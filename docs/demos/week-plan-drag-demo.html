<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>StudyPlanner Drag Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:720px;margin:auto;padding:14px 0 28px}h1{font-size:18px;margin:0 12px 5px}.help{margin:0 12px 10px;color:#6d7580;font-size:12px;line-height:1.55}.status{margin:0 12px 10px;padding:9px 10px;background:white;border:1px solid #e4e7eb;border-radius:10px;font-size:12px}.scroller{overflow-x:auto;background:white;border-block:1px solid #e4e7eb;-webkit-overflow-scrolling:touch}.cal{min-width:600px}.head,.grid{display:grid;grid-template-columns:52px repeat(5,1fr)}.head{height:48px;border-bottom:1px solid #e4e7eb}.head>div{display:grid;place-items:center;border-left:1px solid #e4e7eb;font-size:11px}.head .time{border-left:0;color:#7c838d;font-size:9px}.grid{height:540px}.axis,.day{position:relative;height:540px}.axis{border-right:1px solid #e4e7eb;background:#fafbfc}.day{border-left:1px solid #e4e7eb;background:linear-gradient(#fbfdff,#fff)}.line{position:absolute;left:0;right:0;border-top:1px dashed #e7e9ed;pointer-events:none}.label{position:absolute;right:5px;transform:translateY(-50%);font-size:9px;color:#8a9099}.plan,.ghost{position:absolute;left:6px;right:6px;min-height:42px;padding:6px;border-radius:8px;border:1px solid #86b6f5;background:#eaf3ff;z-index:5;user-select:none;-webkit-user-select:none;touch-action:pan-y;box-shadow:0 3px 10px rgba(30,40,55,.08)}.plan{cursor:grab}.plan.green{border-color:#7bc49b;background:#eaf8f0}.plan.orange{border-color:#efb36c;background:#fff3e6}.plan strong,.ghost strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plan small,.ghost small{font-size:9px;color:#6d7580}.plan.pending{outline:3px solid rgba(47,128,237,.12)}.plan.dragging{opacity:.18}.ghost{opacity:.45;border-style:dashed;pointer-events:none;z-index:4}.float{display:none;position:fixed;z-index:9999;pointer-events:none;min-width:130px;padding:9px;border:1px solid #72aaf1;border-radius:10px;background:#f2f7ff;box-shadow:0 18px 45px rgba(31,42,55,.22);transform:translate(-50%,-60%)}.float.show{display:block}.float strong{display:block;font-size:12px}.float small{display:block;margin-top:3px;font-size:10px;color:#6d7580}.modal{display:none;position:fixed;inset:0;z-index:10000;background:rgba(15,23,42,.3);align-items:end;justify-content:center}.modal.show{display:flex}.sheet{width:min(100%,520px);padding:18px;background:white;border-radius:18px 18px 0 0}.sheet h2{margin:0 0 7px;font-size:17px}.sheet p{font-size:13px;color:#6d7580}.sheet button{width:100%;padding:11px;border:0;border-radius:9px;background:#edf0f4}.badges{display:flex;gap:7px;flex-wrap:wrap;padding:10px 12px}.badge{font-size:10px;color:#6d7580;background:white;border:1px solid #e4e7eb;border-radius:999px;padding:5px 8px}</style></head><body><div class="wrap"><h1>予定ドラッグ確認用</h1><p class="help">PCはそのままドラッグ。スマホは予定を約240ms長押ししてからドラッグです。短いタップは編集を開きます。</p><div class="status" id="status">青い「数学 問題演習」をまず動かしてみてください。</div><div class="scroller"><div class="cal"><div class="head"><div class="time">時間</div><div>8/24<br>月</div><div>8/25<br>火</div><div>8/26<br>水</div><div>8/27<br>木</div><div>8/28<br>金</div></div><div class="grid"><div class="axis" id="axis"></div><div class="day" data-day="0"><div class="plan" data-id="math" data-day="0" data-start="540" data-duration="90" style="top:54px;height:81px"><strong>数学 問題演習</strong><small>09:00–10:30</small></div></div><div class="day" data-day="1"></div><div class="day" data-day="2"><div class="plan green" data-id="english" data-day="2" data-start="660" data-duration="60" style="top:162px;height:54px"><strong>英単語</strong><small>11:00–12:00</small></div></div><div class="day" data-day="3"></div><div class="day" data-day="4"><div class="plan orange" data-id="repeat" data-day="4" data-start="840" data-duration="60" data-repeat="1" style="top:324px;height:54px"><strong>毎週の復習</strong><small>14:00–15:00</small></div></div></div></div></div><div class="badges"><span class="badge">短タップ＝編集</span><span class="badge">長押し240ms＝ドラッグ</span><span class="badge">長押し前9px移動＝スクロール優先</span><span class="badge">5分スナップ</span></div></div><div class="float" id="floating"><strong></strong><small></small></div><div class="modal" id="modal"><div class="sheet"><h2 id="title"></h2><p id="time"></p><p>短いタップとして認識しました。</p><button id="close">閉じる</button></div></div><script>(function(){var START=480,END=1080,RANGE=600,H=540,SNAP=5,HOLD=240,CANCEL=9,MOUSE=4;var gesture=null,suppress=0,status=document.getElementById('status'),floating=document.getElementById('floating'),modal=document.getElementById('modal');function clamp(v,a,b){return Math.min(Math.max(v,a),b)}function fmt(n){var h=Math.floor(n/60),m=n%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}function topPx(m){return(m-START)/RANGE*H}function hPx(d){return Math.max(d/RANGE*H,42)}function width(){var d=document.querySelector('.day');return d?d.getBoundingClientRect().width:100}function plan(el){return{id:el.dataset.id,day:Number(el.dataset.day),start:Number(el.dataset.start),duration:Number(el.dataset.duration),repeat:el.dataset.repeat==='1',title:el.querySelector('strong').textContent}}function target(p,dx,dy){var start=clamp(Math.round((p.start+(dy/H)*RANGE)/SNAP)*SNAP,START,END-p.duration),dd=p.repeat?0:Math.round(dx/width());return{day:clamp(p.day+dd,0,4),start:start,end:start+p.duration}}function dateLabel(i){return['8/24(月)','8/25(火)','8/26(水)','8/27(木)','8/28(金)'][i]}function clearGhost(){document.querySelectorAll('.ghost').forEach(function(x){x.remove()})}function showGhost(t,p){clearGhost();var d=document.querySelector('.day[data-day="'+t.day+'"]'),g=document.createElement('div');g.className='ghost';g.style.top=topPx(t.start)+'px';g.style.height=hPx(p.duration)+'px';g.innerHTML='<strong>'+p.title+'</strong><small>'+fmt(t.start)+'–'+fmt(t.end)+'</small>';d.appendChild(g)}function activate(x,y){if(!gesture||gesture.active)return;gesture.active=true;clearTimeout(gesture.timer);gesture.el.classList.remove('pending');gesture.el.classList.add('dragging');gesture.lastX=x;gesture.lastT=performance.now();floating.classList.add('show');floating.querySelector('strong').textContent=gesture.p.title;status.textContent=gesture.p.repeat?'ドラッグ中：繰り返し予定なので曜日は固定です。':'ドラッグ中：上下で時刻、左右で曜日を変更できます。';update(x,y)}function update(x,y){if(!gesture||!gesture.active)return;var now=performance.now(),dt=Math.max(now-gesture.lastT,1),vx=(x-gesture.lastX)/dt*16.67;gesture.lastX=x;gesture.lastT=now;gesture.t=target(gesture.p,x-gesture.sx,y-gesture.sy);showGhost(gesture.t,gesture.p);floating.style.left=x+'px';floating.style.top=y+'px';floating.style.transform='translate(-50%,-60%) rotate('+clamp(vx*.012,-5,5)+'deg) scale(1.03)';floating.querySelector('small').textContent=dateLabel(gesture.t.day)+' '+fmt(gesture.t.start)+'–'+fmt(gesture.t.end)}function cancel(){if(!gesture)return;clearTimeout(gesture.timer);gesture.el.classList.remove('pending','dragging');gesture=null;clearGhost();floating.classList.remove('show')}function finish(){if(!gesture||!gesture.active){cancel();return}var el=gesture.el,t=gesture.t||target(gesture.p,0,0),p=gesture.p,d=document.querySelector('.day[data-day="'+t.day+'"]');el.dataset.day=t.day;el.dataset.start=t.start;el.style.top=topPx(t.start)+'px';el.style.height=hPx(p.duration)+'px';el.querySelector('small').textContent=fmt(t.start)+'–'+fmt(t.end);el.classList.remove('pending','dragging');d.appendChild(el);status.textContent='移動確定：'+p.title+' → '+dateLabel(t.day)+' '+fmt(t.start)+'–'+fmt(t.end)+(p.repeat?'（曜日固定）':'');suppress=Date.now()+450;gesture=null;clearGhost();floating.classList.remove('show')}function openEditor(el){if(Date.now()<suppress)return;document.getElementById('title').textContent=el.querySelector('strong').textContent;document.getElementById('time').textContent=dateLabel(Number(el.dataset.day))+' '+fmt(Number(el.dataset.start))+'–'+fmt(Number(el.dataset.start)+Number(el.dataset.duration));modal.classList.add('show');status.textContent='短タップ：編集画面を開きました。'}function bind(el){el.addEventListener('click',function(){openEditor(el)});el.addEventListener('mousedown',function(e){if(e.button!==0)return;gesture={p:plan(el),el:el,sx:e.clientX,sy:e.clientY,active:false,lastX:e.clientX,lastT:performance.now()};function move(ev){if(!gesture||gesture.el!==el)return;var dist=Math.hypot(ev.clientX-gesture.sx,ev.clientY-gesture.sy);if(!gesture.active&&dist>=MOUSE)activate(ev.clientX,ev.clientY);if(gesture.active){ev.preventDefault();update(ev.clientX,ev.clientY)}}function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);finish()}document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)});el.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;var t=e.touches[0];gesture={p:plan(el),el:el,sx:t.clientX,sy:t.clientY,active:false,lastX:t.clientX,lastT:performance.now(),timer:null};el.classList.add('pending');var s=gesture;s.timer=setTimeout(function(){if(gesture===s)activate(s.sx,s.sy)},HOLD)},{passive:true});el.addEventListener('touchmove',function(e){if(!gesture||gesture.el!==el||e.touches.length!==1)return;var t=e.touches[0],dist=Math.hypot(t.clientX-gesture.sx,t.clientY-gesture.sy);if(!gesture.active){if(dist>CANCEL){status.textContent='長押し前に動いたので、ドラッグせずスクロールを優先しました。';cancel()}return}e.preventDefault();update(t.clientX,t.clientY)},{passive:false});el.addEventListener('touchend',function(e){if(!gesture||gesture.el!==el)return;if(gesture.active){e.preventDefault();finish()}else cancel()},{passive:false});el.addEventListener('touchcancel',cancel,{passive:true})}for(var h=8;h<=18;h+=2){var y=(h*60-START)/RANGE*100,lab=document.createElement('span');lab.className='label';lab.style.top=y+'%';lab.textContent=String(h).padStart(2,'0')+':00';document.getElementById('axis').appendChild(lab);var l=document.createElement('div');l.className='line';l.style.top=y+'%';document.getElementById('axis').appendChild(l);document.querySelectorAll('.day').forEach(function(day){var dl=document.createElement('div');dl.className='line';dl.style.top=y+'%';day.appendChild(dl)})}document.querySelectorAll('.plan').forEach(bind);document.getElementById('close').onclick=function(){modal.classList.remove('show')};modal.addEventListener('click',function(e){if(e.target===modal)modal.classList.remove('show')})})();</script></body></html>
