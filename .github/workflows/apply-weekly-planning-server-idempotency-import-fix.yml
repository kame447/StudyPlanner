name: Apply weekly planning server repository import fix

on:
  push:
    branches:
      - agent/weekly-planning-server-idempotency

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-server-idempotency
          fetch-depth: 0
      - name: Patch repository import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.ts')
          text = path.read_text()
          text = text.replace("import { plannerRepository } from '../../../repositories';\n", '', 1)
          marker = "      const identity = resolveDraftIdentity(draft);\n      const existing = (await plannerRepository.getPlans(identity.userId)).find("
          replacement = "      const identity = resolveDraftIdentity(draft);\n      const { plannerRepository } = await import('../../../repositories');\n      const existing = (await plannerRepository.getPlans(identity.userId)).find("
          if marker not in text:
              raise SystemExit('planner-backed save marker not found')
          path.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.ts
          git commit -m "feat: 承認repositoryをブラウザ初期化から分離"
          git push origin HEAD:agent/weekly-planning-server-idempotency
