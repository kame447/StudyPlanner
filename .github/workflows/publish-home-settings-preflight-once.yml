name: Publish Home Settings Preflight Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-home-settings-preflight-once.yml']

permissions:
  contents: read

concurrency:
  group: publish-home-settings-preflight-once
  cancel-in-progress: false

jobs:
  publish-verified-candidate:
    if: >-
      github.repository == 'kame447/StudyPlanner' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'kame447' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'ci: publish verified Home settings diagnostic once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Publish only the verified branch and draft PR
        uses: actions/github-script@v9
        with:
          script: |
            const owner = 'kame447';
            const repo = 'StudyPlanner';
            const branch = 'test/home-settings-preflight';
            const targetSha = 'b38d8cd2e28567b9bc6153918318226cbd420c69';
            const targetTree = 'bd81a789a886f3d7283076c5e00c720268163a01';
            const parentSha = '70f05ccc4f7342b3c9c718bc72fcbb7d2ad3204f';
            const workflowPath = '.github/workflows/publish-home-settings-preflight-once.yml';
            const expiresAt = Date.parse('2026-10-08T00:00:00Z');
            let stage = 'preflight';
            let createdBranch = false;
            try {
              if (Date.now() >= expiresAt) {
                core.setFailed('Temporary publication window expired. No writes attempted.');
                return;
              }
              if (context.repo.owner !== owner || context.repo.repo !== repo || context.ref !== 'refs/heads/main') {
                core.setFailed('Unexpected repository or ref. No writes attempted.');
                return;
              }
              try {
                await github.rest.repos.getContent({ owner, repo, path: workflowPath, ref: context.sha });
              } catch (error) {
                if (error.status === 404) {
                  core.notice('Temporary workflow is absent; cleanup event is a no-op.');
                  return;
                }
                throw error;
              }
              const { data: main } = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
              if (main.object.sha !== context.sha) {
                core.setFailed('Main moved after this installation event. No writes attempted.');
                return;
              }
              const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: targetSha });
              if (commit.tree.sha !== targetTree || commit.parents.length !== 1 || commit.parents[0].sha !== parentSha) {
                core.setFailed('Verified candidate identity mismatch. No writes attempted.');
                return;
              }
              const { data: pulls } = await github.rest.pulls.list({
                owner, repo, state: 'all', head: `${owner}:${branch}`, base: 'main', per_page: 100,
              });
              if (pulls.length > 1) {
                core.setFailed('Multiple existing pull requests; no writes attempted.');
                return;
              }
              if (pulls.length === 1) {
                const pr = pulls[0];
                if (pr.head.sha !== targetSha || pr.head.repo?.full_name !== `${owner}/${repo}`) {
                  core.setFailed('Existing PR is not the verified candidate. No writes attempted.');
                  return;
                }
                core.notice(`Existing PR ${pr.number} is ${pr.state}; no duplicate or metadata change attempted.`);
                await core.summary.addLink('Existing Home/settings PR', pr.html_url).write();
                return;
              }
              let existingRef;
              try {
                ({ data: existingRef } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` }));
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (existingRef && existingRef.object.sha !== targetSha) {
                core.setFailed('Branch already exists at another SHA; refusing to move it.');
                return;
              }
              if (!existingRef) {
                stage = 'create fixed branch';
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: targetSha });
                createdBranch = true;
              }
              const { data: verifiedRef } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              if (verifiedRef.object.sha !== targetSha) {
                core.setFailed('Branch read-back mismatch; no PR will be created.');
                return;
              }
              stage = 'create fixed draft PR';
              const { data: pr } = await github.rest.pulls.create({
                owner, repo, base: 'main', head: branch, draft: true,
                title: 'test: add opt-in Home settings browser preflight',
                body: [
                  'Refs #382',
                  '',
                  'Adds a dispatch-only Home/settings diagnostic workflow and a fixed owner-only /qa home-settings command. All existing full PR/push gates remain unchanged.',
                  '',
                  'Verified locally: both workflow schemas; exactly 16 selected cases across four existing browser projects; 11 dispatcher regressions including unauthorized actors, foreign heads and invalid commands. Existing setup pins, read-only diagnostic token and artifact boundaries are preserved.',
                  '',
                  'Candidate: b38d8cd2e28567b9bc6153918318226cbd420c69; tree bd81a789a886f3d7283076c5e00c720268163a01. Required CI and actual diagnostic dispatch are still pending. This is a draft and does not close the ongoing audit.',
                  '',
                  'Publication used a user-approved temporary, hardcoded workflow after connector cancellation. Remove that temporary workflow after verified publication or a blocked result. No merge, force update, repository setting change or new credential is authorized by this workflow.',
                ].join('\n'),
              });
              if (!pr.draft || pr.head.sha !== targetSha || pr.base.ref !== 'main') {
                core.setFailed('Created PR read-back differs from the bounded draft request. Inspect before continuing.');
                return;
              }
              await core.summary.addLink('Created Home/settings draft PR', pr.html_url).write();
              core.notice('Branch and draft PR published. Required CI/approval and diagnostic execution remain separate.');
            } catch (error) {
              const status = Number.isInteger(error.status) ? String(error.status) : 'unknown';
              core.setFailed(`Publication stopped at ${stage} (HTTP ${status}). No retry, credential, permission or repository-setting change attempted.`);
              await core.summary.addRaw(`Stopped at: ${stage}. HTTP: ${status}. Branch created during this run: ${createdBranch}. Inspect the exact ref/PR, then remove the temporary workflow; this is not completed publication.`).write();
            }
