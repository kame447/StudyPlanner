name: Apply weekly planning operation recovery

on:
  push:
    branches:
      - agent/weekly-planning-server-idempotency

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-server-idempotency
          fetch-depth: 0
      - name: Apply operation recovery patch
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.ts')
          text = path.read_text()
          text = text.replace(
              "import {\n  parseWeeklyPlanningPlanSourceId,\n  WEEKLY_PLANNING_PLAN_SOURCE_TYPE,\n} from '../planning/weeklyPlanningPlanProvenance';",
              "import {\n  buildWeeklyPlanningPlanSourceId,\n  parseWeeklyPlanningPlanSourceId,\n  WEEKLY_PLANNING_PLAN_SOURCE_TYPE,\n} from '../planning/weeklyPlanningPlanProvenance';",
              1,
          )

          marker = "function retentionExpiry(now: Date): Date {"
          helper = """function resolveOperationItemIdentity(params: {
            userId: string;
            approvalOperationId: string;
            sourceDraftBlockId: string;
          }): ResolvedIdentity {
            const userId = requireNonempty(params.userId, '利用者');
            const approvalOperationId = requireNonempty(
              params.approvalOperationId,
              '承認操作',
            );
            const sourceDraftBlockId = requireNonempty(
              params.sourceDraftBlockId,
              '仮予定',
            );
            const sourceId = buildWeeklyPlanningPlanSourceId({
              approvalOperationId,
              sourceDraftBlockId,
            });
            const operationDocumentId = safeDocumentId(
              'weekly-approval',
              `${userId}\\u001f${approvalOperationId}`,
            );
            const itemDocumentId = safeDocumentId('item', sourceDraftBlockId);
            return {
              userId,
              approvalOperationId,
              sourceDraftBlockId,
              operationDocumentId,
              itemDocumentId,
              itemStorageKey: `${operationDocumentId}/${itemDocumentId}`,
              planId: safeDocumentId(
                'weekly-plan',
                `${userId}\\u001f${sourceId}`,
              ),
            };
          }

          """
          if marker not in text:
              raise SystemExit('retention marker not found')
          text = text.replace(marker, helper + marker, 1)

          completion_pattern = re.compile(
              r"function resolveCompletion\(params: \{.*?\n\}\n\nfunction mapPersistenceError",
              re.DOTALL,
          )
          completion_replacement = """function resolveCompletion(params: {
            operation: StoredApprovalOperation | null;
            userId: string;
            approvalOperationId: string;
            durableItemCount: number;
            expectedItemCount: number;
            now: Date;
          }): StoredApprovalOperation {
            const operation = params.operation;
            if (operation
              && (operation.userId !== params.userId
                || operation.approvalOperationId !== params.approvalOperationId)) {
              throw new WeeklyPlanningApprovalPersistenceError(
                'ownership_mismatch',
                '承認操作の所有者が一致しません。',
              );
            }
            if (params.durableItemCount < params.expectedItemCount) {
              throw new WeeklyPlanningApprovalPersistenceError(
                'incomplete_operation',
                '未保存の承認項目が残っています。',
                true,
              );
            }
            const timestamp = params.now.toISOString();
            return {
              schemaVersion: RECORD_SCHEMA_VERSION,
              userId: params.userId,
              approvalOperationId: params.approvalOperationId,
              status: 'completed',
              savedItemCount: params.durableItemCount,
              expectedItemCount: params.expectedItemCount,
              createdAt: operation?.createdAt ?? timestamp,
              updatedAt: timestamp,
              completedAt: operation?.completedAt ?? timestamp,
              expiresAt: retentionExpiry(params.now),
            };
          }

          function mapPersistenceError"""
          text, count = completion_pattern.subn(completion_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'resolveCompletion replacement count was {count}')

          firestore_pattern = re.compile(
              r"    async completeOperation\(operation\) \{.*?    \},\n  \};\n\}\n\nexport function createWeeklyPlanningApprovalMemoryState",
              re.DOTALL,
          )
          firestore_replacement = """    async completeOperation(operation) {
                const serverItems = operation.items.filter(
                  (item) => item.status === 'saved',
                );
                if (serverItems.length === 0) return;
                const userId = requireNonempty(operation.userId, '利用者');
                const approvalOperationId = requireNonempty(
                  operation.approvalOperationId,
                  '承認操作',
                );
                const identities = serverItems.map((item) =>
                  resolveOperationItemIdentity({
                    userId,
                    approvalOperationId,
                    sourceDraftBlockId: item.sourceDraftBlockId,
                  }),
                );
                const operationRef = doc(
                  firestore,
                  OPERATION_COLLECTION,
                  identities[0].operationDocumentId,
                );
                const itemRefs = identities.map((identity) =>
                  doc(operationRef, ITEM_COLLECTION, identity.itemDocumentId),
                );
                try {
                  await runTransaction(firestore, async (transaction) => {
                    const operationSnapshot = await transaction.get(operationRef);
                    const itemSnapshots = await Promise.all(
                      itemRefs.map((itemRef) => transaction.get(itemRef)),
                    );
                    const storedItems = itemSnapshots.map((snapshot, index) => {
                      const item = snapshot.exists() ? parseItem(snapshot.data()) : null;
                      if (!item) {
                        throw new WeeklyPlanningApprovalPersistenceError(
                          'incomplete_operation',
                          '未保存の承認項目が残っています。',
                          true,
                        );
                      }
                      validateItemOwnership(item, identities[index]);
                      return item;
                    });
                    const planSnapshots = await Promise.all(
                      storedItems.map((item) =>
                        transaction.get(doc(firestore, 'plans', item.savedPlanId)),
                      ),
                    );
                    planSnapshots.forEach((snapshot, index) => {
                      if (!snapshot.exists()) {
                        throw new WeeklyPlanningApprovalPersistenceError(
                          'saved_plan_missing',
                          '保存済み承認項目に対応する予定が見つかりません。',
                        );
                      }
                      const plan = normalizePlanRecord({
                        ...snapshot.data(),
                        id: snapshot.id,
                      } as Plan);
                      const identity = identities[index];
                      if (plan.userId !== identity.userId
                        || plan.sourceType !== WEEKLY_PLANNING_PLAN_SOURCE_TYPE
                        || plan.sourceId !== buildWeeklyPlanningPlanSourceId(identity)
                        || plan.id !== identity.planId) {
                        throw new WeeklyPlanningApprovalPersistenceError(
                          'source_conflict',
                          '承認項目に別の予定が関連付けられています。',
                        );
                      }
                    });
                    const parsedOperation = operationSnapshot.exists()
                      ? parseOperation(operationSnapshot.data())
                      : null;
                    if (operationSnapshot.exists() && !parsedOperation) {
                      throw new WeeklyPlanningApprovalPersistenceError(
                        'source_conflict',
                        '承認操作の保存形式が不正です。',
                      );
                    }
                    const completed = resolveCompletion({
                      operation: parsedOperation,
                      userId,
                      approvalOperationId,
                      durableItemCount: storedItems.length,
                      expectedItemCount: identities.length,
                      now: new Date(),
                    });
                    transaction.set(operationRef, completed, { merge: false });
                  });
                } catch (error) {
                  mapPersistenceError(error);
                }
              },
            };
          }

          export function createWeeklyPlanningApprovalMemoryState"""
          text, count = firestore_pattern.subn(firestore_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'firestore completeOperation replacement count was {count}')

          memory_pattern = re.compile(
              r"    async completeOperation\(operation\) \{.*?    \},\n  \};\n\}\n\nfunction createPlannerBackedWeeklyPlanningApprovalPlanRepository",
              re.DOTALL,
          )
          memory_replacement = """    async completeOperation(operation) {
                const serverItems = operation.items.filter(
                  (item) => item.status === 'saved',
                );
                if (serverItems.length === 0) return;
                const userId = requireNonempty(operation.userId, '利用者');
                const approvalOperationId = requireNonempty(
                  operation.approvalOperationId,
                  '承認操作',
                );
                const identities = serverItems.map((item) =>
                  resolveOperationItemIdentity({
                    userId,
                    approvalOperationId,
                    sourceDraftBlockId: item.sourceDraftBlockId,
                  }),
                );
                await state.runExclusive(() => {
                  identities.forEach((identity) => {
                    const item = state.items.get(identity.itemStorageKey);
                    if (!item) {
                      throw new WeeklyPlanningApprovalPersistenceError(
                        'incomplete_operation',
                        '未保存の承認項目が残っています。',
                        true,
                      );
                    }
                    validateItemOwnership(item, identity);
                    const plan = state.plans.get(item.savedPlanId);
                    if (!plan) {
                      throw new WeeklyPlanningApprovalPersistenceError(
                        'saved_plan_missing',
                        '保存済み承認項目に対応する予定が見つかりません。',
                      );
                    }
                    if (plan.userId !== identity.userId
                      || plan.sourceType !== WEEKLY_PLANNING_PLAN_SOURCE_TYPE
                      || plan.sourceId !== buildWeeklyPlanningPlanSourceId(identity)
                      || plan.id !== identity.planId) {
                      throw new WeeklyPlanningApprovalPersistenceError(
                        'source_conflict',
                        '承認項目に別の予定が関連付けられています。',
                      );
                    }
                  });
                  const operationDocumentId = identities[0].operationDocumentId;
                  const completed = resolveCompletion({
                    operation: state.operations.get(operationDocumentId) ?? null,
                    userId,
                    approvalOperationId,
                    durableItemCount: identities.length,
                    expectedItemCount: identities.length,
                    now: new Date(),
                  });
                  state.operations.set(operationDocumentId, completed);
                  state.metrics.operationWrites += 1;
                });
              },
            };
          }

          function createPlannerBackedWeeklyPlanningApprovalPlanRepository"""
          text, count = memory_pattern.subn(memory_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'memory completeOperation replacement count was {count}')

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.ts
          git commit -m "feat: server operationをitem記録から復旧"
          git push origin HEAD:agent/weekly-planning-server-idempotency
