name: validate-pr5-final

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Run full test suite
        run: |
          set +e
          npm run test:run > /tmp/full-test.log 2>&1
          status=$?
          tail -n 80 /tmp/full-test.log
          exit "$status"
      - name: Run production build
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1
          status=$?
          tail -n 40 /tmp/build.log
          exit "$status"
      - name: Record validation summary
        run: |
          git config user.name "studyplanner-fix-bot"
          git config user.email "studyplanner-fix-bot@users.noreply.github.com"
          {
            echo "diff whitespace: passed"
            sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/full-test.log \
              | grep -E 'Test Files|Tests|Duration' \
              | tail -n 3
            echo "production build: passed"
          } > docs/ai/tasks/20260716-weekly-planning-pr5-final-validation.log
          git add docs/ai/tasks/20260716-weekly-planning-pr5-final-validation.log
          git commit -m "feat: PR5最終検証結果を記録"
          git push origin HEAD:agent/weekly-planning-conversation-hardening
