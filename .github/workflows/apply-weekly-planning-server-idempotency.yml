name: Apply weekly planning server idempotency

on:
  push:
    branches:
      - agent/weekly-planning-server-idempotency

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-server-idempotency
          fetch-depth: 0
      - name: Apply production and test patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_text, old, new, label):
              path = Path(path_text)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'{label} pattern not found in {path_text}')
              path.write_text(text.replace(old, new, 1))

          app_state = 'src/hooks/usePlannerAppState.ts'
          replace(
              app_state,
              "import { plannerRepository } from '../repositories';\n",
              "import {\n  getWeeklyPlanningApprovalPlanRepository,\n} from '../features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository';\nimport type { WeeklyDraftApprovalOperation } from '../features/weeklyPlanning/planning/weeklyPlanningApprovalTypes';\n",
              'app state repository import',
          )
          replace(
              app_state,
              "  saveWeeklyApprovedPlan: (draft: PlanDraft) => Promise<Plan>;\n",
              "  saveWeeklyApprovedPlan: (draft: PlanDraft) => Promise<Plan>;\n  completeWeeklyApprovalOperation: (operation: WeeklyDraftApprovalOperation) => Promise<void>;\n",
              'app state interface',
          )
          replace(
              app_state,
              "export function usePlannerAppState(): PlannerAppState {\n  const { notice, showNotice, dismissNotice } = useNoticeState();\n",
              "export function usePlannerAppState(): PlannerAppState {\n  const { notice, showNotice, dismissNotice } = useNoticeState();\n  const weeklyPlanningApprovalPlanRepository =\n    getWeeklyPlanningApprovalPlanRepository();\n",
              'app state repository initialization',
          )
          replace(
              app_state,
              "    if (minutesBetween(draft.startTime, draft.endTime) <= 0) {\n",
              "    if (draft.userId !== user.id) {\n      throw new Error('承認予定の所有者が一致しません。');\n    }\n\n    if (minutesBetween(draft.startTime, draft.endTime) <= 0) {\n",
              'app state ownership guard',
          )
          replace(
              app_state,
              "      const savedPlan = await plannerRepository.upsertPlan(nextPlan);\n",
              "      const savedPlan = await weeklyPlanningApprovalPlanRepository.saveApprovedPlan(draft);\n",
              'app state server save',
          )
          replace(
              app_state,
              "  return {\n    booting,\n",
              "  async function completeWeeklyApprovalOperation(\n    operation: WeeklyDraftApprovalOperation,\n  ): Promise<void> {\n    if (!user?.id || operation.userId !== user.id) {\n      throw new Error('承認操作の所有者が一致しません。');\n    }\n    await weeklyPlanningApprovalPlanRepository.completeOperation(operation);\n  }\n\n  return {\n    booting,\n",
              'app state completion function',
          )
          replace(
              app_state,
              "    saveWeeklyApprovedPlan,\n    deletePlan,\n",
              "    saveWeeklyApprovedPlan,\n    completeWeeklyApprovalOperation,\n    deletePlan,\n",
              'app state return completion',
          )

          approval_app = 'src/features/weeklyPlanning/application/weeklyPlanningApprovalApplication.ts'
          replace(
              approval_app,
              "  saveWeeklyApprovedPlan: (draft: PlanDraft) => Promise<Plan>;\n",
              "  saveWeeklyApprovedPlan: (draft: PlanDraft) => Promise<Plan>;\n  completeWeeklyApprovalOperation?: (operation: WeeklyDraftApprovalOperation) => Promise<void>;\n",
              'approval app interface',
          )
          replace(
              approval_app,
              "  saveWeeklyApprovedPlan,\n  getState,\n",
              "  saveWeeklyApprovedPlan,\n  completeWeeklyApprovalOperation,\n  getState,\n",
              'approval app destructuring',
          )
          replace(
              approval_app,
              "    onOperationCompleted(result);\n\n    if (!ownsPendingApproval(getState(), pending)) return;\n",
              "    onOperationCompleted(result);\n    if (result.status === 'completed' && completeWeeklyApprovalOperation) {\n      await completeWeeklyApprovalOperation(result);\n    }\n\n    if (!ownsPendingApproval(getState(), pending)) return;\n",
              'approval app completion call',
          )

          weekly_hook = 'src/features/weeklyPlanning/application/useWeeklyPlanningApplication.ts'
          replace(
              weekly_hook,
              "  saveWeeklyApprovedPlan: (draft: PlanDraft) => Promise<Plan>;\n",
              "  saveWeeklyApprovedPlan: (draft: PlanDraft) => Promise<Plan>;\n  completeWeeklyApprovalOperation?: (operation: WeeklyDraftApprovalOperation) => Promise<void>;\n",
              'weekly hook interface',
          )
          replace(
              weekly_hook,
              "  saveWeeklyApprovedPlan,\n}: UseWeeklyPlanningApplicationInput): WeeklyPlanningApplication {\n",
              "  saveWeeklyApprovedPlan,\n  completeWeeklyApprovalOperation,\n}: UseWeeklyPlanningApplicationInput): WeeklyPlanningApplication {\n",
              'weekly hook destructuring',
          )
          replace(
              weekly_hook,
              "      saveWeeklyApprovedPlan,\n      getState: getPlanningState,\n",
              "      saveWeeklyApprovedPlan,\n      completeWeeklyApprovalOperation,\n      getState: getPlanningState,\n",
              'weekly hook approval dependency',
          )

          app = 'src/App.tsx'
          replace(
              app,
              "    saveWeeklyApprovedPlan,\n    deletePlan,\n",
              "    saveWeeklyApprovedPlan,\n    completeWeeklyApprovalOperation,\n    deletePlan,\n",
              'App destructuring',
          )
          replace(
              app,
              "    saveWeeklyApprovedPlan,\n  });\n",
              "    saveWeeklyApprovedPlan,\n    completeWeeklyApprovalOperation,\n  });\n",
              'App weekly hook input',
          )

          hook_test = 'src/hooks/usePlannerAppState.weeklyApproval.test.tsx'
          replace(
              hook_test,
              "const repositoryUpsertPlanMock = vi.hoisted(() => vi.fn());\n",
              "const repositoryUpsertPlanMock = vi.hoisted(() => vi.fn());\nconst approvalSavePlanMock = vi.hoisted(() => vi.fn());\nconst approvalCompleteOperationMock = vi.hoisted(() => vi.fn(async () => undefined));\n",
              'hook test mocks',
          )
          replace(
              hook_test,
              "vi.mock('../repositories', () => ({\n  plannerRepository: {\n    upsertPlan: repositoryUpsertPlanMock,\n  },\n}));\n",
              "vi.mock('../repositories', () => ({\n  plannerRepository: {\n    upsertPlan: repositoryUpsertPlanMock,\n  },\n}));\n\nvi.mock('../features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository', () => ({\n  getWeeklyPlanningApprovalPlanRepository: () => ({\n    saveApprovedPlan: approvalSavePlanMock,\n    completeOperation: approvalCompleteOperationMock,\n  }),\n}));\n",
              'hook test repository module mock',
          )
          replace(
              hook_test,
              "    repositoryUpsertPlanMock.mockReset();\n",
              "    repositoryUpsertPlanMock.mockReset();\n    approvalSavePlanMock.mockReset();\n    approvalCompleteOperationMock.mockClear();\n",
              'hook test reset',
          )
          path = Path(hook_test)
          text = path.read_text().replace('repositoryUpsertPlanMock.mockImplementation', 'approvalSavePlanMock.mockImplementation')
          text = text.replace('repositoryUpsertPlanMock.mock.calls', 'approvalSavePlanMock.mock.calls')
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/hooks/usePlannerAppState.ts src/hooks/usePlannerAppState.weeklyApproval.test.tsx src/features/weeklyPlanning/application/useWeeklyPlanningApplication.ts src/features/weeklyPlanning/application/weeklyPlanningApprovalApplication.ts
          git commit -m "feat: 週間計画承認をserver operationへ接続"
          git push origin HEAD:agent/weekly-planning-server-idempotency
