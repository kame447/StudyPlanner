name: Finalize weekly planning trace correlation

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/weekly-planning-trace-full-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-trace-full-implementation
          fetch-depth: 0

      - name: Apply final correlation fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(value, old, new, label):
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, got {count}')
              return value.replace(old, new, 1)

          runtime_path = 'src/features/weeklyPlanning/trace/weeklyPlanningTraceRuntime.ts'
          runtime = read(runtime_path)
          runtime = replace_once(
              runtime,
              """let conversationIdsByState = new WeakMap<object, string>();
          let traceContextByInput = new WeakMap<object, TraceRequestContext>();
          """,
              """let conversationIdsByState = new WeakMap<object, string>();
          let sessionKeysByState = new WeakMap<object, string>();
          let traceContextByInput = new WeakMap<object, TraceRequestContext>();
          """,
              'runtime state session map',
          )
          runtime = replace_once(
              runtime,
              """    const previewId = `behavior-preview:${stateRevision}`;
          """,
              """    const previewId = `behavior-preview:${active.session.logicalConversationId}:${stateRevision}`;
          """,
              'runtime unique preview id',
          )
          runtime = replace_once(
              runtime,
              """export function recordWeeklyPlanningPipelineTrace(params: {
            input: WeeklyPlanningIntakePipelineInput;
            options: WeeklyPlanningBehaviorAwarePipelineOptions;
            output: WeeklyPlanningBehaviorAwarePipelineOutput;
          }): void {
            if (!isWeeklyPlanningTraceEnabled()) return;
            const userId = resolveTraceUserId(params.options.userId);
            if (!userId) return;
            const occurredAt = nowIso();
            const logicalConversationId = resolveLogicalConversationId({
              input: params.input,
              options: params.options,
            });
            const active = ensureActiveSession({
          """,
              """export function recordWeeklyPlanningPipelineTrace(params: {
            input: WeeklyPlanningIntakePipelineInput;
            options: WeeklyPlanningBehaviorAwarePipelineOptions;
            output: WeeklyPlanningBehaviorAwarePipelineOutput;
          }): void {
            const logicalConversationId = resolveLogicalConversationId({
              input: params.input,
              options: params.options,
            });
            if (params.output.state && typeof params.output.state === 'object') {
              conversationIdsByState.set(params.output.state, logicalConversationId);
            }
            if (!isWeeklyPlanningTraceEnabled()) return;
            const userId = resolveTraceUserId(params.options.userId);
            if (!userId) return;
            const occurredAt = nowIso();
            const active = ensureActiveSession({
          """,
              'runtime map state before trace guard',
          )
          runtime = replace_once(
              runtime,
              """  if (params.output.state && typeof params.output.state === 'object') {
            conversationIdsByState.set(params.output.state, logicalConversationId);
          }

          const stateRevision = params.output.behavior.snapshot.stateRevision;
          """,
              """  if (params.output.state && typeof params.output.state === 'object') {
            sessionKeysByState.set(
              params.output.state,
              activeSessionKey(userId, logicalConversationId),
            );
          }

          const stateRevision = params.output.behavior.snapshot.stateRevision;
          """,
              'runtime map state to exact session',
          )
          runtime = replace_once(
              runtime,
              """  const userId = resolveTraceUserId(params.userId);
            if (!userId) return;
            const stateConversationId = params.state ? conversationIdsByState.get(params.state) : undefined;
            const candidate = correlatedSession({
              userId,
              logicalConversationId: params.logicalConversationId ?? stateConversationId,
            });
            if (!candidate) return;
          """,
              """  const stateSessionKey = params.state ? sessionKeysByState.get(params.state) : undefined;
            const stateActive = stateSessionKey ? activeSessions.get(stateSessionKey) : undefined;
            const userId = resolveTraceUserId(params.userId);
            const stateConversationId = params.state ? conversationIdsByState.get(params.state) : undefined;
            const candidate: [string, ActiveTraceSession] | null = stateSessionKey && stateActive
              ? [stateSessionKey, stateActive]
              : userId
                ? correlatedSession({
                    userId,
                    logicalConversationId: params.logicalConversationId ?? stateConversationId,
                  })
                : null;
            if (!candidate) return;
          """,
              'runtime renderer exact session',
          )
          runtime = replace_once(
              runtime,
              """  conversationIdsByState = new WeakMap<object, string>();
            traceContextByInput = new WeakMap<object, TraceRequestContext>();
          """,
              """  conversationIdsByState = new WeakMap<object, string>();
            sessionKeysByState = new WeakMap<object, string>();
            traceContextByInput = new WeakMap<object, TraceRequestContext>();
          """,
              'runtime reset state session map',
          )
          write(runtime_path, runtime)

          bridge_path = 'src/features/weeklyPlanning/planning/weeklyPlanningBehaviorAwarePreviewBridge.ts'
          bridge = read(bridge_path)
          bridge = replace_once(
              bridge,
              """export interface BehaviorAwarePreviewMetadata {
            stateRevision: number;
          """,
              """export interface BehaviorAwarePreviewMetadata {
            conversationId?: string;
            stateRevision: number;
          """,
              'bridge metadata conversation id',
          )
          bridge = replace_once(
              bridge,
              """      behaviorMetadata: {
                stateRevision: params.snapshot.stateRevision,
          """,
              """      behaviorMetadata: {
                ...(params.input.conversationId
                  ? { conversationId: params.input.conversationId }
                  : {}),
                stateRevision: params.snapshot.stateRevision,
          """,
              'bridge candidate conversation id',
          )
          write(bridge_path, bridge)

          types_path = 'src/features/weeklyPlanning/types.ts'
          types = read(types_path)
          types = replace_once(
              types,
              """export interface WeeklyPlanningBehaviorMetadata {
            stateRevision: number;
          """,
              """export interface WeeklyPlanningBehaviorMetadata {
            conversationId?: string;
            stateRevision: number;
          """,
              'behavior metadata conversation id',
          )
          write(types_path, types)

          preview_path = 'src/features/weeklyPlanning/preview/weeklyPlanningPreviewBlocks.ts'
          preview = read(preview_path)
          preview = replace_once(
              preview,
              """  const previewMetadata = userId
            ? {
                previewId: `behavior-preview:${metadata.stateRevision}`,
                stateRevision: metadata.stateRevision,
          """,
              """  const previewMetadata = userId
            ? {
                previewId: metadata.conversationId
                  ? `behavior-preview:${metadata.conversationId}:${metadata.stateRevision}`
                  : `behavior-preview:${metadata.stateRevision}`,
                ...(metadata.conversationId ? { conversationId: metadata.conversationId } : {}),
                stateRevision: metadata.stateRevision,
          """,
              'candidate preview unique id',
          )
          preview = replace_once(
              preview,
              """  return {
            stateRevision: metadata.stateRevision,
          """,
              """  return {
            ...(metadata.conversationId ? { conversationId: metadata.conversationId } : {}),
            stateRevision: metadata.stateRevision,
          """,
              'preview behavior metadata conversation id',
          )
          preview = replace_once(
              preview,
              """        previewMetadata: {
                  previewId: `behavior-preview:${block.behaviorMetadata.stateRevision}`,
                  stateRevision: block.behaviorMetadata.stateRevision,
          """,
              """        previewMetadata: {
                  previewId: block.behaviorMetadata.conversationId
                    ? `behavior-preview:${block.behaviorMetadata.conversationId}:${block.behaviorMetadata.stateRevision}`
                    : `behavior-preview:${block.behaviorMetadata.stateRevision}`,
                  ...(block.behaviorMetadata.conversationId
                    ? { conversationId: block.behaviorMetadata.conversationId }
                    : {}),
                  stateRevision: block.behaviorMetadata.stateRevision,
          """,
              'display preview unique id',
          )
          write(preview_path, preview)

          pipeline_path = 'src/features/weeklyPlanning/pipeline/weeklyPlanningBehaviorAwareIntakePipeline.ts'
          pipeline = read(pipeline_path)
          pipeline = replace_once(
              pipeline,
              """    previewId: behavior.draftRun ? `behavior-preview:${behavior.snapshot.stateRevision}` : undefined,
          """,
              """    previewId: behavior.draftRun
              ? `behavior-preview:${getConversationId(params.options)}:${behavior.snapshot.stateRevision}`
              : undefined,
          """,
              'pipeline unique feasibility preview id',
          )
          write(pipeline_path, pipeline)

          approval_types_path = 'src/features/weeklyPlanning/planning/weeklyPlanningApprovalTypes.ts'
          approval_types = read(approval_types_path)
          approval_types = replace_once(
              approval_types,
              """  previewId: string;
            previewStateRevision: number;
          """,
              """  previewId: string;
            conversationId?: string;
            previewStateRevision: number;
          """,
              'approval operation conversation id',
          )
          write(approval_types_path, approval_types)

          approval_path = 'src/features/weeklyPlanning/planning/weeklyPlanningApproval.ts'
          approval = read(approval_path)
          approval = replace_once(
              approval,
              """    previewId: params.metadata.previewId,
              previewStateRevision: params.metadata.stateRevision,
          """,
              """    previewId: params.metadata.previewId,
              ...(params.metadata.conversationId
                ? { conversationId: params.metadata.conversationId }
                : {}),
              previewStateRevision: params.metadata.stateRevision,
          """,
              'approval operation carries conversation id',
          )
          approval = replace_once(
              approval,
              """      previewId: operation.previewId,
                previewStateRevision: operation.previewStateRevision,
          """,
              """      previewId: operation.previewId,
                ...(operation.conversationId
                  ? { conversationId: operation.conversationId }
                  : {}),
                previewStateRevision: operation.previewStateRevision,
          """,
              'approval started payload conversation id',
          )
          write(approval_path, approval)

          dialogue_path = 'src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueRenderer.ts'
          dialogue = read(dialogue_path)
          dialogue = replace_once(
              dialogue,
              """function tracedMessage(
            message: string,
            responseSource: WeeklyPlanningTraceResponseSource,
            state: PlanningIntakeState,
          ): string {
            recordWeeklyPlanningRenderedAssistantTurn({
              content: message,
              responseSource,
              state,
            });
          """,
              """function tracedMessage(
            message: string,
            responseSource: WeeklyPlanningTraceResponseSource,
            state: PlanningIntakeState,
            userId?: string,
          ): string {
            recordWeeklyPlanningRenderedAssistantTurn({
              content: message,
              responseSource,
              state,
              userId,
            });
          """,
              'dialogue trace user id',
          )
          dialogue = replace_once(
              dialogue,
              """export async function renderWeeklyPlanningDialogueMessage(params: {
            state: PlanningIntakeState;
            decision: WeeklyPlanningDialogueDecision;
            renderer?: WeeklyPlanningDialogueRenderer;
          }): Promise<string> {
          """,
              """export async function renderWeeklyPlanningDialogueMessage(params: {
            state: PlanningIntakeState;
            decision: WeeklyPlanningDialogueDecision;
            renderer?: WeeklyPlanningDialogueRenderer;
            userId?: string;
          }): Promise<string> {
          """,
              'dialogue render user id option',
          )
          dialogue = dialogue.replace(", 'rules', params.state)", ", 'rules', params.state, params.userId)")
          dialogue = dialogue.replace(", 'ai', params.state)", ", 'ai', params.state, params.userId)")
          dialogue = dialogue.replace(", 'deterministic_fallback', params.state)", ", 'deterministic_fallback', params.state, params.userId)")
          write(dialogue_path, dialogue)

          assistant_path = 'src/components/NaturalLanguageAssistant.tsx'
          assistant = read(assistant_path)
          assistant = replace_once(
              assistant,
              """    try {
                const pipelineInput = {
          """,
              """    try {
                const traceRequestId = typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function'
                  ? `weekly-request-${crypto.randomUUID()}`
                  : `weekly-request-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
                const pipelineInput = {
          """,
              'assistant request id',
          )
          assistant = replace_once(
              assistant,
              """        }, {
                  useAiDialoguePlanner: true,
                })
                : await runWeeklyPlanningBehaviorAwarePipeline(pipelineInput);
          """,
              """        }, {
                  useAiDialoguePlanner: true,
                  userId,
                  traceRequestId,
                })
                : await runWeeklyPlanningBehaviorAwarePipeline(pipelineInput, {
                    userId,
                    traceRequestId,
                  });
          """,
              'assistant explicit trace options',
          )
          assistant = replace_once(
              assistant,
              """          renderer: dialogueRenderer,
                })
          """,
              """          renderer: dialogueRenderer,
                  userId,
                })
          """,
              'assistant renderer user id',
          )
          write(assistant_path, assistant)

          date_path = 'src/features/weeklyPlanning/trace/weeklyPlanningTraceDate.ts'
          date_value = read(date_path)
          date_value = replace_once(
              date_value,
              """  const part = (type: Intl.DateTimeFormatPartTypes) =>
          """,
              """  const part = (type: 'year' | 'month' | 'day') =>
          """,
              'date part type portability',
          )
          write(date_path, date_value)

          runtime_test_path = 'src/features/weeklyPlanning/trace/weeklyPlanningTraceRuntimeContract.test.ts'
          runtime_test = read(runtime_test_path)
          test_insert = """

            it('明示request IDが同じretryを別input objectでも重複保存しない', async () => {
              const repository = createInMemoryWeeklyPlanningTraceRepository();
              setWeeklyPlanningTraceRepositoryForTests(repository);
              const options = {
                userId: 'user-1',
                conversationId: 'conversation-retry',
                traceRequestId: 'request-retry-1',
                dialoguePlanner,
              };

              await runWeeklyPlanningBehaviorAwarePipeline(pipelineInput('同じ発話'), options);
              await runWeeklyPlanningBehaviorAwarePipeline(pipelineInput('同じ発話'), options);

              await waitForTrace(async () => {
                const [session] = await repository.listSessionsForAdmin();
                const entries = await repository.listEntries('user-1', session!.id);
                expect(entries.filter((entry) =>
                  entry.kind === 'internal_event' && entry.eventType === 'user_turn_received'
                )).toHaveLength(1);
              });
            });

            it('runtime reset後の同じ初期発話を新しいconversationとして保存する', async () => {
              const repository = createInMemoryWeeklyPlanningTraceRepository();
              setWeeklyPlanningTraceRepositoryForTests(repository);
              await runWeeklyPlanningBehaviorAwarePipeline(
                pipelineInput('同じ発話'),
                { userId: 'user-1', dialoguePlanner },
              );
              await waitForTrace(async () => {
                expect(await repository.listSessionsForAdmin()).toHaveLength(1);
              });

              resetWeeklyPlanningTraceRuntimeForTests();
              await runWeeklyPlanningBehaviorAwarePipeline(
                pipelineInput('同じ発話'),
                { userId: 'user-1', dialoguePlanner },
              );

              await waitForTrace(async () => {
                const sessions = await repository.listSessionsForAdmin();
                expect(sessions).toHaveLength(2);
                expect(new Set(sessions.map((session) => session.logicalConversationId).size).toBe(2));
              });
            });
          """
          if '明示request IDが同じretry' not in runtime_test:
              runtime_test = runtime_test.rsplit('\n});', 1)[0] + test_insert + '\n});\n'
          write(runtime_test_path, runtime_test)

          for disposable in [
              '.agent-trace-correlation.txt',
              '.github/workflows/agent-inspect-trace-correlation.yml',
              '.github/workflows/agent-finalize-weekly-planning-trace.yml',
          ]:
              Path(disposable).unlink(missing_ok=True)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git diff --check
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 週間計画traceの相関ID伝播を補強"
          git push origin HEAD:agent/weekly-planning-trace-full-implementation
