name: Close dialogue stack verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply verification completion records
        run: python3 .github/scripts/close-dialogue-stack-verification.py
      - name: Verify documentation state
        run: |
          git diff --check
          test -f docs/ai/tasks/closed/20260714-weekly-planning-dialogue-stack-verification.md
          test ! -f docs/ai/tasks/20260714-weekly-planning-dialogue-stack-verification.md
          grep -q 'Current main verification' docs/ai/weekly-planning-current-contract-status.md
          grep -q '1.5 Current main dialogue-stack verification' docs/ai/strategy/weekly-planning-roadmap.md
          grep -q 'Current main verification findings' docs/ai/tasks/20260716-weekly-planning-entrypoint-request-ownership.md
          grep -q 'current main targeted/full tests passed' docs/testing/weekly-planning-roleplay-status.md
      - name: Commit completion records
        run: |
          rm .github/scripts/close-dialogue-stack-verification.py
          rm .github/workflows/close-dialogue-stack-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: dialogue stack検証taskの完了記録を同期"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
