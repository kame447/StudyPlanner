name: One-shot request-context test updater

on:
  push:
    branches:
      - refactor/stable-v5-request-context-authority
    paths:
      - '.github/workflows/tmp-fix-request-context-tests.yml'

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stable-v5-request-context-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Update explicit request-context test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('src/features/weeklyPlanning/application/weeklyPlanningTestRequestContext.ts')
          helper.write_text("""export const WEEKLY_PLANNING_TEST_REQUEST_CONTEXT = {\n  startedAtIso: '2026-07-27T00:00:00.000Z',\n  timeZone: 'Asia/Tokyo',\n  currentDate: '2026-07-27',\n  currentTime: '09:00',\n  notBeforeDate: '2026-07-27',\n  notBeforeTime: '09:01',\n  weekStartsOn: 'monday',\n} as const;\n""", encoding='utf-8')

          application_targets = [
              Path('src/features/weeklyPlanning/application/weeklyPlanningStableV5InstrumentedRuntimeExecutor.test.ts'),
              Path('src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.test.ts'),
          ]
          public_targets = [
              Path('src/features/weeklyPlanning/weeklyPlanningStableV5FailureContract.test.ts'),
              Path('src/features/weeklyPlanning/weeklyPlanningTurnExecutor.activeDialogueProjection.test.ts'),
              Path('src/features/weeklyPlanning/weeklyPlanningTurnExecutor.dialogueContext.test.ts'),
              Path('src/features/weeklyPlanning/weeklyPlanningTurnExecutor.selfRepair.test.ts'),
              Path('src/features/weeklyPlanning/weeklyPlanningTurnExecutor.test.ts'),
              Path('src/features/weeklyPlanning/weeklyPlanningTurnExecutorStableV5Trace.test.ts'),
          ]

          total_insertions = 0

          instrumented = application_targets[0]
          text = instrumented.read_text(encoding='utf-8')
          import_line = "import { WEEKLY_PLANNING_TEST_REQUEST_CONTEXT } from './weeklyPlanningTestRequestContext';\n"
          if import_line not in text:
              text = import_line + text
          function_start = text.index('function input(')
          return_index = text.index('  return {', function_start)
          if 'requestContext:' not in text[return_index:return_index + 240]:
              text = text[:return_index] + "  return {\n    requestContext: WEEKLY_PLANNING_TEST_REQUEST_CONTEXT," + text[return_index + len('  return {'):]
              total_insertions += 1
          instrumented.write_text(text, encoding='utf-8')

          runtime = application_targets[1]
          text = runtime.read_text(encoding='utf-8')
          if import_line not in text:
              text = import_line + text
          marker = 'executeWeeklyPlanningStableV5RuntimeTurn({' 
          count = text.count(marker)
          if count == 0:
              raise SystemExit('No Stable V5 runtime execution calls found')
          text = text.replace(marker, marker + "\n      requestContext: WEEKLY_PLANNING_TEST_REQUEST_CONTEXT,")
          total_insertions += count
          runtime.write_text(text, encoding='utf-8')

          for path in public_targets:
              text = path.read_text(encoding='utf-8')
              public_import = "import { WEEKLY_PLANNING_TEST_REQUEST_CONTEXT } from './application/weeklyPlanningTestRequestContext';\n"
              if public_import not in text:
                  text = public_import + text
              marker = 'executeWeeklyPlanningTurn({' 
              count = text.count(marker)
              if count == 0:
                  raise SystemExit(f'No weekly planning execution calls found in {path}')
              text = text.replace(marker, marker + "\n      requestContext: WEEKLY_PLANNING_TEST_REQUEST_CONTEXT,")
              total_insertions += count
              path.write_text(text, encoding='utf-8')

          if total_insertions < 20:
              raise SystemExit(f'Unexpectedly few requestContext insertions: {total_insertions}')
          print(f'Inserted explicit requestContext into {total_insertions} test execution inputs')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify TypeScript contract
        run: npm run typecheck
      - name: Remove one-shot workflow
        run: rm .github/workflows/tmp-fix-request-context-tests.yml
      - name: Commit verified test updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/weeklyPlanning .github/workflows/tmp-fix-request-context-tests.yml
          git commit -m 'test: supply explicit Stable V5 request context'
          git push origin HEAD:refactor/stable-v5-request-context-authority
