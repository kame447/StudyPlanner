name: One-shot Ready PR 234

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    if: ${{ github.event.issue.pull_request && github.event.issue.number == 234 && github.actor == github.repository_owner && github.event.comment.body == '/ops-ready-234' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark PR 234 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr ready 234 --repo "$GITHUB_REPOSITORY"
          test "$(gh pr view 234 --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "false"
