name: One-shot issue 251 safe patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-issue251-safe.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stable-v5-question-slot-decoding
          fetch-depth: 0
      - name: Apply focused refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          helper = Path('src/features/weeklyPlanning/intake/weeklyPlanningStableV5QuestionSlot.ts')
          helper.write_text("const STABLE_V5_QUESTION_SLOT_PREFIX = 'stable_v5:' as const;\n\nexport function decodeWeeklyPlanningStableV5QuestionSlot(\n  targetSlot: string | null | undefined,\n): string | null {\n  if (!targetSlot?.startsWith(STABLE_V5_QUESTION_SLOT_PREFIX)) return null;\n  const questionCode = targetSlot.slice(STABLE_V5_QUESTION_SLOT_PREFIX.length).trim();\n  return questionCode || null;\n}\n\nexport function isWeeklyPlanningStableV5QuestionSlot(\n  targetSlot: string | null | undefined,\n): boolean {\n  return decodeWeeklyPlanningStableV5QuestionSlot(targetSlot) !== null;\n}\n", encoding='utf-8')
          test = Path('src/features/weeklyPlanning/intake/weeklyPlanningStableV5QuestionSlot.test.ts')
          test.write_text("import { describe, expect, it } from 'vitest';\nimport {\n  decodeWeeklyPlanningStableV5QuestionSlot,\n  isWeeklyPlanningStableV5QuestionSlot,\n} from './weeklyPlanningStableV5QuestionSlot';\n\ndescribe('Stable V5 question-slot decoding', () => {\n  it('decodes a valid Stable V5 question code', () => {\n    expect(decodeWeeklyPlanningStableV5QuestionSlot('stable_v5:missing_effort_estimate'))\n      .toBe('missing_effort_estimate');\n  });\n\n  it('normalizes surrounding whitespace in the encoded question code', () => {\n    expect(decodeWeeklyPlanningStableV5QuestionSlot('stable_v5:  missing_effort_estimate  '))\n      .toBe('missing_effort_estimate');\n  });\n\n  it('rejects unrelated slots', () => {\n    expect(decodeWeeklyPlanningStableV5QuestionSlot('legacy:missing_effort_estimate')).toBeNull();\n    expect(isWeeklyPlanningStableV5QuestionSlot('legacy:missing_effort_estimate')).toBe(false);\n  });\n\n  it('rejects empty and whitespace-only Stable V5 slots consistently', () => {\n    expect(decodeWeeklyPlanningStableV5QuestionSlot('stable_v5:')).toBeNull();\n    expect(decodeWeeklyPlanningStableV5QuestionSlot('stable_v5:   ')).toBeNull();\n    expect(isWeeklyPlanningStableV5QuestionSlot('stable_v5:')).toBe(false);\n    expect(isWeeklyPlanningStableV5QuestionSlot('stable_v5:   ')).toBe(false);\n  });\n});\n", encoding='utf-8')
          dialogue = Path('src/features/weeklyPlanning/dialogue/weeklyPlanningStableV5TurnDialogue.ts')
          text = dialogue.read_text(encoding='utf-8')
          old = "import type {\n  WeeklyPlanningStableV5DialogueQuestionIntent,\n} from './weeklyPlanningStableV5DialogueContracts';\n"
          new = old + "import {\n  decodeWeeklyPlanningStableV5QuestionSlot,\n} from '../intake/weeklyPlanningStableV5QuestionSlot';\n"
          assert old in text
          text = text.replace(old, new, 1)
          old = "function questionCode(result: WeeklyPlanningTurnExecutionResult): string | null {\n  const targetSlot = result.state.lastQuestionContext?.targetSlot;\n  return targetSlot?.startsWith('stable_v5:')\n    ? targetSlot.slice('stable_v5:'.length)\n    : null;\n}\n\nfunction questionCodeFromTargetSlot(targetSlot: string | undefined): string | null {\n  return targetSlot?.startsWith('stable_v5:')\n    ? targetSlot.slice('stable_v5:'.length)\n    : null;\n}\n"
          new = "function questionCode(result: WeeklyPlanningTurnExecutionResult): string | null {\n  return decodeWeeklyPlanningStableV5QuestionSlot(\n    result.state.lastQuestionContext?.targetSlot,\n  );\n}\n\nfunction questionCodeFromTargetSlot(targetSlot: string | undefined): string | null {\n  return decodeWeeklyPlanningStableV5QuestionSlot(targetSlot);\n}\n"
          assert old in text
          dialogue.write_text(text.replace(old, new, 1), encoding='utf-8')
          semantic = Path('src/features/weeklyPlanning/application/weeklyPlanningStableV5SemanticContext.ts')
          text = semantic.read_text(encoding='utf-8')
          old = "import type { PlanningIntakeState } from '../intake/weeklyPlanningIntakeTypes';\n"
          new = old + "import {\n  decodeWeeklyPlanningStableV5QuestionSlot,\n} from '../intake/weeklyPlanningStableV5QuestionSlot';\n"
          assert old in text
          text = text.replace(old, new, 1)
          old = "  const context = state?.lastQuestionContext;\n  const targetSlot = context?.targetSlot;\n  if (!targetSlot?.startsWith('stable_v5:')) return null;\n  const questionCode = targetSlot.slice('stable_v5:'.length).trim();\n  if (!questionCode) return null;\n"
          new = "  const context = state?.lastQuestionContext;\n  const questionCode = decodeWeeklyPlanningStableV5QuestionSlot(context?.targetSlot);\n  if (!questionCode) return null;\n"
          assert old in text
          semantic.write_text(text.replace(old, new, 1), encoding='utf-8')
          evaluation = Path('src/features/weeklyPlanning/application/weeklyPlanningStableV5PlanningEvaluation.ts')
          text = evaluation.read_text(encoding='utf-8')
          old = "import type { PlanningIntakeState } from '../intake/weeklyPlanningIntakeTypes';\n"
          new = old + "import {\n  isWeeklyPlanningStableV5QuestionSlot,\n} from '../intake/weeklyPlanningStableV5QuestionSlot';\n"
          assert old in text
          text = text.replace(old, new, 1)
          old = "function hadMachinePendingQuestion(state: PlanningIntakeState | undefined): boolean {\n  return state?.lastQuestionContext?.targetSlot?.startsWith('stable_v5:') ?? false;\n}\n"
          new = "function hadMachinePendingQuestion(state: PlanningIntakeState | undefined): boolean {\n  return isWeeklyPlanningStableV5QuestionSlot(state?.lastQuestionContext?.targetSlot);\n}\n"
          assert old in text
          evaluation.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: centralize Stable V5 question-slot decoding'
          git push origin HEAD:fix/stable-v5-question-slot-decoding
