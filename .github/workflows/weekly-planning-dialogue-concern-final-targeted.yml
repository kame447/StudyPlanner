name: Weekly Planning Dialogue Concern Final Targeted
on:
  push:
    branches: [agent/weekly-ai-conversation-eval]
    paths: [.github/workflows/weekly-planning-dialogue-concern-final-targeted.yml]
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/weekly-ai-conversation-eval}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx tsc -b --pretty false
      - name: Run focused regressions
        run: >-
          npx vitest run
          src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.test.ts
          src/features/weeklyPlanning/dialogue/weeklyPlanningStableV5AiDialogueRenderer.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningDurableConcernBasisV5.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningDurableConcernPromptV5.test.ts
          src/features/userPlanningContext/userPlanningContextConcernHistoryV1.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPromptBudget.test.ts
          src/features/weeklyPlanning/__tests__/weeklyPlanningPromptGeneralizationV5.test.ts
