name: Fix weekly planning trace test typo

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/weekly-planning-trace-full-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-trace-full-implementation
          fetch-depth: 0
      - name: Fix assertion and cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/features/weeklyPlanning/trace/weeklyPlanningTraceRuntimeContract.test.ts')
          value = path.read_text(encoding='utf-8')
          old = "expect(new Set(sessions.map((session) => session.logicalConversationId).size).toBe(2));"
          new = "expect(new Set(sessions.map((session) => session.logicalConversationId)).size).toBe(2);"
          if value.count(old) != 1:
              raise RuntimeError(f'expected one malformed assertion, got {value.count(old)}')
          path.write_text(value.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/agent-fix-trace-test-typo.yml').unlink()
          PY
          git diff --check
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 週間計画traceのreset回帰テストを修正"
          git push origin HEAD:agent/weekly-planning-trace-full-implementation
