# Verification inputs only. One workflow-only child of the same-ref cleanup commit.
name: Issue 488 H2 Exact Verification Once
on:
  push:
    branches: ['integration/issue488-h2-verification']
    paths: ['.github/workflows/issue488-h2-verify-once.yml']
permissions:
  contents: read
env:
  EVENT_PARENT: '00df2049187e872dd58f1580569f6be31a72381b'
  SOURCE_SHA: '18f550af136792789182bf0518474288076a96f5'
  SOURCE_TREE: '4ce09d71bfc0eaafe75c559532b5c92c548f4f5d'
  TARGET_TREE: 'dd672cee16a1b7aafc8fccd2308ec8f825c161ca'
  WORKFLOW_PATH: '.github/workflows/issue488-h2-verify-once.yml'
concurrency:
  group: issue488-h2-exact-verification-once
  cancel-in-progress: false
jobs:
  verify_once:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'kame447/StudyPlanner' &&
          github.repository_id == '1202727586' &&
          github.repository_owner == 'kame447' &&
          github.actor == 'kame447' && github.actor_id == '76802107' &&
          github.triggering_actor == 'kame447' &&
          github.ref == 'refs/heads/integration/issue488-h2-verification' &&
          github.run_attempt == 1 &&
          github.event.created == false && github.event.deleted == false &&
          github.event.forced == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ''
      VITE_AI_API_KEY: ''
      VITE_CLOUDFLARE_AI_PROXY_URL: ''
      GOOGLE_API_KEY: ''
      STUDYPLANNER_F1_REAL_API: '0'
      STUDYPLANNER_R0_REAL_API: '0'
      STUDYPLANNER_H_REAL_API: '0'
      STUDYPLANNER_H2_REAL_API: '0'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the workflow-only event before executing source
        id: event_guard
        env:
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTING_WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = kame447/StudyPlanner
          test "$GITHUB_REPOSITORY_ID" = 1202727586
          test "$GITHUB_REPOSITORY_OWNER" = kame447
          test "$GITHUB_ACTOR" = kame447
          test "$GITHUB_ACTOR_ID" = 76802107
          test "$GITHUB_TRIGGERING_ACTOR" = kame447
          test "$GITHUB_REF" = refs/heads/integration/issue488-h2-verification
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXECUTING_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$EXECUTING_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$WORKFLOW_PATH@$GITHUB_REF"
          python3 - <<'PYEVENT'
          import json,os,pathlib
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['before']==os.environ['EVENT_PARENT'] and event['after']==os.environ['GITHUB_SHA']
          assert event['created'] is False and event['deleted'] is False and event['forced'] is False
          assert event['repository']['full_name']=='kame447/StudyPlanner' and event['repository']['id']==1202727586
          assert event['sender']['login']=='kame447' and event['sender']['id']==76802107
          PYEVENT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P "$GITHUB_SHA")" = "$EVENT_PARENT"
          test "$(git rev-parse "${EVENT_PARENT}^{tree}")" = "$SOURCE_TREE"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r "$EVENT_PARENT" "$GITHUB_SHA")" = "$(printf 'A\t%s' "$WORKFLOW_PATH")"
          test "$(git ls-tree "$GITHUB_SHA" -- "$WORKFLOW_PATH" | awk '{print $1, $2}')" = '100644 blob'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/h2-artifacts"
          cp "$WORKFLOW_PATH" "$RUNNER_TEMP/h2-artifacts/executing-workflow.yml"
          python3 - <<'PYPROVENANCE'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'h2-artifacts'
          d={k:os.environ[v] for k,v in {'eventParent':'EVENT_PARENT','baseHead':'SOURCE_SHA','baseTree':'SOURCE_TREE','candidateTree':'TARGET_TREE',
             'eventSha':'GITHUB_SHA','workflowSha':'EXECUTING_WORKFLOW_SHA','ref':'GITHUB_REF','runId':'GITHUB_RUN_ID'}.items()}
          d.update(attempt=1,verificationInputOnly=True,workflowSha256=hashlib.sha256((out/'executing-workflow.yml').read_bytes()).hexdigest())
          (out/'event-provenance.json').write_text(json.dumps(d,indent=2)+'\n')
          PYPROVENANCE
      - name: Check out frozen H2 source, excluding the event workflow
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
      - name: Materialize the bounded reviewed verification-input bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          python3 - <<'PYBUNDLE'
          import base64,gzip,hashlib,json,os,pathlib
          packed=base64.b64decode('',validate=True)
          assert len(packed)==53162 and hashlib.sha256(packed).hexdigest()=='4e0cfd5a655928a65293536027d5b3db764c9d364a34a696fe5c60512d27762c'
          raw=gzip.decompress(packed)
          assert len(raw)==197487 and hashlib.sha256(raw).hexdigest()=='0762e8291994c264e37f1d6c041dbb2b932f98bd796bc7dcaa2a0588e9168614'
          values=json.loads(raw)
          expected={'run-verify.py': 'b81e41db7634da0e5de95fa156bee19bdf310ca6e40683eaa797b895230a1f2d', 'source-manifest.json': '527a22879a3f31af81020ecfc6a47de0b74f34aec62eec8b807066f004fb94ea', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningExistingEntityBindingV5.ts': 'c25056614610f2472b036804a7ec52288a88e095c604e442735853bd0d1f8bec', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningExistingWorkloadBindingV5.test.ts': 'e8aef74025dbd3a790306184c40b73e1bd04365b8ae7bbd98b3ded7fe0515785', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningStableV5ContextualAnswer.ts': '68b7243b1a2b97ea1afcc6e4cfe066f205a6e10116408c6f99d99676ff278914', 'source/src/features/weeklyPlanning/trace/weeklyPlanningCorrectionTracePersistence.integration.test.ts': 'd4c2542b4e2c640faec7f2940cbe81e0459d9faddcf9436456d829f9e274dfdb'}
          assert type(values) is dict and set(values)==set(expected)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'h2-bundle';root.mkdir(exist_ok=False)
          for name,encoded in values.items():
              assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
              value=base64.b64decode(encoded,validate=True)
              assert len(value)<=100000 and hashlib.sha256(value).hexdigest()==expected[name]
              target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(value)
          PYBUNDLE
      - name: Install pinned npm with a private empty configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = v22.23.0
          mkdir -p "$RUNNER_TEMP/h2-bootstrap-home" "$RUNNER_TEMP/h2-bootstrap-cache" "$RUNNER_TEMP/h2-bootstrap-logs" "$RUNNER_TEMP/h2-bootstrap-tmp"
          touch "$RUNNER_TEMP/h2-bootstrap-npmrc" "$RUNNER_TEMP/h2-bootstrap-global-npmrc"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/h2-bootstrap-home" TMPDIR="$RUNNER_TEMP/h2-bootstrap-tmp" \
            NPM_CONFIG_CACHE="$RUNNER_TEMP/h2-bootstrap-cache" NPM_CONFIG_LOGS_DIR="$RUNNER_TEMP/h2-bootstrap-logs" \
            NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/h2-bootstrap-npmrc" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/h2-bootstrap-global-npmrc" \
            NPM_CONFIG_AUDIT=false NPM_CONFIG_FUND=false NPM_CONFIG_UPDATE_NOTIFIER=false \
            npm install --prefix "$RUNNER_TEMP/h2-npm" --no-save --package-lock=false npm@11.9.0 \
            2>&1 | tee "$RUNNER_TEMP/h2-artifacts/npm-bootstrap.log"
          test "$(node "$RUNNER_TEMP/h2-npm/node_modules/npm/bin/npm-cli.js" --version)" = 11.9.0
      - name: Run unchanged npm verify on the exact reconstructed candidate tree
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin ISSUE488_H2_REMOTE_ONCE=yes \
            python3 "$RUNNER_TEMP/h2-bundle/run-verify.py" --source "$PWD" \
              --node "$(command -v node)" --npm-cli "$RUNNER_TEMP/h2-npm/node_modules/npm/bin/npm-cli.js" \
              --output "$RUNNER_TEMP/h2-artifacts/execution" \
              > "$RUNNER_TEMP/h2-artifacts/runner.log" 2>&1
      - name: Read terminal evidence without hiding verification failure
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTERMINAL'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'h2-artifacts/execution/terminal.json'
          assert p.is_file(), 'terminal missing; verification remains incomplete'
          d=json.loads(p.read_text());print(json.dumps(d,indent=2))
          assert d['status']=='full_verify_passed' and type(d['exit']) is int and d['exit']==0
          assert d['naturalTermination'] is True and d['identityPreserved'] is True
          assert d['candidateTree']=='dd672cee16a1b7aafc8fccd2308ec8f825c161ca' and d['errors']==[]
          PYTERMINAL
      - name: Upload the single diagnostic root on success or failure
        if: ${{ always() && steps.event_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue488-h2-exact-tree-dd672-event-${{ github.sha }}
          path: ${{ runner.temp }}/h2-artifacts/
          if-no-files-found: error
          retention-days: 14
