name: Agent weekly planning trace validation

on:
  push:
    branches:
      - agent/weekly-planning-trace-full-implementation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:run -- src/features/weeklyPlanning/trace
      - run: npm run test:run -- src/features/weeklyPlanning
      - run: npm run test:run
      - run: npm run build
