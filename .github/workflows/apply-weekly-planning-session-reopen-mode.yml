name: Apply weekly planning session reopen mode

on:
  push:
    branches:
      - agent/weekly-planning-conversation-hardening
    paths:
      - scripts/apply-weekly-planning-session-reopen-mode.mjs
      - .github/workflows/apply-weekly-planning-session-reopen-mode.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 1
          show-progress: false
      - name: Apply reopen mode
        run: node scripts/apply-weekly-planning-session-reopen-mode.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Weekly planning tests
        run: npm run test:run -- src/features/weeklyPlanning src/components/WeeklyPlanningConversation.test.tsx src/components/weeklyPlanningConversationMode.test.ts
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Finalize documents
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const taskPath = 'docs/ai/tasks/20260716-weekly-planning-session-reopen-mode.md';
          let task = fs.readFileSync(taskPath, 'utf8');
          task = task.replace('Status: open', 'Status: closed\nClosed: 2026-07-16');
          task = task.replaceAll('- [ ]', '- [x]');
          fs.writeFileSync(taskPath, task);

          const reviewPath = 'docs/ai/tasks/20260716-weekly-planning-conversation-hardening-codex-review.md';
          let review = fs.readFileSync(reviewPath, 'utf8');
          review = review.replace(
            '- preview昇格・承認を含む成功応答の表示元を会話履歴へ一本化',
            '- preview昇格・承認を含む成功応答の表示元を会話履歴へ一本化\n- 保存済みsessionがある場合はmodal再表示時に週間計画画面から再開',
          );
          review = review.replace(
            '11. preview昇格・承認成功時の文がstatus cardと会話履歴へ重複表示されないこと。',
            '11. preview昇格・承認成功時の文がstatus cardと会話履歴へ重複表示されないこと。\n12. 保存済みsessionがある場合だけ初期タブが週間計画になり、mount後の手動切替をprops更新で上書きしないこと。',
          );
          fs.writeFileSync(reviewPath, review);
          NODE
      - name: Remove temporary automation
        run: rm scripts/apply-weekly-planning-session-reopen-mode.mjs .github/workflows/apply-weekly-planning-session-reopen-mode.yml
      - name: Commit verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 保存済み週間計画sessionを再開"
          git push origin HEAD:agent/weekly-planning-conversation-hardening
