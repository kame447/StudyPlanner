name: Fix Issue 266 One-shot Identity

on:
  push:
    branches:
      - refactor/issue266-recurring-plan-mutations
    paths:
      - .github/workflows/tmp-fix-issue266-identity.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue266-recurring-plan-mutations
          fetch-depth: 0
      - name: Execute validated integration without workflow rewrite
        shell: bash
        env:
          FEATURE_HEAD: b6c00128d287cdf30bb809f02fa3a1388ed726c3
          FEATURE_BASE: 06e19af497ef56fcbcf487e956a526aa555c1909
          EXPECTED_MAIN: 129b06169da47499ad634285ac648749e1676c67
          TARGET_BRANCH: refactor/issue266-recurring-plan-mutations
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/tmp-merge-issue266-main.yml').read_text()
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit(f'expected one integration run block, found {source.count(marker)}')
          script = textwrap.dedent(source.split(marker, 1)[1])
          anchor = 'TREE_SHA="$(git write-tree)"\n'
          if script.count(anchor) != 1:
              raise SystemExit(f'expected one TREE_SHA anchor, found {script.count(anchor)}')
          script = script.replace(
              anchor,
              anchor
              + 'git config user.name "github-actions[bot]"\n'
              + 'git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n',
              1,
          )
          Path('/tmp/issue266-integration.sh').write_text(script)
          PY
          bash /tmp/issue266-integration.sh
