name: Weekly planning trace privacy implementation

on:
  push:
    branches:
      - agent/weekly-planning-trace-privacy

permissions:
  contents: read

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply integration
        shell: bash
        run: |
          set -e
          python -m py_compile .github/scripts/apply-weekly-trace-privacy-integration.py
          python .github/scripts/apply-weekly-trace-privacy-integration.py
          git diff --check
          git diff --stat
          git diff --binary > weekly-trace-privacy.patch

      - name: Install dependencies
        run: npm ci

      - name: Run trace privacy focused tests
        run: >-
          npm run test:run --
          workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts
          src/features/weeklyPlanning/trace/weeklyPlanningTraceRepository.test.ts
          src/features/weeklyPlanning/trace/weeklyPlanningTraceRemoteRepository.test.ts
          src/components/NaturalLanguageAssistant.weeklyPlanningControls.test.tsx

      - name: Run trace suite
        run: npm run test:run -- src/features/weeklyPlanning/trace

      - name: Run weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning

      - name: Run full test suite
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.57.0 deploy --dry-run --config workers/ai-proxy/wrangler.jsonc

      - name: Upload implementation and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-trace-privacy-output
          if-no-files-found: error
          retention-days: 3
          path: |
            weekly-trace-privacy.patch
            src/App.tsx
            src/components/QuickEntryModal.tsx
            src/components/NaturalLanguageAssistant.tsx
            src/components/NaturalLanguageAssistant.weeklyPlanningControls.test.tsx
            src/features/weeklyPlanning/trace
            workers/ai-proxy/src/index.ts
            workers/ai-proxy/src/weeklyPlanningTraceApi.ts
            workers/ai-proxy/src/weeklyPlanningTraceFirestore.ts
            workers/ai-proxy/src/weeklyPlanningTracePrivacy.ts
            workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts
            firestore.rules
