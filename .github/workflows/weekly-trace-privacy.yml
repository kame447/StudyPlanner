name: Weekly planning privacy verification

on:
  push:
    branches:
      - agent/weekly-planning-trace-privacy

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee verification-install.log

      - name: Run focused tests
        id: focused
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:run -- \
            src/components/InitialPrivacyConsentScreen.test.tsx \
            src/features/weeklyPlanning/trace/weeklyPlanningTraceRemoteRepository.test.ts \
            workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts \
            2>&1 | tee verification-focused.log

      - name: Run trace tests
        id: trace
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:run -- src/features/weeklyPlanning/trace \
            2>&1 | tee verification-trace.log

      - name: Run full test suite
        id: full
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee verification-full.log

      - name: Build production app
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee verification-build.log

      - name: Validate Worker bundle
        id: worker
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.57.0 deploy --dry-run \
            --config workers/ai-proxy/wrangler.jsonc \
            2>&1 | tee verification-worker.log

      - name: Report result to pull request
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          TRACE_OUTCOME: ${{ steps.trace.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- weekly-trace-privacy-verification -->';
            const items = [
              ['依存関係の準備', process.env.INSTALL_OUTCOME, 'verification-install.log'],
              ['初回同意・個人情報除去の重点テスト', process.env.FOCUSED_OUTCOME, 'verification-focused.log'],
              ['週間計画の会話記録テスト', process.env.TRACE_OUTCOME, 'verification-trace.log'],
              ['全自動テスト', process.env.FULL_OUTCOME, 'verification-full.log'],
              ['本番用画面のビルド', process.env.BUILD_OUTCOME, 'verification-build.log'],
              ['会話記録用サーバーの構成確認', process.env.WORKER_OUTCOME, 'verification-worker.log'],
            ];
            const failed = items.filter(([, outcome]) => outcome !== 'success');
            const status = failed.length === 0 ? 'success' : 'failure';
            const symbol = status === 'success' ? '✅' : '❌';
            const lines = items.map(([label, outcome]) =>
              `- ${outcome === 'success' ? '✅' : outcome === 'skipped' ? '⏭️' : '❌'} ${label}: **${outcome || 'unknown'}**`
            );
            const excerpts = failed.flatMap(([label, outcome, path]) => {
              if (outcome === 'skipped' || !fs.existsSync(path)) return [];
              const text = fs.readFileSync(path, 'utf8').trim().split('\n').slice(-30).join('\n');
              return [`\n<details><summary>${label}の末尾ログ</summary>\n\n\`\`\`text\n${text}\n\`\`\`\n</details>`];
            });
            const body = `${marker}\n## 初回同意・会話記録保護の自動検証\n\n${symbol} 結果: **${status}**\n\n${lines.join('\n')}${excerpts.join('\n')}`;
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:agent/weekly-planning-trace-privacy`,
            });
            const pull = pulls.data[0];
            if (!pull) return;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pull.number,
                body,
              });
            }

      - name: Fail when any verification failed
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          TRACE_OUTCOME: ${{ steps.trace.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          WORKER_OUTCOME: ${{ steps.worker.outcome }}
        run: |
          test "$INSTALL_OUTCOME" = success
          test "$FOCUSED_OUTCOME" = success
          test "$TRACE_OUTCOME" = success
          test "$FULL_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$WORKER_OUTCOME" = success
