name: Apply remaining final-audit fixes

on:
  push:
    branches:
      - agent/fix-weekly-planning-trace-and-dialogue-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-trace-and-dialogue-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found: {path}\n{old[:200]}')
              file.write_text(text.replace(old, new, 1))

          # T2: 表示質問と保存contextを一対一にし、meal/bath短答は限定的なrepairへ送る。
          replace(
              'src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueManager.ts',
              'const MAX_MISSING_QUESTIONS_PER_TURN = 2;',
              'const MAX_MISSING_QUESTIONS_PER_TURN = 1;',
          )
          replace(
              'src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueManager.ts',
              """function clarificationExplanation(targetSlot: string | undefined): string {
            if (!targetSlot) return GENERIC_CLARIFICATION;
            return termExplanationForSlot(targetSlot)
              ?? CONTEXTUAL_CLARIFICATION_EXPLANATIONS[targetSlot]
              ?? GENERIC_CLARIFICATION;
          }""",
              """function clarificationExplanation(targetSlot: string | undefined): string {
            if (!targetSlot) return GENERIC_CLARIFICATION;
            if (targetSlot === 'meal_bath_constraints') {
              return '時刻だけでは食事かお風呂かを特定できません。その時刻は食事の開始ですか、それともお風呂の開始ですか？';
            }
            return termExplanationForSlot(targetSlot)
              ?? CONTEXTUAL_CLARIFICATION_EXPLANATIONS[targetSlot]
              ?? GENERIC_CLARIFICATION;
          }""",
          )

          # T5: 一般的な「1科目」だけではexam scopeへ遷移しない。
          replace(
              'src/features/weeklyPlanning/intake/weeklyPlanningScopeParsing.ts',
              r"""function hasExamScopeSignal(text: string): boolean {
            const normalizedText = normalizeIntakeText(text);
            const fieldDeclaration = /(?:対象)?分野(?:は|が|を)|分野ごと|(?:[0-9]+|[一二三四五六七八九十]+)\s*分野(?!\s*(?:あたり|の\s*(?:1|一)?\s*年分))|(?:[0-9]+|[一二三四五六七八九十]+)\s*科目|第\s*\d+\s*部/.test(normalizedText);
            return /院試|20\d{2}\s*[〜~-]\s*20\d{2}/.test(normalizedText)
              || fieldDeclaration
              || Boolean(parseTotalYears(normalizedText));
          }""",
              r"""function hasExamScopeSignal(
            text: string,
            previousScope: ExamPrepScope | undefined,
          ): boolean {
            const normalizedText = normalizeIntakeText(text);
            const explicitExamContext = /院試|過去問|20\d{2}\s*[〜~-]\s*20\d{2}/.test(normalizedText);
            const fieldDeclaration = /(?:対象)?分野(?:は|が|を)|分野ごと|(?:[0-9]+|[一二三四五六七八九十]+)\s*分野(?!\s*(?:あたり|の\s*(?:1|一)?\s*年分))|第\s*\d+\s*部/.test(normalizedText);
            const subjectCount = /(?:[0-9]+|[一二三四五六七八九十]+)\s*科目/.test(normalizedText);
            return explicitExamContext
              || fieldDeclaration
              || Boolean(parseTotalYears(normalizedText))
              || Boolean(previousScope && subjectCount);
          }""",
          )
          replace(
              'src/features/weeklyPlanning/intake/weeklyPlanningScopeParsing.ts',
              '  if (!hasExamScopeSignal(text)) {',
              '  if (!hasExamScopeSignal(text, previousScope)) {',
          )

          # T7: server生成expireAtだけが異なる同一entry retryを成功扱いする。
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceFirestore.ts',
              """    delete normalizedExisting.id;
              delete normalizedValue.id;
              if (stableJson(normalizedExisting) !== stableJson(normalizedValue)) {""",
              """    delete normalizedExisting.id;
              delete normalizedValue.id;
              delete normalizedExisting.expireAt;
              delete normalizedValue.expireAt;
              if (stableJson(normalizedExisting) !== stableJson(normalizedValue)) {""",
          )

          # T9: 新形式validatorは緩めず、旧redacted document handleだけを別経路で許可する。
          replace(
              'workers/ai-proxy/src/weeklyPlanningTracePrivacy.ts',
              """const TRACE_SESSION_ID_PATTERN = new RegExp(`^weekly-trace-${OPAQUE_SUFFIX}$`, 'i');
          const TRACE_CONVERSATION_ID_PATTERN""",
              """const TRACE_SESSION_ID_PATTERN = new RegExp(`^weekly-trace-${OPAQUE_SUFFIX}$`, 'i');
          const LEGACY_REDACTED_TRACE_SESSION_HANDLE_PATTERN = /^weekly-trace-\\[UUID\\]$/;
          const TRACE_CONVERSATION_ID_PATTERN""",
          )
          replace(
              'workers/ai-proxy/src/weeklyPlanningTracePrivacy.ts',
              """export function isWeeklyPlanningTraceSessionId(value: unknown): value is string {
            return typeof value === 'string' && TRACE_SESSION_ID_PATTERN.test(value);
          }

          export function isWeeklyPlanningTraceConversationId""",
              """export function isWeeklyPlanningTraceSessionId(value: unknown): value is string {
            return typeof value === 'string' && TRACE_SESSION_ID_PATTERN.test(value);
          }

          export function isWeeklyPlanningLegacyTraceSessionHandle(value: unknown): value is string {
            return typeof value === 'string'
              && LEGACY_REDACTED_TRACE_SESSION_HANDLE_PATTERN.test(value);
          }

          export function isWeeklyPlanningTraceConversationId""",
          )
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceApi.ts',
              """  isWeeklyPlanningTraceEntryId,
            isWeeklyPlanningTracePolicyAccepted,
            isWeeklyPlanningTraceSessionId,""",
              """  isWeeklyPlanningTraceEntryId,
            isWeeklyPlanningLegacyTraceSessionHandle,
            isWeeklyPlanningTracePolicyAccepted,
            isWeeklyPlanningTraceSessionId,""",
          )
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceApi.ts',
              """  if (!sessionId) return error(400, 'sessionId is required');
            if (!isWeeklyPlanningTraceSessionId(sessionId)) return error(400, 'sessionId is invalid');
            const target = await firestore.getDocument(TRACE_SESSIONS, sessionId);""",
              """  if (!sessionId) return error(400, 'sessionId is required');
            const isCurrentSessionId = isWeeklyPlanningTraceSessionId(sessionId);
            const isLegacySessionHandle = isWeeklyPlanningLegacyTraceSessionHandle(sessionId);
            if (!isCurrentSessionId && !isLegacySessionHandle) {
              return error(400, 'sessionId is invalid');
            }
            const target = await firestore.getDocument(TRACE_SESSIONS, sessionId);""",
          )
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceApi.ts',
              "  if (target.storageLayoutVersion === TRACE_STORAGE_LAYOUT_VERSION) {",
              "  if (isCurrentSessionId && target.storageLayoutVersion === TRACE_STORAGE_LAYOUT_VERSION) {",
          )

          # T7 regression: expireAt差分だけのretryはidempotent。
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceFirestore.integration.test.ts',
              """  it('creates immutable documents atomically and accepts an identical retry', async () => {
              const value = { id: ENTRY_ID, sessionId: SESSION_ID, sequence: 0, content: 'first' };
              let createAttempts = 0;""",
              """  it('creates immutable documents atomically and accepts a retry with a refreshed expiry', async () => {
              const storedValue = {
                id: ENTRY_ID,
                sessionId: SESSION_ID,
                sequence: 0,
                content: 'first',
                expireAt: '2027-01-14T00:00:00.000Z',
              };
              const retryValue = {
                ...storedValue,
                expireAt: '2027-01-14T00:00:01.000Z',
              };
              let createAttempts = 0;""",
          )
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceFirestore.integration.test.ts',
              """          return new Response(JSON.stringify(firestoreDocument(ENTRY_ID, value)), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' },
                  });""",
              """          return new Response(JSON.stringify(firestoreDocument(ENTRY_ID, storedValue)), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' },
                  });""",
          )
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceFirestore.integration.test.ts',
              """      value,
              )).resolves.toBeUndefined();
              await expect(client.setImmutableDocument(
                'weekly_planning_trace_entries',
                ENTRY_ID,
                value,""",
              """      storedValue,
              )).resolves.toBeUndefined();
              await expect(client.setImmutableDocument(
                'weekly_planning_trace_entries',
                ENTRY_ID,
                retryValue,""",
          )

          # T9 regression fixture and request.
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts',
              """  const conversationId = 'weekly-conversation-223e4567-e89b-12d3-a456-426614174000';
            const sessionDocument = {""",
              """  const conversationId = 'weekly-conversation-223e4567-e89b-12d3-a456-426614174000';
            const legacySessionId = 'weekly-trace-[UUID]';
            const sessionDocument = {""",
          )
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts',
              """  const entryDocuments = new Map<string, Record<string, unknown>>([
              [`${sessionId}-00000000`, {""",
              """  const legacySessionDocument = {
              id: legacySessionId,
              logicalConversationId: '[UUID]',
              entryCount: 1,
              traceSubjectToken: 'wpt_hidden-legacy-session-token',
            };
            const entryDocuments = new Map<string, Record<string, unknown>>([
              [`${legacySessionId}-00000000`, {
                id: `${legacySessionId}-00000000`,
                sessionId: legacySessionId,
                logicalConversationId: '[UUID]',
                sequence: 0,
                content: 'legacy',
                traceSubjectToken: 'wpt_hidden-legacy-entry-token',
              }],
              [`${sessionId}-00000000`, {""",
          )
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts',
              """      if (collection === 'weekly_planning_trace_sessions' && id === sessionId) {
                  return { ...sessionDocument };
                }
                if (collection === 'weekly_planning_trace_entries') {
                  throw new Error('current layout must use a bounded session query');
                }""",
              """      if (collection === 'weekly_planning_trace_sessions' && id === sessionId) {
                  return { ...sessionDocument };
                }
                if (collection === 'weekly_planning_trace_sessions' && id === legacySessionId) {
                  return { ...legacySessionDocument };
                }
                if (collection === 'weekly_planning_trace_entries') {
                  if (id.startsWith(legacySessionId)) {
                    return entryDocuments.get(id) ?? null;
                  }
                  throw new Error('current layout must use a bounded session query');
                }""",
          )
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts',
              """    sessionId,
              conversationId,
              auditWrites,""",
              """    sessionId,
              legacySessionId,
              conversationId,
              auditWrites,""",
          )
          replace(
              'workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts',
              """  });
          });
          """,
              """  });

            it('retrieves entries for the exact legacy redacted session handle', async () => {
              const result = await handleWeeklyPlanningTraceApi(
                new Request('https://example.test/weekly-planning-trace/admin/entries', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ sessionId: fakeFirestore.legacySessionId }),
                }),
                env(),
                { uid: 'admin-user' },
              );

              expect(result.status).toBe(200);
              const entries = result.body.entries as Array<Record<string, unknown>>;
              expect(entries).toEqual([
                expect.objectContaining({
                  id: `${fakeFirestore.legacySessionId}-00000000`,
                  sessionId: fakeFirestore.legacySessionId,
                  content: 'legacy',
                }),
              ]);
            });
          });
          """,
          )

          Path('src/features/weeklyPlanning/__tests__/weeklyPlanningFinalAuditRemainingFixes.test.ts').write_text("""import { describe, expect, it } from 'vitest';
          import { createMissingQuestionPlan, createWeeklyPlanningClarificationDecision } from '../dialogue/weeklyPlanningDialogueManager';
          import { createInitialPlanningIntakeState } from '../intake/weeklyPlanningIntakeReducer';
          import { parseSetExamScopeCommand } from '../intake/weeklyPlanningScopeParsing';

          describe('weekly planning remaining final-audit fixes', () => {
            it('renders at most one missing question so persisted context is complete', () => {
              const state = {
                ...createInitialPlanningIntakeState(),
                missing: ['fixed_events', 'sleep_cycle'] as const,
              };

              expect(createMissingQuestionPlan(state)).toHaveLength(1);
            });

            it('explains why a bare meal/bath time needs a targeted repair', () => {
              const state = {
                ...createInitialPlanningIntakeState(),
                missing: ['meal_bath_constraints'] as const,
              };
              const decision = createWeeklyPlanningClarificationDecision({
                state,
                target: 'unresolved_slot',
                ref: 'meal_bath_constraints',
                previousQuestionContext: {
                  kind: 'missing',
                  targetSlot: 'meal_bath_constraints',
                  intent: 'ask_life_constraints',
                },
              });

              expect(decision.clarification?.explanation).toContain('食事かお風呂か');
              expect(decision.clarification?.explanation).toContain('食事の開始');
            });

            it('does not classify a generic subject count as an entrance-exam scope', () => {
              expect(parseSetExamScopeCommand(
                '来週は数学を1科目勉強する計画を立てたいです',
                undefined,
              )).toBeUndefined();
            });

            it('still accepts subject counts with explicit or existing exam context', () => {
              expect(parseSetExamScopeCommand(
                '院試の過去問は数学を1科目進めたいです',
                undefined,
              )).toBeDefined();
              expect(parseSetExamScopeCommand(
                '1科目です',
                {
                  examType: '院試',
                  fields: ['OS'],
                  totalFields: 1,
                  unitModel: 'year_field_chunk',
                  rawText: ['院試の過去問はOSです'],
                },
              )).toBeDefined();
            });
          });
          """)

          # 診断用変更を戻し、この一時workflow自身も最終commitに残さない。
          Path('.github/workflows/ci.yml').write_text("""name: CI

          on:
            pull_request:
              branches:
                - main
              types:
                - opened
                - synchronize
                - reopened
                - ready_for_review
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - name: Install dependencies
                  run: npm ci
                - name: Run tests
                  run: npm run test:run
                - name: TypeScript and production build
                  run: npm run build
                - name: Check pull request diff
                  if: github.event_name == 'pull_request'
                  run: git diff --check origin/${{ github.base_ref }}...HEAD
          """)
          Path('.github/workflows/agent-apply-final-audit-fixes.yml').unlink()
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused regression tests
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/__tests__/weeklyPlanningCandidateAuditHardening.test.ts
          src/features/weeklyPlanning/__tests__/weeklyPlanningFinalAuditRemainingFixes.test.ts
          workers/ai-proxy/src/weeklyPlanningTraceFirestore.integration.test.ts
          workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts
      - name: Run full verification
        run: |
          npm run test:run
          npm run build
          git diff --check
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: 最終監査の残指摘を修正する'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
