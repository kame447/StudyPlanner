name: Verify Month Event Range

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-apply:
    if: github.event.head_commit.message == 'chore: trigger multi-day month event verifier'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply patch and verify exact product behavior
        shell: bash
        run: |
          set -uo pipefail

          result_file=.month-event-range-verification.txt
          log_file=/tmp/month-event-range-step.log
          rm -f "$result_file" "$log_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          record_failure() {
            step_name="$1"
            exit_code="$2"
            {
              echo "status=failed"
              echo "step=$step_name"
              echo "exit_code=$exit_code"
              echo "head=$(git rev-parse HEAD)"
              echo "--- log tail ---"
              tail -n 160 "$log_file" || true
            } > "$result_file"
            git add "$result_file"
            git commit -m "chore: record month event verifier failure"
            git push
            exit "$exit_code"
          }

          run_step() {
            step_name="$1"
            shift
            echo "[$step_name] $*"
            "$@" > "$log_file" 2>&1
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              record_failure "$step_name" "$exit_code"
            fi
          }

          run_step patch-syntax node --check scripts/apply-month-event-range.mjs
          run_step patch-apply node scripts/apply-month-event-range.mjs
          run_step diff-check git diff --check
          run_step npm-ci npm ci
          run_step typecheck npm run typecheck
          run_step focused-tests node ./node_modules/vitest/vitest.mjs --config vite.config.mjs run src/lib/monthEvents.test.ts src/lib/monthEventEditor.test.ts src/lib/monthViewProjection.test.ts
          run_step full-unit-suite npm run test:run
          run_step production-build npm run build
          run_step isolated-playwright-install npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.62.1
          run_step chromium-install ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium
          run_step mobile-e2e ./tests/e2e/node_modules/.bin/playwright test tests/e2e/mobile-overlay-stability.spec.mjs --config=tests/e2e/playwright.config.mjs

          git add \
            src/types/domain.ts \
            src/domain/planner.ts \
            src/lib/monthEvents.ts \
            src/lib/monthEventEditor.ts \
            src/components/MonthEventDialog.tsx \
            src/components/MonthGridPanel.tsx \
            src/components/MonthDaySheet.tsx \
            src/lib/monthEvents.test.ts \
            src/lib/monthEventEditor.test.ts \
            src/lib/monthViewProjection.test.ts \
            tests/e2e/mobile-overlay-stability.spec.mjs
          git commit -m "fix: support multi-day month events"
          git push
