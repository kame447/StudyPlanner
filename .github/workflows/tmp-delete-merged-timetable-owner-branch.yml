name: One-shot merged timetable branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-delete-merged-timetable-owner-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merged branch target
        run: |
          git fetch origin refactor/timetable-active-term-owner
          test "$(git rev-parse origin/refactor/timetable-active-term-owner)" = "3e839d61744f7d7c1f8974e7cfbe824c5746b567"
          git merge-base --is-ancestor 139c00b66c8fe9da97dd0b81175ebab6180ce581 origin/main
          test "$(git rev-parse origin/refactor/timetable-active-term-owner^{tree})" = "$(git rev-parse 139c00b66c8fe9da97dd0b81175ebab6180ce581^{tree})"
      - name: Delete explicit merged branch
        run: git push origin --delete -- refactor/timetable-active-term-owner
