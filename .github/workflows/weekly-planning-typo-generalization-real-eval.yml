name: Weekly Planning Typo Generalization Real Eval
# Compare one architecture axis only:
# mini surface normalization -> nano semantic vs mini surface normalization -> mini semantic.
# Renderer stays on mini in both arms.

on:
  push:
    branches: [agent/weekly-ai-conversation-eval]
    paths:
      - .github/workflows/weekly-planning-typo-generalization-real-eval.yml

permissions:
  contents: read

jobs:
  typo-matrix:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: mini-preprocess-nano-semantic
            semantic_model: gpt-5.4-nano
            case_id: kanji-conversion
            user_text: 来週、数楽ワークを20ページ進めたいです。
          - mode: mini-preprocess-mini-semantic
            semantic_model: gpt-5.4-mini
            case_id: kanji-conversion
            user_text: 来週、数楽ワークを20ページ進めたいです。
          - mode: mini-preprocess-nano-semantic
            semantic_model: gpt-5.4-nano
            case_id: katakana-voicing
            user_text: 来週、英語のレボートを仕上げたいです。
          - mode: mini-preprocess-mini-semantic
            semantic_model: gpt-5.4-mini
            case_id: katakana-voicing
            user_text: 来週、英語のレボートを仕上げたいです。
          - mode: mini-preprocess-nano-semantic
            semantic_model: gpt-5.4-nano
            case_id: kanji-substitution
            user_text: 来週、現代文の問代集を30問進めたいです。
          - mode: mini-preprocess-mini-semantic
            semantic_model: gpt-5.4-mini
            case_id: kanji-substitution
            user_text: 来週、現代文の問代集を30問進めたいです。
          - mode: mini-preprocess-nano-semantic
            semantic_model: gpt-5.4-nano
            case_id: clean-control
            user_text: 来週、化学のワークシートを10ページ進めたいです。
          - mode: mini-preprocess-mini-semantic
            semantic_model: gpt-5.4-mini
            case_id: clean-control
            user_text: 来週、化学のワークシートを10ページ進めたいです。
          - mode: mini-preprocess-nano-semantic
            semantic_model: gpt-5.4-nano
            case_id: ambiguous-modifier
            user_text: 来週、数学のワークと古典の課題を進めたいです。20ページくらい。
          - mode: mini-preprocess-mini-semantic
            semantic_model: gpt-5.4-mini
            case_id: ambiguous-modifier
            user_text: 来週、数学のワークと古典の課題を進めたいです。20ページくらい。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"
      - name: Normalize utterance with mini
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ORIGINAL_TEXT: ${{ matrix.user_text }}
          MODE: ${{ matrix.mode }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          (async () => {
            const original = process.env.ORIGINAL_TEXT;
            const mode = process.env.MODE;
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                model: 'gpt-5.4-mini',
                messages: [
                  {
                    role: 'system',
                    content: [
                      'Normalize one Japanese user utterance while preserving its meaning exactly.',
                      'Correct only high-confidence surface noise such as obvious typos, conversion mistakes, transcription/OCR errors, spacing, and punctuation.',
                      'Do not add, remove, summarize, strengthen, weaken, disambiguate, or infer any task, quantity, date, priority, concern, modality, or relationship.',
                      'If a correction is uncertain, leave that part unchanged.',
                      'Return only the normalized utterance, with no explanation.',
                    ].join(' '),
                  },
                  { role: 'user', content: original },
                ],
              }),
            });
            if (!response.ok) {
              throw new Error(`preprocess failed: ${response.status} ${await response.text()}`);
            }
            const json = await response.json();
            const normalized = json.choices?.[0]?.message?.content?.trim();
            if (!normalized) throw new Error('preprocess returned empty text');

            const result = {
              mode,
              model: 'gpt-5.4-mini',
              original,
              normalized,
              usage: json.usage ?? null,
            };
            fs.appendFileSync(process.env.GITHUB_ENV, `EVAL_USER_TEXT<<__TEXT__\n${normalized}\n__TEXT__\n`);
            fs.writeFileSync('preprocess-result.json', JSON.stringify(result, null, 2));
            console.log('[Preprocess Eval Usage]', JSON.stringify(result));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Execute one first-turn conversation
        env:
          TZ: Asia/Tokyo
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VITE_AI_PROVIDER: openai
          VITE_AI_BASE_URL: https://api.openai.com/v1
          VITE_AI_MODEL: gpt-5.4-mini
          VITE_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VITE_AI_MAX_PROCESS_REQUESTS: 3
          VITE_AI_EVAL_ENABLE_PURPOSE_MODEL_OVERRIDE: '1'
          VITE_AI_EVAL_SEMANTIC_MODEL: ${{ matrix.semantic_model }}
          VITE_AI_EVAL_CAPTURE_USAGE: '1'
          WEEKLY_PLANNING_RESUMABLE_REAL_API_TURN: '1'
          WEEKLY_PLANNING_RESUMABLE_CHECKPOINT_PATH: ''
          WEEKLY_PLANNING_RESUMABLE_OUTPUT_DIR: artifacts/${{ matrix.mode }}/${{ matrix.case_id }}
          WEEKLY_PLANNING_RESUMABLE_OWNER_ID: typo-generalization-${{ matrix.mode }}-${{ matrix.case_id }}
          WEEKLY_PLANNING_RESUMABLE_CONVERSATION_ID: typo-generalization-${{ matrix.mode }}-${{ matrix.case_id }}-20260810
          WEEKLY_PLANNING_RESUMABLE_WEEK_START_DATE: '2026-08-10'
          WEEKLY_PLANNING_RESUMABLE_SELECTED_DATE: '2026-08-10'
          WEEKLY_PLANNING_RESUMABLE_TEST_TIMEOUT_MS: '120000'
        run: |
          mkdir -p artifacts/${{ matrix.mode }}/${{ matrix.case_id }}
          cp preprocess-result.json artifacts/${{ matrix.mode }}/${{ matrix.case_id }}/preprocess-result.json
          WEEKLY_PLANNING_RESUMABLE_USER_TEXT="$EVAL_USER_TEXT" \
            node ./node_modules/vitest/vitest.mjs --config vite.config.mjs run src/features/weeklyPlanning/evals/weeklyPlanningResumableConversation.real-eval.test.ts --reporter=verbose
          echo '--- PREPROCESS ---'
          cat artifacts/${{ matrix.mode }}/${{ matrix.case_id }}/preprocess-result.json
          echo '--- TRANSCRIPT ---'
          cat artifacts/${{ matrix.mode }}/${{ matrix.case_id }}/transcript.md
          echo '--- LATEST TURN ---'
          cat artifacts/${{ matrix.mode }}/${{ matrix.case_id }}/latest-turn.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typo-generalization-${{ matrix.mode }}-${{ matrix.case_id }}
          path: artifacts/${{ matrix.mode }}/${{ matrix.case_id }}/
          if-no-files-found: warn
          retention-days: 7
