name: Agent natural start question

on:
  push:
    branches:
      - agent/weekly-planning-natural-start-question

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation patch
        run: |
          git apply --check .github/patches/natural-start-question.patch
          git apply .github/patches/natural-start-question.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - name: Focused start-question regressions
        run: npm run test:run -- src/features/weeklyPlanning/intake/weeklyPlanningQuestionSlots.test.ts src/features/weeklyPlanning/intake/weeklyPlanningPeriodShortAnswerRegression.test.ts src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeAdversarialRegression.test.ts src/features/weeklyPlanning/pipeline/weeklyPlanningPendingRangeContract.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningDialoguePathRegression.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningAiDialogueRenderer.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningBehaviorAwareDialoguePlanner.test.ts
      - name: TypeScript
        run: npx tsc -b
      - name: Weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Commit verified implementation
        run: |
          git rm .github/patches/natural-start-question.patch
          git rm .github/workflows/agent-natural-start-question.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/weeklyPlanning
          git commit -m "feat: 開始日質問を自然な日本語へ統一する"
          git push origin HEAD:agent/weekly-planning-natural-start-question
