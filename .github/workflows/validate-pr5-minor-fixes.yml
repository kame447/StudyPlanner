name: validate-pr5-minor-fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npm run test:run --
          src/features/weeklyPlanning/dialogue/weeklyPlanningKnownFixedEvents.test.ts
          src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts
          src/features/weeklyPlanning/intake/weeklyPlanningCommandRuntimeValidation.test.ts
          src/features/weeklyPlanning/intake/weeklyPlanningReviewCoreFixes.test.ts
          src/features/weeklyPlanning/intake/weeklyPlanningScopeEnrichment.test.ts
          src/features/weeklyPlanning/intake/weeklyPlanningSingleFieldPriority.test.ts
          src/features/weeklyPlanning/__tests__/weeklyPlanningAiInterpreter.test.ts
          src/features/weeklyPlanning/intake/weeklyPlanningScopeParsing.test.ts
      - run: npm run build
