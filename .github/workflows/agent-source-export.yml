name: Agent source export

on:
  push:
    branches:
      - agent/remove-weekly-planning-parser-boundary
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          tar --exclude=.git --exclude=node_modules -czf studyplanner-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: studyplanner-source
          path: studyplanner-source.tar.gz
          retention-days: 1
