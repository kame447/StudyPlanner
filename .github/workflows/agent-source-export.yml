name: Apply verified weekly planning fix

on:
  push:
    branches:
      - agent/remove-weekly-planning-parser-boundary

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-patch/part-* > /tmp/weekly.patch.gz.b64
          base64 --decode /tmp/weekly.patch.gz.b64 | gzip --decompress > /tmp/weekly.patch
          echo '30f3af0f0eecfab425769cbb806567a3e024531bd3bd07000adefa46f1f65af5  /tmp/weekly.patch' | sha256sum --check
          git apply --index /tmp/weekly.patch
          git rm -r .github/agent-patch
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Run weekly planning tests in bounded batches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find src/features/weeklyPlanning -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) | sort)
          chunk=24
          for ((i=0; i<${#files[@]}; i+=chunk)); do
            part=("${files[@]:i:chunk}")
            node ./node_modules/vitest/vitest.mjs --config vite.config.mjs run "${part[@]}" --reporter=basic --maxWorkers=1 --minWorkers=1
          done
      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: 週間計画の意味解釈をAI専用経路へ分離'
          git push origin HEAD:agent/remove-weekly-planning-parser-boundary
