name: Diagnose PR75 final audit fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-weekly-planning-parser-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-pr75-final/part-* > /tmp/pr75-final.patch.gz.b64
          base64 --decode /tmp/pr75-final.patch.gz.b64 | gzip --decompress > /tmp/pr75-final.patch
          echo '9e72d6e03c6b899946665d1e429baea0805dd8514570402827c75481f0de9401  /tmp/pr75-final.patch' | sha256sum --check
          git apply --exclude=.github/workflows/agent-source-export.yml /tmp/pr75-final.patch
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite and capture output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee /tmp/pr75-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr75-test-log
          path: /tmp/pr75-test.log
          retention-days: 1
      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
