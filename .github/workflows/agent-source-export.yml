name: Agent source export

on:
  push:
    branches:
      - agent/remove-weekly-planning-parser-boundary

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/studyplanner-pr75.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: studyplanner-pr75
          path: /tmp/studyplanner-pr75.tar.gz
          retention-days: 1
