name: Diagnose PR75 final audit build

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  diagnose-build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-weekly-planning-parser-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-pr75-final/part-* > /tmp/pr75-final.patch.gz.b64
          echo 'b6423fb07dc4e74190535f6ac6535bd24d8154e5eaf312db5fc720a543e362c8  /tmp/pr75-final.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/pr75-final.patch.gz.b64 | gzip --decompress > /tmp/pr75-final.patch
          echo '1640dba84f21ae73b73af55cbd902d783f73e1b797739c0ba34bb45ff3d41945  /tmp/pr75-final.patch' | sha256sum --check
          git apply --exclude=.github/workflows/agent-source-export.yml /tmp/pr75-final.patch
      - name: Install dependencies
        run: npm ci
      - name: Run build and capture output
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/pr75-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr75-build-log
          path: /tmp/pr75-build.log
          retention-days: 1
      - name: Fail when build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
