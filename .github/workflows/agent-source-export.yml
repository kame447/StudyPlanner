name: Apply PR75 final audit fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply-verify-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-weekly-planning-parser-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-pr75-final/part-* > /tmp/pr75-final.patch.gz.b64
          echo 'b6423fb07dc4e74190535f6ac6535bd24d8154e5eaf312db5fc720a543e362c8  /tmp/pr75-final.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/pr75-final.patch.gz.b64 | gzip --decompress > /tmp/pr75-final.patch
          echo '1640dba84f21ae73b73af55cbd902d783f73e1b797739c0ba34bb45ff3d41945  /tmp/pr75-final.patch' | sha256sum --check
          git apply --index --exclude=.github/workflows/agent-source-export.yml /tmp/pr75-final.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/weeklyPlanning/pipeline/weeklyPlanningSemanticBoundary.test.ts')
          text = path.read_text()
          old = "path.replaceAll('\\\\', '/')"
          new = "path.split('\\\\').join('/')"
          if old not in text:
              raise SystemExit('replaceAll target was not found')
          path.write_text(text.replace(old, new))
          PY
          git add src/features/weeklyPlanning/pipeline/weeklyPlanningSemanticBoundary.test.ts
          git rm -r .github/agent-pr75-final .github/workflows/agent-source-export.yml
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite
        run: npm run test:run
      - name: TypeScript and production build
        run: npm run build
      - name: Check staged diff
        run: git diff --cached --check
      - name: Commit verified audit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: 週間計画の七監査指摘を修正'
          git push origin HEAD:agent/remove-weekly-planning-parser-boundary
