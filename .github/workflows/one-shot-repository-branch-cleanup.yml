name: One-shot repository branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-repository-branch-cleanup.yml

permissions:
  contents: write

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete explicitly allowlisted merged branches
        run: |
          git push origin --delete -- refactor/issue52-quick-entry-separation
          git push origin --delete -- chore/repository-hygiene
