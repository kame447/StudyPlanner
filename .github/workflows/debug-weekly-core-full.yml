name: Debug weekly planning core full

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/debug-weekly-core-full.yml
      - scripts/apply-weekly-planning-review-fixes-core.mjs
      - scripts/patch-weekly-planning-review-core-v2.mjs
      - scripts/patch-weekly-planning-review-core-v3.mjs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: |
          node scripts/apply-weekly-planning-review-fixes-core.mjs
          node scripts/patch-weekly-planning-review-core-v2.mjs
          node scripts/patch-weekly-planning-review-core-v3.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full weekly tests
        run: |
          set -o pipefail
          npm run test:run -- src/features/weeklyPlanning 2>&1 | tee weekly-test-output.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-full-test-log
          path: weekly-test-output.log
