name: One-shot merged personalization branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-delete-merged-personalization-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merged branch target
        run: |
          git fetch origin refactor/stable-v5-explicit-personalization-context
          test "$(git rev-parse origin/refactor/stable-v5-explicit-personalization-context)" = "cec4289779f6be4507ebeeecfe4b09c35cb13d93"
          git merge-base --is-ancestor 738f9b64b180c70e4f299c1c8939dd2cc95d6990 origin/main
          test "$(git rev-parse origin/refactor/stable-v5-explicit-personalization-context^{tree})" = "$(git rev-parse 738f9b64b180c70e4f299c1c8939dd2cc95d6990^{tree})"
      - name: Delete explicit merged branch
        run: git push origin --delete -- refactor/stable-v5-explicit-personalization-context
