name: Phase 4 Pre-UI Verification

on:
  push:
    branches:
      - feat/product-observability-phase4-overview

permissions:
  contents: read

concurrency:
  group: phase4-pre-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Run overview aggregation regression
        run: npm run test:run -- workers/ai-proxy/src/productObservabilityOverviewAggregation.test.ts workers/ai-proxy/src/productObservabilityReadModelService.test.ts
      - name: Run full tests
        run: npm run test:run
      - name: Run Firestore rules regression
        run: npm run test:firestore-rules
      - name: Build production bundle
        run: npm run build
      - name: Check diff
        run: git diff --check origin/main...HEAD
