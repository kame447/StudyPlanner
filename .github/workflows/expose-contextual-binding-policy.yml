name: Expose Contextual Binding Policy
on:
  push:
    branches: [agent/weekly-ai-conversation-eval]
    paths:
      - .github/expose-contextual-binding-policy.py
      - .github/workflows/expose-contextual-binding-policy.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/weekly-ai-conversation-eval, fetch-depth: 0}
      - run: |
          git fetch origin agent/weekly-ai-conversation-eval
          git reset --hard origin/agent/weekly-ai-conversation-eval
          python .github/expose-contextual-binding-policy.py
          git config user.name kame447
          git config user.email 76802107+kame447@users.noreply.github.com
          git add src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPipelineV5.ts
          git commit -m "refactor: expose contextual entity binding policy"
          git push origin HEAD:agent/weekly-ai-conversation-eval
