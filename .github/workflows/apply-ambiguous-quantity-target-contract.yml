name: Apply Ambiguous Quantity Target Contract

on:
  push:
    branches: [agent/weekly-ai-conversation-eval]
    paths:
      - .github/apply-ambiguous-quantity-target-contract.py
      - .github/workflows/apply-ambiguous-quantity-target-contract.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-ai-conversation-eval
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply generic modifier-target ambiguity contract
        run: python .github/apply-ambiguous-quantity-target-contract.py
      - name: Typecheck
        run: npx tsc -b --pretty false
      - name: Run prompt and runtime regression tests
        run: |
          npx vitest run \
            src/features/weeklyPlanning/__tests__/weeklyPlanningPromptGeneralizationV5.test.ts \
            src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.test.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPromptBudget.test.ts
      - name: Commit verified changes
        run: |
          git config user.name kame447
          git config user.email 76802107+kame447@users.noreply.github.com
          git add \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticDocumentV5.ts \
            src/features/weeklyPlanning/__tests__/weeklyPlanningPromptGeneralizationV5.test.ts
          git diff --cached --check
          git commit -m "fix: require unambiguous modifier targets"
          git push origin HEAD:agent/weekly-ai-conversation-eval
