name: Apply entrypoint request ownership

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - name: Apply implementation
        shell: bash
        run: |
          set -o pipefail
          {
            python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-entrypoint-request-ownership.py')
          text = path.read_text(encoding='utf-8')
          old = '\n""",\n""",\n\'remove duplicate pending matcher\')'
          new = '\n""",\n\'\',\n\'remove duplicate pending matcher\')'
          if text.count(old) != 1:
              raise SystemExit(f'empty replacement syntax pattern count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
            python3 -m py_compile .github/scripts/apply-entrypoint-request-ownership.py
            python3 .github/scripts/instrument-entrypoint-request-ownership.py
            python3 .github/scripts/apply-entrypoint-request-ownership.py
          } 2>&1 | tee entrypoint-apply.log
      - name: Diff check
        run: git diff --check
      - name: Focused request ownership tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:run -- \
            src/features/weeklyPlanning/weeklyPlanningTurnController.test.ts \
            src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueOrchestrator.test.ts \
            src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueUiPolicy.test.ts \
            src/features/weeklyPlanning/weeklyPlanningReducer.test.ts \
            src/features/weeklyPlanning/weeklyPlanningSessionState.property.test.ts \
            src/features/weeklyPlanning/weeklyPlanningConversationPersistence.test.ts \
            src/features/weeklyPlanning/weeklyPlanningStorageValidation.test.ts 2>&1 | tee focused-request-ownership.log
      - name: TypeScript
        shell: bash
        run: npx tsc --noEmit 2>&1 | tee typescript.log
      - name: Weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Full test suite
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          rm .github/scripts/apply-entrypoint-request-ownership.py
          rm .github/scripts/instrument-entrypoint-request-ownership.py
          rm .github/scripts/fix-entrypoint-request-script-syntax.py
          rm .github/workflows/apply-entrypoint-request-ownership.yml
          rm -f entrypoint-apply.log focused-request-ownership.log typescript.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 週間計画のrequest ownershipをentrypointへ接続"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entrypoint-request-ownership-logs
          path: |
            entrypoint-apply.log
            focused-request-ownership.log
            typescript.log
          if-no-files-found: warn
