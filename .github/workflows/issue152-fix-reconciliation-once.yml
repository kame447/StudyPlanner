name: Issue 152 fix reconciliation once

on:
  push:
    branches:
      - test/issue152-adversarial-validation-lab
    paths:
      - .github/workflows/issue152-fix-reconciliation-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/issue152-adversarial-validation-lab
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded reconciliation corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1))

          root = Path('src/features/weeklyPlanning/semantic')

          replace_once(
              root / 'weeklyPlanningSemanticNormalizerV5.ts',
              "} from './weeklyPlanningCurrentTurnProvenanceV5';\n  tryWeeklyPlanningDenseTurnCompletenessRetryV5,\n} from './weeklyPlanningSemanticDenseTurnCompletenessV5';",
              "} from './weeklyPlanningCurrentTurnProvenanceV5';\nimport {\n  tryWeeklyPlanningDenseTurnCompletenessRetryV5,\n} from './weeklyPlanningSemanticDenseTurnCompletenessV5';",
          )

          replace_once(
              root / 'weeklyPlanningSemanticPromptAssemblyV5.ts',
              "'Interpret current-turn meaning into semantic facts independently. Treat pendingQuestion as authoritative only for an actual answer; bind it to its exact target. It must not suppress other explicit contributions: emit them and leave an unanswered question pending; do not invent uncertainty for it.',",
              "'Interpret each current-turn contribution independently. Treat pendingQuestion as authoritative only for an actual answer; bind it to its exact target. It must not suppress other explicit contributions: emit them and leave an unanswered question pending; do not invent uncertainty for it.',",
          )
          replace_once(
              root / 'weeklyPlanningSemanticPromptAssemblyV5.ts',
              "'For accepted existingPublicId, keep established partner-specific title/contextLabel unless the user renames it.',",
              "'Keep an accepted existingPublicId title/contextLabel unless user renames it.',",
          )

          replace_once(
              root / 'weeklyPlanningSemanticMeaningPolicyV5.ts',
              'Scheduled time intended as the work itself is target minute/hour workload; do not ask content progress.',
              'Scheduled time is target minute/hour workload when the time amount is the work itself; do not ask content progress.',
          )
          PY

          git diff --check
          git diff -- src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPromptAssemblyV5.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticMeaningPolicyV5.ts

      - name: Commit fixes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue152-fix-reconciliation-once.yml
          git add \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPromptAssemblyV5.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticMeaningPolicyV5.ts
          git commit -m 'fix: preserve Issue 152 contracts after main sync'
          git push origin HEAD:test/issue152-adversarial-validation-lab
