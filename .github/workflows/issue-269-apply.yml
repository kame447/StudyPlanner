name: Apply Issue 269 implementation

on:
  push:
    branches:
      - fix/issue-269-planner-data-availability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation and regressions
        run: python scripts/ci/issue-269-apply.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused regressions
        run: npm run test:run -- src/domain/plannerDataReadAuthority.test.ts src/hooks/usePlannerDataState.test.tsx src/features/weeklyPlanning/application/weeklyPlanningTurnApplication.test.ts
      - name: Full tests
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "kame447"
          git config user.email "76802107+kame447@users.noreply.github.com"
          git rm .github/workflows/issue-269-apply.yml scripts/ci/issue-269-apply.py
          git add src/App.tsx src/domain/plannerDataReadAuthority.ts src/domain/plannerDataReadAuthority.test.ts src/hooks/usePlannerDataState.ts src/hooks/usePlannerDataState.test.tsx src/hooks/usePlannerAppState.ts src/features/weeklyPlanning/application/useWeeklyPlanningApplication.ts src/features/weeklyPlanning/application/weeklyPlanningTurnApplication.ts src/features/weeklyPlanning/application/weeklyPlanningTurnApplication.test.ts
          git diff --cached --check
          git commit -m "fix: preserve planner data read availability"
          git push origin HEAD:fix/issue-269-planner-data-availability
