name: Fix weekly planning issue 23

on:
  push:
    branches:
      - agent/fix-weekly-planning-period-short-answer
    paths:
      - .github/workflows/fix-weekly-planning-issue-23.yml

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-period-short-answer
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Issue 23 fix
        run: python3 .github/scripts/fix_weekly_planning_issue_23.py

      - name: Check diff formatting
        run: git diff --check

      - name: Run focused regression test
        run: npm run test:run -- src/features/weeklyPlanning/intake/weeklyPlanningPeriodShortAnswerRegression.test.ts

      - name: Run weekly planning tests
        run: npm run test:run -- src/features/weeklyPlanning

      - name: Build
        run: npm run build

      - name: Commit verified fix
        run: |
          rm .github/scripts/fix_weekly_planning_issue_23.py
          rm .github/workflows/fix-weekly-planning-issue-23.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 計画期間の短答による再質問ループを修正"
          git push origin HEAD:agent/fix-weekly-planning-period-short-answer
