name: Issue 152 Adversarial Real API

# Real-credential runs are requested explicitly for a reviewed, immutable commit:
# gh workflow run weekly-planning-issue152-adversarial.yml --ref <branch-containing-this-workflow> \
#   -f suites=adversarial,stateful -f request_id=<id> -f ref=<full-40-hex-commit-sha>
#
# Trust boundary: anyone who can dispatch this workflow can run the code at `ref` with the
# OpenAI credential. `ref` must therefore be a full commit SHA the dispatcher has reviewed; branch
# names and short SHAs are rejected. An empty `ref` uses github.sha (the dispatched commit).
# The credential is exposed only to the provider smoke and Real suite steps, never to the job
# env, dependency installation, or typecheck.
on:
  workflow_dispatch:
    inputs:
      suites:
        description: Comma- or space-separated Issue 152 suite keys
        required: true
        type: string
      critical_repetitions:
        description: Repetitions for critical scenarios (1-5)
        required: false
        default: '3'
        type: string
      request_id:
        description: Auditable identifier using A-Z a-z 0-9 . _ - only
        required: true
        type: string
      ref:
        description: Full 40-hex reviewed commit SHA to check out (defaults to github.sha)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: issue152-adversarial-real-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      checkout_sha: ${{ steps.resolve.outputs.checkout_sha }}
      files: ${{ steps.resolve.outputs.files }}
      repetitions: ${{ steps.resolve.outputs.repetitions }}
      request_id: ${{ steps.resolve.outputs.request_id }}
    steps:
      - id: resolve
        name: Resolve requested Issue 152 suites
        shell: bash
        env:
          ISSUE152_REF: ${{ inputs.ref }}
          ISSUE152_DEFAULT_SHA: ${{ github.sha }}
          ISSUE152_SUITES: ${{ inputs.suites }}
          ISSUE152_CRITICAL_REPETITIONS: ${{ inputs.critical_repetitions }}
          ISSUE152_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          checkout_sha=${ISSUE152_REF:-$ISSUE152_DEFAULT_SHA}
          if ! [[ "$checkout_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ref must be a full 40-hex lowercase commit SHA (branch names are rejected)" >&2
            exit 1
          fi
          request_id=$ISSUE152_REQUEST_ID
          case "$request_id" in
            ''|*[!A-Za-z0-9._-]*) echo "request_id may contain only A-Z a-z 0-9 . _ -" >&2; exit 1 ;;
          esac
          repetitions=$ISSUE152_CRITICAL_REPETITIONS
          case "$repetitions" in
            ''|*[!0-9]*) echo "critical_repetitions must be an integer" >&2; exit 1 ;;
          esac
          if [ "$repetitions" -lt 1 ] || [ "$repetitions" -gt 5 ]; then
            echo "critical_repetitions must be between 1 and 5" >&2
            exit 1
          fi
          files=()
          while IFS= read -r suite; do
            [ -z "$suite" ] && continue
            case "$suite" in
              adversarial) files+=("src/features/weeklyPlanning/evals/weeklyPlanningIssue152AdversarialRealApi.observation.test.ts") ;;
              indirect) files+=("src/features/weeklyPlanning/evals/weeklyPlanningIssue152IndirectInputRealApi.observation.test.ts") ;;
              stateful) files+=("src/features/weeklyPlanning/evals/weeklyPlanningIssue152StatefulBoundaryRealApi.observation.test.ts") ;;
              retention) files+=("src/features/weeklyPlanning/evals/weeklyPlanningIssue152SemanticRetentionRealApi.observation.test.ts") ;;
              stored-durable) files+=("src/features/weeklyPlanning/evals/weeklyPlanningIssue152StoredDurableRealApi.observation.test.ts") ;;
              synthesized-evidence) files+=("src/features/weeklyPlanning/evals/weeklyPlanningIssue152SynthesizedEvidenceRealApi.observation.test.ts") ;;
              renderer-influence) files+=("src/features/weeklyPlanning/evals/weeklyPlanningIssue152RendererInfluenceRealApi.observation.test.ts") ;;
              *) echo "unsupported suite: $suite" >&2; exit 1 ;;
            esac
          done < <(printf '%s\n' "$ISSUE152_SUITES" | tr ',[:space:]' '\n')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "at least one Issue 152 suite is required" >&2
            exit 1
          fi
          echo "checkout_sha=$checkout_sha" >> "$GITHUB_OUTPUT"
          echo "files=${files[*]}" >> "$GITHUB_OUTPUT"
          echo "repetitions=$repetitions" >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"

  adversarial-real-api:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
      WEEKLY_PLANNING_ISSUE152_REAL_API: '1'
      WEEKLY_PLANNING_ISSUE152_OUTPUT_DIR: artifacts/issue152-adversarial-real-api
      WEEKLY_PLANNING_ISSUE152_TIMEOUT_MS: '600000'
      WEEKLY_PLANNING_ISSUE152_CRITICAL_REPETITIONS: ${{ needs.prepare.outputs.repetitions }}
      VITE_AI_PROVIDER: openai
      VITE_AI_BASE_URL: https://api.openai.com/v1
      VITE_AI_MODEL: gpt-5.6-luna
      VITE_AI_MAX_PROCESS_REQUESTS: '240'
      VITE_AI_EVAL_CAPTURE_METRICS: '1'
      VITE_CLOUDFLARE_AI_PROXY_URL: ''

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.checkout_sha }}
          fetch-depth: 1
          persist-credentials: false

      - id: checked-out-revision
        name: Verify checked-out commit SHA
        shell: bash
        env:
          ISSUE152_CHECKOUT_SHA: ${{ needs.prepare.outputs.checkout_sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          test "$sha" = "$ISSUE152_CHECKOUT_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify requested suite files exist at the checked-out commit
        shell: bash
        env:
          ISSUE152_FILES: ${{ needs.prepare.outputs.files }}
        run: |
          set -euo pipefail
          read -r -a files <<< "$ISSUE152_FILES"
          missing=0
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "requested suite file does not exist at this commit: $file" >&2
              missing=1
            fi
          done
          test "$missing" -eq 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck first
        run: npm run typecheck

      - name: Provider smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          payload=$(jq -nc --arg model "$VITE_AI_MODEL" '{model:$model,messages:[{role:"user",content:"Reply only OK."}]}')
          status=$(curl -sS -o /tmp/issue152-provider-smoke.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$VITE_AI_BASE_URL/chat/completions")
          echo "provider smoke HTTP $status"
          jq '{error:(if .error then {type:.error.type,code:.error.code,param:.error.param,message:.error.message} else null end),model:.model,has_choices:(.choices|type=="array")}' \
            /tmp/issue152-provider-smoke.json
          rm -f /tmp/issue152-provider-smoke.json
          test "$status" -ge 200 -a "$status" -lt 300

      - name: Run requested Issue 152 Real API suites
        env:
          ISSUE152_FILES: ${{ needs.prepare.outputs.files }}
          ISSUE152_REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          VITE_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_AI_API_KEY"
          echo "request_id=$ISSUE152_REQUEST_ID"
          read -r -a files <<< "$ISSUE152_FILES"
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs --maxWorkers=1 run "${files[@]}"

      - name: Upload safe observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue152-adversarial-real-api-${{ needs.prepare.outputs.request_id }}-${{ steps.checked-out-revision.outputs.sha }}
          path: artifacts/issue152-adversarial-real-api/
          if-no-files-found: warn
          retention-days: 30
