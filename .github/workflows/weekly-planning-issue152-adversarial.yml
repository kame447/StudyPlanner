name: Issue 152 Adversarial Real API

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/weekly-planning-issue152-adversarial.yml'
      - 'src/features/weeklyPlanning/evals/weeklyPlanningIssue152AdversarialRealApi.observation.test.ts'
      - 'src/features/weeklyPlanning/evals/weeklyPlanningIssue152IndirectInputRealApi.observation.test.ts'
      - 'src/features/weeklyPlanning/evals/weeklyPlanningIssue152StatefulBoundaryRealApi.observation.test.ts'
      - 'src/features/weeklyPlanning/evals/weeklyPlanningIssue152FailureDiagnosticsRealApi.observation.test.ts'
      - 'src/features/weeklyPlanning/security/weeklyPlanningIssue152AdversarialCorpus.ts'
      - 'src/features/weeklyPlanning/semantic/weeklyPlanningCurrentTurnProvenanceV5.ts'
      - 'src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue152-adversarial-real-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-real-api:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'test/issue152-adversarial-validation-lab' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
      WEEKLY_PLANNING_ISSUE152_REAL_API: '1'
      WEEKLY_PLANNING_ISSUE152_OUTPUT_DIR: artifacts/issue152-adversarial-real-api
      WEEKLY_PLANNING_ISSUE152_TIMEOUT_MS: '600000'
      WEEKLY_PLANNING_ISSUE152_CRITICAL_REPETITIONS: '3'
      VITE_AI_PROVIDER: openai
      VITE_AI_BASE_URL: https://api.openai.com/v1
      VITE_AI_MODEL: gpt-5.6-luna
      VITE_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VITE_AI_MAX_PROCESS_REQUESTS: '240'
      VITE_AI_EVAL_CAPTURE_METRICS: '1'
      VITE_CLOUDFLARE_AI_PROXY_URL: ''

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify API credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Typecheck first
        run: npm run typecheck

      - name: Provider smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg model "$VITE_AI_MODEL" '{model:$model,messages:[{role:"user",content:"Reply only OK."}]}')
          status=$(curl -sS -o /tmp/issue152-provider-smoke.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$VITE_AI_BASE_URL/chat/completions")
          echo "provider smoke HTTP $status"
          jq '{error:(if .error then {type:.error.type,code:.error.code,param:.error.param,message:.error.message} else null end),model:.model,has_choices:(.choices|type=="array")}' \
            /tmp/issue152-provider-smoke.json
          rm -f /tmp/issue152-provider-smoke.json
          test "$status" -ge 200 -a "$status" -lt 300

      - name: Run Issue 152 adversarial Real API audit
        run: |
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs --maxWorkers=1 run \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue152FailureDiagnosticsRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue152AdversarialRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue152IndirectInputRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue152StatefulBoundaryRealApi.observation.test.ts

      - name: Upload safe observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue152-adversarial-real-api-${{ github.sha }}
          path: artifacts/issue152-adversarial-real-api/
          if-no-files-found: warn
          retention-days: 30
