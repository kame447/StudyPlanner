name: apply-pr5-n2-regression

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          git config user.name "studyplanner-fix-bot"
          git config user.email "studyplanner-fix-bot@users.noreply.github.com"
          set +e
          python .github/agent-scripts/fix-pr5-n2-regression.py > /tmp/pr5-n2-regression.log 2>&1
          status=$?
          cat /tmp/pr5-n2-regression.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/pr5-n2-regression.log docs/ai/tasks/20260716-weekly-planning-pr5-n2-regression-error.log
            git add docs/ai/tasks/20260716-weekly-planning-pr5-n2-regression-error.log
            git commit -m "feat: N2全体回帰修正ログを保存"
            git push origin HEAD:agent/weekly-planning-conversation-hardening
            exit "$status"
          fi
