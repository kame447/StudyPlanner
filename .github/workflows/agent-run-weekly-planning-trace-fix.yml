name: Run weekly planning trace fix

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.head.ref == 'agent/weekly-planning-trace-full-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-trace-full-implementation
          fetch-depth: 0

      - name: Execute embedded fix script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/agent-fix-weekly-planning-trace.yml').read_text(encoding='utf-8')
          start_marker = "          python <<'PY'\n"
          end_marker = "          PY\n\n      - name: Commit and push fixes"
          if start_marker not in workflow or end_marker not in workflow:
              raise RuntimeError('embedded fix script markers not found')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(script), 'agent-fix-weekly-planning-trace.py', 'exec'))
          PY
          rm -f .github/workflows/agent-run-weekly-planning-trace-fix.yml

      - name: Commit and push fixes
        shell: bash
        run: |
          git diff --check
          git status -sb
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 週間計画traceの会話相関と信頼性を修正"
          git push origin HEAD:agent/weekly-planning-trace-full-implementation
