name: PR68 trace session concurrency verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr68-trace-session-concurrency-fix.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply concurrency fix
        run: python3 scripts/pr68_trace_session_concurrency_fix.py
      - name: Check diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run trace tests
        shell: bash
        run: |
          set +e
          npm run test:run -- \
            workers/ai-proxy/src/weeklyPlanningTraceFirestore.integration.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceApi.test.ts \
            workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts \
            --reporter=verbose > /tmp/pr68-trace-concurrency.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 240 /tmp/pr68-trace-concurrency.log > pr68-trace-concurrency-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pr68-trace-concurrency-error.txt
            git commit -m 'feat: trace session並行更新診断を記録'
            git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
          fi
          tail -n 240 /tmp/pr68-trace-concurrency.log
          exit "$status"
      - name: Run full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Commit verified fix and clean temporary files
        run: |
          rm -f scripts/pr68_trace_session_concurrency_fix.py
          rm -f .github/workflows/pr68-trace-session-concurrency-fix.yml
          rm -f pr68-trace-concurrency-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: trace sessionの並行更新を単調化'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
