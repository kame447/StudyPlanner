# PREPARATION ONLY. Do not publish/run before root authorization and final review.
# One added workflow file, direct child of the existing integration cleanup; attempt 1 only.
name: Issue 488 Material Live App Once
on:
  push:
    branches: ['integration/issue488-a-c-e-r0']
    paths: ['.github/workflows/issue488-material-live-app-once.yml']
permissions:
  contents: read
env:
  EVENT_PARENT: 'b518da0190cfd13c494119ed1396ab0ec1d59896'
  EVENT_PARENT_TREE: 'db37d7bb56c9731f8585f985ee2dfeb7c6b05bdf'
  SOURCE_SHA: '7f4b2a49c5bb72e681ea63c05b92ffed6056e63d'
  SOURCE_TREE: 'db95dbb0bc89377d7b4666b76ee99bb8bbec0913'
  WORKFLOW_PATH: '.github/workflows/issue488-material-live-app-once.yml'
concurrency:
  group: issue488-material-live-app-once
  cancel-in-progress: false
jobs:
  material_once:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'kame447/StudyPlanner' &&
          github.repository_id == '1202727586' &&
          github.repository_owner == 'kame447' &&
          github.actor == 'kame447' && github.actor_id == '76802107' &&
          github.triggering_actor == 'kame447' &&
          github.ref == 'refs/heads/integration/issue488-a-c-e-r0' &&
          github.run_attempt == 1 &&
          github.event.created == false && github.event.deleted == false &&
          github.event.forced == false }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      OPENAI_API_KEY: ''
      VITE_AI_API_KEY: ''
      VITE_CLOUDFLARE_AI_PROXY_URL: ''
      STUDYPLANNER_F1_REAL_API: '0'
      STUDYPLANNER_R0_REAL_API: '0'
      STUDYPLANNER_H_REAL_API: '0'
      STUDYPLANNER_H2_REAL_API: '0'
      GOOGLE_API_KEY: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the one-file direct-child event before any source execution
        id: event_guard
        env:
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTING_WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = kame447/StudyPlanner
          test "$GITHUB_REPOSITORY_ID" = 1202727586
          test "$GITHUB_REPOSITORY_OWNER" = kame447
          test "$GITHUB_ACTOR" = kame447
          test "$GITHUB_ACTOR_ID" = 76802107
          test "$GITHUB_TRIGGERING_ACTOR" = kame447
          test "$GITHUB_REF" = refs/heads/integration/issue488-a-c-e-r0
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXECUTING_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$EXECUTING_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$WORKFLOW_PATH@$GITHUB_REF"
          python3 - <<'PYEVENT'
          import json,os,pathlib
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['before']==os.environ['EVENT_PARENT'] and event['after']==os.environ['GITHUB_SHA']
          assert event['created'] is False and event['deleted'] is False and event['forced'] is False
          assert event['repository']['full_name']=='kame447/StudyPlanner' and event['repository']['id']==1202727586
          assert event['sender']['login']=='kame447' and event['sender']['id']==76802107
          PYEVENT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P "$GITHUB_SHA")" = "$EVENT_PARENT"
          test "$(git rev-parse "${EVENT_PARENT}^{tree}")" = "$EVENT_PARENT_TREE"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r "$EVENT_PARENT" "$GITHUB_SHA")" = "$(printf 'A\t%s' "$WORKFLOW_PATH")"
          test "$(git ls-tree "$GITHUB_SHA" -- "$WORKFLOW_PATH" | awk '{print $1, $2}')" = '100644 blob'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/material-artifacts"
          cp "$WORKFLOW_PATH" "$RUNNER_TEMP/material-artifacts/executing-workflow.yml"
          python3 - <<'PYPROVENANCE'
          import json,os,pathlib
          values={key:os.environ[name] for key,name in {'source':'SOURCE_SHA','tree':'SOURCE_TREE','eventParent':'EVENT_PARENT','eventParentTree':'EVENT_PARENT_TREE','event':'GITHUB_SHA',
              'workflow':'EXECUTING_WORKFLOW_SHA','ref':'GITHUB_REF','runId':'GITHUB_RUN_ID'}.items()}
          values['attempt']=1
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'material-artifacts/event-provenance.json').write_text(json.dumps(values,indent=2)+'\n')
          PYPROVENANCE
      - name: Check out immutable material production source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
      - name: Install locked app and version-matched runner with no model credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          test -w "$PWD"; test -w "$HOME"; test -w "$RUNNER_TEMP"
          test "$(node -v)" = v22.23.0
          test "$PLAYWRIGHT_BROWSERS_PATH" = /ms-playwright
          test -z "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          sha256sum package.json package-lock.json > "$RUNNER_TEMP/material-artifacts/app-manifests.sha256"
          test ! -e .npmrc
          test ! -e "$RUNNER_TEMP/material-isolated-home"; test ! -e "$RUNNER_TEMP/material-npm"
          mkdir -p "$RUNNER_TEMP/material-isolated-home" "$RUNNER_TEMP/material-npm/cache" "$RUNNER_TEMP/material-npm/logs"
          : > "$RUNNER_TEMP/material-npm/user.npmrc"; : > "$RUNNER_TEMP/material-npm/global.npmrc"
          NODE_BIN="$(command -v node)"; NPM_ENTRY="$(readlink -f "$(command -v npm)")"
          export NODE_BIN NPM_ENTRY
          python3 - <<'PYNPM'
          import hashlib,json,os,pathlib,subprocess
          node=pathlib.Path(os.environ['NODE_BIN']).resolve();npm=pathlib.Path(os.environ['NPM_ENTRY'])
          assert npm.is_file() and str(npm).endswith('/node_modules/npm/bin/npm-cli.js')
          package=json.loads((npm.parents[1]/'package.json').read_text());assert package['name']=='npm'
          info={'nodePath':str(node),'nodeSha256':hashlib.sha256(node.read_bytes()).hexdigest(),
            'nodeVersion':subprocess.check_output([str(node),'--version'],text=True).strip(),
            'npmEntry':str(npm),'npmEntrySha256':hashlib.sha256(npm.read_bytes()).hexdigest(),'npmVersion':package['version'],
            'configScope':'fresh private HOME, user/global configs, cache and logs; env -i; source .npmrc absent'}
          assert info['nodeVersion']=='v22.23.0'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'material-artifacts/install-tooling.json').write_text(json.dumps(info,indent=2)+'\n')
          PYNPM
          clean_npm() {
            env -i PATH="$(dirname "$NODE_BIN"):/usr/local/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/material-isolated-home" \
              CI=true TZ=UTC PLAYWRIGHT_BROWSERS_PATH=/ms-playwright PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
              npm_config_userconfig="$RUNNER_TEMP/material-npm/user.npmrc" npm_config_globalconfig="$RUNNER_TEMP/material-npm/global.npmrc" \
              npm_config_cache="$RUNNER_TEMP/material-npm/cache" npm_config_logs_dir="$RUNNER_TEMP/material-npm/logs" \
              npm_config_update_notifier=false npm_config_fund=false WRANGLER_SEND_METRICS=false \
              "$NODE_BIN" "$NPM_ENTRY" "$@"
          }
          clean_npm ci
          clean_npm install --prefix "$RUNNER_TEMP/material-pw" --no-save --package-lock=false @playwright/test@1.64.0
          python3 - <<'PYNPMCHECK'
          import hashlib,json,os,pathlib
          j=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'material-artifacts/install-tooling.json').read_text())
          for key,hashkey in [('nodePath','nodeSha256'),('npmEntry','npmEntrySha256')]:
              assert hashlib.sha256(pathlib.Path(j[key]).read_bytes()).hexdigest()==j[hashkey]
          PYNPMCHECK
          sha256sum -c "$RUNNER_TEMP/material-artifacts/app-manifests.sha256"
          # No playwright install, apt, browser fallback, or executablePath override.
      - name: Materialize the exact reviewed live bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          import base64,gzip,hashlib,io,json,os,pathlib,tarfile
          packed=base64.b64decode('',validate=True)
          assert len(packed)==56741 and hashlib.sha256(packed).hexdigest()=='ffbeb1d83fbc77e45e7a3c8f0c65a241c48ffedfbe1159b04f5db9a33b31d9e0'
          raw=gzip.decompress(packed);assert len(raw)==266240 and hashlib.sha256(raw).hexdigest()=='5870c9a8d5e120c8fa198dfb55d5d66c34218b97392b8d280fde75e0b5e88578'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'material-bundle';root.mkdir(exist_ok=False)
          expected={'candidate/budget-envelope.json': 'fe510ba6791838132aa63d5c2e45d2c0882b6490c15920c398c19c2db9a4f7aa', 'candidate/captured-provider.json': '8dfd99f6fb3ea8dca9cc81c27c3f82b05bbf675de8e1ef9328ffc6be0e34e349', 'candidate/f1-ui-observers.mjs': 'efd1148116b158a3df4e4d1be71db7ae3e5378f3b2ceb0cee9a190ddf21845c7', 'candidate/fixed-clock.mjs': '814a21374df6b3d0dd5317f412b50afb5ed026ac6fa8909bcb444d8af7ce5b06', 'candidate/live-dispatch.mjs': '3d940552cebbba4034477d723e50576d8678543ed974a0bb0b26605e687a7bc6', 'candidate/material-playwright.config.template.mjs': '91cb2e952e40a0a8236a869f15ae1ca12c486160bb93bcf34a21ad65965b6a3a', 'candidate/material-recorded-replay.mjs': 'eeb7d7a19c6b68e37aab36a73207ee9badb0c47ee22f66d60dc52a6496ee756d', 'candidate/material-seed.json': '968e01defe7f387c08cf1dec62ed1b2f5ed78e13fac425bd76ed4b97210e936a', 'candidate/material-vite.config.template.mjs': '9be68847c7efb6ce35889360d1cda54d7e30ea668b455bcbaa68d04f9a3bea0b', 'candidate/material.live-app.mjs': 'bafac1c6b8b1bc8b46fc9a7d4ccd1ade5374d635dfb6e0739c303a085bbacc13', 'candidate/prepare-material-gate.py': 'ee5d84a8e80930cfe432fa06c6254ec0a94af097704c9940b607c6a6cbda80f9', 'candidate/r0-captured-evidence.mjs': '79a054f4631983b9057b76f3de4dac45f7e1112aaae634769bd824145b6c2cc0', 'candidate/read-unless-stopped.mjs': '90cf181c39e02ab2b8fdab111cdecb739b58455a1f092df142fcc0299308dc9f', 'candidate/scenarios.json': '217b5e073e7ba5116b0ff31c63e3f05b49c35b97e6a784644dd5ff4ee2011248', 'candidate/seed-inputs.json': '131fda2dd86fc868184253614f1d8284f14bbdc2726a36b8c271f842a099fa1e', 'candidate/source-pins.json': '8c2e4a70684e775dc5c76fc36a60e23ae87c6401af8aceec2562fd3cd6bb9a8c', 'candidate/startup-ready.mjs': 'd0d8adb0f428a75ae0249460763938a84ecc06e516f32436c616d94a6d84fe63', 'candidate/typed-time-window.mjs': '5199f4c182b9e6d04fdff28d5b382956255e6fe536cdb753f49e14d9a1046e3b', 'manifest.json': 'c2c31ff881e5956bcb5dad9511bdebeade3f82d9f4ce7690842195eb287acc4d', 'execution-wrapper/run-material-live.py': 'd4257bb2579ca2be04e737b9b7ea4d23a719fe45b76b06733b3c259f4ed4ebd1'}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
              rows=archive.getmembers()
              assert len(rows)==len(expected) and sorted(row.name for row in rows)==sorted(expected)
              values={}
              for row in rows:
                  assert row.isfile() and row.name in expected and row.size <= (120000 if row.name == 'candidate/captured-provider.json' else 100000)
                  value=archive.extractfile(row).read();assert len(value)==row.size
                  assert hashlib.sha256(value).hexdigest()==expected[row.name]
                  values[row.name]=value
              for name,value in values.items():
                  target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(value)
          PYBUNDLE
      - name: Root-authorized material actual-model UI within reserved envelope
        id: live_app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"; test -z "$GOOGLE_API_KEY"
          mkdir -p "$RUNNER_TEMP/material-isolated-home"
          env -i OPENAI_API_KEY="$OPENAI_API_KEY" PATH="$PATH" HOME="$RUNNER_TEMP/material-isolated-home" PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            ISSUE488_MATERIAL_LIVE_SLOT_GRANTED=yes CI=true TZ=UTC WRANGLER_SEND_METRICS=false \
            python3 "$RUNNER_TEMP/material-bundle/execution-wrapper/run-material-live.py" \
            --root "$PWD" --node "$(command -v node)" --playwright "$RUNNER_TEMP/material-pw/node_modules" \
            --output "$RUNNER_TEMP/material-execution-1" \
            > "$RUNNER_TEMP/material-artifacts/runner.log" 2>&1
          python3 - <<'PYTERMINAL'
          import json,os,pathlib
          receipt=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'material-execution-1/terminal-receipt.json').read_text())
          assert receipt['result']=='passed' and receipt['lastStage']=='completed'
          assert type(receipt['processExitCode']) is int and receipt['processExitCode']==0
          assert receipt['immutableBeforeAfterEqual'] is True and receipt['narrowBeforeAfterEqual'] is True
          PYTERMINAL
      - name: Preserve bounded diagnostics inside the single proven artifact root
        id: diagnostic_stage
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/material-execution-1"
          DEST="$RUNNER_TEMP/material-artifacts/execution"
          # Small diagnostics also survive in the job log if artifact delivery fails.
          python3 - <<'PYDIAGNOSTICS'
          import json,os,pathlib,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'material-execution-1'
          receipt=root/'terminal-receipt.json'
          try:
              meta=receipt.lstat()
              if not stat.S_ISREG(meta.st_mode) or meta.st_size>8*1024*1024:
                  raise ValueError('Receipt is not a bounded regular file')
              value=json.loads(receipt.read_text())
              if not isinstance(value,dict):raise TypeError('Receipt is not an object')
              keys=['lastStage','processExitCode','result','error','afterError','immutableBeforeAfterEqual','narrowBeforeAfterEqual']
              print('MATERIAL_TERMINAL_DIAGNOSTIC '+json.dumps({k:value.get(k) for k in keys})[:8192])
          except Exception as exc:print('MATERIAL_TERMINAL_DIAGNOSTIC unavailable: '+type(exc).__name__)
          log=root/'playwright.log'
          try:
              meta=log.lstat()
              if not stat.S_ISREG(meta.st_mode):raise ValueError('Log is not a regular file')
              with log.open('rb') as stream:
                  stream.seek(max(0,meta.st_size-24576));tail=stream.read(24576).decode('utf-8',errors='replace')
              print('MATERIAL_PLAYWRIGHT_FAILURE_TAIL_BEGIN\n'+'\n'.join(tail.splitlines()[-80:])+'\nMATERIAL_PLAYWRIGHT_FAILURE_TAIL_END')
          except Exception as exc:print('MATERIAL_PLAYWRIGHT_FAILURE_TAIL unavailable: '+type(exc).__name__)
          PYDIAGNOSTICS
          test -d "$SRC"; test ! -e "$DEST"
          # Copy only generated evidence/input records, excluding disposable browser/temp and Vite caches.
          python3 - <<'PYBOUNDS'
          import os,pathlib,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'material-execution-1';count=0;size=0
          for parent,dirs,files in os.walk(root,followlinks=False):
              here=pathlib.Path(parent)
              dirs[:]=[name for name in dirs if here/name not in [root/'tmp',root/'app/vite-cache']]
              for name in dirs+files:
                  item=here/name;mode=item.lstat().st_mode
                  assert stat.S_ISREG(mode) or stat.S_ISDIR(mode), 'Non-regular diagnostic input'
                  if stat.S_ISREG(mode):count+=1;size+=item.stat().st_size
          assert count<=10000 and size<=256*1024*1024, 'Diagnostic evidence exceeds bounded upload scope'
          print('MATERIAL_DIAGNOSTIC_COPY_BOUNDS files='+str(count)+' bytes='+str(size))
          PYBOUNDS
          mkdir -p "$DEST"
          for entry in "$SRC"/*; do
            test -e "$entry" || continue
            name="$(basename "$entry")"
            if test "$name" = tmp; then continue; fi
            if test "$name" = app; then
              mkdir -p "$DEST/app"
              for child in "$entry"/*; do
                test -e "$child" || continue
                if test "$(basename "$child")" = vite-cache; then continue; fi
                cp -a -- "$child" "$DEST/app/"
              done
            else cp -a -- "$entry" "$DEST/"
            fi
          done
          test -f "$DEST/terminal-receipt.json"
          cmp "$SRC/terminal-receipt.json" "$DEST/terminal-receipt.json"
      - name: Require the immutable product source after every attempted gate
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"; test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          sha256sum -c "$RUNNER_TEMP/material-artifacts/app-manifests.sha256"
      - name: Upload synthetic evidence on success or failure
        if: ${{ always() && steps.event_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue488-material-live-source-${{ env.SOURCE_SHA }}-event-${{ github.sha }}
          path: ${{ runner.temp }}/material-artifacts/
          if-no-files-found: error
          retention-days: 14
