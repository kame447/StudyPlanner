name: UI Regression Matrix

on:
  workflow_dispatch:
    inputs:
      suite:
        description: UI regression suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - visual
          - cross-browser
      spec:
        description: Optional existing spec filename; manual WebKit mobile only, separate from the full gate
        required: false
        default: ''
        type: string
  pull_request:
    branches:
      - main
      - ui/home-screen-redesign
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/e2e/**'
      - 'vite.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/e2e/**'
      - 'vite.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ui-regression.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.spec != '' && 'ui-targeted-webkit' || 'ui-regression' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.spec != '') && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'visual') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Snapshot application manifests before isolated test-runner install
        shell: bash
        run: sha256sum package.json package-lock.json > /tmp/studyplanner-manifests.sha256

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.64.0

      - name: Verify isolated test-runner install did not mutate application manifests
        shell: bash
        run: sha256sum -c /tmp/studyplanner-manifests.sha256

      - name: Install Chromium
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run visual regression matrix
        run: ./tests/e2e/node_modules/.bin/playwright test --config=tests/e2e/playwright.visual.config.mjs

      - name: Upload visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-visual-regression-${{ github.sha }}
          path: |
            artifacts/playwright-visual-results/
            artifacts/playwright-visual-report/
            artifacts/playwright-visual-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload compact visual comparison images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-visual-images-${{ github.sha }}
          path: |
            artifacts/playwright-visual-results/**/*-actual.png
            artifacts/playwright-visual-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 14

  cross-browser-projects:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.spec != '' && 'targeted-webkit' || 'cross-browser-projects' }} (${{ matrix.project }})${{ matrix.shard && format(' (shard {0}/2)', matrix.shard) || '' }}
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.spec != '') || github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'cross-browser' }}
    runs-on: ubuntu-latest
    # Keep the preinstalled browser versions aligned with @playwright/test below.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    # Split the full WebKit mobile suite without changing its time/worker budget.
    # Targeted single-spec dispatches keep one unsharded leg.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'workflow_dispatch' && inputs.spec != '' && fromJSON('[{"project":"webkit-mobile","shard":""}]') || fromJSON('[{"project":"chromium-desktop","shard":""},{"project":"firefox-desktop","shard":""},{"project":"webkit-desktop","shard":""},{"project":"webkit-mobile","shard":1},{"project":"webkit-mobile","shard":2}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Snapshot application manifests before isolated test-runner install
        shell: bash
        run: sha256sum package.json package-lock.json > /tmp/studyplanner-manifests.sha256

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.64.0

      - name: Verify isolated test-runner install did not mutate application manifests
        shell: bash
        run: sha256sum -c /tmp/studyplanner-manifests.sha256

      - name: Build production bundle
        run: npm run build

      - name: Run cross-browser smoke matrix
        shell: bash
        env:
          UI_EVENT_NAME: ${{ github.event_name }}
          UI_SPEC: ${{ inputs.spec }}
          UI_PROJECT: ${{ matrix.project }}
          UI_REGRESSION_SHARD: ${{ matrix.shard && format('{0}/2', matrix.shard) || '' }}
        run: |
          set -euo pipefail
          args=(test --config=tests/e2e/playwright.cross-browser.config.mjs "--project=$UI_PROJECT")
          if [[ "$UI_EVENT_NAME" == workflow_dispatch && -n "$UI_SPEC" ]]; then
            if [[ ! "$UI_SPEC" =~ ^[a-z0-9][a-z0-9-]*\.spec\.mjs$ ]] || [[ ! -f "tests/e2e/$UI_SPEC" || -L "tests/e2e/$UI_SPEC" ]]; then
              echo 'spec must be one existing regular tests/e2e/*.spec.mjs filename' >&2
              exit 2
            fi
            # Playwright treats file filters as regexes: anchor and escape the exact basename.
            args+=("(^|/)${UI_SPEC//./\\.}$")
          elif [[ -n "$UI_REGRESSION_SHARD" ]]; then
            args+=("--shard=$UI_REGRESSION_SHARD")
          fi
          node scripts/ci/playwright-shard.mjs "${args[@]}"

      - name: Upload cross-browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.spec != '' && 'ui-targeted-webkit' || 'ui-cross-browser' }}-${{ matrix.project }}-${{ github.sha }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: |
            artifacts/playwright-cross-browser-results/
            artifacts/playwright-cross-browser-report/
            artifacts/playwright-cross-browser-results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload compact cross-browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.spec != '' && 'ui-targeted-webkit' || 'ui-cross-browser' }}-diagnostics-${{ matrix.project }}-${{ github.sha }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: |
            artifacts/playwright-cross-browser-results.json
            artifacts/playwright-cross-browser-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload compact cross-browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.spec != '' && 'ui-targeted-webkit' || 'ui-cross-browser' }}-images-${{ matrix.project }}-${{ github.sha }}${{ matrix.shard && format('-shard-{0}', matrix.shard) || '' }}
          path: artifacts/playwright-cross-browser-results/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  # Preserve the existing required check across all project legs and mobile shards.
  # A failed, cancelled or skipped project must never become a successful gate.
  cross-browser-smoke:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.spec != '' && 'targeted-webkit-summary' || 'cross-browser-smoke' }}
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.spec != '') || github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'cross-browser') }}
    needs: cross-browser-projects
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require every browser project to succeed
        env:
          PROJECT_RESULT: ${{ needs.cross-browser-projects.result }}
        run: test "$PROJECT_RESULT" = success
