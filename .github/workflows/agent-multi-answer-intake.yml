name: Agent multi answer intake

on:
  push:
    branches:
      - agent/weekly-planning-multi-answer-intake

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation patch
        run: |
          git apply --check .github/patches/multi-question-answer.patch
          git apply .github/patches/multi-question-answer.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - name: Focused intake regression
        run: npm run test:run -- src/features/weeklyPlanning/__tests__/weeklyPlanningIntakeEdgeCases.test.ts
      - name: TypeScript
        run: npx tsc -b
      - name: Weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Commit verified implementation
        run: |
          git rm .github/patches/multi-question-answer.patch
          git rm .github/workflows/agent-multi-answer-intake.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/weeklyPlanning
          git commit -m "feat: 複数質問への回答を一括受理する"
          git push origin HEAD:agent/weekly-planning-multi-answer-intake
