# PREPARATION ONLY. Do not publish/run before root authorization and final review.
# One added workflow file, direct child of exact D source; attempt 1 only.
name: Issue 488 D Scripted App Once
on:
  push:
    branches: ['integration/issue488-timed-event-app']
    paths: ['.github/workflows/issue488-d-scripted-app-once.yml']
permissions:
  contents: read
env:
  SOURCE_SHA: '957c57db049c6f17a6c363498b121da9b572e262'
  SOURCE_TREE: 'f3911bb81e40e13a37c7b6abf992ba9f8463fa63'
  WORKFLOW_PATH: '.github/workflows/issue488-d-scripted-app-once.yml'
concurrency:
  group: issue488-d-scripted-app-once
  cancel-in-progress: false
jobs:
  d_once:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'kame447/StudyPlanner' &&
          github.repository_id == '1202727586' &&
          github.repository_owner == 'kame447' &&
          github.actor == 'kame447' && github.actor_id == '76802107' &&
          github.triggering_actor == 'kame447' &&
          github.ref == 'refs/heads/integration/issue488-timed-event-app' &&
          github.run_attempt == 1 &&
          github.event.created == false && github.event.deleted == false &&
          github.event.forced == false }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      OPENAI_API_KEY: ''
      VITE_AI_API_KEY: ''
      VITE_CLOUDFLARE_AI_PROXY_URL: ''
      STUDYPLANNER_F1_REAL_API: '0'
      STUDYPLANNER_R0_REAL_API: '0'
      STUDYPLANNER_H_REAL_API: '0'
      STUDYPLANNER_H2_REAL_API: '0'
      GOOGLE_API_KEY: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the one-file direct-child event before any source execution
        id: event_guard
        env:
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTING_WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = kame447/StudyPlanner
          test "$GITHUB_REPOSITORY_ID" = 1202727586
          test "$GITHUB_REPOSITORY_OWNER" = kame447
          test "$GITHUB_ACTOR" = kame447
          test "$GITHUB_ACTOR_ID" = 76802107
          test "$GITHUB_TRIGGERING_ACTOR" = kame447
          test "$GITHUB_REF" = refs/heads/integration/issue488-timed-event-app
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXECUTING_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$EXECUTING_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$WORKFLOW_PATH@$GITHUB_REF"
          python3 - <<'PYEVENT'
          import json,os,pathlib
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['before']==os.environ['SOURCE_SHA'] and event['after']==os.environ['GITHUB_SHA']
          assert event['created'] is False and event['deleted'] is False and event['forced'] is False
          assert event['repository']['full_name']=='kame447/StudyPlanner' and event['repository']['id']==1202727586
          assert event['sender']['login']=='kame447' and event['sender']['id']==76802107
          PYEVENT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P "$GITHUB_SHA")" = "$SOURCE_SHA"
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$SOURCE_TREE"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r "$SOURCE_SHA" "$GITHUB_SHA")" = "$(printf 'A\t%s' "$WORKFLOW_PATH")"
          test "$(git ls-tree "$GITHUB_SHA" -- "$WORKFLOW_PATH" | awk '{print $1, $2}')" = '100644 blob'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/d-artifacts"
          cp "$WORKFLOW_PATH" "$RUNNER_TEMP/d-artifacts/executing-workflow.yml"
          python3 - <<'PYPROVENANCE'
          import json,os,pathlib
          values={key:os.environ[name] for key,name in {'source':'SOURCE_SHA','tree':'SOURCE_TREE','event':'GITHUB_SHA',
              'workflow':'EXECUTING_WORKFLOW_SHA','ref':'GITHUB_REF','runId':'GITHUB_RUN_ID'}.items()}
          values['attempt']=1
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'d-artifacts/event-provenance.json').write_text(json.dumps(values,indent=2)+'\n')
          PYPROVENANCE
      - name: Check out immutable D production source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Install locked app and version-matched runner with no model credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          test -w "$PWD"; test -w "$HOME"; test -w "$RUNNER_TEMP"
          test "$(node -v)" = v22.23.0
          test "$PLAYWRIGHT_BROWSERS_PATH" = /ms-playwright
          test -z "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          sha256sum package.json package-lock.json > "$RUNNER_TEMP/d-artifacts/app-manifests.sha256"
          npm ci
          npm install --prefix "$RUNNER_TEMP/d-pw" --no-save --package-lock=false @playwright/test@1.64.0
          sha256sum -c "$RUNNER_TEMP/d-artifacts/app-manifests.sha256"
          # No playwright install, apt, browser fallback, or executablePath override.
      - name: Materialize the exact reviewed scripted bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          import base64,gzip,hashlib,io,json,os,pathlib,tarfile
          packed=base64.b64decode('',validate=True)
          assert len(packed)==24610 and hashlib.sha256(packed).hexdigest()=='ca0c4d242735750a300a7c53768920ab3a9f983b577fd7b1d16786cae0fcca83'
          raw=gzip.decompress(packed);assert len(raw)==92160 and hashlib.sha256(raw).hexdigest()=='153d28156c2b8757a8114537abe1f367309756a2b1e47af23bf89e936ceea45c'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'d-bundle';root.mkdir(exist_ok=False)
          expected={'candidate/d-playwright.config.template.mjs': '2fe932135bec8aa0cd401fa7e97803e92463fffc948b08a6ec145f3923c7be0a', 'candidate/d-vite.config.template.mjs': 'de37dd01b91f801867da20c066447ef2631a9f1a52dc60377cade35574ba83b0', 'candidate/d.scripted-app.mjs': '1ed9e6d5a74db81eba78c2eeba8c20656e4664b4f86ffce64a8588b72465b158', 'candidate/f1-ui-observers.mjs': 'd57ae40d04f9137a7aca4dc6b4fe4f395430e4bd20772540c5b8e1927299e04c', 'candidate/fixed-clock.mjs': '814a21374df6b3d0dd5317f412b50afb5ed026ac6fa8909bcb444d8af7ce5b06', 'candidate/prepare-d-gate.py': '3c3ea448a4b9c0743b0aa8ab119bfe741d17d83fc5fac198640ee9c6968108ae', 'candidate/semantic-response.json': '19dcd1408023d611ddad2312d1510f9aae9b8d7053bf9a3675e5f551e8a9e3de', 'candidate/source-pins.json': '04ad166849f63e51572e7896e6fb73c760f35c2b77837466fd10715a2fd5559f', 'candidate/startup-ready.mjs': 'd0d8adb0f428a75ae0249460763938a84ecc06e516f32436c616d94a6d84fe63', 'execution-wrapper/run-d-scripted.py': 'd14de713f14b918b6a97277a8d5ac32f962f08c793a1efff8d8528d94eb2b6a8', 'manifest.json': 'b7e76aac77e35ff50c8d7cb485837f186136801136983add463d728df6089e3e'}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
              rows=archive.getmembers()
              assert len(rows)==len(expected) and sorted(row.name for row in rows)==sorted(expected)
              values={}
              for row in rows:
                  assert row.isfile() and row.name in expected and row.size<=100000
                  value=archive.extractfile(row).read();assert len(value)==row.size
                  assert hashlib.sha256(value).hexdigest()==expected[row.name]
                  values[row.name]=value
              for name,value in values.items():
                  target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(value)
          PYBUNDLE
      - name: One credential-free actual App case, two contexts and four scripted calls
        id: scripted_app
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          test -z "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"; test -z "$GOOGLE_API_KEY"
          mkdir -p "$RUNNER_TEMP/d-isolated-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/d-isolated-home" PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            ISSUE488_D_SCRIPTED_SLOT_GRANTED=yes CI=true TZ=UTC WRANGLER_SEND_METRICS=false \
            python3 "$RUNNER_TEMP/d-bundle/execution-wrapper/run-d-scripted.py" \
            --root "$PWD" --node "$(command -v node)" --playwright "$RUNNER_TEMP/d-pw/node_modules" \
            --output "$RUNNER_TEMP/d-execution-1" \
            > "$RUNNER_TEMP/d-artifacts/runner.log" 2>&1
          python3 - <<'PYTERMINAL'
          import json,os,pathlib
          receipt=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'d-execution-1/terminal-receipt.json').read_text())
          assert receipt['result']=='passed' and receipt['lastStage']=='completed'
          assert type(receipt['processExitCode']) is int and receipt['processExitCode']==0
          assert receipt['immutableBeforeAfterEqual'] is True and receipt['narrowBeforeAfterEqual'] is True
          PYTERMINAL
      - name: Require the immutable product source after every attempted gate
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"; test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          sha256sum -c "$RUNNER_TEMP/d-artifacts/app-manifests.sha256"
      - name: Upload synthetic evidence on success or failure
        if: ${{ always() && steps.event_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue488-d-scripted-source-${{ env.SOURCE_SHA }}-event-${{ github.sha }}
          path: |
            ${{ runner.temp }}/d-artifacts/
            ${{ runner.temp }}/d-execution-1/
          if-no-files-found: error
          retention-days: 14
