name: Weekly Planning Application Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/weekly-planning-application-behavior-tests
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused application tests
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/application/useWeeklyPlanningApplication.test.tsx
          src/features/weeklyPlanning/application/weeklyPlanningApprovalApplication.test.ts
      - name: Weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Full test suite
        run: npm run test:run
      - name: TypeScript and production build
        run: npm run build
      - name: Diff check
        run: git diff --check origin/main...HEAD
