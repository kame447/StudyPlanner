name: PR5 build fix runner

on:
  push:
    branches:
      - agent/weekly-planning-conversation-hardening

permissions:
  contents: write
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply build fixes
        id: fix
        continue-on-error: true
        run: |
          set -o pipefail
          python .github/scripts/pr5_fix_build_types.py 2>&1 | tee /tmp/build-fix.log

      - name: Commit build fixes
        if: steps.fix.outcome == 'success'
        run: |
          if git diff --quiet; then
            echo 'No build fixes required.'
            exit 0
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/weeklyPlanning
          git commit -m "feat: pending rangeのbuild型残件を修正"
          git push origin HEAD:agent/weekly-planning-conversation-hardening

      - name: Report build fix result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/build-fix.log')
              ? fs.readFileSync('/tmp/build-fix.log', 'utf8').slice(-12000)
              : 'build-fix log not found';
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 20,
              body: `build-fix outcome: ${{ steps.fix.outcome }}\nhead: ${context.sha}\n\n\`\`\`text\n${log}\n\`\`\``,
            });

      - name: Fail on build-fix error
        if: steps.fix.outcome != 'success'
        run: exit 1
