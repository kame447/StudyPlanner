name: Issue 152 final verification once

on:
  push:
    branches:
      - test/issue152-adversarial-validation-lab
    paths:
      - .github/workflows/issue152-final-verification-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TZ: Asia/Tokyo

    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/issue152-adversarial-validation-lab
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Prepare final-tree-equivalent workspace
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue152-final-verification-once.yml
          mkdir -p artifacts/issue152-final-verification
          git diff --exit-code -- . ':!.github/workflows/issue152-final-verification-once.yml'

      - name: Install dependencies
        run: npm ci

      - name: Deterministic verification
        id: deterministic
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          status=0
          run_check() {
            name="$1"; shift
            echo "===== $name =====" | tee "artifacts/issue152-final-verification/${name}.log"
            "$@" 2>&1 | tee -a "artifacts/issue152-final-verification/${name}.log"
            code=${PIPESTATUS[0]}
            echo "$code" > "artifacts/issue152-final-verification/${name}.status"
            if [ "$code" -ne 0 ]; then status=1; fi
          }
          run_check typecheck npm run typecheck
          run_check issue152-targeted node ./node_modules/vitest/vitest.mjs --config vite.config.mjs --maxWorkers=1 run \
            src/features/weeklyPlanning/security/weeklyPlanningIssue152DecisionValidation.test.ts \
            src/features/weeklyPlanning/security/weeklyPlanningIssue152ExternalDataBoundary.test.ts \
            src/features/weeklyPlanning/security/weeklyPlanningIssue152FocusedAuthorization.test.ts \
            src/features/weeklyPlanning/security/weeklyPlanningIssue152NumericMutationBoundary.test.ts \
            src/features/weeklyPlanning/security/weeklyPlanningIssue152NumericSafety.test.ts \
            src/features/weeklyPlanning/security/weeklyPlanningIssue152PromptBoundary.test.ts \
            src/features/weeklyPlanning/security/weeklyPlanningIssue152ProvenanceCoverage.test.ts \
            src/features/weeklyPlanning/security/weeklyPlanningIssue152SemanticValidation.property.test.ts \
            src/features/weeklyPlanning/security/weeklyPlanningIssue152StoredContextLaundering.test.ts \
            src/features/weeklyPlanning/security/weeklyPlanningIssue152SupplementalContextBoundary.test.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningDecisionReferenceValidationV5.test.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticAssertionScopePolicyV5.test.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticMeaningPolicyInventoryV5.test.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPromptBudget.test.ts
          run_check full-vitest npm run test:run
          run_check build npm run build
          echo "$status" > artifacts/issue152-final-verification/deterministic.status
          exit "$status"

      - name: Targeted mutation verification
        id: mutation
        if: steps.deterministic.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          npm run test:mutation:issue152 2>&1 | tee artifacts/issue152-final-verification/mutation.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/issue152-final-verification/mutation.status
          exit "$code"

      - name: Verify Real API credential
        id: credential
        if: steps.deterministic.outcome == 'success'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set +e
          test -n "$OPENAI_API_KEY"
          code=$?
          echo "$code" > artifacts/issue152-final-verification/credential.status
          exit "$code"

      - name: Provider smoke
        id: smoke
        if: steps.deterministic.outcome == 'success' && steps.credential.outcome == 'success'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VITE_AI_BASE_URL: https://api.openai.com/v1
          VITE_AI_MODEL: gpt-5.6-luna
        shell: bash
        run: |
          set +e
          set -u
          payload=$(jq -nc --arg model "$VITE_AI_MODEL" '{model:$model,messages:[{role:"user",content:"Reply only OK."}]}')
          status=$(curl -sS -o /tmp/issue152-provider-smoke.json -w '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$VITE_AI_BASE_URL/chat/completions")
          echo "provider smoke HTTP $status" | tee artifacts/issue152-final-verification/provider-smoke.log
          jq '{error:(if .error then {type:.error.type,code:.error.code,param:.error.param,message:.error.message} else null end),model:.model,has_choices:(.choices|type=="array")}' \
            /tmp/issue152-provider-smoke.json | tee -a artifacts/issue152-final-verification/provider-smoke.log
          rm -f /tmp/issue152-provider-smoke.json
          test "$status" -ge 200 -a "$status" -lt 300
          code=$?
          echo "$code" > artifacts/issue152-final-verification/provider-smoke.status
          exit "$code"

      - name: Issue 152 Real API adversarial audit
        id: real_api
        if: steps.deterministic.outcome == 'success' && steps.smoke.outcome == 'success'
        continue-on-error: true
        env:
          WEEKLY_PLANNING_ISSUE152_REAL_API: '1'
          WEEKLY_PLANNING_ISSUE152_OUTPUT_DIR: artifacts/issue152-adversarial-real-api
          WEEKLY_PLANNING_ISSUE152_TIMEOUT_MS: '600000'
          WEEKLY_PLANNING_ISSUE152_CRITICAL_REPETITIONS: '3'
          VITE_AI_PROVIDER: openai
          VITE_AI_BASE_URL: https://api.openai.com/v1
          VITE_AI_MODEL: gpt-5.6-luna
          VITE_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VITE_AI_MAX_PROCESS_REQUESTS: '240'
          VITE_AI_EVAL_CAPTURE_METRICS: '1'
          VITE_CLOUDFLARE_AI_PROXY_URL: ''
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs --maxWorkers=1 run \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue152FailureDiagnosticsRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue152AdversarialRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue152IndirectInputRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue152StatefulBoundaryRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue152SemanticRetentionRealApi.observation.test.ts \
            2>&1 | tee artifacts/issue152-final-verification/real-api.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/issue152-final-verification/real-api.status
          exit "$code"

      - name: Record skipped stages
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for name in mutation credential provider-smoke real-api; do
            if [ ! -f "artifacts/issue152-final-verification/$name.status" ]; then
              echo skipped > "artifacts/issue152-final-verification/$name.status"
            fi
          done

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue152-final-verification-${{ github.sha }}
          path: |
            artifacts/issue152-final-verification/
            artifacts/issue152-adversarial-real-api/
            reports/stryker/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove one-shot verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue152-final-verification-once.yml
          git commit -m 'chore: remove one-shot Issue 152 final verifier'
          git push origin HEAD:test/issue152-adversarial-validation-lab

      - name: Enforce verification outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          deterministic='${{ steps.deterministic.outcome }}'
          mutation='${{ steps.mutation.outcome }}'
          credential='${{ steps.credential.outcome }}'
          smoke='${{ steps.smoke.outcome }}'
          real_api='${{ steps.real_api.outcome }}'
          printf 'deterministic=%s\nmutation=%s\ncredential=%s\nsmoke=%s\nreal_api=%s\n' \
            "$deterministic" "$mutation" "$credential" "$smoke" "$real_api"
          test "$deterministic" = success
          test "$mutation" = success
          test "$credential" = success
          test "$smoke" = success
          test "$real_api" = success
