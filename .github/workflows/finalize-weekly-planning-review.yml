name: Finalize weekly planning review fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/close-weekly-planning-review-tasks.mjs
      - .github/workflows/finalize-weekly-planning-review.yml

permissions:
  contents: write

jobs:
  verify-and-finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: node scripts/close-weekly-planning-review-tasks.mjs
      - run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused session and property tests
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:run -- src/components/QuickEntryModalSessionResume.test.tsx src/components/weeklyPlanningConversationMode.test.ts src/components/WeeklyPlanningConversation.test.tsx src/features/weeklyPlanning/weeklyPlanningReducer.test.ts src/features/weeklyPlanning/weeklyPlanningConversationPersistence.test.ts src/features/weeklyPlanning/weeklyPlanningStorageValidation.test.ts src/features/weeklyPlanning/weeklyPlanningSessionState.property.test.ts 2>&1 | tee weekly-planning-focused.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-planning-focused-diagnostic
          path: weekly-planning-focused.log
      - name: Require focused tests
        if: ${{ steps.focused.outcome == 'failure' }}
        run: exit 1
      - name: Full test suite
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee weekly-planning-full.log
      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee weekly-planning-build.log
      - name: Audit changed test structure
        run: |
          python - <<'PY'
          import pathlib, re, subprocess
          base = 'origin/main'
          changed = subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines()
          tests = [p for p in changed if re.search(r'\.(test|spec)\.(ts|tsx)$', p)]
          def content_at(ref, path):
              try:
                  return subprocess.check_output(['git', 'show', f'{ref}:{path}'], text=True)
              except subprocess.CalledProcessError:
                  return ''
          lines = ['# Weekly planning test structure audit', '', '| file | base lines | head lines | delta | base cases | head cases | property checks |', '|---|---:|---:|---:|---:|---:|---:|']
          for path in sorted(tests):
              head = pathlib.Path(path).read_text() if pathlib.Path(path).exists() else ''
              old = content_at(base, path)
              old_lines = len(old.splitlines())
              head_lines = len(head.splitlines())
              old_cases = len(re.findall(r'\b(?:it|test)\s*\(', old)) + len(re.findall(r'\bit\.each\s*\(', old))
              head_cases = len(re.findall(r'\b(?:it|test)\s*\(', head)) + len(re.findall(r'\bit\.each\s*\(', head))
              properties = len(re.findall(r'fc\.assert\s*\(', head))
              lines.append(f'| `{path}` | {old_lines} | {head_lines} | {head_lines-old_lines:+d} | {old_cases} | {head_cases} | {properties} |')
          lines.extend(['', f'Changed test files: {len(tests)}'])
          pathlib.Path('weekly-planning-test-structure.md').write_text('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-final-verification
          path: |
            weekly-planning-focused.log
            weekly-planning-full.log
            weekly-planning-build.log
            weekly-planning-test-structure.md
      - name: Commit finalized task documents
        run: |
          rm scripts/close-weekly-planning-review-tasks.mjs
          rm .github/workflows/finalize-weekly-planning-review.yml
          rm -f weekly-planning-focused.log weekly-planning-full.log weekly-planning-build.log weekly-planning-test-structure.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 週間計画レビュー修正を最終確認"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
