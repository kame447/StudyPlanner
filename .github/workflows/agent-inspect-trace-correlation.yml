name: Inspect weekly planning trace correlation

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/weekly-planning-trace-full-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-trace-full-implementation
          fetch-depth: 0
      - name: Locate pipeline call sites
        shell: bash
        run: |
          grep -R -n --exclude-dir=node_modules --exclude='*.map' \
            -E 'runWeeklyPlanningBehaviorAwarePipeline(WithInterpreter)?\(' \
            src > .agent-trace-correlation.txt || true
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-trace-correlation.txt
          git commit -m "feat: 週間計画pipeline呼出結果を記録"
          git push origin HEAD:agent/weekly-planning-trace-full-implementation
