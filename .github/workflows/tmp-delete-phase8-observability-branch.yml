name: One-shot Phase 8 observability branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-delete-phase8-observability-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merged branch target
        run: |
          git fetch origin feat/product-observability-phase8-system-legacy-removal
          test "$(git rev-parse origin/feat/product-observability-phase8-system-legacy-removal)" = "0ea223165c6f1aa7fec228ebc73944f202ccbe98"
          git merge-base --is-ancestor 46a8d22a9a60e373947d2fd568286e0eaa5949ba origin/main
          test "$(git rev-parse origin/feat/product-observability-phase8-system-legacy-removal^{tree})" = "$(git rev-parse 46a8d22a9a60e373947d2fd568286e0eaa5949ba^{tree})"
      - name: Delete explicit merged branch
        run: git push origin --delete -- feat/product-observability-phase8-system-legacy-removal
