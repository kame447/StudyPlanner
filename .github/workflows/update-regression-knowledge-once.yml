name: Update regression knowledge once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-regression-knowledge-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update canonical regression knowledge
        shell: bash
        run: |
