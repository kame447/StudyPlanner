name: Temporary Reviewed Bookshelf Baseline Update

on:
  push:
    branches:
      - test/playwright-ui-regression

permissions:
  actions: read
  contents: write

jobs:
  update-reviewed-baseline:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4
        with:
          ref: test/playwright-ui-regression
          fetch-depth: 0

      - name: Download reviewed visual artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/9479919676/zip" \
            --output /tmp/reviewed-visual.zip
          mkdir -p /tmp/reviewed-visual
          unzip -q /tmp/reviewed-visual.zip -d /tmp/reviewed-visual

      - name: Verify and copy only reviewed dark Bookshelf baseline
        run: |
          set -euo pipefail
          source="/tmp/reviewed-visual/playwright-visual-results/visual-regression-primary--a1761-he-approved-visual-baseline-mobile-dark/bookshelf-actual.png"
          echo "048a89b57725c89ee1a21b3dba3b6d2fac925df99575bf28c9e908495faa914a  ${source}" | sha256sum --check --strict
          cp "${source}" tests/e2e/visual-regression.spec.mjs-snapshots/bookshelf-mobile-dark-linux.png

      - name: Commit reviewed baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-regression.spec.mjs-snapshots/bookshelf-mobile-dark-linux.png
          git diff --cached --quiet && { echo "Reviewed baseline produced no diff"; exit 1; }
          git commit -m "test: update reviewed dark Bookshelf visual baseline"
          git push origin HEAD:test/playwright-ui-regression
