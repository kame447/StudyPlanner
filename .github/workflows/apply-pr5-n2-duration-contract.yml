name: apply-pr5-n2-duration-contract

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          git config user.name "studyplanner-fix-bot"
          git config user.email "studyplanner-fix-bot@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/agent-scripts/apply-pr5-n2-duration-contract.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              'src/features/weeklyPlanning/intake/weeklyPlanningScopeParsing.ts',
              "): SetPendingPlanningRangeCommand | undefined {\\n",
              "): NormalizedSetPendingPlanningRangeCommand | undefined {\\n",
          )
          '''
          new = '''replace_once(
              'src/features/weeklyPlanning/intake/weeklyPlanningScopeParsing.ts',
              "function parsePendingPlanningRange(\\n  text: string,\\n  context: WeeklyPlanningIntakeContext,\\n): SetPendingPlanningRangeCommand | undefined {\\n",
              "function parsePendingPlanningRange(\\n  text: string,\\n  context: WeeklyPlanningIntakeContext,\\n): NormalizedSetPendingPlanningRangeCommand | undefined {\\n",
          )
          '''
          if text.count(old) != 1:
              raise RuntimeError('scope parser replacement block did not match')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          set +e
          python .github/agent-scripts/apply-pr5-n2-duration-contract.py > /tmp/pr5-n2.log 2>&1
          status=$?
          cat /tmp/pr5-n2.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/pr5-n2.log docs/ai/tasks/20260716-weekly-planning-pr5-n2-error.log
            git add docs/ai/tasks/20260716-weekly-planning-pr5-n2-error.log
            git commit -m "feat: N2修正workflowの失敗ログを保存"
            git push origin HEAD:agent/weekly-planning-conversation-hardening
            exit "$status"
          fi
