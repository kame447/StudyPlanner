name: Apply Decomposition Stop Concern Basis
on:
  push:
    branches: [agent/weekly-ai-conversation-eval]
    paths:
      - .github/apply-decomposition-stop-concern-basis.py
      - .github/workflows/apply-decomposition-stop-concern-basis.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/weekly-ai-conversation-eval, fetch-depth: 0}
      - run: |
          git fetch origin agent/weekly-ai-conversation-eval
          git reset --hard origin/agent/weekly-ai-conversation-eval
          python .github/apply-decomposition-stop-concern-basis.py
          git config user.name kame447
          git config user.email 76802107+kame447@users.noreply.github.com
          git add src/features/weeklyPlanning/semantic/weeklyPlanningSemanticDocumentV5.ts \
                  src/features/weeklyPlanning/semantic/weeklyPlanningSemanticValidatorV5.ts \
                  src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.ts \
                  src/features/weeklyPlanning/dialogue/weeklyPlanningStableV5AiDialogueRenderer.ts
          git commit -m "fix: stop over-decomposition and type durable concerns"
          git push origin HEAD:agent/weekly-ai-conversation-eval
