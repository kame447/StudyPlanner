name: Apply semantic name verifier integration

on:
  push:
    branches:
      - agent/weekly-ai-conversation-eval
    paths:
      - '.github/workflows/apply-semantic-name-verifier-integration.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate focused name verifier
        run: python .github/apply-semantic-name-verifier-integration.py
      - name: Verify focused regression
        run: |
          npm run typecheck
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs run \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNameVerifierV5.test.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPipelineV5.test.ts \
            src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.test.ts \
            src/features/weeklyPlanning/dialogue/weeklyPlanningStableV5DialoguePlanningGuardrails.test.ts
          git diff --check
      - name: Commit verified integration
        run: |
          git config user.name 'kame447'
          git config user.email '76802107+kame447@users.noreply.github.com'
          git add \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPipelineV5.ts \
            src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.ts
          git commit -m 'feat: verify semantic names before canonicalization'
          git push origin HEAD:agent/weekly-ai-conversation-eval
