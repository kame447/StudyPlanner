name: Diagnose weekly planning server idempotency

on:
  push:
    branches:
      - agent/weekly-planning-server-idempotency

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture focused test result
        id: focused
        shell: bash
        run: |
          set +e
          npm run test:run -- \
            src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.test.ts \
            src/features/weeklyPlanning/application/weeklyPlanningApprovalApplication.serverCompletion.test.ts \
            src/hooks/usePlannerAppState.weeklyApproval.test.tsx \
            > server-idempotency-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: server-idempotency-test-log
          path: server-idempotency-tests.log
      - name: Fail when focused tests failed
        if: steps.focused.outputs.status != '0'
        run: exit 1
