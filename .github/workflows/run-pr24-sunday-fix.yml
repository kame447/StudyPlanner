name: Run PR24 Sunday-bound fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-pr24-sunday-fix.yml

permissions:
  contents: write

jobs:
  apply-verify-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-period-short-answer
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 .github/scripts/refine_sunday_bound_planning_range.py
      - run: git diff --check
      - run: npm run test:run -- src/features/weeklyPlanning/intake/weeklyPlanningPeriodShortAnswerRegression.test.ts
      - run: npm run test:run -- src/features/weeklyPlanning
      - run: npm run build

      - name: Commit target branch
        run: |
          rm .github/scripts/refine_sunday_bound_planning_range.py
          rm .github/workflows/refine-sunday-bound-planning-range.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 日曜日終端と任意開始日時の計画期間を修正"
          git push origin HEAD:agent/fix-weekly-planning-period-short-answer

      - name: Remove launcher from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm .github/workflows/run-pr24-sunday-fix.yml
          git add -A
          git commit -m "feat: 一時PR24修正workflowを削除"
          git push origin main
