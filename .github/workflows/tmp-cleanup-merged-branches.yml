name: One-shot merged branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and delete exact branches
        shell: bash
        run: |
          set -euo pipefail
          check_branch() {
            branch="$1"
            expected="$2"
            actual="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -z "$actual" ]; then
              echo "Branch already absent: $branch"
              return
            fi
            if [ "$actual" != "$expected" ]; then
              echo "Refusing to delete $branch: expected $expected, found $actual" >&2
              exit 1
            fi
            git push origin --delete "$branch"
          }
          check_branch 'refactor/stable-v5-request-context-authority' 'f62915cf0617fcef8e22d21459fce924f7de4726'
          check_branch '__do_not_use__' 'cc6798d9e03e3395184b7d967e75acfc3db34bd1'
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          rm .github/workflows/tmp-cleanup-merged-branches.yml
          git add .github/workflows/tmp-cleanup-merged-branches.yml
          git commit -m 'chore: remove one-shot merged branch cleanup workflow'
          git push origin HEAD:main
