name: Apply weekly planning interpreter generalization

on:
  push:
    branches:
      - agent/generalize-weekly-planning-interpreter
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-weekly-planning-interpreter-generalization
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/generalize-weekly-planning-interpreter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply implementation
        run: node scripts/run-weekly-planning-interpreter-generalization.mjs
      - name: Persist applicator error
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apply-weekly-planning-interpreter-error.log
          git diff --cached --quiet || git commit -m "chore: 週間計画AI一般化の適用エラーを記録"
          git push origin HEAD:agent/generalize-weekly-planning-interpreter
      - name: Run focused tests
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/intake/weeklyPlanningAiPromptContract.test.ts
          src/features/weeklyPlanning/intake/weeklyPlanningAiRawResponse.test.ts
          src/features/weeklyPlanning/trace/weeklyPlanningInterpreterTraceObservability.test.ts
          src/features/weeklyPlanning/pipeline/weeklyPlanningAiSemanticOwnership.test.ts
      - name: Run full test suite
        id: full_tests
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee weekly-planning-generalization-full-test.log
      - name: Persist full-test failure
        if: failure() && steps.full_tests.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-planning-generalization-full-test.log
          git commit -m "chore: 週間計画AI一般化のテスト失敗を記録"
          git push origin HEAD:agent/generalize-weekly-planning-interpreter
      - name: TypeScript and production build
        id: production_build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee weekly-planning-generalization-build.log
      - name: Persist build failure
        if: failure() && steps.production_build.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-planning-generalization-build.log
          git commit -m "chore: 週間計画AI一般化のbuild失敗を記録"
          git push origin HEAD:agent/generalize-weekly-planning-interpreter
      - name: Check diff
        id: diff_check
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee weekly-planning-generalization-diff.log
      - name: Persist diff failure
        if: failure() && steps.diff_check.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-planning-generalization-diff.log
          git commit -m "chore: 週間計画AI一般化のdiff失敗を記録"
          git push origin HEAD:agent/generalize-weekly-planning-interpreter
      - name: Remove temporary applicator
        run: |
          rm scripts/apply-weekly-planning-interpreter-generalization.mjs
          rm scripts/run-weekly-planning-interpreter-generalization.mjs
          rm .github/workflows/apply-weekly-planning-interpreter-generalization.yml
          rm -f apply-weekly-planning-interpreter-error.log
          rm -f weekly-planning-generalization-full-test.log
          rm -f weekly-planning-generalization-build.log
          rm -f weekly-planning-generalization-diff.log
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 週間計画AIの意味解釈指示を一般化"
          git push origin HEAD:agent/generalize-weekly-planning-interpreter
