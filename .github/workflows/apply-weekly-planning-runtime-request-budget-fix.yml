name: Apply weekly planning runtime and request budget fix

on:
  push:
    branches:
      - fix/weekly-planning-stable-v5-runtime-and-request-budget
    paths:
      - .github/workflows/apply-weekly-planning-runtime-request-budget-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weekly-planning-stable-v5-runtime-and-request-budget
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              file_path.write_text(text.replace(old, new, 1))

          Path('shared').mkdir(exist_ok=True)
          Path('shared/aiProxyContract.ts').write_text("""export const AI_PROXY_CHAT_REQUEST_LIMITS = {
            maxRequestBodyBytes: 256 * 1024,
            maxMessageCount: 20,
            maxMessageContentLength: 96_000,
            maxTotalMessageContentLength: 160_000,
            defaultOutputTokens: 800,
            maxOutputTokens: 4_096,
          } as const;

          export function getUtf8ByteLength(value: string): number {
            return new TextEncoder().encode(value).byteLength;
          }

          export function measureJsonUtf8Bytes(value: unknown): number {
            return getUtf8ByteLength(JSON.stringify(value));
          }
          """)

          Path('src/components/WeeklyPlanningConversation.tsx').write_text("""import { useEffect, useState } from 'react';
          import {
            getWeeklyPlanningRuntimeMode,
            setWeeklyPlanningRuntimeMode,
            WEEKLY_PLANNING_RUNTIME_MODE_CHANGE_EVENT,
            type WeeklyPlanningRuntimeMode,
          } from '../features/weeklyPlanning/application/weeklyPlanningRuntimeMode';
          import type { WeeklyPlanningMessage } from '../features/weeklyPlanning/types';

          interface WeeklyPlanningConversationProps {
            messages: readonly WeeklyPlanningMessage[];
            isAnalyzing: boolean;
          }

          const RUNTIME_LABELS: Record<WeeklyPlanningRuntimeMode, string> = {
            legacy: '現行方式',
            stable_v5: 'Stable V5',
          };

          export function WeeklyPlanningConversation({
            messages,
            isAnalyzing,
          }: WeeklyPlanningConversationProps) {
            const [runtimeMode, setRuntimeModeState] = useState<WeeklyPlanningRuntimeMode>(() =>
              getWeeklyPlanningRuntimeMode(),
            );

            useEffect(() => {
              if (typeof window === 'undefined') return undefined;
              const syncRuntimeMode = () => setRuntimeModeState(getWeeklyPlanningRuntimeMode());
              window.addEventListener(WEEKLY_PLANNING_RUNTIME_MODE_CHANGE_EVENT, syncRuntimeMode);
              return () => window.removeEventListener(
                WEEKLY_PLANNING_RUNTIME_MODE_CHANGE_EVENT,
                syncRuntimeMode,
              );
            }, []);

            function changeRuntimeMode(nextMode: WeeklyPlanningRuntimeMode): void {
              if (nextMode === runtimeMode || isAnalyzing) return;
              if (
                messages.length > 0
                && typeof window !== 'undefined'
                && !window.confirm('実行方式を切り替えると、現在の週間計画の会話と未保存previewを初期化します。切り替えますか？')
              ) {
                return;
              }

              setWeeklyPlanningRuntimeMode(nextMode);
              setRuntimeModeState(getWeeklyPlanningRuntimeMode());
            }

            return (
              <div className="section-stack">
                <div className="assistant-feedback-card" aria-label="週間計画AIの実行方式">
                  <div className="label-row">
                    <strong>週間計画AIの実行方式</strong>
                    <span className="confidence-badge">現在実行中: {RUNTIME_LABELS[runtimeMode]}</span>
                  </div>
                  <div className="segmented-control" role="radiogroup" aria-label="週間計画AIの実行方式を選択">
                    <button
                      aria-checked={runtimeMode === 'legacy'}
                      className={runtimeMode === 'legacy' ? 'segment active' : 'segment'}
                      disabled={isAnalyzing}
                      onClick={() => changeRuntimeMode('legacy')}
                      role="radio"
                      type="button"
                    >
                      現行方式
                    </button>
                    <button
                      aria-checked={runtimeMode === 'stable_v5'}
                      className={runtimeMode === 'stable_v5' ? 'segment active' : 'segment'}
                      disabled={isAnalyzing}
                      onClick={() => changeRuntimeMode('stable_v5')}
                      role="radio"
                      type="button"
                    >
                      Stable V5
                    </button>
                  </div>
                  <p className="detail-note">
                    Stable V5では、AIが意味構造だけを作り、質問選択と予定配置はアプリ側が決定します。切替時は新旧の状態を混在させないため会話を初期化します。
                  </p>
                </div>

                {messages.length > 0 || isAnalyzing ? (
                  <div className="weekly-planning-chat-log" aria-label="週間計画の会話履歴">
                    {messages.map((message) => (
                      <div
                        className={`weekly-planning-chat-message weekly-planning-chat-message--${message.role}`}
                        key={message.id}
                      >
                        <strong>{message.role === 'user' ? 'あなた' : 'アプリ'}</strong>
                        <p>{message.content}</p>
                      </div>
                    ))}
                    {isAnalyzing ? (
                      <div
                        className="weekly-planning-chat-message weekly-planning-chat-message--assistant weekly-planning-chat-message--typing"
                        role="status"
                        aria-label="アプリが回答を作成中"
                      >
                        <strong>アプリ</strong>
                        <span className="weekly-planning-typing-indicator" aria-hidden="true">
                          <span />
                          <span />
                          <span />
                        </span>
                      </div>
                    ) : null}
                  </div>
                ) : null}
              </div>
            );
          }
          """)

          Path('src/components/WeeklyPlanningConversation.test.tsx').write_text("""import { act, create } from 'react-test-renderer';
          import { afterEach, beforeEach, describe, expect, it } from 'vitest';
          import {
            getWeeklyPlanningRuntimeMode,
            resetWeeklyPlanningRuntimeModeForTest,
          } from '../features/weeklyPlanning/application/weeklyPlanningRuntimeMode';
          import { WeeklyPlanningConversation } from './WeeklyPlanningConversation';

          describe('WeeklyPlanningConversation runtime selector', () => {
            beforeEach(() => resetWeeklyPlanningRuntimeModeForTest());
            afterEach(() => resetWeeklyPlanningRuntimeModeForTest());

            it('shows the effective runtime and can select Stable V5 before a conversation starts', () => {
              const renderer = create(
                <WeeklyPlanningConversation messages={[]} isAnalyzing={false} />,
              );
              const stableButton = renderer.root.findAllByType('button').find(
                (button) => button.children.join('') === 'Stable V5',
              );
              expect(stableButton).toBeDefined();

              act(() => stableButton?.props.onClick());

              expect(getWeeklyPlanningRuntimeMode()).toBe('stable_v5');
              expect(renderer.root.findByProps({ 'aria-label': '週間計画AIの実行方式' })).toBeDefined();
            });
          });
          """)

          replace_once(
              'src/components/NaturalLanguageAssistant.tsx',
              '''        <div className="assistant-runtime">\n          <span className="confidence-badge">current pipeline first</span>\n          <span className="assistant-runtime-help">{runtimeInfo.fallbackLabel}</span>\n        </div>''',
              '''        <div className="assistant-runtime">\n          <span className="confidence-badge">\n            {aiInputMode === 'weekly_planning' ? '週間計画AI' : '相談AI'}\n          </span>\n          <span className="assistant-runtime-help">\n            {aiInputMode === 'weekly_planning'\n              ? '実行方式は週間計画の会話欄で選択できます'\n              : runtimeInfo.fallbackLabel}\n          </span>\n        </div>''',
          )

          replace_once(
              'src/components/AppSettingsDialog.tsx',
              '''  function changeWeeklyPlanningRuntimeMode(mode: WeeklyPlanningRuntimeMode): void {\n    setWeeklyPlanningRuntimeMode(mode);\n    setRuntimeModeState(mode);\n  }''',
              '''  function changeWeeklyPlanningRuntimeMode(mode: WeeklyPlanningRuntimeMode): void {\n    setWeeklyPlanningRuntimeMode(mode);\n    setRuntimeModeState(getWeeklyPlanningRuntimeMode());\n  }''',
          )

          replace_once(
              'workers/ai-proxy/src/index.ts',
              "import { DEFAULT_ALLOWED_CHAT_MODELS, resolveChatModel } from './modelPolicy';",
              "import { DEFAULT_ALLOWED_CHAT_MODELS, resolveChatModel } from './modelPolicy';\nimport {\n  AI_PROXY_CHAT_REQUEST_LIMITS,\n  getUtf8ByteLength,\n} from '../../../shared/aiProxyContract';",
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              'const MAX_REQUEST_BODY_BYTES = 32 * 1024;',
              'const MAX_REQUEST_BODY_BYTES = AI_PROXY_CHAT_REQUEST_LIMITS.maxRequestBodyBytes;',
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              'const MAX_MESSAGE_COUNT = 20;',
              'const MAX_MESSAGE_COUNT = AI_PROXY_CHAT_REQUEST_LIMITS.maxMessageCount;',
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              'const MAX_MESSAGE_CONTENT_LENGTH = 6000;',
              'const MAX_MESSAGE_CONTENT_LENGTH = AI_PROXY_CHAT_REQUEST_LIMITS.maxMessageContentLength;',
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              'const MAX_TOTAL_MESSAGE_CONTENT_LENGTH = 16000;',
              'const MAX_TOTAL_MESSAGE_CONTENT_LENGTH = AI_PROXY_CHAT_REQUEST_LIMITS.maxTotalMessageContentLength;',
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              'const CHAT_DEFAULT_OUTPUT_TOKENS = 800;',
              'const CHAT_DEFAULT_OUTPUT_TOKENS = AI_PROXY_CHAT_REQUEST_LIMITS.defaultOutputTokens;',
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              'const CHAT_MAX_OUTPUT_TOKENS = 1200;',
              'const CHAT_MAX_OUTPUT_TOKENS = AI_PROXY_CHAT_REQUEST_LIMITS.maxOutputTokens;',
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              "const WORKER_DEBUG_VERSION = 'timetable-ocr-debug-20260429-001';",
              "const WORKER_DEBUG_VERSION = 'weekly-planning-request-budget-20260723-001';",
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              '''function getUtf8ByteLength(value: string): number {\n  return new TextEncoder().encode(value).byteLength;\n}\n\n''',
              '',
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              '''    return jsonResponse(request, env, 413, {\n      error: 'Request body was too large.',\n    });''',
              '''    return jsonResponse(request, env, 413, {\n      error: 'Request body was too large.',\n      errorCode: 'chat_request_body_too_large',\n      limitBytes: MAX_REQUEST_BODY_BYTES,\n      actualBytes: declaredBodyLength,\n    });''',
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              '''  const requestText = await request.text();\n\n  if (getUtf8ByteLength(requestText) > MAX_REQUEST_BODY_BYTES) {\n    return jsonResponse(request, env, 413, {\n      error: 'Request body was too large.',\n    });\n  }''',
              '''  const requestText = await request.text();\n  const requestBodyBytes = getUtf8ByteLength(requestText);\n\n  if (requestBodyBytes > MAX_REQUEST_BODY_BYTES) {\n    return jsonResponse(request, env, 413, {\n      error: 'Request body was too large.',\n      errorCode: 'chat_request_body_too_large',\n      limitBytes: MAX_REQUEST_BODY_BYTES,\n      actualBytes: requestBodyBytes,\n    });\n  }''',
          )

          replace_once(
              'src/services/ai/openAiCompatibleClient.ts',
              "import { getFirebaseAuth } from '../../lib/firebaseClient';",
              "import { getFirebaseAuth } from '../../lib/firebaseClient';\nimport {\n  AI_PROXY_CHAT_REQUEST_LIMITS,\n  getUtf8ByteLength,\n} from '../../../shared/aiProxyContract';",
          )
          replace_once(
              'src/services/ai/openAiCompatibleClient.ts',
              '''interface AiProxyResponse {\n  content?: string;\n  error?: string;\n}''',
              '''interface AiProxyResponse {\n  content?: string;\n  error?: string;\n  errorCode?: string;\n  limitBytes?: number;\n  actualBytes?: number;\n}''',
          )
          replace_once(
              'src/services/ai/openAiCompatibleClient.ts',
              '''        };\n        const logModel = purpose ? `purpose:${purpose}` : config.model;\n\n        try {''',
              '''        };\n        const proxyRequestBody = JSON.stringify(proxyBody);\n        const proxyRequestBytes = getUtf8ByteLength(proxyRequestBody);\n        const logModel = purpose ? `purpose:${purpose}` : config.model;\n\n        try {\n          if (proxyRequestBytes > AI_PROXY_CHAT_REQUEST_LIMITS.maxRequestBodyBytes) {\n            throw new Error(\n              `AI proxy request payload exceeded the application limit (${proxyRequestBytes}/${AI_PROXY_CHAT_REQUEST_LIMITS.maxRequestBodyBytes} bytes).`,\n            );\n          }''',
          )
          replace_once(
              'src/services/ai/openAiCompatibleClient.ts',
              '            body: JSON.stringify(proxyBody),',
              '            body: proxyRequestBody,',
          )
          replace_once(
              'src/services/ai/openAiCompatibleClient.ts',
              '''            const responseMessage =\n              result.error || `AI proxy request failed with status ${response.status}.`;''',
              '''            const responseMessage = result.errorCode === 'chat_request_body_too_large'\n              ? `AI proxy request payload exceeded the server limit (${result.actualBytes ?? 'unknown'}/${result.limitBytes ?? 'unknown'} bytes).`\n              : result.error || `AI proxy request failed with status ${response.status}.`;''',
          )

          replace_once(
              'src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts',
              '''        requestBytes.push(byteLength({\n          purpose: 'weekly_planning_semantic_normalizer',\n          messages,\n          responseFormat: WEEKLY_PLANNING_SEMANTIC_RESPONSE_FORMAT_V5,\n          maxCompletionTokens: SEMANTIC_NORMALIZER_V5_MAX_COMPLETION_TOKENS,\n        }));''',
              '''        requestBytes.push(byteLength({\n          purpose: 'weekly_planning_semantic_normalizer',\n          temperature: 0,\n          messages,\n          response_format: WEEKLY_PLANNING_SEMANTIC_RESPONSE_FORMAT_V5,\n          max_completion_tokens: SEMANTIC_NORMALIZER_V5_MAX_COMPLETION_TOKENS,\n        }));''',
          )

          Path('src/features/weeklyPlanning/semantic/weeklyPlanningSemanticRequestBudgetV5.test.ts').write_text("""import { describe, expect, it } from 'vitest';
          import {
            AI_PROXY_CHAT_REQUEST_LIMITS,
            measureJsonUtf8Bytes,
          } from '../../../../shared/aiProxyContract';
          import type { OpenAiCompatibleClient } from '../../../services/ai/openAiCompatibleClient';
          import {
            WEEKLY_PLANNING_SEMANTIC_SCHEMA_VERSION_V5,
          } from './weeklyPlanningSemanticDocumentV5';
          import { createWeeklyPlanningSemanticNormalizerV5 } from './weeklyPlanningSemanticNormalizerV5';

          describe('Stable V5 AI proxy request budget', () => {
            it('fits a schema-heavy eight-turn request inside the shared proxy contract', async () => {
              const calls: Array<Record<string, unknown>> = [];
              const client: OpenAiCompatibleClient = {
                async createChatCompletion(input) {
                  calls.push(input as unknown as Record<string, unknown>);
                  return JSON.stringify({
                    schemaVersion: WEEKLY_PLANNING_SEMANTIC_SCHEMA_VERSION_V5,
                    planningIntent: 'discuss',
                    planningWindow: null,
                    tasks: [],
                    relations: [],
                    availabilityDeclarations: [],
                    constraintSourceRequests: [],
                    uncertainties: [],
                    corrections: [],
                    decisions: [],
                  });
                },
              };
              const recentConversation = Array.from({ length: 8 }, (_, index) => ({
                role: index % 2 === 0 ? 'user' as const : 'assistant' as const,
                content: `${index}:` + 'あ'.repeat(4_000),
              }));
              const publicStateSummary = {
                runtime: 'weekly-planning-stable-v5',
                graphRevision: 18,
                tasks: Array.from({ length: 40 }, (_, index) => ({
                  publicId: `task:${index}`,
                  category: index % 2 === 0 ? 'study' : 'non_study',
                  title: `予定${index}`,
                })),
                workloads: Array.from({ length: 40 }, (_, index) => ({
                  publicId: `workload:${index}`,
                  taskPublicId: `task:${index}`,
                  quantityRole: 'target',
                  amount: index + 1,
                  unitCode: 'page',
                  unitLabel: 'ページ',
                })),
              };

              const result = await createWeeklyPlanningSemanticNormalizerV5(client).normalize({
                userText: 'この条件を確認してください。',
                recentConversation,
                publicStateSummary,
              });
              expect(result.status).toBe('accepted');

              const call = calls[0];
              const wireRequest = {
                purpose: call.purpose,
                temperature: call.temperature,
                messages: call.messages,
                response_format: call.responseFormat,
                max_completion_tokens: call.maxCompletionTokens,
              };
              const requestBytes = measureJsonUtf8Bytes(wireRequest);
              const messages = call.messages as Array<{ content: string }>;
              const messageLengths = messages.map((message) => message.content.length);

              expect(requestBytes).toBeGreaterThan(32 * 1024);
              expect(requestBytes).toBeLessThanOrEqual(
                AI_PROXY_CHAT_REQUEST_LIMITS.maxRequestBodyBytes,
              );
              expect(Math.max(...messageLengths)).toBeLessThanOrEqual(
                AI_PROXY_CHAT_REQUEST_LIMITS.maxMessageContentLength,
              );
              expect(messageLengths.reduce((sum, value) => sum + value, 0)).toBeLessThanOrEqual(
                AI_PROXY_CHAT_REQUEST_LIMITS.maxTotalMessageContentLength,
              );
              expect(call.maxCompletionTokens).toBeLessThanOrEqual(
                AI_PROXY_CHAT_REQUEST_LIMITS.maxOutputTokens,
              );
              expect(result.diagnostics.requestBytes[0]).toBe(requestBytes);
            });
          });
          """)

          Path('.github/workflows/apply-weekly-planning-runtime-request-budget-fix.yml').unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused tests
        run: >-
          npm run test:run --
          src/components/WeeklyPlanningConversation.test.tsx
          src/features/weeklyPlanning/application/weeklyPlanningRuntimeMode.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticRequestBudgetV5.test.ts

      - name: Typecheck and build
        run: npm run build

      - name: Commit verified changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'studyplanner-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: Stable V5の選択導線とAI送信容量を修正'
          git push origin HEAD:fix/weekly-planning-stable-v5-runtime-and-request-budget
