name: PR5 second rereview fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/weekly-planning-conversation-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Apply source and test fixes
        run: node scripts/apply-pr5-second-rereview-fixes.mjs

      - name: Add lifecycle test dependency
        run: npm install --save-dev react-test-renderer@18.3.1 @types/react-test-renderer@^18.3.0

      - name: Run focused tests
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/weeklyPlanningStorageValidation.test.ts
          src/features/weeklyPlanning/weeklyPlanningPreviewSessionLifecycle.test.tsx
          src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts
          src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts

      - name: Run weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning src/components/WeeklyPlanningConversation.test.tsx src/components/weeklyPlanningConversationMode.test.ts

      - name: Run full test suite
        run: npm run test:run

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Upload build log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pr5-second-rereview-build-log
          path: build.log

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 120 build.log
          exit 1

      - name: Check diff whitespace
        run: git diff --check

      - name: Remove temporary automation files
        run: rm scripts/apply-pr5-second-rereview-fixes.mjs .github/workflows/pr5-second-rereview-fixes.yml

      - name: Commit verified changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json \
            docs/ai/tasks/20260716-weekly-planning-pr5-second-rereview-fixes.md \
            src/features/weeklyPlanning/weeklyPlanningStorage.ts \
            src/features/weeklyPlanning/weeklyPlanningStorageValidation.test.ts \
            src/features/weeklyPlanning/weeklyPlanningPreviewSessionLifecycle.test.tsx \
            src/features/weeklyPlanning/intake/weeklyPlanningScopeParsing.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningCandidateValidator.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts \
            src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts \
            scripts/apply-pr5-second-rereview-fixes.mjs \
            .github/workflows/pr5-second-rereview-fixes.yml
          git commit -m "feat: PR5二回目再レビュー指摘を修正"
          git push origin HEAD:agent/weekly-planning-conversation-hardening
