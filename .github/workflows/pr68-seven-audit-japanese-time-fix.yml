name: PR68 seven audit Japanese time verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr68-seven-audit-japanese-time-fix.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Japanese time grounding fix
        run: python3 scripts/pr68_seven_audit_japanese_time_fix.py
      - name: Check diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: |
          npm run test:run -- \
            src/features/weeklyPlanning/__tests__/weeklyPlanningAdversarialInput.test.ts \
            src/features/weeklyPlanning/__tests__/weeklyPlanningSevenAuditContract.test.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningCandidateValidator.test.ts
      - name: Run full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Commit verified fix and clean temporary files
        run: |
          rm -f scripts/pr68_seven_audit_japanese_time_fix.py
          rm -f .github/workflows/pr68-seven-audit-japanese-time-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 日本語時刻のgrounding境界を整合'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
