name: One-shot refresh dark home baselines

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-refresh-dark-home-baselines.yml

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified visual-regression artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 33173286196 \
            --repo "$GITHUB_REPOSITORY" \
            --name ui-visual-regression-dde47d9cc4478735c473393bed55674d10ece450 \
            --dir /tmp/ui-visual

      - name: Replace only the two stale dark Home baselines
        run: |
          set -euo pipefail
          desktop_source='/tmp/ui-visual/playwright-visual-results/visual-regression-primary--a1761-he-approved-visual-baseline-desktop-dark/home-actual.png'
          mobile_source='/tmp/ui-visual/playwright-visual-results/visual-regression-primary--a1761-he-approved-visual-baseline-mobile-dark/home-actual.png'
          desktop_target='tests/e2e/visual-regression.spec.mjs-snapshots/home-desktop-dark-linux.png'
          mobile_target='tests/e2e/visual-regression.spec.mjs-snapshots/home-mobile-dark-linux.png'

          test -s "$desktop_source"
          test -s "$mobile_source"
          test -f "$desktop_target"
          test -f "$mobile_target"

          cp "$desktop_source" "$desktop_target"
          cp "$mobile_source" "$mobile_target"

          file "$desktop_target" "$mobile_target"
          sha256sum "$desktop_target" "$mobile_target"

      - name: Commit baselines and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-refresh-dark-home-baselines.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/e2e/visual-regression.spec.mjs-snapshots/home-desktop-dark-linux.png \
            tests/e2e/visual-regression.spec.mjs-snapshots/home-mobile-dark-linux.png \
            .github/workflows/one-shot-refresh-dark-home-baselines.yml
          git diff --cached --stat
          git diff --cached --quiet && { echo 'Expected baseline changes are missing.' >&2; exit 1; }
          git commit -m 'test: refresh dark mode home visual baselines'
          git push origin HEAD:main
