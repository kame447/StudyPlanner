name: PR5 push probe

on:
  push:
    branches:
      - agent/weekly-planning-conversation-hardening

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 20,
              body: `push workflow started for ${context.sha}`,
            });
