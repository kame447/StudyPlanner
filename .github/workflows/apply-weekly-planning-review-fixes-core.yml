name: Apply weekly planning review fixes core

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply-weekly-planning-review-fixes-core.mjs
      - scripts/patch-weekly-planning-review-core-v2.mjs
      - .github/workflows/apply-weekly-planning-review-fixes-core.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply core fixes
        run: |
          set -o pipefail
          { node scripts/apply-weekly-planning-review-fixes-core.mjs; node scripts/patch-weekly-planning-review-core-v2.mjs; } 2>&1 | tee core-apply-output.log
      - name: Upload core apply log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-core-apply-log
          path: core-apply-output.log
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core review tests
        run: |
          set -o pipefail
          npm run test:run -- src/features/weeklyPlanning/intake/weeklyPlanningReviewCoreFixes.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningAiInterpreter.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningInterpreterFoundation.test.ts src/features/weeklyPlanning/intake/weeklyPlanningSingleFieldPriority.test.ts src/features/weeklyPlanning/intake/weeklyPlanningScopeEnrichment.test.ts 2>&1 | tee core-test-output.log
      - name: Upload core test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-core-test-log
          path: core-test-output.log
      - name: Weekly planning tests
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Finalize task docs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of [
            'docs/ai/tasks/20260716-weekly-planning-exam-scope-attribute-merge.md',
            'docs/ai/tasks/20260716-weekly-planning-closed-command-runtime-validation.md',
          ]) {
            let content = fs.readFileSync(path, 'utf8');
            content = content.replace('Status: open', 'Status: closed\nClosed: 2026-07-16');
            content = content.replaceAll('- [ ]', '- [x]');
            fs.writeFileSync(path, content);
          }
          NODE
      - name: Remove temporary automation
        run: rm scripts/apply-weekly-planning-review-fixes-core.mjs scripts/patch-weekly-planning-review-core-v2.mjs .github/workflows/apply-weekly-planning-review-fixes-core.yml
      - name: Commit verified core fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 週間計画のcommand境界とscope補完を修正"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
