name: Apply weekly planning review fixes core

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply-weekly-planning-review-fixes-core.mjs
      - scripts/patch-weekly-planning-review-core-v2.mjs
      - scripts/patch-weekly-planning-review-core-v3.mjs
      - scripts/patch-weekly-planning-review-core-v4.mjs
      - scripts/cleanup-weekly-planning-core-validator.mjs
      - scripts/patch-weekly-planning-exam-scope-summary-type.mjs
      - scripts/patch-weekly-planning-exam-scope-year-range-type.mjs
      - .github/workflows/apply-weekly-planning-review-fixes-core.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply core fixes
        run: |
          node scripts/apply-weekly-planning-review-fixes-core.mjs
          node scripts/patch-weekly-planning-review-core-v2.mjs
          node scripts/patch-weekly-planning-review-core-v3.mjs
          node scripts/patch-weekly-planning-review-core-v4.mjs
          node scripts/cleanup-weekly-planning-core-validator.mjs
          node scripts/patch-weekly-planning-exam-scope-summary-type.mjs
          node scripts/patch-weekly-planning-exam-scope-year-range-type.mjs
      - name: Diff check
        run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Core review tests
        run: npm run test:run -- src/features/weeklyPlanning/intake/weeklyPlanningReviewCoreFixes.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningAiInterpreter.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningInterpreterFoundation.test.ts src/features/weeklyPlanning/intake/weeklyPlanningSingleFieldPriority.test.ts src/features/weeklyPlanning/intake/weeklyPlanningScopeEnrichment.test.ts
      - name: Weekly planning tests
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Finalize task docs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of [
            'docs/ai/tasks/20260716-weekly-planning-exam-scope-attribute-merge.md',
            'docs/ai/tasks/20260716-weekly-planning-closed-command-runtime-validation.md',
          ]) {
            let content = fs.readFileSync(path, 'utf8');
            content = content.replace('Status: open', 'Status: closed\nClosed: 2026-07-16');
            content = content.replaceAll('- [ ]', '- [x]');
            fs.writeFileSync(path, content);
          }
          NODE
      - name: Remove temporary automation
        run: rm scripts/apply-weekly-planning-review-fixes-core.mjs scripts/patch-weekly-planning-review-core-v2.mjs scripts/patch-weekly-planning-review-core-v3.mjs scripts/patch-weekly-planning-review-core-v4.mjs scripts/cleanup-weekly-planning-core-validator.mjs scripts/patch-weekly-planning-exam-scope-summary-type.mjs scripts/patch-weekly-planning-exam-scope-year-range-type.mjs .github/workflows/apply-weekly-planning-review-fixes-core.yml .github/workflows/debug-weekly-core-full.yml weekly-planning-core-build-output.log
      - name: Commit verified core fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 週間計画のcommand境界とscope補完を修正"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
