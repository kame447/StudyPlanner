name: Weekly planning app orchestration

on:
  push:
    branches:
      - agent/weekly-planning-app-orchestration
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-app-orchestration
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply App refactor
        shell: bash
        run: |
          set -e
          if grep -q "submitWeeklyPlanningControlledTurn" src/App.tsx; then
            python -m py_compile .github/scripts/apply-weekly-planning-app-orchestration.py
            python .github/scripts/apply-weekly-planning-app-orchestration.py
          fi
          git diff --check
          git diff --stat

      - name: Install dependencies
        run: npm ci

      - name: Run focused architecture and behavior tests
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/application/weeklyPlanningAppOrchestrationArchitecture.test.ts
          src/features/weeklyPlanning/weeklyPlanningTurnController.test.ts
          src/features/weeklyPlanning/planning/weeklyPlanningApproval.test.ts
          src/components/QuickEntryModalSessionResume.test.tsx
          src/components/NaturalLanguageAssistant.weeklyPlanningControls.test.tsx

      - name: Run weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning

      - name: Run full test suite
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

      - name: Publish generated App refactor
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -e
          if git diff --quiet -- src/App.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "feat: Appから週間計画の進行管理を分離"
          git push origin HEAD:agent/weekly-planning-app-orchestration
