name: Final pending range verification

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.issue.title == '[automation] final pending range verification'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Focused pending range tests
        id: focused
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts
          src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeAdversarialRegression.test.ts
          src/features/weeklyPlanning/pipeline/weeklyPlanningPendingRangeContract.test.ts
          src/features/weeklyPlanning/weeklyPlanningPendingRangeStorageContract.test.ts

      - name: Weekly planning tests
        id: weekly
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:run -- src/features/weeklyPlanning

      - name: Full test suite
        id: full
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:run

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Diff and repository checks
        id: diff
        continue-on-error: true
        run: |
          git diff --check
          git diff --check 74185277d68b5dee37560a9c0a79356f837bc5f2...HEAD
          test -z "$(git status --short --untracked-files=no)"

      - name: Report verification result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcomes = {
              install: '${{ steps.install.outcome }}',
              focused: '${{ steps.focused.outcome }}',
              weekly: '${{ steps.weekly.outcome }}',
              full: '${{ steps.full.outcome }}',
              build: '${{ steps.build.outcome }}',
              diff: '${{ steps.diff.outcome }}',
            };
            const ok = Object.values(outcomes).every(value => value === 'success');
            const lines = Object.entries(outcomes).map(([name, value]) => `- ${name}: ${value}`);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [`final verification: ${ok ? 'PASS' : 'FAIL'}`, ...lines, `head: ${context.sha}`].join('\n'),
            });
            if (!ok) core.setFailed('Final verification failed');
