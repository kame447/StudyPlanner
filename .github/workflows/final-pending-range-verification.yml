name: Final pending range verification

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.issue.title == '[automation] final pending range verification'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0

      - name: Record target head
        run: echo "TARGET_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/install.log

      - name: Focused pending range tests
        id: focused
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:run -- \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeAdversarialRegression.test.ts \
            src/features/weeklyPlanning/pipeline/weeklyPlanningPendingRangeContract.test.ts \
            src/features/weeklyPlanning/weeklyPlanningPendingRangeStorageContract.test.ts \
            2>&1 | tee /tmp/focused.log

      - name: Weekly planning tests
        id: weekly
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:run -- src/features/weeklyPlanning 2>&1 | tee /tmp/weekly.log

      - name: Full test suite
        id: full
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee /tmp/full.log

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Diff and repository checks
        id: diff
        continue-on-error: true
        run: |
          set -o pipefail
          {
            git diff --check
            git diff --check 74185277d68b5dee37560a9c0a79356f837bc5f2...HEAD
            test -z "$(git status --short --untracked-files=no)"
          } 2>&1 | tee /tmp/diff.log

      - name: Report verification result
        if: always()
        uses: actions/github-script@v7
        env:
          TARGET_HEAD: ${{ env.TARGET_HEAD }}
        with:
          script: |
            const fs = require('fs');
            const outcomes = {
              install: '${{ steps.install.outcome }}',
              focused: '${{ steps.focused.outcome }}',
              weekly: '${{ steps.weekly.outcome }}',
              full: '${{ steps.full.outcome }}',
              build: '${{ steps.build.outcome }}',
              diff: '${{ steps.diff.outcome }}',
            };
            const ok = Object.values(outcomes).every(value => value === 'success');
            const lines = Object.entries(outcomes).map(([name, value]) => `- ${name}: ${value}`);
            const details = [];
            for (const [name, outcome] of Object.entries(outcomes)) {
              if (outcome === 'success') continue;
              const path = `/tmp/${name}.log`;
              if (!fs.existsSync(path)) continue;
              const tail = fs.readFileSync(path, 'utf8').split('\n').slice(-55).join('\n');
              details.push(`\n## ${name} log tail\n\n\`\`\`text\n${tail}\n\`\`\``);
            }
            const body = [
              `final verification: ${ok ? 'PASS' : 'FAIL'}`,
              ...lines,
              `target head: ${process.env.TARGET_HEAD}`,
              ...details,
            ].join('\n').slice(0, 60000);
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            if (!ok) core.setFailed('Final verification failed');
