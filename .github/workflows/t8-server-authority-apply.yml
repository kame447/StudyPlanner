name: T8 Server Authority Apply

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-trace-server-authoritative-ids
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply T-8 worker boundary
        run: python scripts/apply-t8-server-authoritative-trace.py
      - name: Remove temporary application files
        run: rm scripts/apply-t8-server-authoritative-trace.py .github/workflows/t8-server-authority-apply.yml
      - name: Run focused regressions
        run: |
          set -o pipefail
          npm run test:run -- \
            src/features/weeklyPlanning/trace/weeklyPlanningTraceRemoteRepository.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceServerAuthority.integration.test.ts \
            workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts \
            2>&1 | tee /tmp/t8-focused.log
      - name: Run full suite
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee /tmp/t8-full.log
      - name: TypeScript and production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/t8-build.log
      - name: Check diff
        run: git diff --check origin/main...HEAD && git diff --check
      - name: Commit verified T-8 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            workers/ai-proxy/src/weeklyPlanningTracePrivacy.ts \
            workers/ai-proxy/src/weeklyPlanningTraceApi.ts \
            scripts/apply-t8-server-authoritative-trace.py \
            .github/workflows/t8-server-authority-apply.yml
          git commit -m "feat: traceの構造IDをサーバー発行に変更"
          git push origin HEAD:agent/fix-weekly-planning-trace-server-authoritative-ids
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t8-server-authority-verification
          path: |
            /tmp/t8-focused.log
            /tmp/t8-full.log
            /tmp/t8-build.log
          if-no-files-found: ignore
