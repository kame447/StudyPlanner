name: Temporary Issue52 Trash Toolbar Patch

on:
  push:
    branches:
      - fix/issue52-preview-overview-longpress
    paths:
      - '.github/workflows/tmp-issue52-trash-toolbar.yml'

permissions:
  contents: read

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue52-preview-overview-longpress
          fetch-depth: 1
          persist-credentials: false

      - name: Apply hit-test diagnostic patch
        run: |
          python .github/scripts/tmp_issue52_trash_toolbar.py
          python .github/scripts/tmp_issue52_overview_diag.py
          python .github/scripts/tmp_issue52_followup.py
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Build diagnostic candidate
        run: npm run build

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Diagnose overview hit-test layers
        run: ./tests/e2e/node_modules/.bin/playwright test tests/e2e/ai-planning-preview-item-removal.spec.mjs --config=tests/e2e/playwright.config.mjs --project=chromium --grep "default overview touch long press"

      - name: Upload diagnostic browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue52-overview-hit-test-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
