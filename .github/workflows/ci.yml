name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-trace-and-dialogue-final
          fetch-depth: 1
          show-progress: false
      - name: Normalize final audit code formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          candidate = Path('src/features/weeklyPlanning/intake/weeklyPlanningCandidateValidator.ts')
          text = candidate.read_text()
          start = text.index('interface PriorityRelation')
          end = text.index('function lifeConstraintKindGrounded', start)
          block = '''interface PriorityRelation {
            before: string;
            after: string;
          }

          function explicitPriorityRelations(
            userText: string,
            knownFields: string[],
          ): PriorityRelation[] {
            const normalized = normalizedEvidence(userText);
            const relations: PriorityRelation[] = [];
            const keys = new Set<string>();
            const addRelation = (before: string, after: string) => {
              const key = `${before}\\u0000${after}`;
              if (before !== after && !keys.has(key)) {
                keys.add(key);
                relations.push({ before, after });
              }
            };

            for (let leftIndex = 0; leftIndex < knownFields.length; leftIndex += 1) {
              for (let rightIndex = leftIndex + 1; rightIndex < knownFields.length; rightIndex += 1) {
                const left = knownFields[leftIndex];
                const right = knownFields[rightIndex];
                const leftPattern = escapeRegExp(normalizedEvidence(left));
                const rightPattern = escapeRegExp(normalizedEvidence(right));
                const leftBeforeRight = [
                  new RegExp(`${rightPattern}より(?:も)?${leftPattern}を?(?:先に|優先)`),
                  new RegExp(`${leftPattern}を?${rightPattern}より(?:も)?(?:先に|優先)`),
                  new RegExp(`${rightPattern}の(?:前|まえ)に${leftPattern}`),
                  new RegExp(`${leftPattern}の(?:後|あと)に${rightPattern}`),
                ].some((pattern) => pattern.test(normalized));
                const rightBeforeLeft = [
                  new RegExp(`${leftPattern}より(?:も)?${rightPattern}を?(?:先に|優先)`),
                  new RegExp(`${rightPattern}を?${leftPattern}より(?:も)?(?:先に|優先)`),
                  new RegExp(`${leftPattern}の(?:前|まえ)に${rightPattern}`),
                  new RegExp(`${rightPattern}の(?:後|あと)に${leftPattern}`),
                ].some((pattern) => pattern.test(normalized));

                if (leftBeforeRight && !rightBeforeLeft) addRelation(left, right);
                if (rightBeforeLeft && !leftBeforeRight) addRelation(right, left);
              }
            }
            return relations;
          }

          function applyPriorityRelations(
            mentionedFields: string[],
            relations: PriorityRelation[],
          ): string[] {
            const mentionedSet = new Set(mentionedFields);
            const outgoing = new Map<string, Set<string>>(
              mentionedFields.map((field) => [field, new Set<string>()]),
            );
            const indegree = new Map<string, number>(mentionedFields.map((field) => [field, 0]));

            relations.forEach(({ before, after }) => {
              if (!mentionedSet.has(before) || !mentionedSet.has(after)) return;
              const targets = outgoing.get(before);
              if (!targets || targets.has(after)) return;
              targets.add(after);
              indegree.set(after, (indegree.get(after) ?? 0) + 1);
            });

            const ordered: string[] = [];
            const selected = new Set<string>();
            while (ordered.length < mentionedFields.length) {
              const next = mentionedFields.find((field) =>
                !selected.has(field) && (indegree.get(field) ?? 0) === 0);
              if (!next) return mentionedFields;
              selected.add(next);
              ordered.push(next);
              outgoing.get(next)?.forEach((target) => {
                indegree.set(target, (indegree.get(target) ?? 0) - 1);
              });
            }
            return ordered;
          }

          function mentionedFieldOrder(userText: string, knownFields: string[]): string[] {
            const normalized = normalizedEvidence(userText);
            const mentionedFields = knownFields
              .map((field) => ({ field, index: normalized.indexOf(normalizedEvidence(field)) }))
              .filter((item) => item.index >= 0)
              .sort((left, right) => left.index - right.index)
              .map((item) => item.field);
            return applyPriorityRelations(
              mentionedFields,
              explicitPriorityRelations(userText, knownFields),
            );
          }

          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          candidate.write_text(text[:start] + block + text[end:])

          life = Path('src/features/weeklyPlanning/__tests__/weeklyPlanningLifeConstraintGrounding.audit.test.ts')
          text = life.read_text()
          start = text.index("  it('accepts explicitly written zero minutes")
          end = text.index('  it.each([', start)
          block = '''  it('accepts explicitly written zero minutes as the exact whole-hour range', () => {
            const result = validateInterpretedCandidates([
              sleepCandidate('23時00分から7時00分まで寝ます', '23:00', '07:00'),
            ], EMPTY_SUMMARY);

            expect(result.accepted).toHaveLength(1);
            expect(result.rejected).toEqual([]);
          });

          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          life.write_text(text[:start] + block + text[end:])

          hardening = Path('src/features/weeklyPlanning/__tests__/weeklyPlanningCandidateAuditHardening.test.ts')
          text = hardening.read_text()
          start = text.index("it('accepts comparative priority wording")
          end = text.rindex('\n});')
          block = '''  it('accepts comparative priority wording according to its semantic relation', () => {
            const userText = 'OSよりネットワークを先にして、最後にデータベースを進めたいです';
            const result = validateInterpretedCandidates([
              candidate({
                type: 'set_priority_policy',
                policy: { kind: 'field_first', order: ['ネットワーク', 'OS', 'データベース'] },
                confidence: 'high',
                sourceText: userText,
              }, userText),
            ], summary({ knownFields: ['OS', 'ネットワーク', 'データベース'] }));

            expect(result.accepted).toHaveLength(1);
            expect(result.rejected).toEqual([]);
          });

          it('rejects literal mention order when comparative wording requires the reverse relation', () => {
            const userText = 'OSよりネットワークを先にして、最後にデータベースを進めたいです';
            const result = validateInterpretedCandidates([
              candidate({
                type: 'set_priority_policy',
                policy: { kind: 'field_first', order: ['OS', 'ネットワーク', 'データベース'] },
                confidence: 'high',
                sourceText: userText,
              }, userText),
            ], summary({ knownFields: ['OS', 'ネットワーク', 'データベース'] }));

            expect(result.accepted).toEqual([]);
            expect(result.rejected).toHaveLength(1);
          });
          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          hardening.write_text(text[:start] + block + text[end:])

          api = Path('workers/ai-proxy/src/weeklyPlanningTraceApi.ts')
          text = api.read_text()
          start = text.index('  const safeEntries = safeWeeklyPlanningTraceDocumentsForAdmin(entries);')
          end = text.index('\n}\n\nasync function handleAdminArchive', start)
          block = '''  const safeEntries = safeWeeklyPlanningTraceDocumentsForAdmin(entries);
          if (isLegacySessionHandle) {
            safeEntries.forEach((entry) => {
              const sequence = entry.sequence;
              if (typeof sequence !== 'number'
                || !Number.isSafeInteger(sequence)
                || sequence < 0) {
                return;
              }
              entry.id = `${sessionId}-${String(sequence).padStart(8, '0')}`;
              entry.sessionId = sessionId;
            });
          }
          return ok({ entries: safeEntries });
          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          api.write_text(text[:start] + block + text[end:])

          privacy_test = Path('workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts')
          text = privacy_test.read_text()
          text = text.replace('\n\n\nconst SESSION_ID', '\n\nconst SESSION_ID')
          text = text.replace('''  return {
            id: SESSION_ID, logicalConversationId: CONVERSATION_ID, status: 'active',
            startedAt: OCCURRED_AT, lastActivityAt: OCCURRED_AT, turnCount: 1, entryCount: 1,
            hasPreview: false, hasApprovalFailure: false, hasFallback: false, hasError: false,
            appVersion: 'test', schemaVersion: 1, ...overrides,
          };'''.replace('          ', ''), '''  return {
            id: SESSION_ID,
            logicalConversationId: CONVERSATION_ID,
            status: 'active',
            startedAt: OCCURRED_AT,
            lastActivityAt: OCCURRED_AT,
            turnCount: 1,
            entryCount: 1,
            hasPreview: false,
            hasApprovalFailure: false,
            hasFallback: false,
            hasError: false,
            appVersion: 'test',
            schemaVersion: 1,
            ...overrides,
          };'''.replace('          ', ''))
          text = text.replace('''  return {
            id: `${SESSION_ID}-00000000`, sessionId: SESSION_ID,
            logicalConversationId: CONVERSATION_ID, sequence: 0,
            occurredAt: OCCURRED_AT, observedAt: OCCURRED_AT, schemaVersion: 1,
            kind: 'turn', role: 'user', content: 'hello', turnIndex: 0, ...overrides,
          };'''.replace('          ', ''), '''  return {
            id: `${SESSION_ID}-00000000`,
            sessionId: SESSION_ID,
            logicalConversationId: CONVERSATION_ID,
            sequence: 0,
            occurredAt: OCCURRED_AT,
            observedAt: OCCURRED_AT,
            schemaVersion: 1,
            kind: 'turn',
            role: 'user',
            content: 'hello',
            turnIndex: 0,
            ...overrides,
          };'''.replace('          ', ''))
          start = text.index("  it('prepares session and entry documents")
          end = text.index("  it('requires matching entry ownership", start)
          block = '''  it('prepares session and entry documents without raw account identifiers', async () => {
            const subject = await createWeeklyPlanningTraceSubject(
              'firebase-user-123',
              '100',
              { '100': 'a'.repeat(32) },
            );
            const prepared = prepareWeeklyPlanningTraceWrite({
              session: validSession({ userId: 'firebase-user-123' }),
              entries: [validTurnEntry({
                userId: 'firebase-user-123',
                content: 'person@example.com',
              })],
            }, subject, '2026-07-18T00:00:00.000Z');
            const output = serialized(prepared);

            expect(output).not.toContain('firebase-user-123');
            expect(output).not.toContain('person@example.com');
            expect(prepared.session.traceSubjectToken).toBe(subject.token);
            expect(prepared.entries[0].traceSubjectEpoch).toBe('100');
            expect(prepared.entries[0].policyVersion).toBe(WEEKLY_PLANNING_TRACE_POLICY_VERSION);
            expect(prepared.entries[0].expireAt).toBe('2027-01-14T00:00:00.000Z');
          });

          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          text = text[:start] + block + text[end:]
          start = text.index("  it('requires matching entry ownership")
          end = text.index("it('rejects missing or invalid session schema", start)
          block = '''  it('requires matching entry ownership and the current policy version', () => {
            expect(() => prepareWeeklyPlanningTraceWrite({
              session: validSession(),
              entries: [validTurnEntry({
                sessionId: 'weekly-trace-223e4567-e89b-12d3-a456-426614174000',
              })],
            }, { token: 'wpt_token', epoch: '100' })).toThrow(/session mismatch/);

            expect(isWeeklyPlanningTracePolicyAccepted({
              version: WEEKLY_PLANNING_TRACE_POLICY_VERSION,
              acceptedAt: '2026-07-18T00:00:00.000Z',
            })).toBe(true);
            expect(isWeeklyPlanningTracePolicyAccepted({
              version: 'old',
              acceptedAt: '2026-07-18T00:00:00.000Z',
            })).toBe(false);
          });

          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          text = text[:start] + block + text[end:]
          start = text.index("it('rejects missing or invalid session schema")
          end = text.rindex('\n});')
          block = '''  it('rejects missing or invalid session schema at the write boundary', () => {
            expect(() => prepareWeeklyPlanningTraceWrite({
              session: validSession({ status: 'unknown' }),
              entries: [validTurnEntry()],
            }, { token: 'wpt_token', epoch: '100' })).toThrow(/session schema/);
            expect(() => prepareWeeklyPlanningTraceWrite({
              session: validSession({ startedAt: 'not-a-date' }),
              entries: [validTurnEntry()],
            }, { token: 'wpt_token', epoch: '100' })).toThrow(/session schema/);
          });

          it.each([
            ['invalid turn role', { role: 'admin' }],
            ['non-string turn content', { content: 123 }],
            [
              'unknown internal event',
              { kind: 'internal_event', eventType: 'unknown', payload: {}, severity: 'info' },
            ],
            [
              'snapshot without state',
              { kind: 'state_snapshot', snapshotReason: 'manual_capture', state: undefined },
            ],
          ])('rejects %s at the server write boundary', (_label, overrides) => {
            expect(() => prepareWeeklyPlanningTraceWrite({
              session: validSession(),
              entries: [validTurnEntry(overrides)],
            }, { token: 'wpt_token', epoch: '100' })).toThrow(/entry/);
          });
          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          privacy_test.write_text(text[:start] + block + text[end:])
          PY
          git diff --check
      - name: Commit formatting cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/features/weeklyPlanning/intake/weeklyPlanningCandidateValidator.ts \
            src/features/weeklyPlanning/__tests__/weeklyPlanningLifeConstraintGrounding.audit.test.ts \
            src/features/weeklyPlanning/__tests__/weeklyPlanningCandidateAuditHardening.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceApi.ts \
            workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts
          git commit -m "feat: 最終監査修正の可読性を整える"
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
