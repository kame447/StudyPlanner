name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture restored lifecycle tests
        id: focused
        shell: bash
        run: |
          set +e
          npm run test:run -- \
            src/features/weeklyPlanning/application/weeklyPlanningApprovalAvailability.test.ts \
            src/features/weeklyPlanning/application/useWeeklyPlanningApplication.test.tsx \
            src/components/WeeklyPlanningQuickEntryModal.test.tsx \
            > restored-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload restored lifecycle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-lifecycle-test-log
          path: restored-test.log
      - name: Fail when focused tests failed
        if: steps.focused.outputs.status != '0'
        run: exit 1
