name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-trace-and-dialogue-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final non-M8 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit_block(path: str, start_marker: str, end_marker: str, replacements):
              file = Path(path)
              text = file.read_text()
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              block = text[start:end]
              for old, new, expected in replacements:
                  count = block.count(old)
                  if count != expected:
                      raise SystemExit(
                          f'{path}: {start_marker!r}: expected {expected} occurrences of {old!r}, found {count}'
                      )
                  block = block.replace(old, new)
              file.write_text(text[:start] + block + text[end:])

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence of {old!r}, found {count}')
              file.write_text(text.replace(old, new, 1))

          edit_block(
              'src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueManager.test.ts',
              "  it('asks missing info before considering ambiguity or draft creation'",
              "  it('plans only the next dependent missing slots instead of listing every missing item'",
              [
                  ("      requiredFields: ['fixed_events', 'sleep_cycle'],\n", "      requiredFields: ['fixed_events'],\n", 1),
                  ("        expect.objectContaining({ targetSlot: 'sleep_cycle', missing: ['sleep_cycle'] }),\n", '', 1),
              ],
          )

          pipeline = 'src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts'
          edit_block(
              pipeline,
              "  it.each([",
              "  it('connects a begin turn to a later period answer without re-asking the begin intent'",
              [("        expect.objectContaining({ targetSlot: 'tasks_or_goals', intent: 'ask_tasks_or_goals' }),\n", '', 1)],
          )
          edit_block(
              pipeline,
              "  it('connects a begin turn to a later period answer without re-asking the begin intent'",
              "  it('does not seed redundant begin slots when one turn already includes range and exam scope'",
              [("      expect.objectContaining({ targetSlot: 'tasks_or_goals' }),\n", '', 1)],
          )
          edit_block(
              pipeline,
              "  it('routes a pending next-week start utterance to start-date and learning-content questions'",
              "  it('classifies an uninterpretable first turn as an open planning dialogue'",
              [("      expect.objectContaining({ targetSlot: 'tasks_or_goals' }),\n", '', 1)],
          )
          edit_block(
              pipeline,
              "    it('documents the first-turn pipeline truthiness difference for setup-command legacy fallback'",
              "    it('legacy fallback removes tasks_or_goals missing after branch B fills first-turn setup tasks'",
              [
                  ("          'sleep_cycle',\n", '', 1),
                  ("          expect.objectContaining({ targetSlot: 'sleep_cycle', missing: ['sleep_cycle'] }),\n", '', 1),
              ],
          )
          edit_block(
              pipeline,
              "    it('legacy fallback removes tasks_or_goals missing after branch B fills first-turn setup tasks'",
              "    it('does not ask fixed events or sleep again after a compound turn fills both slots'",
              [("          'sleep_cycle',\n", '', 1)],
          )

          replace_once(
              'workers/ai-proxy/src/weeklyPlanningTraceApi.ts',
              '  return ok({ entries: safeWeeklyPlanningTraceDocumentsForAdmin(entries) });\n',
              """  const safeEntries = safeWeeklyPlanningTraceDocumentsForAdmin(entries);
          if (isLegacySessionHandle) {
            safeEntries.forEach((entry) => {
              const sequence = entry.sequence;
              if (typeof sequence !== 'number'
                || !Number.isSafeInteger(sequence)
                || sequence < 0) {
                return;
              }
              entry.id = `${sessionId}-${String(sequence).padStart(8, '0')}`;
              entry.sessionId = sessionId;
            });
          }
          return ok({ entries: safeEntries });
          """,
          )
          PY
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/pr68-finalize-non-m8.yml
      - name: Commit final fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml \
            .github/workflows/pr68-finalize-non-m8.yml \
            src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueManager.test.ts \
            src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceApi.ts
          git commit -m "feat: M-8以外の監査指摘修正を完了"
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run
      - name: TypeScript and production build
        run: npm run build
      - name: Check pull request diff
        run: git diff --check origin/main...HEAD
