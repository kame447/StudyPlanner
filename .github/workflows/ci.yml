name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-trace-and-dialogue-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final audit fixes except M-8
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new))

          candidate_path = 'src/features/weeklyPlanning/intake/weeklyPlanningCandidateValidator.ts'
          replace_once(candidate_path, r'''  if (minute === 0) {
            return new RegExp(`${hour}\\s*時(?!\\s*\\d+\\s*分)`).test(normalized)
              || new RegExp(`${String(hour).padStart(2, '0')}:00`).test(normalized);
          }
          ''', r'''  if (minute === 0) {
            return new RegExp(
              `${hour}\\s*時(?:\\s*0{1,2}\\s*分|(?!\\s*\\d+\\s*分))`,
            ).test(normalized)
              || new RegExp(`${String(hour).padStart(2, '0')}:00`).test(normalized);
          }
          ''')

          replace_once(candidate_path, r'''function mentionedFieldOrder(userText: string, knownFields: string[]): string[] {
            const normalized = normalizedEvidence(userText);
            return knownFields
              .map((field) => ({ field, index: normalized.indexOf(normalizedEvidence(field)) }))
              .filter((item) => item.index >= 0)
              .sort((left, right) => left.index - right.index)
              .map((item) => item.field);
          }
          ''', r'''interface PriorityRelation {
            before: string;
            after: string;
          }

          function explicitPriorityRelations(userText: string, knownFields: string[]): PriorityRelation[] {
            const normalized = normalizedEvidence(userText);
            const relations: PriorityRelation[] = [];
            const keys = new Set<string>();
            const addRelation = (before: string, after: string) => {
              const key = `${before}\u0000${after}`;
              if (before !== after && !keys.has(key)) {
                keys.add(key);
                relations.push({ before, after });
              }
            };

            for (let leftIndex = 0; leftIndex < knownFields.length; leftIndex += 1) {
              for (let rightIndex = leftIndex + 1; rightIndex < knownFields.length; rightIndex += 1) {
                const left = knownFields[leftIndex];
                const right = knownFields[rightIndex];
                const leftPattern = escapeRegExp(normalizedEvidence(left));
                const rightPattern = escapeRegExp(normalizedEvidence(right));
                const leftBeforeRight = [
                  new RegExp(`${rightPattern}より(?:も)?${leftPattern}を?(?:先に|優先)`),
                  new RegExp(`${leftPattern}を?${rightPattern}より(?:も)?(?:先に|優先)`),
                  new RegExp(`${rightPattern}の(?:前|まえ)に${leftPattern}`),
                  new RegExp(`${leftPattern}の(?:後|あと)に${rightPattern}`),
                ].some((pattern) => pattern.test(normalized));
                const rightBeforeLeft = [
                  new RegExp(`${leftPattern}より(?:も)?${rightPattern}を?(?:先に|優先)`),
                  new RegExp(`${rightPattern}を?${leftPattern}より(?:も)?(?:先に|優先)`),
                  new RegExp(`${leftPattern}の(?:前|まえ)に${rightPattern}`),
                  new RegExp(`${rightPattern}の(?:後|あと)に${leftPattern}`),
                ].some((pattern) => pattern.test(normalized));

                if (leftBeforeRight && !rightBeforeLeft) addRelation(left, right);
                if (rightBeforeLeft && !leftBeforeRight) addRelation(right, left);
              }
            }
            return relations;
          }

          function applyPriorityRelations(
            mentionedFields: string[],
            relations: PriorityRelation[],
          ): string[] {
            const mentionedSet = new Set(mentionedFields);
            const outgoing = new Map<string, Set<string>>(
              mentionedFields.map((field) => [field, new Set<string>()]),
            );
            const indegree = new Map<string, number>(mentionedFields.map((field) => [field, 0]));

            relations.forEach(({ before, after }) => {
              if (!mentionedSet.has(before) || !mentionedSet.has(after)) return;
              const targets = outgoing.get(before);
              if (!targets || targets.has(after)) return;
              targets.add(after);
              indegree.set(after, (indegree.get(after) ?? 0) + 1);
            });

            const ordered: string[] = [];
            const selected = new Set<string>();
            while (ordered.length < mentionedFields.length) {
              const next = mentionedFields.find((field) =>
                !selected.has(field) && (indegree.get(field) ?? 0) === 0);
              if (!next) return mentionedFields;
              selected.add(next);
              ordered.push(next);
              outgoing.get(next)?.forEach((target) => {
                indegree.set(target, (indegree.get(target) ?? 0) - 1);
              });
            }
            return ordered;
          }

          function mentionedFieldOrder(userText: string, knownFields: string[]): string[] {
            const normalized = normalizedEvidence(userText);
            const mentionedFields = knownFields
              .map((field) => ({ field, index: normalized.indexOf(normalizedEvidence(field)) }))
              .filter((item) => item.index >= 0)
              .sort((left, right) => left.index - right.index)
              .map((item) => item.field);
            return applyPriorityRelations(
              mentionedFields,
              explicitPriorityRelations(userText, knownFields),
            );
          }
          ''')

          life_test = Path('src/features/weeklyPlanning/__tests__/weeklyPlanningLifeConstraintGrounding.audit.test.ts')
          life_text = life_test.read_text()
          marker = "  it.each([\n"
          addition = r'''  it('accepts explicitly written zero minutes as the exact whole-hour range', () => {
            const result = validateInterpretedCandidates([
              sleepCandidate('23時00分から7時00分まで寝ます', '23:00', '07:00'),
            ], EMPTY_SUMMARY);

            expect(result.accepted).toHaveLength(1);
            expect(result.rejected).toEqual([]);
          });

          '''
          if 'accepts explicitly written zero minutes' not in life_text:
              if marker not in life_text:
                  raise SystemExit('life constraint test insertion point not found')
              life_test.write_text(life_text.replace(marker, addition + marker, 1))

          priority_test = Path('src/features/weeklyPlanning/__tests__/weeklyPlanningCandidateAuditHardening.test.ts')
          priority_text = priority_test.read_text()
          addition = r'''
            it('accepts comparative priority wording according to its semantic relation', () => {
              const userText = 'OSよりネットワークを先にして、最後にデータベースを進めたいです';
              const result = validateInterpretedCandidates([
                candidate({
                  type: 'set_priority_policy',
                  policy: { kind: 'field_first', order: ['ネットワーク', 'OS', 'データベース'] },
                  confidence: 'high',
                  sourceText: userText,
                }, userText),
              ], summary({ knownFields: ['OS', 'ネットワーク', 'データベース'] }));

              expect(result.accepted).toHaveLength(1);
              expect(result.rejected).toEqual([]);
            });

            it('rejects literal mention order when comparative wording requires the reverse relation', () => {
              const userText = 'OSよりネットワークを先にして、最後にデータベースを進めたいです';
              const result = validateInterpretedCandidates([
                candidate({
                  type: 'set_priority_policy',
                  policy: { kind: 'field_first', order: ['OS', 'ネットワーク', 'データベース'] },
                  confidence: 'high',
                  sourceText: userText,
                }, userText),
              ], summary({ knownFields: ['OS', 'ネットワーク', 'データベース'] }));

              expect(result.accepted).toEqual([]);
              expect(result.rejected).toHaveLength(1);
            });
          '''
          if 'accepts comparative priority wording' not in priority_text:
              head, separator, tail = priority_text.rpartition('\n});')
              if not separator:
                  raise SystemExit('priority test insertion point not found')
              priority_test.write_text(head + addition + separator + tail)

          privacy_path = 'workers/ai-proxy/src/weeklyPlanningTracePrivacy.ts'
          privacy_helpers = r'''const TRACE_SESSION_STATUSES = new Set(['active', 'completed', 'abandoned', 'failed']);
          const TRACE_RESPONSE_SOURCES = new Set(['ai', 'deterministic_fallback', 'rules', 'system']);
          const TRACE_EVENT_TYPES = new Set([
            'user_turn_received',
            'interpreter_started',
            'interpreter_completed',
            'candidate_accepted',
            'candidate_rejected',
            'assumption_proposed',
            'assumption_accepted',
            'assumption_rejected',
            'assumption_superseded',
            'correction_applied',
            'correction_rejected',
            'relative_constraint_resolved',
            'relative_constraint_rejected',
            'readiness_evaluated',
            'feasibility_evaluated',
            'dialogue_planned',
            'fallback_used',
            'preview_gate_evaluated',
            'preview_generated',
            'preview_rejected_stale',
            'preview_rejected_pending_assumption',
            'draft_promoted',
            'approval_started',
            'approval_item_saved',
            'approval_item_failed',
            'approval_completed',
            'request_cancelled',
            'stale_async_result_discarded',
            'trace_write_failed',
          ]);
          const TRACE_SEVERITIES = new Set(['debug', 'info', 'warn', 'error']);
          const TRACE_SNAPSHOT_REASONS = new Set([
            'turn_completed',
            'correction_applied',
            'preview_generated',
            'approval_started',
            'approval_completed',
            'error',
            'manual_capture',
          ]);

          function isIsoTimestamp(value: unknown): value is string {
            if (typeof value !== 'string') return false;
            const time = new Date(value).getTime();
            return Number.isFinite(time) && new Date(time).toISOString() === value;
          }

          function isNonNegativeInteger(value: unknown): value is number {
            return typeof value === 'number' && Number.isSafeInteger(value) && value >= 0;
          }

          function requireTraceSessionSchema(session: Record<string, unknown>): void {
            const valid = TRACE_SESSION_STATUSES.has(String(session.status))
              && isIsoTimestamp(session.startedAt)
              && isIsoTimestamp(session.lastActivityAt)
              && (session.endedAt === undefined || isIsoTimestamp(session.endedAt))
              && (session.archivedAt === undefined || isIsoTimestamp(session.archivedAt))
              && (session.planningRangeStart === undefined || isIsoTimestamp(session.planningRangeStart))
              && (session.planningRangeEnd === undefined || isIsoTimestamp(session.planningRangeEnd))
              && isNonNegativeInteger(session.turnCount)
              && typeof session.hasPreview === 'boolean'
              && typeof session.hasApprovalFailure === 'boolean'
              && typeof session.hasFallback === 'boolean'
              && typeof session.hasError === 'boolean'
              && typeof session.appVersion === 'string'
              && session.appVersion.trim().length > 0
              && typeof session.schemaVersion === 'number'
              && Number.isSafeInteger(session.schemaVersion)
              && session.schemaVersion >= 1;
            if (!valid) throw new Error('trace session schema is invalid');
          }

          function requireTraceEntrySchema(entry: Record<string, unknown>): void {
            const validBase = isIsoTimestamp(entry.occurredAt)
              && isIsoTimestamp(entry.observedAt)
              && typeof entry.schemaVersion === 'number'
              && Number.isSafeInteger(entry.schemaVersion)
              && entry.schemaVersion >= 1
              && (entry.requestId === undefined || typeof entry.requestId === 'string')
              && (entry.stateRevision === undefined || isNonNegativeInteger(entry.stateRevision));
            if (!validBase) throw new Error('trace entry schema is invalid');

            if (entry.kind === 'turn') {
              const validSource = TRACE_RESPONSE_SOURCES.has(String(entry.responseSource));
              const validTurn = (entry.role === 'user' || entry.role === 'assistant')
                && typeof entry.content === 'string'
                && isNonNegativeInteger(entry.turnIndex)
                && (entry.role === 'assistant' ? validSource : entry.responseSource === undefined);
              if (!validTurn) throw new Error('trace turn entry schema is invalid');
              return;
            }

            if (entry.kind === 'internal_event') {
              const validEvent = Object.prototype.hasOwnProperty.call(entry, 'payload')
                && entry.payload !== undefined
                && TRACE_EVENT_TYPES.has(String(entry.eventType))
                && TRACE_SEVERITIES.has(String(entry.severity));
              if (!validEvent) throw new Error('trace internal event entry schema is invalid');
              return;
            }

            if (entry.kind === 'state_snapshot') {
              const validSnapshot = Object.prototype.hasOwnProperty.call(entry, 'state')
                && entry.state !== undefined
                && TRACE_SNAPSHOT_REASONS.has(String(entry.snapshotReason));
              if (!validSnapshot) throw new Error('trace state snapshot entry schema is invalid');
              return;
            }

            throw new Error('trace entry kind is invalid');
          }

          '''
          privacy_file = Path(privacy_path)
          privacy_text = privacy_file.read_text()
          if 'function requireTraceSessionSchema' not in privacy_text:
              insertion = 'function preparedDocument(\n'
              if insertion not in privacy_text:
                  raise SystemExit('privacy helper insertion point not found')
              privacy_text = privacy_text.replace(insertion, privacy_helpers + insertion, 1)
          old = "  const entryCount = requireTraceEntryCount(input.session.entryCount);\n  const expireAt = weeklyPlanningTraceExpireAt(now);"
          new = "  const entryCount = requireTraceEntryCount(input.session.entryCount);\n  requireTraceSessionSchema(input.session);\n  const expireAt = weeklyPlanningTraceExpireAt(now);"
          if 'requireTraceSessionSchema(input.session);' not in privacy_text:
              if old not in privacy_text:
                  raise SystemExit('session schema call insertion point not found')
              privacy_text = privacy_text.replace(old, new, 1)
          old = r'''    if (entryConversationId !== logicalConversationId) {
              throw new Error('trace entry conversation mismatch');
            }
            return {
          '''
          new = r'''    if (entryConversationId !== logicalConversationId) {
              throw new Error('trace entry conversation mismatch');
            }
            requireTraceEntrySchema(entry);
            return {
          '''
          if 'requireTraceEntrySchema(entry);' not in privacy_text:
              if old not in privacy_text:
                  raise SystemExit('entry schema call insertion point not found')
              privacy_text = privacy_text.replace(old, new, 1)
          privacy_file.write_text(privacy_text)

          privacy_test = Path('workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts')
          test_text = privacy_test.read_text()
          helper_marker = "function serialized(value: unknown): string {\n  return JSON.stringify(value);\n}\n"
          helpers = r'''

          const SESSION_ID = 'weekly-trace-123e4567-e89b-12d3-a456-426614174000';
          const CONVERSATION_ID = 'weekly-conversation-323e4567-e89b-12d3-a456-426614174000';
          const OCCURRED_AT = '2026-07-18T00:00:00.000Z';

          function validSession(overrides: Record<string, unknown> = {}): Record<string, unknown> {
            return {
              id: SESSION_ID,
              logicalConversationId: CONVERSATION_ID,
              status: 'active',
              startedAt: OCCURRED_AT,
              lastActivityAt: OCCURRED_AT,
              turnCount: 1,
              entryCount: 1,
              hasPreview: false,
              hasApprovalFailure: false,
              hasFallback: false,
              hasError: false,
              appVersion: 'test',
              schemaVersion: 1,
              ...overrides,
            };
          }

          function validTurnEntry(overrides: Record<string, unknown> = {}): Record<string, unknown> {
            return {
              id: `${SESSION_ID}-00000000`,
              sessionId: SESSION_ID,
              logicalConversationId: CONVERSATION_ID,
              sequence: 0,
              occurredAt: OCCURRED_AT,
              observedAt: OCCURRED_AT,
              schemaVersion: 1,
              kind: 'turn',
              role: 'user',
              content: 'hello',
              turnIndex: 0,
              ...overrides,
            };
          }
          '''
          if 'function validSession' not in test_text:
              if helper_marker not in test_text:
                  raise SystemExit('privacy test helper insertion point not found')
              test_text = test_text.replace(helper_marker, helper_marker + helpers, 1)

          old = r'''      session: {
                id: 'weekly-trace-123e4567-e89b-12d3-a456-426614174000',
                userId: 'firebase-user-123',
                logicalConversationId: 'weekly-conversation-323e4567-e89b-12d3-a456-426614174000',
                status: 'active',
                entryCount: 1,
              },
              entries: [{
                id: 'weekly-trace-123e4567-e89b-12d3-a456-426614174000-00000000',
                sessionId: 'weekly-trace-123e4567-e89b-12d3-a456-426614174000',
                userId: 'firebase-user-123',
                logicalConversationId: 'weekly-conversation-323e4567-e89b-12d3-a456-426614174000',
                sequence: 0,
                kind: 'turn',
                content: 'person@example.com',
              }],
          '''
          new = r'''      session: validSession({ userId: 'firebase-user-123' }),
              entries: [validTurnEntry({
                userId: 'firebase-user-123',
                content: 'person@example.com',
              })],
          '''
          if old in test_text:
              test_text = test_text.replace(old, new, 1)

          old = r'''      session: {
                id: 'weekly-trace-123e4567-e89b-12d3-a456-426614174000',
                logicalConversationId: 'weekly-conversation-323e4567-e89b-12d3-a456-426614174000',
                entryCount: 1,
              },
              entries: [{
                id: 'weekly-trace-123e4567-e89b-12d3-a456-426614174000-00000000',
                sessionId: 'weekly-trace-223e4567-e89b-12d3-a456-426614174000',
                logicalConversationId: 'weekly-conversation-323e4567-e89b-12d3-a456-426614174000',
                sequence: 0,
              }],
          '''
          new = r'''      session: validSession(),
              entries: [validTurnEntry({
                sessionId: 'weekly-trace-223e4567-e89b-12d3-a456-426614174000',
              })],
          '''
          if old in test_text:
              test_text = test_text.replace(old, new, 1)

          additional_tests = r'''

            it('rejects missing or invalid session schema at the write boundary', () => {
              expect(() => prepareWeeklyPlanningTraceWrite({
                session: validSession({ status: 'unknown' }),
                entries: [validTurnEntry()],
              }, { token: 'wpt_token', epoch: '100' })).toThrow(/session schema/);

              expect(() => prepareWeeklyPlanningTraceWrite({
                session: validSession({ startedAt: 'not-a-date' }),
                entries: [validTurnEntry()],
              }, { token: 'wpt_token', epoch: '100' })).toThrow(/session schema/);
            });

            it.each([
              ['invalid turn role', { role: 'admin' }],
              ['non-string turn content', { content: 123 }],
              ['unknown internal event', {
                kind: 'internal_event',
                eventType: 'unknown',
                payload: {},
                severity: 'info',
              }],
              ['snapshot without state', {
                kind: 'state_snapshot',
                snapshotReason: 'manual_capture',
                state: undefined,
              }],
            ])('rejects %s at the server write boundary', (_label, overrides) => {
              expect(() => prepareWeeklyPlanningTraceWrite({
                session: validSession(),
                entries: [validTurnEntry(overrides)],
              }, { token: 'wpt_token', epoch: '100' })).toThrow(/entry/);
            });
          '''
          if 'rejects missing or invalid session schema' not in test_text:
              head, separator, tail = test_text.rpartition('\n});')
              if not separator:
                  raise SystemExit('privacy test final insertion point not found')
              test_text = head + additional_tests + separator + tail
          privacy_test.write_text(test_text)

          for path in ['focused-regressions.log', 'full-tests.log', 'full-build.log', 'full-diff.log']:
              file = Path(path)
              if file.exists():
                  file.unlink()

          canonical_ci = '''name: CI

          on:
            pull_request:
              branches:
                - main
              types:
                - opened
                - synchronize
                - reopened
                - ready_for_review
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - name: Install dependencies
                  run: npm ci
                - name: Run tests
                  run: npm run test:run
                - name: TypeScript and production build
                  run: npm run build
                - name: Check pull request diff
                  if: github.event_name == 'pull_request'
                  run: git diff --check origin/${{ github.base_ref }}...HEAD
          '''
          Path('.github/workflows/ci.yml').write_text(canonical_ci)
          PY
          git diff --check
      - name: Commit final audit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: M-8以外の監査残件を修正"
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run
      - name: TypeScript and production build
        run: npm run build
      - name: Check pull request diff
        run: git diff --check origin/main...HEAD
