name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-server-idempotency
          fetch-depth: 0
      - name: Remove duplicate identity helper
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.ts')
          text = path.read_text()
          marker = 'function resolveOperationItemIdentity(params: {'
          starts = [match.start() for match in re.finditer(re.escape(marker), text)]
          if len(starts) != 2:
            raise SystemExit(f'identity helper count was {len(starts)}')
          second_start = starts[1]
          retention_start = text.index('function retentionExpiry', second_start)
          path.write_text(text[:second_start] + text[retention_start:])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: patched-approval-repository
          path: src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture focused tests
        id: focused
        shell: bash
        run: |
          set +e
          npm run test:run -- \
            src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.test.ts \
            src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.recovery.test.ts \
            src/features/weeklyPlanning/application/weeklyPlanningApprovalApplication.serverCompletion.test.ts \
            src/hooks/usePlannerAppState.weeklyApproval.test.tsx \
            > operation-recovery-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: operation-recovery-test-log
          path: operation-recovery-tests.log
      - name: Fail when focused tests failed
        if: steps.focused.outputs.status != '0'
        run: exit 1
