name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run
      - name: TypeScript and production build
        run: npm run build
      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD

  apply-final-audit-fixes:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.ref == 'agent/fix-weekly-planning-trace-and-dialogue-final'
      && github.actor != 'github-actions[bot]'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-trace-and-dialogue-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused fixes
        run: python scripts/apply-final-audit-fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused regressions
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/__tests__/weeklyPlanningCandidateAuditHardening.test.ts
          src/features/weeklyPlanning/__tests__/weeklyPlanningFinalAuditRemainingFixes.test.ts
          workers/ai-proxy/src/weeklyPlanningTraceFirestore.integration.test.ts
          workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts
      - name: Run full verification
        run: |
          npm run test:run
          npm run build
          git diff --check
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: 最終監査の残指摘を修正する'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
