name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-trace-and-dialogue-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize audit EOF and restore CI
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/ai/audits/20260720-pr68-final/auditors/auditor-1.md')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml docs/ai/audits/20260720-pr68-final/auditors/auditor-1.md
          git commit -m "feat: 監査資料の末尾空行を修正"
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run
      - name: TypeScript and production build
        run: npm run build
      - name: Check pull request diff
        run: git diff --check origin/main...HEAD
