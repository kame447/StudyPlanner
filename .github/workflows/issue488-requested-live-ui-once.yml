name: Issue488 F1 Source-Supported Placement Control Once
on:
  push:
    branches: ['integration/issue488-timed-event-app']
    paths: ['.github/workflows/issue488-requested-live-ui-once.yml']
permissions:
  contents: read
concurrency:
  group: issue488-requested-live-ui-once
  cancel-in-progress: false
jobs:
  actual_ai_ui:
    if: >-
      ${{ github.event_name == 'push' && github.repository == 'kame447/StudyPlanner' &&
          github.actor == 'kame447' && github.run_attempt == 1 &&
          github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - pr: '572'
            source: 'df8a12ab4e4cb596c571a95e276c724a4eb70503'
            tree: '60483e5b559a45cf22d40facba0e94fbb3f59726'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ matrix.source }}
      SOURCE_TREE: ${{ matrix.tree }}
      CASE_PR: ${{ matrix.pr }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      WRANGLER_SEND_METRICS: 'false'
      TZ: Asia/Tokyo
      OPENAI_API_KEY: ''
      VITE_AI_API_KEY: ''
      VITE_CLOUDFLARE_AI_PROXY_URL: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact one-file test-only event
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/integration/issue488-timed-event-app
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git show -s --format=%P HEAD)" = 8f24a94404b90f97471db78ea659ff7629f4fa80
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = "$(printf 'A\t.github/workflows/issue488-requested-live-ui-once.yml')"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/live-audit"
          cp .github/workflows/issue488-requested-live-ui-once.yml "$RUNNER_TEMP/live-audit/executing-workflow.yml"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Install isolated dependencies without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          test "$(node -v)" = v22.23.0
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"
          npm ci
          npm install --prefix "$RUNNER_TEMP/live-pw" --no-save --package-lock=false @playwright/test@1.64.0
      - name: Prepare bounded browser test without invoking AI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          from pathlib import Path
          import base64,gzip,json,hashlib,os
          data=base64.b64decode('',validate=True)
          assert hashlib.sha256(data).hexdigest()=='40195f9b2c25da10412314dc2812f0a30c9e087bef2a956cc0c9a9e95814edce'
          files=json.loads(gzip.decompress(data));assert len(files)==7
          root=Path(os.environ['RUNNER_TEMP'])/'live-bundle';root.mkdir()
          for name,text in files.items():
              assert '/' not in name and '..' not in name and len(text)<100000
              (root/name).write_text(text)
          PYBUNDLE
          python3 "$RUNNER_TEMP/live-bundle/prepare.py"
          node --check "$RUNNER_TEMP/live-execution/live.spec.mjs"
      - name: Actual AI and browser acceptance - maximum four calls, no automatic retries
        id: acceptance
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          timeout -k 15s 360s node "$RUNNER_TEMP/live-pw/node_modules/@playwright/test/cli.js" test \
            --config "$RUNNER_TEMP/live-execution/playwright.config.mjs" \
            2>&1 | tee "$RUNNER_TEMP/live-audit/acceptance.log"
      - name: Preserve exact-source identity and synthetic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/live-execution/evidence" ]; then
            cp -R "$RUNNER_TEMP/live-execution/evidence" "$RUNNER_TEMP/live-audit/evidence"
          fi
          python3 - <<'PYIDENTITY'
          from pathlib import Path
          import os,json,hashlib,subprocess
          root=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['RUNNER_TEMP'])/'live-audit'
          before=out/'evidence/source-before.json'
          if not before.exists():
              (out/'preflight-incomplete.txt').write_text('No prepared source or API acceptance is claimed.\n')
              raise SystemExit(0)
          inputs=json.loads(before.read_text())
          changed=[name for name,h in inputs.items() if not (root/name).is_file() or hashlib.sha256((root/name).read_bytes()).hexdigest()!=h]
          status=subprocess.check_output(['git','status','--porcelain'],text=True)
          result={'unchanged':not changed and not status.strip(),'changedPaths':changed,'gitStatus':status,'productionFirestoreUsed':False,'syntheticLocalOnly':True}
          (out/'source-integrity.json').write_text(json.dumps(result,indent=2))
          assert result['unchanged']
          summary=out/'evidence/observations.json'
          if summary.exists():
              value=json.loads(summary.read_text());print(json.dumps({k:value.get(k) for k in ['pr','source','status','officialApiCalls','terminalError']}))
          PYIDENTITY
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue488-requested-live-pr${{ matrix.pr }}-${{ github.run_id }}
          path: ${{ runner.temp }}/live-audit/
          if-no-files-found: error
          retention-days: 7
