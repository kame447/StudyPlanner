name: Weekly Planning Completion-Based Evaluation

on:
  workflow_dispatch:
    inputs:
      execute_action:
        description: Actually execute the selected evaluation action
        required: true
        default: false
        type: boolean
      action:
        description: Advance the evaluation by one explicit application action
        required: true
        default: submit_turn
        type: choice
        options:
          - submit_turn
          - promote_preview
          - approve_drafts
      user_text:
        description: User utterance for submit_turn; ignored by deterministic actions
        required: false
        type: string
      previous_run_id:
        description: Previous run ID whose checkpoint artifact should be restored; leave empty only for the first submit_turn
        required: false
        type: string
      conversation_id:
        description: Stable logical conversation ID; required for the first submit_turn
        type: string
        required: false
      owner_id:
        description: Evaluation owner ID; required for the first submit_turn
        required: false
        default: resumable-real-api-observation-user
        type: string
      week_start_date:
        description: Monday date in YYYY-MM-DD; required for the first submit_turn
        required: false
        type: string
      selected_date:
        description: Selected date in YYYY-MM-DD; required for the first submit_turn
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: weekly-planning-completion-${{ inputs.conversation_id || inputs.previous_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare-and-optionally-advance-evaluation:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      OUTPUT_DIR: artifacts/weekly-planning-resumable-conversation
      ARTIFACT_NAME: weekly-planning-resumable-conversation

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore previous checkpoint artifact
        if: ${{ inputs.previous_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
        run: |
          mkdir -p previous-artifact
          gh run download "$PREVIOUS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir previous-artifact
          test -f previous-artifact/checkpoint.json

      - name: Validate evaluation inputs without calling API
        env:
          ACTION: ${{ inputs.action }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          CONVERSATION_ID: ${{ inputs.conversation_id }}
          OWNER_ID: ${{ inputs.owner_id }}
          WEEK_START_DATE: ${{ inputs.week_start_date }}
          SELECTED_DATE: ${{ inputs.selected_date }}
          USER_TEXT: ${{ inputs.user_text }}
        run: |
          case "$ACTION" in
            submit_turn)
              test -n "$USER_TEXT"
              if [ -n "$PREVIOUS_RUN_ID" ]; then
                test -f previous-artifact/checkpoint.json
              else
                test -n "$CONVERSATION_ID"
                test -n "$OWNER_ID"
                echo "$WEEK_START_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
                echo "$SELECTED_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
              fi
              ;;
            promote_preview|approve_drafts)
              test -n "$PREVIOUS_RUN_ID"
              test -f previous-artifact/checkpoint.json
              ;;
            *)
              echo "Unsupported action: $ACTION" >&2
              exit 1
              ;;
          esac

      - name: Typecheck evaluation implementation
        run: npm run typecheck

      - name: Stop before evaluation execution
        if: ${{ !inputs.execute_action }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          cat > "$OUTPUT_DIR/readiness.md" <<EOF
          # Completion-based evaluation readiness

          Status: ready_without_execution
          Action: ${{ inputs.action }}

          This run validated checkout, dependencies, inputs, optional checkpoint download, and TypeScript compilation.
          No StudyPlanner action and no OpenAI API request were executed.
          EOF

      - name: Verify API credential for a conversation turn
        if: ${{ inputs.execute_action && inputs.action == 'submit_turn' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Advance completion-based evaluation by one action
        if: ${{ inputs.execute_action }}
        env:
          WEEKLY_PLANNING_RESUMABLE_EVALUATION_ACTION: '1'
          WEEKLY_PLANNING_RESUMABLE_ACTION: ${{ inputs.action }}
          WEEKLY_PLANNING_RESUMABLE_REAL_API_TURN: ${{ inputs.action == 'submit_turn' && '1' || '0' }}
          WEEKLY_PLANNING_RESUMABLE_USER_TEXT: ${{ inputs.user_text }}
          WEEKLY_PLANNING_RESUMABLE_CHECKPOINT_PATH: ${{ inputs.previous_run_id != '' && 'previous-artifact/checkpoint.json' || '' }}
          WEEKLY_PLANNING_RESUMABLE_OUTPUT_DIR: artifacts/weekly-planning-resumable-conversation
          WEEKLY_PLANNING_RESUMABLE_OWNER_ID: ${{ inputs.owner_id }}
          WEEKLY_PLANNING_RESUMABLE_CONVERSATION_ID: ${{ inputs.conversation_id }}
          WEEKLY_PLANNING_RESUMABLE_WEEK_START_DATE: ${{ inputs.week_start_date }}
          WEEKLY_PLANNING_RESUMABLE_SELECTED_DATE: ${{ inputs.selected_date }}
          WEEKLY_PLANNING_RESUMABLE_TEST_TIMEOUT_MS: '60000'
          VITE_AI_PROVIDER: openai
          VITE_AI_BASE_URL: https://api.openai.com/v1
          VITE_AI_MODEL: gpt-5.6-luna
          VITE_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VITE_AI_MAX_PROCESS_REQUESTS: '4'
          VITE_AI_EVAL_CAPTURE_METRICS: '1'
          VITE_CLOUDFLARE_AI_PROXY_URL: ''
        run: |
          mkdir -p "$OUTPUT_DIR"
          set -o pipefail
          npm run observe:weekly-ai:conversation:turn 2>&1 | tee "$OUTPUT_DIR/ai-request-metrics.log"

      - name: Summarize AI request metrics
        if: ${{ always() && inputs.execute_action }}
        run: |
          if [ -f "$OUTPUT_DIR/ai-request-metrics.log" ]; then
            node scripts/summarize-ai-eval-metrics.mjs \
              "$OUTPUT_DIR/ai-request-metrics.log" \
              "$OUTPUT_DIR/ai-request-metrics-summary.json"
          fi

      - name: Record evaluation completion
        if: always()
        run: echo "Evaluation details, the next required action, and AI request metrics are available in the uploaded artifact."

      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-planning-resumable-conversation
          path: artifacts/weekly-planning-resumable-conversation/
          if-no-files-found: error
          retention-days: 30
