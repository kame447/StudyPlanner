name: Deploy Firestore rules once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-firestore-rules-once.yml

permissions:
  contents: write

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Resolve Firebase credentials
        id: firebase-auth
        shell: bash
        env:
          FIREBASE_TOKEN_VALUE: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_VALUE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_SERVICE_ACCOUNT_VALUE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUDY_PLANNER_D1BC8 }}
          FIREBASE_COMPACT_SERVICE_ACCOUNT_VALUE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUDYPLANNER }}
          GOOGLE_CREDENTIALS_JSON_VALUE: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GCP_SA_KEY_VALUE: ${{ secrets.GCP_SA_KEY }}
        run: |
          service_account="${FIREBASE_PROJECT_SERVICE_ACCOUNT_VALUE:-${FIREBASE_SERVICE_ACCOUNT_VALUE:-${FIREBASE_COMPACT_SERVICE_ACCOUNT_VALUE:-${GOOGLE_CREDENTIALS_JSON_VALUE:-${GCP_SA_KEY_VALUE:-}}}}}"
          if [ -n "$service_account" ]; then
            printf '%s' "$service_account" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
            echo "mode=service-account" >> "$GITHUB_OUTPUT"
          elif [ -n "$FIREBASE_TOKEN_VALUE" ]; then
            echo "FIREBASE_TOKEN=$FIREBASE_TOKEN_VALUE" >> "$GITHUB_ENV"
            echo "mode=token" >> "$GITHUB_OUTPUT"
          else
            echo "mode=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Firestore rules
        id: deploy
        if: steps.install.outcome == 'success' && steps.firebase-auth.outputs.mode != 'missing'
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ steps.firebase-auth.outputs.mode }}" = "token" ]; then
            npx firebase-tools deploy --only firestore:rules --project study-planner-d1bc8 --non-interactive --token "$FIREBASE_TOKEN"
          else
            npx firebase-tools deploy --only firestore:rules --project study-planner-d1bc8 --non-interactive
          fi

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTH_MODE: ${{ steps.firebase-auth.outputs.mode }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ "$INSTALL_OUTCOME" != "success" ]; then
            status="install_failed"
          elif [ "$AUTH_MODE" = "missing" ]; then
            status="missing_credentials"
          elif [ "$DEPLOY_OUTCOME" = "success" ]; then
            status="success"
          else
            status="deploy_failed"
          fi
          cat > .github/deploy-firestore-result.json <<EOF
          {
            "status": "$status",
            "project": "study-planner-d1bc8",
            "sourceCommit": "$GITHUB_SHA",
            "authMode": "$AUTH_MODE",
            "installOutcome": "$INSTALL_OUTCOME",
            "deployOutcome": "$DEPLOY_OUTCOME",
            "recordedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/deploy-firestore-result.json
          git commit -m "feat: Firestoreデプロイ結果を記録"
          git push origin HEAD:main
