name: Weekly Planning Natural Dialogue Targeted

on:
  push:
    branches:
      - agent/weekly-ai-conversation-eval
    paths:
      - .github/workflows/weekly-planning-natural-dialogue-targeted.yml

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-ai-conversation-eval
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b --pretty false
      - name: Run targeted regressions
        run: >-
          npx vitest run
          src/features/weeklyPlanning/semantic/weeklyPlanningRecurrenceConsistencyV5.test.ts
          src/features/weeklyPlanning/__tests__/weeklyPlanningPromptGeneralizationV5.test.ts
          src/features/weeklyPlanning/dialogue/weeklyPlanningStableV5AiDialogueRenderer.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.test.ts
