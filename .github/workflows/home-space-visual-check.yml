name: Home Space Visual Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render-home-space-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install isolated Playwright
        run: npm install --prefix /tmp/home-space-render --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: /tmp/home-space-render/node_modules/.bin/playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        shell: bash
        run: |
          npm run preview:vite -- --host 127.0.0.1 --port 4173 > /tmp/home-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/home-preview.log
          exit 1

      - name: Render one-plan and four-plan matrices
        shell: bash
        run: |
          mkdir -p artifacts
          cat > /tmp/home-space-render/render.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';

          const viewports = [
            ['320x568', 320, 568],
            ['360x640', 360, 640],
            ['375x667', 375, 667],
            ['390x844', 390, 844],
            ['393x852', 393, 852],
            ['412x915', 412, 915],
            ['430x932', 430, 932],
            ['511x1094', 511, 1094],
            ['768x710', 768, 710],
            ['1024x768', 1024, 768],
          ];

          const browser = await chromium.launch({ headless: true });
          const allMetrics = [];

          for (const planCount of [1, 4]) {
            for (const [name, width, height] of viewports) {
              const page = await browser.newPage({ viewport: { width, height } });
              await page.addInitScript(({ count }) => {
                const today = new Date().toISOString().slice(0, 10);
                const now = new Date().toISOString();
                const user = {
                  id: 'space-render-user',
                  email: 'space-render@example.com',
                  username: 'space-render-user',
                  avatar: '',
                  createdAt: now,
                };
                const slots = [
                  ['20:10', '20:40'],
                  ['20:50', '21:20'],
                  ['21:30', '22:00'],
                  ['22:10', '22:40'],
                ];
                const plans = Array.from({ length: count }, (_, index) => ({
                  id: `space-plan-${index + 1}`,
                  seriesId: `space-plan-${index + 1}`,
                  userId: user.id,
                  title: `情報資源総論 ${index + 1}`,
                  subject: '情報科学',
                  type: 'study',
                  date: today,
                  startTime: slots[index]?.[0] ?? '22:50',
                  endTime: slots[index]?.[1] ?? '23:20',
                  memo: '',
                  recurrence: null,
                  createdAt: now,
                  updatedAt: now,
                }));
                const material = {
                  id: 'space-material',
                  userId: user.id,
                  name: '基本情報技術者テキスト',
                  subjectId: 'space-subject',
                  subjectName: '情報科学',
                  status: 'active',
                  progressUnit: 'page',
                  totalUnits: 500,
                  currentUnit: 120,
                  createdAt: now,
                  updatedAt: now,
                };
                localStorage.setItem('studyplanner.users', JSON.stringify([user]));
                localStorage.setItem('studyplanner.session', user.id);
                localStorage.setItem('studyplanner.plans', JSON.stringify(plans));
                localStorage.setItem('studyplanner.actuals', '[]');
                localStorage.setItem('studyplanner.todos.v1', '[]');
                localStorage.setItem('studyplanner.studyMaterials.v1', JSON.stringify([material]));
              }, { count: planCount });

              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              await page.locator('.home-dashboard-default').waitFor();
              await page.waitForTimeout(700);

              const metrics = await page.evaluate(() => {
                const visible = (element) => {
                  const style = getComputedStyle(element);
                  const rect = element.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
                };
                const nav = document.querySelector('.home-bottom-nav');
                const core = document.querySelector('.home-core-sections');
                const materialPanels = [...document.querySelectorAll('.home-material-panel')].filter(visible);
                const material = materialPanels[0] ?? null;
                const lastCore = core?.lastElementChild ?? null;
                const navTop = nav?.getBoundingClientRect().top ?? 0;
                const lastVisibleBottom = material?.getBoundingClientRect().bottom ?? lastCore?.getBoundingClientRect().bottom ?? 0;
                const schedule = document.querySelector('.home-schedule-list');
                const nextMeta = document.querySelector('.home-next-meta');
                const startButton = document.querySelector('.home-start-button');
                return {
                  bottomGap: navTop - lastVisibleBottom,
                  materialCount: materialPanels.length,
                  scheduleClientHeight: schedule?.clientHeight ?? 0,
                  scheduleScrollHeight: schedule?.scrollHeight ?? 0,
                  nextMetaBottom: nextMeta?.getBoundingClientRect().bottom ?? null,
                  startButtonTop: startButton?.getBoundingClientRect().top ?? null,
                  pageScrollHeight: document.documentElement.scrollHeight,
                  viewportHeight: document.documentElement.clientHeight,
                };
              });

              allMetrics.push({ planCount, name, width, height, ...metrics });
              await page.screenshot({ path: `artifacts/${planCount}plan-${name}.png`, fullPage: true });
              await page.close();
            }
          }

          fs.writeFileSync('artifacts/metrics.json', JSON.stringify(allMetrics, null, 2));
          await browser.close();
          NODE
          node /tmp/home-space-render/render.mjs

      - name: Upload matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-space-matrix-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
