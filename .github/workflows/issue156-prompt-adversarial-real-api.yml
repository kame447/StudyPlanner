name: Issue 156 Prompt Adversarial Real API

on:
  push:
    branches:
      - agent/issue156-prompt-simplification-adversarial-audit
    paths:
      - '.github/workflows/issue156-prompt-adversarial-real-api.yml'
      - 'src/features/weeklyPlanning/evals/weeklyPlanningIssue156AdversarialRealApi.observation.test.ts'
      - 'src/features/weeklyPlanning/evals/weeklyPlanningIssue156TypedRendererMatrix.observation.test.ts'
      - 'src/features/weeklyPlanning/dialogue/**'
      - 'src/features/weeklyPlanning/semantic/**'
      - 'src/features/weeklyPlanning/application/**'
      - '.github/issue156-real-api-trigger.json'

permissions:
  contents: read

jobs:
  adversarial-real-api:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      WEEKLY_PLANNING_ISSUE156_REAL_API: '1'
      WEEKLY_PLANNING_ISSUE156_OUTPUT_DIR: artifacts/issue156-real-api
      WEEKLY_PLANNING_ISSUE156_TIMEOUT_MS: '420000'
      VITE_AI_PROVIDER: openai
      VITE_AI_BASE_URL: https://api.openai.com/v1
      VITE_AI_MODEL: gpt-5.6-luna
      VITE_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VITE_AI_MAX_PROCESS_REQUESTS: '120'
      VITE_AI_EVAL_CAPTURE_METRICS: '1'
      VITE_CLOUDFLARE_AI_PROXY_URL: ''

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify API credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Typecheck
        run: npm run typecheck

      - name: Run adversarial real API audit
        run: |
          mkdir -p "$WEEKLY_PLANNING_ISSUE156_OUTPUT_DIR"
          set -o pipefail
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs run \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156AdversarialRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156TypedRendererMatrix.observation.test.ts \
            2>&1 | tee "$WEEKLY_PLANNING_ISSUE156_OUTPUT_DIR/run.log"

      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue156-prompt-adversarial-real-api
          path: artifacts/issue156-real-api/
          if-no-files-found: warn
          retention-days: 30
