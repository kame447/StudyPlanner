name: One-shot Phase 7 branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-cleanup-phase7-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and delete merged Phase 7 branch
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/product-observability-phase7-log-explorer'
          expected='dee8790eabd040dfe97b80c5ed0b5663198be24a'
          actual="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [ -z "$actual" ]; then
            echo "Branch already absent: $branch"
          elif [ "$actual" != "$expected" ]; then
            echo "Refusing to delete $branch: expected $expected, found $actual" >&2
            exit 1
          else
            git push origin --delete "$branch"
          fi
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          rm .github/workflows/tmp-cleanup-phase7-branch.yml
          git add .github/workflows/tmp-cleanup-phase7-branch.yml
          git commit -m 'chore: remove one-shot Phase 7 branch cleanup workflow'
          git push origin HEAD:main
