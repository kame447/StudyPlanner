name: PR68 stage2 trace invariants

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr68-stage2-runner.yml]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply trace invariant fixes
        run: python3 scripts/pr68_stage2_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run trace tests
        run: npm run test:run -- workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts workers/ai-proxy/src/weeklyPlanningTraceStructuralIds.test.ts workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts
      - name: Run full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Commit trace fixes to the existing branch
        run: |
          rm -f scripts/pr68_stage2_fix.py .github/workflows/pr68-stage2-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: traceの構造不変条件を強制'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
