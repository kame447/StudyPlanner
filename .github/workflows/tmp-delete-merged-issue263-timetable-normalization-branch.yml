name: One-shot merged timetable-normalization branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-delete-merged-issue263-timetable-normalization-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merged branch target
        run: |
          git fetch origin refactor/issue263-timetable-normalization-owner
          test "$(git rev-parse origin/refactor/issue263-timetable-normalization-owner)" = "66c25dac895790d9297cd323bfd148bf2a286ab2"
          git merge-base --is-ancestor de7ceae839398922d709378706c48cdc7cbb9dc9 origin/main
          test "$(git rev-parse origin/refactor/issue263-timetable-normalization-owner^{tree})" = "$(git rev-parse de7ceae839398922d709378706c48cdc7cbb9dc9^{tree})"
      - name: Delete explicit merged branch
        run: git push origin --delete -- refactor/issue263-timetable-normalization-owner
