name: PR68 stage1 fulltest debug

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr68-stage1-fulltest-debug.yml]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture full test failure
        shell: bash
        run: |
          git worktree add /tmp/pr68-stage1 HEAD
          set +e
          cd /tmp/pr68-stage1
          python3 scripts/pr68_stage1_fix_wrapper.py > /tmp/pr68-stage1-patch.txt 2>&1
          patch_status=$?
          if [ "$patch_status" -eq 0 ]; then
            npm ci > /tmp/pr68-stage1-install.txt 2>&1
            install_status=$?
          else
            install_status=99
          fi
          if [ "$patch_status" -eq 0 ] && [ "$install_status" -eq 0 ]; then
            npm run test:run > /tmp/pr68-stage1-fulltest.txt 2>&1
            test_status=$?
          else
            test_status=99
          fi
          cd "$GITHUB_WORKSPACE"
          cp /tmp/pr68-stage1-patch.txt pr68-stage1-patch.txt
          cp /tmp/pr68-stage1-install.txt pr68-stage1-install.txt 2>/dev/null || true
          cp /tmp/pr68-stage1-fulltest.txt pr68-stage1-fulltest.txt 2>/dev/null || true
          printf '\npatch_status=%s\ninstall_status=%s\ntest_status=%s\n' "$patch_status" "$install_status" "$test_status" >> pr68-stage1-fulltest.txt
          rm .github/workflows/pr68-stage1-fulltest-debug.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pr68-stage1-patch.txt pr68-stage1-install.txt pr68-stage1-fulltest.txt .github/workflows/pr68-stage1-fulltest-debug.yml
          git commit -m 'feat: 敵対的入力修正の全体テスト診断を記録'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
