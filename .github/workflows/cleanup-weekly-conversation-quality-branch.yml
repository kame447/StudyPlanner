name: Cleanup merged weekly conversation quality branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-weekly-conversation-quality-branch.yml

permissions:
  contents: write

jobs:
  delete-merged-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete allowlisted merged branch
        shell: bash
        run: |
          set -euo pipefail
          target='agent/weekly-conversation-quality-luna-audit'
          test "$target" != 'main'
          git push origin --delete -- "$target"
