# Diagnostic only: measurements do not constitute native acceptance.
name: Material Stable Wait Diagnostic
permissions:
  contents: read
concurrency:
  group: desktop-four-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  related-native:
    if: github.repository == 'kame447/StudyPlanner'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - project: cross
          timeout: 35
          browsers: webkit
    env:
      CI: 'true'
      SOURCE_SHA: 5dfcb11f624c13775947e9fd2d14952b7e17ab3d
      SOURCE_TREE: 4870e76c1a8820d6fe6aad519bcac34463658a78
      PROOF_WORKFLOW_SHA: ${{ github.sha }}
      PROOF_PROJECT: ${{ matrix.project }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 5dfcb11f624c13775947e9fd2d14952b7e17ab3d
        fetch-depth: 1
        persist-credentials: false
    - name: Verify immutable application source
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        test "$(git rev-parse ''HEAD^{tree}'')" = "$SOURCE_TREE"

        mkdir -p artifacts/desktop-four-proof

        printf ''{"sourceSha":"%s","sourceTree":"%s","workflowSha":"%s","project":"%s"}\n'' "$SOURCE_SHA" "$SOURCE_TREE"
        "$PROOF_WORKFLOW_SHA" "$PROOF_PROJECT" > artifacts/desktop-four-proof/source.json

        git ls-files -z src tests/e2e package.json package-lock.json .node-version vite.config.mjs index.html public/fonts
        | xargs -0 sha256sum > artifacts/desktop-four-proof/inputs.sha256

        '
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: npm
    - name: Install application dependencies
      run: npm ci
    - name: Snapshot application manifests before isolated test-runner install
      shell: bash
      run: sha256sum package.json package-lock.json > /tmp/studyplanner-manifests.sha256
    - name: Install existing pinned Playwright
      run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.64.0
      shell: bash
    - name: Verify isolated test-runner install did not mutate application manifests
      shell: bash
      run: sha256sum -c /tmp/studyplanner-manifests.sha256
    - name: Install existing project browsers
      run: ./tests/e2e/node_modules/.bin/playwright install --with-deps ${{ matrix.browsers }}
    - name: Build production bundle
      run: npm run build
      id: build
      env:
        DEV_LAN_HOST: 127.0.0.1
    - name: Generate only reviewed diagnostic inputs
      shell: bash
      run: "set -euo pipefail\ntest \"$(sha256sum tests/e2e/bookshelf-surface.spec.mjs | cut -d ' ' -f1)\" = \"\
        1a3293101b00ed9c0bcc482a6fe8187bb12d77a0a94dfd062470117222e4f810\"\ntest ! -e tests/e2e/material-frame-diagnostic.spec.mjs\n\
        cat > tests/e2e/material-frame-diagnostic.spec.mjs <<'REVIEWED_DIAGNOSTIC_0'\nimport { performance as nodePerformance\
        \ } from 'node:perf_hooks';\nimport { expect, test } from './support/fixed-clock.mjs';\n\nasync function\
        \ seedBookshelf(page) {\n  await page.addInitScript(() => {\n    if (localStorage.getItem('bookshelf-surface-seeded'))\
        \ return;\n    localStorage.setItem('bookshelf-surface-seeded', 'true');\n    const today = new Date().toLocaleDateString('sv-SE');\n\
        \    const tomorrowDate = new Date(`${today}T00:00:00`);\n    tomorrowDate.setDate(tomorrowDate.getDate()\
        \ + 1);\n    const tomorrow = [\n      tomorrowDate.getFullYear(),\n      String(tomorrowDate.getMonth()\
        \ + 1).padStart(2, '0'),\n      String(tomorrowDate.getDate()).padStart(2, '0'),\n    ].join('-');\n   \
        \ const now = new Date().toISOString();\n    const user = {\n      id: 'bookshelf-e2e-user',\n      email:\
        \ 'bookshelf-e2e@example.com',\n      username: 'bookshelf-e2e',\n      avatar: '',\n      createdAt: now,\n\
        \    };\n    const subject = {\n      id: 'bookshelf-e2e-subject',\n      userId: user.id,\n      name:\
        \ '\u60C5\u5831\u79D1\u5B66',\n      color: '#2f6fc2',\n      createdAt: now,\n      updatedAt: now,\n \
        \   };\n    const material = {\n      id: 'bookshelf-e2e-material',\n      userId: user.id,\n      name:\
        \ '\u30A2\u30EB\u30B4\u30EA\u30BA\u30E0\u554F\u984C\u96C6',\n      subjectId: subject.id,\n      subjectName:\
        \ subject.name,\n      color: subject.color,\n      status: 'active',\n      paceEnabled: true,\n      progressUnit:\
        \ 'page',\n      totalUnits: 200,\n      currentUnit: 80,\n      targetDate: tomorrow,\n      createdAt:\
        \ now,\n      updatedAt: now,\n    };\n    const secondMaterial = {\n      ...material,\n      id: 'bookshelf-e2e-material-2',\n\
        \      name: '\u30CD\u30C3\u30C8\u30EF\u30FC\u30AF\u6F14\u7FD2',\n      currentUnit: 30,\n    };\n    const\
        \ plan = {\n      id: 'bookshelf-e2e-plan',\n      seriesId: 'bookshelf-e2e-plan',\n      userId: user.id,\n\
        \      title: '\u30A2\u30EB\u30B4\u30EA\u30BA\u30E0\u554F\u984C\u96C6\u3092\u9032\u3081\u308B',\n      subject:\
        \ subject.name,\n      date: tomorrow,\n      startTime: '19:00',\n      endTime: '20:00',\n      repeat:\
        \ 'none',\n      repeatUntil: null,\n      excludedDates: [],\n      recurrenceRules: [],\n      type: 'study',\n\
        \      memo: '',\n      sourceType: 'manual',\n      materialId: material.id,\n      materialName: material.name,\n\
        \      createdAt: now,\n      updatedAt: now,\n    };\n    const actual = {\n      id: 'bookshelf-e2e-actual',\n\
        \      userId: user.id,\n      planId: null,\n      occurrenceDate: today,\n      actualStartTime: '18:00',\n\
        \      actualEndTime: '18:45',\n      title: '\u30A2\u30EB\u30B4\u30EA\u30BA\u30E0\u6F14\u7FD2',\n     \
        \ subject: subject.name,\n      isAlignedToPlan: false,\n      note: '\u52D5\u7684\u8A08\u753B\u6CD5\u3092\
        \u5FA9\u7FD2',\n      updatedAt: now,\n      materialId: material.id,\n      materialName: material.name,\n\
        \      materialProgressUpdates: [\n        {\n          materialId: material.id,\n          progressUnit:\
        \ 'page',\n          progressUnitLabel: '\u30DA\u30FC\u30B8',\n          fromUnit: 60,\n          toUnit:\
        \ 80,\n          deltaUnits: 20,\n        },\n      ],\n    };\n\n    localStorage.setItem('studyplanner.users',\
        \ JSON.stringify([user]));\n    localStorage.setItem('studyplanner.session', user.id);\n    localStorage.setItem('studyplanner.plans',\
        \ JSON.stringify([plan]));\n    localStorage.setItem('studyplanner.actuals', JSON.stringify([actual]));\n\
        \    localStorage.setItem('studyplanner.todos.v1', '[]');\n    localStorage.setItem('studyplanner.studySubjects.v1',\
        \ JSON.stringify([subject]));\n    localStorage.setItem(\n      'studyplanner.studyMaterials.v1',\n    \
        \  JSON.stringify([material, secondMaterial]),\n    );\n    localStorage.setItem(\n      `studyplanner:material-detail:v1:${user.id}:${material.id}`,\n\
        \      JSON.stringify({\n        structureEnabled: true,\n        structureVisible: true,\n        favorite:\
        \ true,\n        structureItems: [\n          { id: 'structure-1', title: '\u57FA\u790E\u7DE8', startUnit:\
        \ 0, endUnit: 100 },\n          { id: 'structure-2', title: '\u5FDC\u7528\u7DE8', startUnit: 100, endUnit:\
        \ 200 },\n        ],\n      }),\n    );\n  });\n}\n\nasync function openBookshelf(page) {\n  await page.goto('/');\n\
        \  await expect(page.locator('.primary-bottom-nav')).toBeVisible();\n  await page\n    .locator('.primary-bottom-nav\
        \ button')\n    .filter({ hasText: '\u6559\u6750' })\n    .click();\n  await expect(page.locator('.bookshelf-view')).toBeVisible();\n\
        }\n\n// Diagnostic only: compare a static control with the existing seeded app.\n// Passing this file does\
        \ not accept any material editing/persistence contract.\nasync function materialFrameSnapshot(control) {\n\
        \  return control.evaluate(element => {\n    const rect = e => { const r = e.getBoundingClientRect(); return\
        \ { x: r.x, y: r.y, width: r.width, height: r.height }; };\n    const ancestors = [];\n    for (let node\
        \ = element; node; node = node.parentElement) {\n      const css = getComputedStyle(node);\n      ancestors.push({\
        \ tag: node.tagName, className: node.className, rect: rect(node),\n        animationName: css.animationName,\
        \ animationDuration: css.animationDuration,\n        transitionProperty: css.transitionProperty, transitionDuration:\
        \ css.transitionDuration,\n        transform: css.transform, scrollBehavior: css.scrollBehavior });\n  \
        \  }\n    const animations = document.getAnimations().map(animation => {\n      const effect = animation.effect;\n\
        \      const timing = effect?.getComputedTiming();\n      const target = effect?.target;\n      return {\
        \ playState: animation.playState, currentTime: String(animation.currentTime),\n        targetTag: target?.tagName\
        \ ?? null, targetClass: target?.className ?? null,\n        duration: String(timing?.duration), progress:\
        \ timing?.progress ?? null };\n    });\n    return { width: innerWidth, height: innerHeight, dpr: devicePixelRatio,\n\
        \      visibility: document.visibilityState, focused: document.hasFocus(),\n      reducedMotion: matchMedia('(prefers-reduced-motion:\
        \ reduce)').matches,\n      coarsePointer: matchMedia('(pointer: coarse)').matches,\n      rootFont: getComputedStyle(document.documentElement).fontSize,\n\
        \      motionAttribute: document.documentElement.getAttribute('data-motion'),\n      theme: document.documentElement.getAttribute('data-theme'),\n\
        \      appearance: document.documentElement.getAttribute('data-appearance'),\n      domElementCount: document.querySelectorAll('*').length,\
        \ styleSheetCount: document.styleSheets.length,\n      target: rect(element), ancestors, animations };\n\
        \  });\n}\n\nasync function sampleMaterialPageFrames(control) {\n  // This is page-world rAF under the flowing\
        \ fixed clock. It is supplemental\n  // to Node elapsed time and the utility-world stable waits retained\
        \ in trace.\n  return control.evaluate(element => new Promise(resolve => {\n    const frames = [];\n   \
        \ const sample = timestamp => {\n      const rect = element.getBoundingClientRect();\n      frames.push({\
        \ timestamp, pagePerformanceNow: performance.now(),\n        visibility: document.visibilityState,\n   \
        \     rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height } });\n      if (frames.length\
        \ === 4) resolve(frames);\n      else requestAnimationFrame(sample);\n    };\n    requestAnimationFrame(sample);\n\
        \  }));\n}\n\ntest.describe('material frame diagnostic', () => {\n  test.use({ viewport: { width: 1920,\
        \ height: 1080 }, screen: { width: 1920, height: 1080 },\n    contextOptions: { reducedMotion: 'reduce'\
        \ } });\n  for (const surface of ['static-control', 'seeded-material-application']) {\n    test(`compares\
        \ normal actionability on ${surface}`, async ({ page }, testInfo) => {\n      const diagnostics = { surface,\
        \ comparisonPurpose: 'Diagnostic only; no release acceptance',\n        clockScope: 'Existing flowing fixed-clock\
        \ fixture; page-world rAF and utility-world trace are distinct',\n        startedAt: new Date().toISOString(),\
        \ phases: [], trials: [] };\n      let failure;\n      const timed = async (name, work) => {\n        const\
        \ start = nodePerformance.now();\n        try { return await work(); }\n        finally { diagnostics.phases.push({\
        \ name, nodeElapsedMs: nodePerformance.now() - start }); }\n      };\n      try {\n        await page.addInitScript(()\
        \ => {\n          localStorage.setItem('study-planner-appearance', 'pixel');\n          localStorage.setItem('study-planner-theme-mode',\
        \ 'light');\n        });\n        let control;\n        await timed('setup', async () => {\n          if\
        \ (surface === 'static-control') {\n            await page.route('**/__material-frame-diagnostic-static',\
        \ route => route.fulfill({\n              status: 200, contentType: 'text/html; charset=utf-8',\n      \
        \        body: '<!doctype html><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\
        ><title>Static material actionability control</title><style>html,body{margin:0;min-height:100%;background:#f5f5f5}button{position:fixed;left:calc(50%\
        \ - 100px);bottom:10px;width:200px;height:60px;font:16px sans-serif;transition:none;animation:none}</style><button\
        \ type=\"button\">\u6559\u6750</button>'\n            }));\n            await page.goto('/__material-frame-diagnostic-static');\n\
        \            control = page.getByRole('button', { name: '\u6559\u6750', exact: true });\n          } else\
        \ {\n            await seedBookshelf(page);\n            await openBookshelf(page);\n            control\
        \ = page.locator('.primary-bottom-nav button').filter({ hasText: '\u6559\u6750' });\n          }\n     \
        \     await expect(control).toBeVisible();\n          await page.evaluate(() => document.fonts.ready);\n\
        \        });\n        diagnostics.initial = await materialFrameSnapshot(control);\n        expect(diagnostics.initial.width).toBe(1920);\
        \ expect(diagnostics.initial.height).toBe(1080);\n        expect(diagnostics.initial.dpr).toBe(3); expect(diagnostics.initial.reducedMotion).toBe(true);\n\
        \        expect(diagnostics.initial.visibility).toBe('visible');\n        diagnostics.beforeFrames = await\
        \ timed('page-world-raf-before', () => sampleMaterialPageFrames(control));\n        for (let index = 0;\
        \ index < 3; index++) {\n          const trial = { index, before: await materialFrameSnapshot(control) };\n\
        \          diagnostics.trials.push(trial);\n          const start = nodePerformance.now();\n          try\
        \ { await control.click({ trial: true }); trial.completed = true; }\n          catch (error) { trial.error\
        \ = String(error); throw error; }\n          finally { trial.nodeElapsedMs = nodePerformance.now() - start;\
        \ }\n          trial.after = await materialFrameSnapshot(control);\n        }\n        diagnostics.afterFrames\
        \ = await timed('page-world-raf-after', () => sampleMaterialPageFrames(control));\n        diagnostics.final\
        \ = await materialFrameSnapshot(control);\n        await testInfo.attach(`diagnostic-${surface}-surface`,\
        \ {\n          body: await timed('explicit-screenshot-after-measurement', () => page.screenshot({ scale:\
        \ 'css' })), contentType: 'image/png' });\n      } catch (error) { failure = error; diagnostics.error =\
        \ String(error); }\n      try { await testInfo.attach(`diagnostic-${surface}-timings`, { body: JSON.stringify(diagnostics),\
        \ contentType: 'application/json' }); }\n      catch (error) { throw failure ?? error; }\n      if (failure)\
        \ throw failure;\n    });\n  }\n});\nREVIEWED_DIAGNOSTIC_0\nprintf '%s  %s\\n' '8f3b8f641776829eb56566f6c0e65e20aa7014e39a1acd53a7c77b24f3b9dfb4'\
        \ 'tests/e2e/material-frame-diagnostic.spec.mjs' | sha256sum -c -\ncp tests/e2e/material-frame-diagnostic.spec.mjs\
        \ artifacts/desktop-four-proof/material-frame-diagnostic.spec.mjs\ntest ! -e tests/e2e/material-frame-diagnostic.config.mjs\n\
        cat > tests/e2e/material-frame-diagnostic.config.mjs <<'REVIEWED_DIAGNOSTIC_1'\nimport { defineConfig }\
        \ from '@playwright/test';\nimport crossBrowserConfig from './playwright.cross-browser.config.mjs';\n\n\
        const mobileProject = crossBrowserConfig.projects.find(project => project.name === 'webkit-mobile');\nif\
        \ (!mobileProject) throw new Error('Expected existing webkit-mobile project');\n\n// QA-only diagnostic.\
        \ Keep production config and actionability settings intact;\n// retain successful traces so utility-world\
        \ stable waits can be compared.\nexport default defineConfig({\n  ...crossBrowserConfig,\n  use: { ...crossBrowserConfig.use,\
        \ trace: 'on' },\n  projects: [{ ...mobileProject, testMatch: '**/material-frame-diagnostic.spec.mjs' }],\n\
        });\nREVIEWED_DIAGNOSTIC_1\nprintf '%s  %s\\n' '23558f52de2faf36fa7b6ecd00d612d7092d5d64a1c2625c80c69443ff9778f3'\
        \ 'tests/e2e/material-frame-diagnostic.config.mjs' | sha256sum -c -\ncp tests/e2e/material-frame-diagnostic.config.mjs\
        \ artifacts/desktop-four-proof/material-frame-diagnostic.config.mjs\nsha256sum tests/e2e/material-frame-diagnostic.spec.mjs\
        \ tests/e2e/material-frame-diagnostic.config.mjs > artifacts/desktop-four-proof/diagnostic-inputs.sha256\n\
        git diff --exit-code\n"
    - name: Write exact reviewed collection admission
      id: admission
      shell: bash
      run: "cat > artifacts/desktop-four-proof/run-selected.mjs <<'NODE'\nimport assert from 'node:assert/strict';\n\
        import crypto from 'node:crypto';\nimport fs from 'node:fs';\nimport { spawnSync } from 'node:child_process';\n\
        const selected = {\n  \"cross\": {\n    \"count\": 2,\n    \"sha256\": \"30a5aea077cc8222b76abca319356ff762d68183ae41494cc57382feef40ca4c\"\
        ,\n    \"projects\": [\n      \"webkit-mobile\"\n    ],\n    \"args\": [\n      \"test\",\n      \"--config=tests/e2e/material-frame-diagnostic.config.mjs\"\
        ,\n      \"--project=webkit-mobile\",\n      \"(^|/)material-frame-diagnostic\\\\.spec\\\\.mjs$\"\n    ]\n\
        \  }\n};\nconst mode = process.argv[2];\nconst expected = selected[mode];\nassert.ok(expected, 'Unknown\
        \ proof selection');\nconst prefix = `artifacts/desktop-four-proof/${mode}`;\nfs.writeFileSync(`${prefix}-arguments.json`,\
        \ JSON.stringify(expected.args, null, 2));\nconst collectionProcess = spawnSync('./tests/e2e/node_modules/.bin/playwright',\
        \ [...expected.args, '--list', '--reporter=json'], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 });\n\
        fs.writeFileSync(`${prefix}-collection.json`, collectionProcess.stdout ?? '');\nassert.equal(collectionProcess.status,\
        \ 0, collectionProcess.stderr || String(collectionProcess.error));\nconst collection = JSON.parse(collectionProcess.stdout);\n\
        assert.deepEqual(collection.errors, []);\nconst identities = new Set();\nfunction visit(suite, parents =\
        \ []) {\n  const titles = [...parents, suite.title];\n  for (const spec of suite.specs ?? []) for (const\
        \ test of spec.tests) {\n    assert.ok(expected.projects.includes(test.projectName), 'Unexpected project');\n\
        \    const identity = JSON.stringify([test.projectName, spec.file, ...titles, spec.title]);\n    assert.ok(!identities.has(identity),\
        \ `Duplicate case: ${identity}`);\n    identities.add(identity);\n  }\n  for (const child of suite.suites\
        \ ?? []) visit(child, titles);\n}\nfor (const suite of collection.suites) visit(suite);\nassert.equal(identities.size,\
        \ expected.count);\nconst sha256 = crypto.createHash('sha256').update(JSON.stringify([...identities].sort())).digest('hex');\n\
        assert.equal(sha256, expected.sha256, 'Selected identities differ from review');\nfs.writeFileSync(`${prefix}-selection.json`,\
        \ JSON.stringify({ mode, count: identities.size, sha256 }, null, 2));\nconst run = spawnSync('./tests/e2e/node_modules/.bin/playwright',\
        \ expected.args, { stdio: 'inherit' });\nif (run.error) throw run.error;\nprocess.exit(run.status ?? 1);\n\
        NODE\n"
    - name: Measure only two diagnostic conditions
      shell: bash
      run: node artifacts/desktop-four-proof/run-selected.mjs "$PROOF_PROJECT"
    - name: Upload source proof, results and screenshot attachments
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: material-frame-diagnostic-${{ matrix.project }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: 'artifacts/desktop-four-proof/

          artifacts/playwright-results/

          artifacts/playwright-report/

          artifacts/playwright-results.json

          artifacts/playwright-cross-browser-results/

          artifacts/playwright-cross-browser-report/

          artifacts/playwright-cross-browser-results.json


          '
        if-no-files-found: error
        retention-days: 14
'on':
  push:
    branches:
    - test/desktop-four-acceptance
    paths:
    - .github/workflows/desktop-four-acceptance.yml
