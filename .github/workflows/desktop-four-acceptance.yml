# Read-only bounded diagnostic; success is measurement completion, not acceptance.
name: Material DPR Frame Diagnostic
permissions:
  contents: read
concurrency:
  group: desktop-four-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  related-native:
    if: github.repository == 'kame447/StudyPlanner'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - project: cross
          timeout: 35
          browsers: webkit
    env:
      CI: 'true'
      SOURCE_SHA: 5dfcb11f624c13775947e9fd2d14952b7e17ab3d
      SOURCE_TREE: 4870e76c1a8820d6fe6aad519bcac34463658a78
      PROOF_WORKFLOW_SHA: ${{ github.sha }}
      PROOF_PROJECT: ${{ matrix.project }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 5dfcb11f624c13775947e9fd2d14952b7e17ab3d
        fetch-depth: 1
        persist-credentials: false
    - name: Verify immutable application source
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
        mkdir -p artifacts/desktop-four-proof
        printf '{"sourceSha":"%s","sourceTree":"%s","workflowSha":"%s","project":"%s"}\n' "$SOURCE_SHA" "$SOURCE_TREE" "$PROOF_WORKFLOW_SHA" "$PROOF_PROJECT" > artifacts/desktop-four-proof/source.json
        git ls-files -z src tests/e2e package.json package-lock.json .node-version vite.config.mjs index.html public/fonts | xargs -0 sha256sum > artifacts/desktop-four-proof/inputs.sha256
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: npm
    - name: Install application dependencies
      run: npm ci
    - name: Snapshot application manifests before isolated test-runner install
      shell: bash
      run: sha256sum package.json package-lock.json > /tmp/studyplanner-manifests.sha256
    - name: Install existing pinned Playwright
      run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.64.0
      shell: bash
    - name: Verify isolated test-runner install did not mutate application manifests
      shell: bash
      run: sha256sum -c /tmp/studyplanner-manifests.sha256
    - name: Install existing project browsers
      run: ./tests/e2e/node_modules/.bin/playwright install --with-deps ${{ matrix.browsers }}
    - name: Build production bundle
      run: npm run build
      id: build
      env:
        DEV_LAN_HOST: 127.0.0.1
    - name: Generate only reviewed diagnostic inputs
      shell: bash
      run: |
        set -euo pipefail
        test "$(sha256sum tests/e2e/bookshelf-surface.spec.mjs | cut -d ' ' -f1)" = "1a3293101b00ed9c0bcc482a6fe8187bb12d77a0a94dfd062470117222e4f810"
        test ! -e tests/e2e/material-frame-diagnostic.spec.mjs
        cat > tests/e2e/material-frame-diagnostic.spec.mjs <<'REVIEWED_DIAGNOSTIC_0'
        import { performance as nodePerformance } from 'node:perf_hooks';
        import { expect, test } from './support/fixed-clock.mjs';

        async function seedBookshelf(page) {
          await page.addInitScript(() => {
            if (localStorage.getItem('bookshelf-surface-seeded')) return;
            localStorage.setItem('bookshelf-surface-seeded', 'true');
            const today = new Date().toLocaleDateString('sv-SE');
            const tomorrowDate = new Date(`${today}T00:00:00`);
            tomorrowDate.setDate(tomorrowDate.getDate() + 1);
            const tomorrow = [
              tomorrowDate.getFullYear(),
              String(tomorrowDate.getMonth() + 1).padStart(2, '0'),
              String(tomorrowDate.getDate()).padStart(2, '0'),
            ].join('-');
            const now = new Date().toISOString();
            const user = {
              id: 'bookshelf-e2e-user',
              email: 'bookshelf-e2e@example.com',
              username: 'bookshelf-e2e',
              avatar: '',
              createdAt: now,
            };
            const subject = {
              id: 'bookshelf-e2e-subject',
              userId: user.id,
              name: '情報科学',
              color: '#2f6fc2',
              createdAt: now,
              updatedAt: now,
            };
            const material = {
              id: 'bookshelf-e2e-material',
              userId: user.id,
              name: 'アルゴリズム問題集',
              subjectId: subject.id,
              subjectName: subject.name,
              color: subject.color,
              status: 'active',
              paceEnabled: true,
              progressUnit: 'page',
              totalUnits: 200,
              currentUnit: 80,
              targetDate: tomorrow,
              createdAt: now,
              updatedAt: now,
            };
            const secondMaterial = {
              ...material,
              id: 'bookshelf-e2e-material-2',
              name: 'ネットワーク演習',
              currentUnit: 30,
            };
            const plan = {
              id: 'bookshelf-e2e-plan',
              seriesId: 'bookshelf-e2e-plan',
              userId: user.id,
              title: 'アルゴリズム問題集を進める',
              subject: subject.name,
              date: tomorrow,
              startTime: '19:00',
              endTime: '20:00',
              repeat: 'none',
              repeatUntil: null,
              excludedDates: [],
              recurrenceRules: [],
              type: 'study',
              memo: '',
              sourceType: 'manual',
              materialId: material.id,
              materialName: material.name,
              createdAt: now,
              updatedAt: now,
            };
            const actual = {
              id: 'bookshelf-e2e-actual',
              userId: user.id,
              planId: null,
              occurrenceDate: today,
              actualStartTime: '18:00',
              actualEndTime: '18:45',
              title: 'アルゴリズム演習',
              subject: subject.name,
              isAlignedToPlan: false,
              note: '動的計画法を復習',
              updatedAt: now,
              materialId: material.id,
              materialName: material.name,
              materialProgressUpdates: [
                {
                  materialId: material.id,
                  progressUnit: 'page',
                  progressUnitLabel: 'ページ',
                  fromUnit: 60,
                  toUnit: 80,
                  deltaUnits: 20,
                },
              ],
            };

            localStorage.setItem('studyplanner.users', JSON.stringify([user]));
            localStorage.setItem('studyplanner.session', user.id);
            localStorage.setItem('studyplanner.plans', JSON.stringify([plan]));
            localStorage.setItem('studyplanner.actuals', JSON.stringify([actual]));
            localStorage.setItem('studyplanner.todos.v1', '[]');
            localStorage.setItem('studyplanner.studySubjects.v1', JSON.stringify([subject]));
            localStorage.setItem(
              'studyplanner.studyMaterials.v1',
              JSON.stringify([material, secondMaterial]),
            );
            localStorage.setItem(
              `studyplanner:material-detail:v1:${user.id}:${material.id}`,
              JSON.stringify({
                structureEnabled: true,
                structureVisible: true,
                favorite: true,
                structureItems: [
                  { id: 'structure-1', title: '基礎編', startUnit: 0, endUnit: 100 },
                  { id: 'structure-2', title: '応用編', startUnit: 100, endUnit: 200 },
                ],
              }),
            );
          });
        }

        async function openBookshelf(page) {
          await page.goto('/');
          await expect(page.locator('.primary-bottom-nav')).toBeVisible();
          await page
            .locator('.primary-bottom-nav button')
            .filter({ hasText: '教材' })
            .click();
          await expect(page.locator('.bookshelf-view')).toBeVisible();
        }

        // Diagnostic only: compare DPR3/1 with the same preserved-native frame observer.
        // Passing this file does not accept any material editing/persistence contract.
        async function materialFrameSnapshot(control) {
          return control.evaluate(element => {
            const rect = e => { const r = e.getBoundingClientRect(); return { x: r.x, y: r.y, width: r.width, height: r.height }; };
            const ancestors = [];
            for (let node = element; node; node = node.parentElement) {
              const css = getComputedStyle(node);
              ancestors.push({ tag: node.tagName, className: node.className, rect: rect(node),
                animationName: css.animationName, animationDuration: css.animationDuration,
                transitionProperty: css.transitionProperty, transitionDuration: css.transitionDuration,
                transform: css.transform, scrollBehavior: css.scrollBehavior });
            }
            const animations = document.getAnimations().map(animation => {
              const effect = animation.effect;
              const timing = effect?.getComputedTiming();
              const target = effect?.target;
              return { playState: animation.playState, currentTime: String(animation.currentTime),
                targetTag: target?.tagName ?? null, targetClass: target?.className ?? null,
                duration: String(timing?.duration), progress: timing?.progress ?? null };
            });
            return { width: innerWidth, height: innerHeight, dpr: devicePixelRatio,
              visibility: document.visibilityState, focused: document.hasFocus(),
              reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
              coarsePointer: matchMedia('(pointer: coarse)').matches,
              rootFont: getComputedStyle(document.documentElement).fontSize,
              motionAttribute: document.documentElement.getAttribute('data-motion'),
              theme: document.documentElement.getAttribute('data-theme'),
              appearance: document.documentElement.getAttribute('data-appearance'),
              domElementCount: document.querySelectorAll('*').length, styleSheetCount: document.styleSheets.length,
              target: rect(element), ancestors, animations };
          });
        }

        async function sampleMaterialPageFrames(control) {
          // This is page-world rAF under the flowing fixed clock. It is supplemental
          // to Node elapsed time and the utility-world stable waits retained in trace.
          return control.evaluate(element => new Promise(resolve => {
            const frames = [];
            const sample = timestamp => {
              const rect = element.getBoundingClientRect();
              frames.push({ timestamp, pagePerformanceNow: performance.now(),
                visibility: document.visibilityState,
                rect: { x: rect.x, y: rect.y, width: rect.width, height: rect.height } });
              if (frames.length === 4) resolve(frames);
              else requestAnimationFrame(sample);
            };
            requestAnimationFrame(sample);
          }));
        }

        async function observeMaterialFrameOrigin(control, origin) {
          return control.evaluate((element, selectedOrigin) => new Promise((resolve, reject) => {
            try {
              if (!['page', 'native'].includes(selectedOrigin)) throw new Error('Unknown observer origin');
              const saved = globalThis.__pwClock?.builtins;
              const pageRaf = globalThis.requestAnimationFrame;
              const pagePerformance = globalThis.performance;
              if (!saved || typeof saved.requestAnimationFrame !== 'function'
                || typeof saved.performance?.now !== 'function' || typeof saved.Date !== 'function'
                || typeof pageRaf !== 'function' || typeof pagePerformance?.now !== 'function'
                || saved.requestAnimationFrame === pageRaf || saved.performance === pagePerformance
                || saved.Date === globalThis.Date || globalThis.Date.isFake !== true || saved.Date.isFake === true) {
                throw new Error('Expected distinct preserved native and installed page clock APIs');
              }
              const nativeRaf = saved.requestAnimationFrame;
              const requestFrame = selectedOrigin === 'native' ? nativeRaf : pageRaf.bind(globalThis);
              const readClocks = () => ({ nativePerformanceNow: saved.performance.now(),
                pagePerformanceNow: pagePerformance.now() });
              const observation = { origin: selectedOrigin,
                validity: { preservedRafDistinct: true, preservedPerformanceDistinct: true,
                  preservedDateDistinct: true, installedDateIsFake: true },
                nativeTimeOrigin: saved.performance.timeOrigin, pageTimeOrigin: pagePerformance.timeOrigin,
                registered: readClocks(), frames: [] };
              const requireFinite = values => {
                if (!values.every(Number.isFinite)) throw new Error('Non-finite observer clock');
              };
              requireFinite([observation.nativeTimeOrigin, observation.pageTimeOrigin,
                ...Object.values(observation.registered)]);
              const sample = timestamp => {
                try {
                  if (globalThis.__pwClock?.builtins !== saved || saved.requestAnimationFrame !== nativeRaf
                    || globalThis.requestAnimationFrame !== pageRaf || globalThis.performance !== pagePerformance) {
                    throw new Error('Observer clock identities changed during measurement');
                  }
                  const clocks = readClocks();
                  const r = element.getBoundingClientRect();
                  requireFinite([timestamp, ...Object.values(clocks), r.x, r.y, r.width, r.height]);
                  observation.frames.push({ callbackTimestamp: timestamp, ...clocks,
                    visibility: document.visibilityState, connected: element.isConnected,
                    rect: { x: r.x, y: r.y, width: r.width, height: r.height } });
                  if (observation.frames.length === 2) resolve(observation);
                  else requestFrame(sample);
                } catch (error) { reject(error); }
              };
              requestFrame(sample);
            } catch (error) { reject(error); }
          }), origin);
        }

        async function observeInitialMaterialNavigation(control, origin, diagnostics) {
          const pair = { observerOrigin: origin, nodeTimeOrigin: nodePerformance.timeOrigin };
          diagnostics.initialNavigationPair = pair;
          // Dispatch both without waiting for observer completion. The trace and both
          // Node intervals establish ordering; they do not equate main/utility worlds.
          const observer = (async () => {
            pair.observerNodeStart = nodePerformance.now();
            try { pair.observation = await observeMaterialFrameOrigin(control, origin); }
            catch (error) { pair.observerError = String(error); throw error; }
            finally { pair.observerNodeEnd = nodePerformance.now(); }
          })();
          const click = (async () => {
            pair.clickNodeStart = nodePerformance.now();
            try { await control.click(); pair.clickCompleted = true; }
            catch (error) { pair.clickError = String(error); throw error; }
            finally { pair.clickNodeEnd = nodePerformance.now(); }
          })();
          const [observerResult, clickResult] = await Promise.allSettled([observer, click]);
          pair.nodeIntervalsOverlap = Math.max(pair.observerNodeStart, pair.clickNodeStart)
            <= Math.min(pair.observerNodeEnd, pair.clickNodeEnd);
          // Preserve the actual action failure even if the observer also rejects.
          if (clickResult.status === 'rejected') throw clickResult.reason;
          if (observerResult.status === 'rejected') throw observerResult.reason;
        }

        test.describe('material DPR frame diagnostic', () => {
          test.use({ viewport: { width: 1920, height: 1080 }, screen: { width: 1920, height: 1080 },
            contextOptions: { reducedMotion: 'reduce' } });
          for (const density of [3, 1]) {
            test.describe(`DPR ${density}`, () => {
              test.use({ deviceScaleFactor: density });
              test(`measures initial navigation with DPR ${density}`, async ({ page }, testInfo) => {
              const observerOrigin = 'native';
              const diagnostics = { observerOrigin, deviceScaleFactor: density, motionPreference: 'reduced', comparisonPurpose: 'Diagnostic only; no release acceptance',
                comparisonLimit: 'One fixed-order DPR3/DPR1 pair; observer-induced rendering, changing runner load and warm-up remain confounders',
                measurementLimit: 'Preserved main-world native rAF is not a direct utility-world observer; compare trace call boundaries without subtracting different time origins',
                clockScope: 'Existing flowing fixed-clock fixture; page-world rAF and utility-world trace are distinct',
                startedAt: new Date().toISOString(), phases: [], trials: [] };
              let failure;
              const timed = async (name, work) => {
                const start = nodePerformance.now();
                try { return await work(); }
                finally { diagnostics.phases.push({ name, nodeElapsedMs: nodePerformance.now() - start }); }
              };
              try {
                await page.addInitScript(preference => {
                  localStorage.setItem('study-planner-appearance', 'pixel');
                  localStorage.setItem('study-planner-theme-mode', 'light');
                  localStorage.setItem('study-planner-motion', preference);
                }, 'reduced');
                let control;
                await timed('setup', async () => {
                  await seedBookshelf(page);
                  await page.goto('/');
                  await expect(page.locator('.primary-bottom-nav')).toBeVisible();
                  control = page.locator('.primary-bottom-nav button').filter({ hasText: '教材' });
                  diagnostics.homeBeforeNavigation = await materialFrameSnapshot(control);
                  expect(diagnostics.homeBeforeNavigation.motionAttribute).toBe('reduced');
                  expect(diagnostics.homeBeforeNavigation.dpr).toBe(density);
                  await timed('initial-home-navigation-pair', () => observeInitialMaterialNavigation(control, observerOrigin, diagnostics));
                  await expect(page.locator('.bookshelf-view')).toBeVisible();
                  await expect(control).toBeVisible();
                  await page.evaluate(() => document.fonts.ready);
                });
                diagnostics.initial = await materialFrameSnapshot(control);
                expect(diagnostics.initial.width).toBe(1920); expect(diagnostics.initial.height).toBe(1080);
                expect(diagnostics.initial.dpr).toBe(density); expect(diagnostics.initial.reducedMotion).toBe(true);
                expect(diagnostics.initial.visibility).toBe('visible');
                expect(diagnostics.initial.motionAttribute).toBe('reduced');
                diagnostics.beforeFrames = await timed('page-world-raf-before', () => sampleMaterialPageFrames(control));
                for (let index = 0; index < 3; index++) {
                  const trial = { index, before: await materialFrameSnapshot(control) };
                  diagnostics.trials.push(trial);
                  const start = nodePerformance.now();
                  try { await control.click({ trial: true }); trial.completed = true; }
                  catch (error) { trial.error = String(error); throw error; }
                  finally { trial.nodeElapsedMs = nodePerformance.now() - start; }
                  trial.after = await materialFrameSnapshot(control);
                }
                diagnostics.afterFrames = await timed('page-world-raf-after', () => sampleMaterialPageFrames(control));
                diagnostics.final = await materialFrameSnapshot(control);
                await testInfo.attach(`diagnostic-dpr-${density}-surface`, {
                  body: await timed('explicit-screenshot-after-measurement', () => page.screenshot({ scale: 'css' })), contentType: 'image/png' });
              } catch (error) { failure = error; diagnostics.error = String(error); }
              try { await testInfo.attach(`diagnostic-dpr-${density}-timings`, { body: JSON.stringify(diagnostics), contentType: 'application/json' }); }
              catch (error) { throw failure ?? error; }
              if (failure) throw failure;
              });
            });
          }
        });
        REVIEWED_DIAGNOSTIC_0
        printf '%s  %s\n' '77046f93ae40fd60ffb1e6233370e367561833782c3083568b67acfe0cf7ddae' 'tests/e2e/material-frame-diagnostic.spec.mjs' | sha256sum -c -
        cp tests/e2e/material-frame-diagnostic.spec.mjs artifacts/desktop-four-proof/material-frame-diagnostic.spec.mjs
        test ! -e tests/e2e/material-frame-diagnostic.config.mjs
        cat > tests/e2e/material-frame-diagnostic.config.mjs <<'REVIEWED_DIAGNOSTIC_1'
        import { defineConfig } from '@playwright/test';
        import crossBrowserConfig from './playwright.cross-browser.config.mjs';

        const mobileProject = crossBrowserConfig.projects.find(project => project.name === 'webkit-mobile');
        if (!mobileProject) throw new Error('Expected existing webkit-mobile project');

        // QA-only diagnostic. Keep production config and actionability settings intact;
        // retain successful traces so utility-world stable waits can be compared.
        export default defineConfig({
          ...crossBrowserConfig,
          use: { ...crossBrowserConfig.use, trace: 'on' },
          projects: [{ ...mobileProject, testMatch: '**/material-frame-diagnostic.spec.mjs' }],
        });
        REVIEWED_DIAGNOSTIC_1
        printf '%s  %s\n' '23558f52de2faf36fa7b6ecd00d612d7092d5d64a1c2625c80c69443ff9778f3' 'tests/e2e/material-frame-diagnostic.config.mjs' | sha256sum -c -
        cp tests/e2e/material-frame-diagnostic.config.mjs artifacts/desktop-four-proof/material-frame-diagnostic.config.mjs
        sha256sum tests/e2e/material-frame-diagnostic.spec.mjs tests/e2e/material-frame-diagnostic.config.mjs > artifacts/desktop-four-proof/diagnostic-inputs.sha256
        git diff --exit-code
    - name: Write exact reviewed collection admission
      id: admission
      shell: bash
      run: |
        cat > artifacts/desktop-four-proof/run-selected.mjs <<'NODE'
        import assert from 'node:assert/strict';
        import crypto from 'node:crypto';
        import fs from 'node:fs';
        import { spawnSync } from 'node:child_process';
        const selected = {
          "cross": {
            "count": 2,
            "sha256": "0b0cbf011fba493f778e0412d153c8357a2731365f7b19a1a3e0931853cc8591",
            "projects": [
              "webkit-mobile"
            ],
            "args": [
              "test",
              "--config=tests/e2e/material-frame-diagnostic.config.mjs",
              "--project=webkit-mobile",
              "(^|/)material-frame-diagnostic\\.spec\\.mjs$"
            ]
          }
        };
        const mode = process.argv[2];
        const expected = selected[mode];
        assert.ok(expected, 'Unknown proof selection');
        const prefix = `artifacts/desktop-four-proof/${mode}`;
        fs.writeFileSync(`${prefix}-arguments.json`, JSON.stringify(expected.args, null, 2));
        const collectionProcess = spawnSync('./tests/e2e/node_modules/.bin/playwright', [...expected.args, '--list', '--reporter=json'], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 });
        fs.writeFileSync(`${prefix}-collection.json`, collectionProcess.stdout ?? '');
        assert.equal(collectionProcess.status, 0, collectionProcess.stderr || String(collectionProcess.error));
        const collection = JSON.parse(collectionProcess.stdout);
        assert.deepEqual(collection.errors, []);
        const identities = new Set();
        function visit(suite, parents = []) {
          const titles = [...parents, suite.title];
          for (const spec of suite.specs ?? []) for (const test of spec.tests) {
            assert.ok(expected.projects.includes(test.projectName), 'Unexpected project');
            const identity = JSON.stringify([test.projectName, spec.file, ...titles, spec.title]);
            assert.ok(!identities.has(identity), `Duplicate case: ${identity}`);
            identities.add(identity);
          }
          for (const child of suite.suites ?? []) visit(child, titles);
        }
        for (const suite of collection.suites) visit(suite);
        assert.equal(identities.size, expected.count);
        const sha256 = crypto.createHash('sha256').update(JSON.stringify([...identities].sort())).digest('hex');
        assert.equal(sha256, expected.sha256, 'Selected identities differ from review');
        fs.writeFileSync(`${prefix}-selection.json`, JSON.stringify({ mode, count: identities.size, sha256 }, null, 2));
        const run = spawnSync('./tests/e2e/node_modules/.bin/playwright', expected.args, { stdio: 'inherit' });
        if (run.error) throw run.error;
        process.exit(run.status ?? 1);
        NODE
    - name: Measure only two diagnostic conditions
      shell: bash
      run: node artifacts/desktop-four-proof/run-selected.mjs "$PROOF_PROJECT"
    - name: Upload source proof, results and screenshot attachments
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: material-dpr-frame-diagnostic-${{ matrix.project }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{
          github.run_attempt }}
        path: |+
          artifacts/desktop-four-proof/
          artifacts/playwright-results/
          artifacts/playwright-report/
          artifacts/playwright-results.json
          artifacts/playwright-cross-browser-results/
          artifacts/playwright-cross-browser-report/
          artifacts/playwright-cross-browser-results.json

        if-no-files-found: error
        retention-days: 14
'on':
  push:
    branches:
    - test/desktop-four-acceptance
    paths:
    - .github/workflows/desktop-four-acceptance.yml
