# Local template: bind immutable reviewed application source before publication.
name: Material Readability Correction Acceptance
permissions:
  contents: read
concurrency:
  group: desktop-four-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  related-native:
    if: github.repository == 'kame447/StudyPlanner'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - project: chromium
          timeout: 30
          browsers: chromium
        - project: cross
          timeout: 35
          browsers: webkit
    env:
      CI: 'true'
      SOURCE_SHA: cf4512afd4481d48ba177d8814c86b637406b994
      SOURCE_TREE: 1b43714e9c2b7795e2d4d2b72f6d890152e4f9dd
      PROOF_WORKFLOW_SHA: ${{ github.sha }}
      PROOF_PROJECT: ${{ matrix.project }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: cf4512afd4481d48ba177d8814c86b637406b994
        fetch-depth: 1
        persist-credentials: false
    - name: Verify immutable application source
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        test "$(git rev-parse ''HEAD^{tree}'')" = "$SOURCE_TREE"

        mkdir -p artifacts/desktop-four-proof

        printf ''{"sourceSha":"%s","sourceTree":"%s","workflowSha":"%s","project":"%s"}\n'' "$SOURCE_SHA" "$SOURCE_TREE"
        "$PROOF_WORKFLOW_SHA" "$PROOF_PROJECT" > artifacts/desktop-four-proof/source.json

        git ls-files -z src tests/e2e package.json package-lock.json .node-version vite.config.mjs index.html public/fonts
        | xargs -0 sha256sum > artifacts/desktop-four-proof/inputs.sha256

        '
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: npm
    - name: Install application dependencies
      run: npm ci
    - name: Snapshot application manifests before isolated test-runner install
      shell: bash
      run: sha256sum package.json package-lock.json > /tmp/studyplanner-manifests.sha256
    - name: Install existing pinned Playwright
      run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.64.0
      shell: bash
    - name: Verify isolated test-runner install did not mutate application manifests
      shell: bash
      run: sha256sum -c /tmp/studyplanner-manifests.sha256
    - name: Install existing project browsers
      run: ./tests/e2e/node_modules/.bin/playwright install --with-deps ${{ matrix.browsers }}
    - name: Build production bundle
      run: npm run build
      id: build
      env:
        DEV_LAN_HOST: 127.0.0.1
    - name: Write exact reviewed collection admission
      id: admission
      shell: bash
      run: "cat > artifacts/desktop-four-proof/run-selected.mjs <<'NODE'\nimport assert from 'node:assert/strict';\n\
        import crypto from 'node:crypto';\nimport fs from 'node:fs';\nimport { spawnSync } from 'node:child_process';\n\
        const selected = {\n  \"chromium\": {\n    \"count\": 5,\n    \"sha256\": \"299fae72d2415716ed128a46e6fdf83f964ff7671ce46ffa41554ee86999f980\"\
        ,\n    \"projects\": [\n      \"chromium\"\n    ],\n    \"args\": [\n      \"test\",\n      \"--config=tests/e2e/playwright.config.mjs\"\
        ,\n      \"--project=chromium\",\n      \"(^|/)(?:bookshelf-surface\\\\.spec\\\\.mjs|bookshelf-material-name-order\\\
        \\.spec\\\\.mjs)$\",\n      \"--grep\",\n      \"(?:keeps full text and long editor actions reachable at\
        \ 100% and 200%|allows 200% text and dark mode without losing controls or exposing the background)$\"\n\
        \    ]\n  },\n  \"cross\": {\n    \"count\": 9,\n    \"sha256\": \"083dbb7d8a5df1e961011491db9326050bc9ca86753159dd1720bacaea156f09\"\
        ,\n    \"projects\": [\n      \"webkit-desktop\",\n      \"webkit-mobile\"\n    ],\n    \"args\": [\n  \
        \    \"test\",\n      \"--config=tests/e2e/playwright.cross-browser.config.mjs\",\n      \"--project=webkit-desktop\"\
        ,\n      \"--project=webkit-mobile\",\n      \"(^|/)(?:bookshelf-surface\\\\.spec\\\\.mjs|bookshelf-material-name-order\\\
        \\.spec\\\\.mjs)$\",\n      \"--grep\",\n      \"(?:(?:keeps full text and long editor actions reachable\
        \ at 100% and 200%|allows 200% text and dark mode without losing controls or exposing the background)$|(?:^|\
        \ )webkit-mobile .*retains the approved frame and all fields at 100% and 200% text$)\"\n    ]\n  }\n};\n\
        const mode = process.argv[2];\nconst expected = selected[mode];\nassert.ok(expected, 'Unknown proof selection');\n\
        const prefix = `artifacts/desktop-four-proof/${mode}`;\nfs.writeFileSync(`${prefix}-arguments.json`, JSON.stringify(expected.args,\
        \ null, 2));\nconst collectionProcess = spawnSync('./tests/e2e/node_modules/.bin/playwright', [...expected.args,\
        \ '--list', '--reporter=json'], { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 });\nfs.writeFileSync(`${prefix}-collection.json`,\
        \ collectionProcess.stdout ?? '');\nassert.equal(collectionProcess.status, 0, collectionProcess.stderr ||\
        \ String(collectionProcess.error));\nconst collection = JSON.parse(collectionProcess.stdout);\nassert.deepEqual(collection.errors,\
        \ []);\nconst identities = new Set();\nfunction visit(suite, parents = []) {\n  const titles = [...parents,\
        \ suite.title];\n  for (const spec of suite.specs ?? []) for (const test of spec.tests) {\n    assert.ok(expected.projects.includes(test.projectName),\
        \ 'Unexpected project');\n    const identity = JSON.stringify([test.projectName, spec.file, ...titles, spec.title]);\n\
        \    assert.ok(!identities.has(identity), `Duplicate case: ${identity}`);\n    identities.add(identity);\n\
        \  }\n  for (const child of suite.suites ?? []) visit(child, titles);\n}\nfor (const suite of collection.suites)\
        \ visit(suite);\nassert.equal(identities.size, expected.count);\nconst sha256 = crypto.createHash('sha256').update(JSON.stringify([...identities].sort())).digest('hex');\n\
        assert.equal(sha256, expected.sha256, 'Selected identities differ from review');\nfs.writeFileSync(`${prefix}-selection.json`,\
        \ JSON.stringify({ mode, count: identities.size, sha256 }, null, 2));\nconst run = spawnSync('./tests/e2e/node_modules/.bin/playwright',\
        \ expected.args, { stdio: 'inherit' });\nif (run.error) throw run.error;\nprocess.exit(run.status ?? 1);\n\
        NODE\n"
    - name: Run only reviewed related native cases
      shell: bash
      run: node artifacts/desktop-four-proof/run-selected.mjs "$PROOF_PROJECT"
    - name: Upload source proof, results and screenshot attachments
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: material-correction-${{ matrix.project }}-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: 'artifacts/desktop-four-proof/

          artifacts/playwright-results/

          artifacts/playwright-report/

          artifacts/playwright-results.json

          artifacts/playwright-cross-browser-results/

          artifacts/playwright-cross-browser-report/

          artifacts/playwright-cross-browser-results.json


          '
        if-no-files-found: error
        retention-days: 14
'on':
  push:
    branches:
    - test/desktop-four-acceptance
    paths:
    - .github/workflows/desktop-four-acceptance.yml
