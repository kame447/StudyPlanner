name: Debug fixed event tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/debug-fixed-event-tests.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: |
          node scripts/apply-weekly-planning-grounded-fixed-events.mjs
          node scripts/adjust-fixed-event-grounding-tests.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm run test:run -- src/features/weeklyPlanning/dialogue/weeklyPlanningKnownFixedEvents.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningBehaviorAwareDialoguePlanner.test.ts src/features/weeklyPlanning/pipeline/weeklyPlanningFixedEventCapability.test.ts src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts
      - name: Run build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee fixed-event-build-diagnostic.log
      - name: Save diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f fixed-event-build-diagnostic.log
          git commit -m "feat: 固定予定build診断ログを記録"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
