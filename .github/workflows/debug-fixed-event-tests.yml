name: Debug fixed event tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/debug-fixed-event-tests.yml
      - scripts/adjust-fixed-event-grounding-tests.mjs

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: |
          node scripts/apply-weekly-planning-grounded-fixed-events.mjs
          node scripts/adjust-fixed-event-grounding-tests.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm run test:run -- src/features/weeklyPlanning/dialogue/weeklyPlanningKnownFixedEvents.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningBehaviorAwareDialoguePlanner.test.ts src/features/weeklyPlanning/pipeline/weeklyPlanningFixedEventCapability.test.ts src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts > fixed-event-test-output.log 2>&1
      - name: Save log
        if: steps.tests.outcome == 'failure'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f fixed-event-test-output.log
          git commit -m "feat: 固定予定テスト失敗内容を記録"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Fail
        if: steps.tests.outcome == 'failure'
        run: exit 1
