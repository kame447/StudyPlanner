name: Fix Work Breakdown Prompt Syntax

on:
  push:
    branches:
      - agent/weekly-ai-conversation-eval
    paths:
      - .github/workflows/fix-work-breakdown-prompt-syntax.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-ai-conversation-eval
          fetch-depth: 0
      - name: Sync latest branch head
        run: |
          git fetch origin agent/weekly-ai-conversation-eval
          git reset --hard origin/agent/weekly-ai-conversation-eval
      - name: Fix quoted prompt text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts')
          text = p.read_text()
          old = "Represent the current answer as that task's present structure"
          new = "Represent the current answer as the present structure of that task"
          if text.count(old) != 1:
              raise SystemExit(f'expected one prompt fragment, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "kame447"
          git config user.email "76802107+kame447@users.noreply.github.com"
          git add src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts
          git commit -m "fix: correct work breakdown prompt syntax"
          git push origin HEAD:agent/weekly-ai-conversation-eval
