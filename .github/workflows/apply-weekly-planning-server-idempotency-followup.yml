name: Apply weekly planning server idempotency follow-up

on:
  push:
    branches:
      - agent/weekly-planning-server-idempotency

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-server-idempotency
          fetch-depth: 0
      - name: Apply follow-up patches
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/features/weeklyPlanning/application/weeklyPlanningApprovalApplication.ts')
          text = app.read_text()
          old = """        async findExistingPlanId({ sourceDraftBlockId }) {
                    const sourceId = buildWeeklyPlanningPlanSourceId({
                      approvalOperationId: operation.approvalOperationId,
                      sourceDraftBlockId,
                    });
                    const structuredMatch = plans.find((plan) =>
                      plan.userId === authenticatedUserId
                      && plan.sourceType === WEEKLY_PLANNING_PLAN_SOURCE_TYPE
                      && plan.sourceId === sourceId,
                    );
                    if (structuredMatch) return structuredMatch.id;

                    const legacyMarker = `[weekly-source:${sourceDraftBlockId}]`;
                    return plans.find((plan) =>
                      plan.userId === authenticatedUserId
                      && plan.memo.includes(legacyMarker),
                    )?.id;
                  },"""
          new = """        async findExistingPlanId({ sourceDraftBlockId }) {
                    const legacyMarker = `[weekly-source:${sourceDraftBlockId}]`;
                    return plans.find((plan) =>
                      plan.userId === authenticatedUserId
                      && plan.sourceType !== WEEKLY_PLANNING_PLAN_SOURCE_TYPE
                      && plan.memo.includes(legacyMarker),
                    )?.id;
                  },"""
          if old not in text:
              raise SystemExit('application duplicate lookup pattern not found')
          app.write_text(text.replace(old, new, 1))

          repository = Path('src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.ts')
          text = repository.read_text()
          old = """    async completeOperation(operation) {
                  const userId = requireNonempty(operation.userId, '利用者');"""
          new = """    async completeOperation(operation) {
                  const expectedItemCount = operation.items.filter(
                    (item) => item.status === 'saved',
                  ).length;
                  if (expectedItemCount === 0) return;
                  const userId = requireNonempty(operation.userId, '利用者');"""
          if text.count(old) != 2:
              raise SystemExit(f'completeOperation pattern count was {text.count(old)}')
          text = text.replace(old, new)
          text = text.replace(
              "expectedItemCount: operation.items.length,",
              "expectedItemCount,",
          )
          repository.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/weeklyPlanning/application/weeklyPlanningApprovalApplication.ts src/features/weeklyPlanning/application/weeklyPlanningApprovalPlanRepository.ts
          git commit -m "feat: server claimを承認重複判定の正本にする"
          git push origin HEAD:agent/weekly-planning-server-idempotency
