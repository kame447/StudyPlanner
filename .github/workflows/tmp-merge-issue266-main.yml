name: One-shot Issue 266 Main Integration

on:
  push:
    branches:
      - refactor/issue266-recurring-plan-mutations
    paths:
      - .github/workflows/tmp-merge-issue266-main.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue266-recurring-plan-mutations
          fetch-depth: 0

      - name: Build resolved merge tree on latest main
        shell: bash
        env:
          FEATURE_HEAD: b6c00128d287cdf30bb809f02fa3a1388ed726c3
          FEATURE_BASE: 06e19af497ef56fcbcf487e956a526aa555c1909
          EXPECTED_MAIN: 129b06169da47499ad634285ac648749e1676c67
          TARGET_BRANCH: refactor/issue266-recurring-plan-mutations
        run: |
          set -euo pipefail

          BRANCH_HEAD="$(git rev-parse HEAD)"
          git fetch origin main
          MAIN_HEAD="$(git rev-parse origin/main)"

          if [[ "$MAIN_HEAD" != "$EXPECTED_MAIN" ]]; then
            echo "main moved: expected $EXPECTED_MAIN, actual $MAIN_HEAD" >&2
            exit 20
          fi
          if ! git merge-base --is-ancestor "$FEATURE_HEAD" "$BRANCH_HEAD"; then
            echo "feature head is not an ancestor of the current branch head" >&2
            exit 21
          fi

          paths=(
            src/domain/recurringPlanMutation.test.ts
            src/domain/recurringPlanMutation.ts
            src/hooks/usePlannerDataState.ts
            src/repositories/firebasePlannerRepository.recurringMutation.test.ts
            src/repositories/firebasePlannerRepository.ts
            src/repositories/observedPlannerRepository.ts
            src/repositories/plannerRepository.ts
            src/repositories/recurringPlanMutationRepository.test.ts
            src/repositories/repositoryContracts.ts
            src/repositories/unavailableRepositories.ts
          )

          git diff --binary "$FEATURE_BASE" "$FEATURE_HEAD" -- "${paths[@]}" > /tmp/issue266.patch
          git checkout --detach "$MAIN_HEAD"

          if ! git apply --3way --index /tmp/issue266.patch; then
            echo "three-way apply left conflicts:" >&2
            git status --short >&2 || true
            git diff --cc >&2 || true
            exit 22
          fi

          python <<'PY'
          from pathlib import Path

          observed = Path('src/repositories/observedPlannerRepository.ts')
          text = observed.read_text()
          needle = "      mutation.actualUpserts.forEach(() => recordBestEffort(telemetry, 'actual_recorded'));\n"
          if text.count(needle) != 1:
              raise SystemExit(f'expected one recurring Actual telemetry line, found {text.count(needle)}')
          observed.write_text(text.replace(needle, '', 1))

          test_path = Path('src/repositories/observedPlannerRepository.test.ts')
          test_text = test_path.read_text()
          anchor = "  it('preserves telemetry for aggregate Actual and material persistence', async () => {\n"
          if test_text.count(anchor) != 1:
              raise SystemExit(f'expected one telemetry test insertion anchor, found {test_text.count(anchor)}')
          test = """  it('does not recount recurring Actual rebinds as newly recorded activity', async () => {\n    const actions: ProductActivityAction[] = [];\n    const reboundActual = {\n      id: 'actual-rebound',\n      userId: 'user-1',\n      planId: 'plan-future',\n      occurrenceDate: '2026-09-03',\n      actualStartTime: '09:00',\n      actualEndTime: '10:00',\n      title: 'Math',\n      subject: 'Math',\n      isAlignedToPlan: true,\n      note: '',\n      updatedAt: '2026-09-03T01:00:00.000Z',\n    } as Actual;\n    const base = {\n      applyRecurringPlanMutation: vi.fn(async () => undefined),\n    } as unknown as PlannerRepository;\n    const repository = createObservedPlannerRepository(base, telemetry(actions));\n\n    await repository.applyRecurringPlanMutation('user-1', {\n      planUpserts: [],\n      planDeletes: [],\n      actualUpserts: [reboundActual],\n      actualDeletes: [],\n    });\n\n    expect(actions).toEqual([]);\n  });\n\n"""
          test_path.write_text(test_text.replace(anchor, test + anchor, 1))
          PY

          git add -A

          expected_files="$(printf '%s\n' \
            src/domain/recurringPlanMutation.test.ts \
            src/domain/recurringPlanMutation.ts \
            src/hooks/usePlannerDataState.ts \
            src/repositories/firebasePlannerRepository.recurringMutation.test.ts \
            src/repositories/firebasePlannerRepository.ts \
            src/repositories/observedPlannerRepository.test.ts \
            src/repositories/observedPlannerRepository.ts \
            src/repositories/plannerRepository.ts \
            src/repositories/recurringPlanMutationRepository.test.ts \
            src/repositories/repositoryContracts.ts \
            src/repositories/unavailableRepositories.ts | sort)"
          actual_files="$(git diff --cached --name-only | sort)"
          if [[ "$actual_files" != "$expected_files" ]]; then
            echo "unexpected resolved diff" >&2
            echo "expected:" >&2
            printf '%s\n' "$expected_files" >&2
            echo "actual:" >&2
            printf '%s\n' "$actual_files" >&2
            exit 23
          fi

          npm ci
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs run \
            src/domain/recurringPlanMutation.test.ts \
            src/repositories/recurringPlanMutationRepository.test.ts \
            src/repositories/firebasePlannerRepository.recurringMutation.test.ts \
            src/repositories/observedPlannerRepository.test.ts
          npm run typecheck
          npm run typecheck:build
          npm run test:run
          npm run build
          git diff --cached --check

          TREE_SHA="$(git write-tree)"
          MERGE_SHA="$(printf '%s\n' 'merge: integrate main into issue 266 recurring mutations' | git commit-tree "$TREE_SHA" -p "$BRANCH_HEAD" -p "$MAIN_HEAD")"
          git push origin "$MERGE_SHA:refs/heads/$TARGET_BRANCH"
          echo "merge_sha=$MERGE_SHA"
