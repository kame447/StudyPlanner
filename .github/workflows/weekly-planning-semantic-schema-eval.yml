name: Weekly Planning Stable V5 Semantic Eval

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-planning-semantic-stable-v5-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-eval:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      WEEKLY_PLANNING_SEMANTIC_V5_REAL_EVAL: '1'
      WEEKLY_PLANNING_SEMANTIC_V5_EVAL_BASE_URL: https://api.openai.com/v1
      WEEKLY_PLANNING_SEMANTIC_V5_EVAL_MODEL: gpt-5.4-mini

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Repository secret OPENAI_API_KEY is required." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run Stable V5 semantic evaluation
        id: eval
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticV5.real-eval.test.ts

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-semantic-v5-real-eval
          path: artifacts/weekly-planning-semantic-v5-real-eval.json
          if-no-files-found: warn
          retention-days: 14

      - name: Propagate evaluation failure
        if: steps.eval.outcome == 'failure'
        run: exit 1
