name: Weekly Planning Semantic Schema Eval

on:
  push:
    branches:
      - test/weekly-planning-semantic-schema-eval
  pull_request:
    branches:
      - main
    paths:
      - 'src/features/weeklyPlanning/semanticV2/**'
      - '.github/workflows/weekly-planning-semantic-schema-eval.yml'
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  group: weekly-planning-semantic-schema-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEEKLY_PLANNING_SEMANTIC_SCHEMA_REAL_EVAL: '1'
      WEEKLY_PLANNING_SEMANTIC_SCHEMA_EVAL_MODEL: 'openai/gpt-4.1'
      OPENAI_API_KEY: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_BASE_URL: 'https://models.github.ai/inference'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Adapt token-limit field for GitHub Models
        run: >-
          sed -i
          's/max_completion_tokens: 1200/max_tokens: 1200/'
          src/features/weeklyPlanning/semanticV2/weeklyPlanningSemanticExperiment.real-eval.test.ts
      - name: Run generic semantic schema API evaluation
        id: eval
        continue-on-error: true
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/semanticV2/weeklyPlanningSemanticExperiment.real-eval.test.ts
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-semantic-schema-eval
          path: artifacts/weekly-planning-semantic-schema-eval.json
          if-no-files-found: warn
      - name: Propagate evaluation failure
        if: steps.eval.outcome == 'failure'
        run: exit 1
