name: PR5 final verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.number == 5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Focused pending range tests
        id: focused
        continue-on-error: true
        run: |
          npm run test:run -- \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeAdversarialRegression.test.ts \
            src/features/weeklyPlanning/pipeline/weeklyPlanningPendingRangeContract.test.ts \
            src/features/weeklyPlanning/weeklyPlanningPendingRangeStorageContract.test.ts \
            > /tmp/focused.log 2>&1

      - name: Weekly planning tests
        id: weekly
        continue-on-error: true
        run: npm run test:run -- src/features/weeklyPlanning > /tmp/weekly.log 2>&1

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr5-weekly-verification-logs
          path: |
            /tmp/focused.log
            /tmp/weekly.log
          if-no-files-found: error

      - name: Fail on test failure
        if: steps.focused.outcome != 'success' || steps.weekly.outcome != 'success'
        run: |
          echo "focused=${{ steps.focused.outcome }}"
          echo "weekly=${{ steps.weekly.outcome }}"
          exit 1
