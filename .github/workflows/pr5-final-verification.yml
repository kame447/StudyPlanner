name: PR5 final verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.number == 5
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci --silent > /tmp/install.log 2>&1

      - name: Focused pending range tests
        id: focused
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          npm run test:run -- \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeAdversarialRegression.test.ts \
            src/features/weeklyPlanning/pipeline/weeklyPlanningPendingRangeContract.test.ts \
            src/features/weeklyPlanning/weeklyPlanningPendingRangeStorageContract.test.ts \
            > /tmp/focused.log 2>&1

      - name: Weekly planning tests
        id: weekly
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:run -- src/features/weeklyPlanning > /tmp/weekly.log 2>&1

      - name: Full test suite
        id: full
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run test:run > /tmp/full.log 2>&1

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build > /tmp/build.log 2>&1

      - name: Diff checks
        id: diff
        continue-on-error: true
        run: |
          {
            git diff --check
            git diff --check origin/main...HEAD
            test -z "$(git status --short --untracked-files=no)"
          } > /tmp/diff.log 2>&1

      - name: Write result summary
        if: always()
        run: |
          cat > /tmp/result.txt <<EOF
          install=${{ steps.install.outcome }}
          focused=${{ steps.focused.outcome }}
          weekly=${{ steps.weekly.outcome }}
          full=${{ steps.full.outcome }}
          build=${{ steps.build.outcome }}
          diff=${{ steps.diff.outcome }}
          head=${{ github.event.pull_request.head.sha }}
          EOF

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr5-final-verification-logs
          path: |
            /tmp/result.txt
            /tmp/install.log
            /tmp/focused.log
            /tmp/weekly.log
            /tmp/full.log
            /tmp/build.log
            /tmp/diff.log
          if-no-files-found: warn

      - name: Fail on verification error
        if: |
          steps.install.outcome != 'success' ||
          steps.focused.outcome != 'success' ||
          steps.weekly.outcome != 'success' ||
          steps.full.outcome != 'success' ||
          steps.build.outcome != 'success' ||
          steps.diff.outcome != 'success'
        run: cat /tmp/result.txt && exit 1
