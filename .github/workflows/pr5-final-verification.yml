name: PR5 final verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.number == 5
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Focused pending range and storage tests
        run: |
          npm run test:run -- \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeAdversarialRegression.test.ts \
            src/features/weeklyPlanning/pipeline/weeklyPlanningPendingRangeContract.test.ts \
            src/features/weeklyPlanning/weeklyPlanningPendingRangeStorageContract.test.ts \
            src/features/weeklyPlanning/weeklyPlanningStorageValidation.test.ts \
            2>&1 | tee /tmp/focused.log

      - name: Weekly planning tests
        run: npm run test:run -- src/features/weeklyPlanning 2>&1 | tee /tmp/weekly.log

      - name: Full test suite
        run: npm run test:run 2>&1 | tee /tmp/full.log

      - name: Build
        run: npm run build 2>&1 | tee /tmp/build.log

      - name: Diff checks
        run: |
          git diff --check
          git diff --check origin/main...HEAD
          test -z "$(git status --short --untracked-files=no)"

      - name: Upload final logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr5-final-verification-logs
          path: |
            /tmp/focused.log
            /tmp/weekly.log
            /tmp/full.log
            /tmp/build.log
          if-no-files-found: warn
