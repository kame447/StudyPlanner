name: PR5 final verification

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.number == 5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Focused pending range tests
        run: |
          npm run test:run -- \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeAdversarialRegression.test.ts \
            src/features/weeklyPlanning/pipeline/weeklyPlanningPendingRangeContract.test.ts \
            src/features/weeklyPlanning/weeklyPlanningPendingRangeStorageContract.test.ts \
            > /tmp/focused.log 2>&1 || {
              tail -n 160 /tmp/focused.log
              exit 1
            }
          tail -n 25 /tmp/focused.log

      - name: Weekly planning tests
        run: |
          npm run test:run -- src/features/weeklyPlanning > /tmp/weekly.log 2>&1 || {
            tail -n 220 /tmp/weekly.log
            exit 1
          }
          tail -n 35 /tmp/weekly.log
