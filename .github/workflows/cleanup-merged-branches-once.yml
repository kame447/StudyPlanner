name: Cleanup merged branches once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete explicitly allowlisted merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "ci/firestore-rules-wif-deploy"
            "feat/product-observability-phase4-overview"
            "feat/shared-user-context-memory-v2"
            "feat/week-plan-drag-drop"
            "fix/firestore-rules-api-deploy"
            "fix/timetable-period-swipe-delete"
          )

          for branch in "${branches[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done

          for branch in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Branch still exists: ${branch}" >&2
              exit 1
            fi
          done
