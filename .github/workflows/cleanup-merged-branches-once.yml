name: Cleanup merged branches once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-merged-branches-once.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify merged PR ownership
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for pr in 277 281 279 282; do
            merged_at="$(gh api "repos/${REPO}/pulls/${pr}" --jq '.merged_at // empty')"
            test -n "$merged_at" || {
              echo "PR #${pr} is not merged; refusing cleanup." >&2
              exit 1
            }
          done

      - name: Verify accidental branch is disposable
        run: |
          set -euo pipefail
          expected_sha='4cbf7d7b18e337ff8c6903bc37211c544bf01c55'
          noop_sha="$(git ls-remote origin 'refs/heads/__noop' | awk '{print $1}')"
          test -n "$noop_sha"
          test "$noop_sha" = "$expected_sha" || {
            echo "__noop no longer points at its accidental creation SHA; refusing deletion." >&2
            exit 1
          }

      - name: Delete exact allowlisted branches
        run: |
          set -euo pipefail
          git push origin --delete 'fix/issue52-preview-longpress-actions'
          git push origin --delete 'fix/issue52-preview-overview-longpress'
          git push origin --delete 'refactor/issue278-schedule-event-authority'
          git push origin --delete 'refactor/issue278-schedule-event-persistence'
          git push origin --delete '__noop'
