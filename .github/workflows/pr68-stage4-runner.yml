name: PR68 stage4 exam scope integrity v3

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr68-stage4-runner.yml]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exam scope fixes
        run: python3 scripts/pr68_stage4_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: npm run test:run -- src/features/weeklyPlanning/__tests__/weeklyPlanningAdversarialInput.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningControllerApprovalFlow.integration.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningObservedConversation.integration.test.ts
      - name: Run full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Commit fixes to the existing branch
        run: |
          rm -f scripts/pr68_stage4_fix.py .github/workflows/pr68-stage4-runner.yml
          rm -f pr68-stage3-test.txt pr68-stage3-v2-test.txt pr68-stage3-v3-test.txt pr68-stage3-v4-test.txt
          rm -f pr68-stage4-test.txt pr68-stage4-v2-test.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 院試scopeとpreview readinessを整合'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
