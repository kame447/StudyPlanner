name: Agent rendered question context

on:
  push:
    branches:
      - agent/weekly-planning-rendered-question-context

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation patch
        run: |
          git apply --check .github/patches/rendered-question-context.patch
          git apply .github/patches/rendered-question-context.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - name: Focused dialogue tests
        run: npm run test:run -- src/features/weeklyPlanning/__tests__/weeklyPlanningDialoguePathRegression.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningBehaviorAwareDialoguePlanner.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningClarificationContext.test.ts
      - name: TypeScript
        run: npx tsc -b
      - name: Weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Commit verified implementation
        run: |
          git rm .github/patches/rendered-question-context.patch
          git rm .github/workflows/agent-rendered-question-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/weeklyPlanning
          git commit -m "feat: 表示質問と質問文脈を一致させる"
          git push origin HEAD:agent/weekly-planning-rendered-question-context
