# PREPARATION ONLY. Do not publish/run before root authorization and final review.
# One added workflow file, direct child of the existing integration cleanup; attempt 1 only.
name: Issue 488 A Captured Case1 API0 Once
on:
  push:
    branches: ['integration/issue488-a-c-e-r0']
    paths: ['.github/workflows/issue488-a-case1-api0-once.yml']
permissions:
  contents: read
env:
  EVENT_PARENT: '428e97dd84564990a6d6f65213f363393b170d34'
  EVENT_PARENT_TREE: 'be3170838b29a672fe591f7024028a0b1267a169'
  SOURCE_SHA: '78b4b06f48769d94d7a60e184b77938eaec6aff0'
  SOURCE_TREE: 'f4b366d5273a15e5aac129b8fc43a54f1a810f77'
  WORKFLOW_PATH: '.github/workflows/issue488-a-case1-api0-once.yml'
concurrency:
  group: issue488-a-case1-api0-once
  cancel-in-progress: false
jobs:
  a_case1_once:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'kame447/StudyPlanner' &&
          github.repository_id == '1202727586' &&
          github.repository_owner == 'kame447' &&
          github.actor == 'kame447' && github.actor_id == '76802107' &&
          github.triggering_actor == 'kame447' &&
          github.ref == 'refs/heads/integration/issue488-a-c-e-r0' &&
          github.run_attempt == 1 &&
          github.event.created == false && github.event.deleted == false &&
          github.event.forced == false }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      OPENAI_API_KEY: ''
      VITE_AI_API_KEY: ''
      VITE_CLOUDFLARE_AI_PROXY_URL: ''
      STUDYPLANNER_F1_REAL_API: '0'
      STUDYPLANNER_R0_REAL_API: '0'
      STUDYPLANNER_H_REAL_API: '0'
      STUDYPLANNER_H2_REAL_API: '0'
      GOOGLE_API_KEY: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the one-file direct-child event before any source execution
        id: event_guard
        env:
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTING_WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = kame447/StudyPlanner
          test "$GITHUB_REPOSITORY_ID" = 1202727586
          test "$GITHUB_REPOSITORY_OWNER" = kame447
          test "$GITHUB_ACTOR" = kame447
          test "$GITHUB_ACTOR_ID" = 76802107
          test "$GITHUB_TRIGGERING_ACTOR" = kame447
          test "$GITHUB_REF" = refs/heads/integration/issue488-a-c-e-r0
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXECUTING_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$EXECUTING_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$WORKFLOW_PATH@$GITHUB_REF"
          python3 - <<'PYEVENT'
          import json,os,pathlib
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['before']==os.environ['EVENT_PARENT'] and event['after']==os.environ['GITHUB_SHA']
          assert event['created'] is False and event['deleted'] is False and event['forced'] is False
          assert event['repository']['full_name']=='kame447/StudyPlanner' and event['repository']['id']==1202727586
          assert event['sender']['login']=='kame447' and event['sender']['id']==76802107
          PYEVENT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P "$GITHUB_SHA")" = "$EVENT_PARENT"
          test "$(git rev-parse "${EVENT_PARENT}^{tree}")" = "$EVENT_PARENT_TREE"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r "$EVENT_PARENT" "$GITHUB_SHA")" = "$(printf 'A\t%s' "$WORKFLOW_PATH")"
          test "$(git ls-tree "$GITHUB_SHA" -- "$WORKFLOW_PATH" | awk '{print $1, $2}')" = '100644 blob'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/a-case1-api0-artifacts"
          cp "$WORKFLOW_PATH" "$RUNNER_TEMP/a-case1-api0-artifacts/executing-workflow.yml"
          python3 - <<'PYPROVENANCE'
          import json,os,pathlib
          values={key:os.environ[name] for key,name in {'source':'SOURCE_SHA','tree':'SOURCE_TREE','eventParent':'EVENT_PARENT','eventParentTree':'EVENT_PARENT_TREE','event':'GITHUB_SHA',
              'workflow':'EXECUTING_WORKFLOW_SHA','ref':'GITHUB_REF','runId':'GITHUB_RUN_ID'}.items()}
          values['attempt']=1
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'a-case1-api0-artifacts/event-provenance.json').write_text(json.dumps(values,indent=2)+'\n')
          PYPROVENANCE
      - name: Check out immutable session production source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
      - name: Install locked app and version-matched runner with no model credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          test -w "$PWD"; test -w "$HOME"; test -w "$RUNNER_TEMP"
          test "$(node -v)" = v22.23.0
          test "$PLAYWRIGHT_BROWSERS_PATH" = /ms-playwright
          test -z "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          sha256sum package.json package-lock.json > "$RUNNER_TEMP/a-case1-api0-artifacts/app-manifests.sha256"
          test ! -e .npmrc
          test ! -e "$RUNNER_TEMP/a-case1-api0-home"; test ! -e "$RUNNER_TEMP/a-case1-api0-npm"
          mkdir -p "$RUNNER_TEMP/a-case1-api0-home" "$RUNNER_TEMP/a-case1-api0-npm/cache" "$RUNNER_TEMP/a-case1-api0-npm/logs"
          : > "$RUNNER_TEMP/a-case1-api0-npm/user.npmrc"; : > "$RUNNER_TEMP/a-case1-api0-npm/global.npmrc"
          NODE_BIN="$(command -v node)"; NPM_ENTRY="$(readlink -f "$(command -v npm)")"
          export NODE_BIN NPM_ENTRY
          python3 - <<'PYNPM'
          import hashlib,json,os,pathlib,subprocess
          node=pathlib.Path(os.environ['NODE_BIN']).resolve();npm=pathlib.Path(os.environ['NPM_ENTRY'])
          assert npm.is_file() and str(npm).endswith('/node_modules/npm/bin/npm-cli.js')
          package=json.loads((npm.parents[1]/'package.json').read_text());assert package['name']=='npm'
          info={'nodePath':str(node),'nodeSha256':hashlib.sha256(node.read_bytes()).hexdigest(),
            'nodeVersion':subprocess.check_output([str(node),'--version'],text=True).strip(),
            'npmEntry':str(npm),'npmEntrySha256':hashlib.sha256(npm.read_bytes()).hexdigest(),'npmVersion':package['version'],
            'configScope':'fresh private HOME, user/global configs, cache and logs; env -i; source .npmrc absent'}
          assert info['nodeVersion']=='v22.23.0'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'a-case1-api0-artifacts/install-tooling.json').write_text(json.dumps(info,indent=2)+'\n')
          PYNPM
          clean_npm() {
            env -i PATH="$(dirname "$NODE_BIN"):/usr/local/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/a-case1-api0-home" \
              CI=true TZ=UTC PLAYWRIGHT_BROWSERS_PATH=/ms-playwright PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
              npm_config_userconfig="$RUNNER_TEMP/a-case1-api0-npm/user.npmrc" npm_config_globalconfig="$RUNNER_TEMP/a-case1-api0-npm/global.npmrc" \
              npm_config_cache="$RUNNER_TEMP/a-case1-api0-npm/cache" npm_config_logs_dir="$RUNNER_TEMP/a-case1-api0-npm/logs" \
              npm_config_update_notifier=false npm_config_fund=false WRANGLER_SEND_METRICS=false \
              "$NODE_BIN" "$NPM_ENTRY" "$@"
          }
          clean_npm ci
          clean_npm install --prefix "$RUNNER_TEMP/a-case1-api0-pw" --no-save --package-lock=false @playwright/test@1.64.0
          python3 - <<'PYNPMCHECK'
          import hashlib,json,os,pathlib
          j=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'a-case1-api0-artifacts/install-tooling.json').read_text())
          for key,hashkey in [('nodePath','nodeSha256'),('npmEntry','npmEntrySha256')]:
              assert hashlib.sha256(pathlib.Path(j[key]).read_bytes()).hexdigest()==j[hashkey]
          PYNPMCHECK
          sha256sum -c "$RUNNER_TEMP/a-case1-api0-artifacts/app-manifests.sha256"
          # No playwright install, apt, browser fallback, or executablePath override.
      - name: Materialize exact original-five-response API0 bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          import base64,gzip,hashlib,io,json,os,pathlib,tarfile
          packed=base64.b64decode('',validate=True)
          assert len(packed)==69942 and hashlib.sha256(packed).hexdigest()=='f136ead83ca5bccc2b0fac7ed30d85e24da76b967a5cc0d699ccc71f9e1181d3'
          raw=gzip.decompress(packed);assert len(raw)==286720 and hashlib.sha256(raw).hexdigest()=='b6d85cc8591752b1d81e4b0bf8906719a9b53d0f7afcf1629073c12867a1c58d'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'a-case1-api0-bundle';root.mkdir(exist_ok=False)
          expected={'candidate/a-correction-oracles.mjs': '21a9f94cefbd28640986f4f5c3d2827c7cd220dae1b1722322af71312a0da13c', 'candidate/a-playwright.config.template.mjs': '0f4222467dd86dd5a72fe1be71c5773c3ed3c9a442b9e9fcf403a64dec0bf951', 'candidate/a-route-contract.mjs': '40df3a0fa66be3bb7ffec8051b33d6bb3daeb939ad7933499886470193c7a814', 'candidate/a-scenarios.mjs': 'e4bc72ed98c925f0d7017ecdbaf3c92f3d0deec4aa3de8b4cb9299a4384aa865', 'candidate/a-session-allocation-oracle.mjs': '5acd9d552499664c89bbf3dbd822a506d26b7a20e82d128c89a1188ebcb9f3d8', 'candidate/a-vite.config.template.mjs': '8f57cd5908efeaf0e4deb67bedd9341a7640e1b6cb9aaf6be64b29fc4d7fbdfc', 'candidate/a.correction-live-app.template.mjs': '953dc30b6431cbefcc15583a86ce225c42182b92f9e60bbf6a142ee3aa5e8fdd', 'candidate/captured-conversation-identity.mjs': 'dfd0bca1d0469af4e442bb96d25f401b42255e1e06097d744725733bac63da24', 'candidate/captured-five-responses.json': 'cfb7c58d2bb4563d4480553ca9c62e6e343cc6edc04cb5379dc15e7b0f2f244d', 'candidate/f1-ui-observers.mjs': 'efd1148116b158a3df4e4d1be71db7ae3e5378f3b2ceb0cee9a190ddf21845c7', 'candidate/fixed-clock.mjs': '814a21374df6b3d0dd5317f412b50afb5ed026ac6fa8909bcb444d8af7ce5b06', 'candidate/paired-migration-oracle.mjs': '384324372bc83bf6fb69d82396afc269d99a3c81e3f4f5621b48c2f4710f9e41', 'candidate/prepare-a-api0-gate.py': 'c211cea2a51684c4698c15e49db160add85e246d67b6ff161b1ef1d26d509cdc', 'candidate/r0-captured-evidence.mjs': '4228d9ab80b214738a510dd48622db4e291378072030b96702c8582cdb8faa0f', 'candidate/read-unless-stopped.mjs': '90cf181c39e02ab2b8fdab111cdecb739b58455a1f092df142fcc0299308dc9f', 'candidate/replay-dispatch.mjs': 'd9d6eae9b0d4e596f8e22d498822f3ae858f8a5cdb6e41d0405dc612d90e196c', 'candidate/source-pins.json': '3a1bbb127c82755b35b9ef5b82e2ecc2f0a5420e9d73b4b48a46311897d8cf25', 'candidate/startup-ready.mjs': 'd0d8adb0f428a75ae0249460763938a84ecc06e516f32436c616d94a6d84fe63', 'execution-wrapper/run-a-case1-api0.py': '62062447175aca8acfe19b782bbf3c56e5d21a243972defd04ae1ee749d0468d', 'manifest.json': '7eeca64f5c4c7a05b5e065af04583ca88aabfa11b6bbce6ca9e3a15af734d6d0'}
          expectedSizes={'candidate/a-correction-oracles.mjs': 3503, 'candidate/a-playwright.config.template.mjs': 1129, 'candidate/a-route-contract.mjs': 5953, 'candidate/a-scenarios.mjs': 868, 'candidate/a-session-allocation-oracle.mjs': 7780, 'candidate/a-vite.config.template.mjs': 2265, 'candidate/a.correction-live-app.template.mjs': 17417, 'candidate/captured-conversation-identity.mjs': 3119, 'candidate/captured-five-responses.json': 131032, 'candidate/f1-ui-observers.mjs': 25327, 'candidate/fixed-clock.mjs': 1501, 'candidate/paired-migration-oracle.mjs': 4542, 'candidate/prepare-a-api0-gate.py': 2827, 'candidate/r0-captured-evidence.mjs': 5891, 'candidate/read-unless-stopped.mjs': 490, 'candidate/replay-dispatch.mjs': 2118, 'candidate/source-pins.json': 16594, 'candidate/startup-ready.mjs': 1779, 'execution-wrapper/run-a-case1-api0.py': 23878, 'manifest.json': 3505}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
              rows=archive.getmembers()
              assert len(rows)==len(expected) and sorted(row.name for row in rows)==sorted(expected)
              values={}
              for row in rows:
                  assert row.isfile() and row.name in expected and row.size == expectedSizes[row.name]
                  value=archive.extractfile(row).read();assert len(value)==row.size
                  assert hashlib.sha256(value).hexdigest()==expected[row.name]
                  values[row.name]=value
              for name,value in values.items():
                  target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(value)
          PYBUNDLE
      - name: Original A case1 exact-five-response API0 and Save/reload
        id: live_app
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          test -z "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"; test -z "$GOOGLE_API_KEY"
          mkdir -p "$RUNNER_TEMP/a-case1-api0-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/a-case1-api0-home" PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            ISSUE488_A_CASE1_API0_SLOT_GRANTED=yes CI=true TZ=UTC WRANGLER_SEND_METRICS=false \
            python3 "$RUNNER_TEMP/a-case1-api0-bundle/execution-wrapper/run-a-case1-api0.py" \
            --root "$PWD" --node "$(command -v node)" --playwright "$RUNNER_TEMP/a-case1-api0-pw/node_modules" \
            --output "$RUNNER_TEMP/a-case1-api0-execution-1" \
            > "$RUNNER_TEMP/a-case1-api0-artifacts/runner.log" 2>&1
          python3 - <<'PYTERMINAL'
          import json,os,pathlib
          receipt=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'a-case1-api0-execution-1/terminal-receipt.json').read_text())
          assert receipt['result']=='passed' and receipt['lastStage']=='completed'
          assert type(receipt['processExitCode']) is int and receipt['processExitCode']==0
          assert receipt['immutableBeforeAfterEqual'] is True and receipt['narrowBeforeAfterEqual'] is True
          PYTERMINAL
      - name: Preserve bounded diagnostics inside the single proven artifact root
        id: diagnostic_stage
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/a-case1-api0-execution-1"
          DEST="$RUNNER_TEMP/a-case1-api0-artifacts/execution"
          # Small diagnostics also survive in the job log if artifact delivery fails.
          python3 - <<'PYDIAGNOSTICS'
          import json,os,pathlib,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'a-case1-api0-execution-1'
          receipt=root/'terminal-receipt.json'
          try:
              meta=receipt.lstat()
              if not stat.S_ISREG(meta.st_mode) or meta.st_size>8*1024*1024:
                  raise ValueError('Receipt is not a bounded regular file')
              value=json.loads(receipt.read_text())
              if not isinstance(value,dict):raise TypeError('Receipt is not an object')
              keys=['lastStage','processExitCode','result','error','afterError','immutableBeforeAfterEqual','narrowBeforeAfterEqual']
              print('A_CASE1_API0_TERMINAL_DIAGNOSTIC '+json.dumps({k:value.get(k) for k in keys})[:8192])
          except Exception as exc:print('A_CASE1_API0_TERMINAL_DIAGNOSTIC unavailable: '+type(exc).__name__)
          log=root/'playwright.log'
          try:
              meta=log.lstat()
              if not stat.S_ISREG(meta.st_mode):raise ValueError('Log is not a regular file')
              with log.open('rb') as stream:
                  stream.seek(max(0,meta.st_size-24576));tail=stream.read(24576).decode('utf-8',errors='replace')
              print('A_CASE1_API0_PLAYWRIGHT_FAILURE_TAIL_BEGIN\n'+'\n'.join(tail.splitlines()[-80:])+'\nA_CASE1_API0_PLAYWRIGHT_FAILURE_TAIL_END')
          except Exception as exc:print('A_CASE1_API0_PLAYWRIGHT_FAILURE_TAIL unavailable: '+type(exc).__name__)
          PYDIAGNOSTICS
          test -d "$SRC"; test ! -e "$DEST"
          # Copy only generated evidence/input records, excluding disposable browser/temp and Vite caches.
          python3 - <<'PYBOUNDS'
          import os,pathlib,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'a-case1-api0-execution-1';count=0;size=0
          for parent,dirs,files in os.walk(root,followlinks=False):
              here=pathlib.Path(parent)
              dirs[:]=[name for name in dirs if here/name not in [root/'tmp',root/'app/vite-cache']]
              for name in dirs+files:
                  item=here/name;mode=item.lstat().st_mode
                  assert stat.S_ISREG(mode) or stat.S_ISDIR(mode), 'Non-regular diagnostic input'
                  if stat.S_ISREG(mode):count+=1;size+=item.stat().st_size
          assert count<=10000 and size<=256*1024*1024, 'Diagnostic evidence exceeds bounded upload scope'
          print('A_CASE1_API0_DIAGNOSTIC_COPY_BOUNDS files='+str(count)+' bytes='+str(size))
          PYBOUNDS
          mkdir -p "$DEST"
          for entry in "$SRC"/*; do
            test -e "$entry" || continue
            name="$(basename "$entry")"
            if test "$name" = tmp; then continue; fi
            if test "$name" = app; then
              mkdir -p "$DEST/app"
              for child in "$entry"/*; do
                test -e "$child" || continue
                if test "$(basename "$child")" = vite-cache; then continue; fi
                cp -a -- "$child" "$DEST/app/"
              done
            else cp -a -- "$entry" "$DEST/"
            fi
          done
          test -f "$DEST/terminal-receipt.json"
          cmp "$SRC/terminal-receipt.json" "$DEST/terminal-receipt.json"
      - name: Require the immutable product source after every attempted gate
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"; test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          sha256sum -c "$RUNNER_TEMP/a-case1-api0-artifacts/app-manifests.sha256"
      - name: Upload synthetic evidence on success or failure
        if: ${{ always() && steps.event_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue488-a-case1-api0-source-${{ env.SOURCE_SHA }}-event-${{ github.sha }}
          path: ${{ runner.temp }}/a-case1-api0-artifacts/
          if-no-files-found: error
          retention-days: 14
