name: QA Result Summary

on:
  workflow_run:
    workflows:
      - Browser Regression
      - UI Regression Matrix
      - UI Quality Automation
      - Test Intelligence
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish stable PR QA summary
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const repository = `${owner}/${repo}`;
            if (run.head_repository?.full_name !== repository || typeof run.head_sha !== 'string' || !run.head_sha) {
              core.notice('QA run source repository or head SHA is not eligible for same-repository PR summaries.');
              return;
            }
            let candidates = run.pull_requests || [];

            if (candidates.length === 0 && run.head_branch) {
              const { data } = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${run.head_branch}`, per_page: 10 });
              candidates = data;
            }

            // Both event associations and branch matches are candidates only.
            // Check the current PR head before allowing this run to publish.
            const pulls = [];
            for (const candidate of candidates) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: candidate.number });
              if (pr.state === 'open' && pr.head?.repo?.full_name === repository && pr.head?.sha === run.head_sha) {
                pulls.push(pr);
              }
            }

            if (pulls.length === 0) {
              core.notice('No open same-repository pull request matches this QA run head SHA.');
              return;
            }

            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
            const jobs = jobsData.jobs.map((job) => ({ name: job.name, status: job.status, conclusion: job.conclusion, url: job.html_url }));
            const isMatrix = run.name === 'UI Regression Matrix';
            const targetedJobs = jobs.some((job) => job.name === 'targeted-webkit-summary' || job.name.startsWith('targeted-webkit ('));
            const standardJobs = jobs.some((job) => job.name === 'cross-browser-smoke' || job.name.startsWith('cross-browser-projects (') || (job.name === 'visual-regression' && job.status === 'completed' && ['success', 'failure', 'timed_out'].includes(job.conclusion)));
            // Job identities are emitted by the selected Matrix branch. A cancelled
            // run with missing or mixed identities cannot overwrite either summary.
            if (isMatrix && targetedJobs === standardJobs) {
              core.notice('Matrix result scope is missing or ambiguous; preserving existing QA summaries.');
              return;
            }
            const isTargeted = isMatrix && targetedJobs;
            const marker = `<!-- studyplanner-qa-summary:${run.name}${isTargeted ? ':targeted-webkit' : ''} -->`;
            // Job names come from the triggering workflow. Encode punctuation so
            // metadata cannot introduce links, HTML, or extra table cells/rows.
            const literalJobName = (name) => {
              const text = String(name).replace(/[\r\n]+/g, ' ');
              const escaped = text.replace(/[\u0021-\u002f\u003a-\u0040\u005b-\u0060\u007b-\u007e]/g, (char) => `&#${char.charCodeAt(0)};`);
              return `<code>${escaped}</code>`;
            };
            const rows = jobs.map((job) => `| ${literalJobName(job.name)} | ${job.status} | ${job.conclusion || '-'} | [log](${job.url}) |`).join('\n');
            const payload = { schemaVersion: 1, workflow: run.name, runId: run.id, status: run.status, conclusion: run.conclusion, headBranch: run.head_branch, headSha: run.head_sha, runUrl: run.html_url, jobs, ...(isTargeted ? { scope: 'targeted-webkit' } : {}) };
            const body = [marker, `QA summary: ${run.name}${isTargeted ? ' (targeted WebKit)' : ''}`, ...(isTargeted ? ['', 'Diagnostic only: this result does not replace the full UI Regression Matrix gate.'] : []), '', `Run conclusion: \`${run.conclusion || run.status}\``, '', '| Job | Status | Conclusion | Details |', '| --- | --- | --- | --- |', rows || '| no jobs | - | - | - |', '', '<details><summary>Machine-readable result</summary>', '', '```json', JSON.stringify(payload, null, 2), '```', '</details>'].join('\n');

            for (const pr of pulls) {
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number, per_page: 100 });
              const previous = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.startsWith(`${marker}\n`));
              if (previous) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
            }
