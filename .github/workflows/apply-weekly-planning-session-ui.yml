name: Apply weekly planning session UI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply-weekly-planning-session-ui.mjs
      - .github/workflows/apply-weekly-planning-session-ui.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply UI ownership changes
        run: node scripts/apply-weekly-planning-session-ui.mjs
      - run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Targeted session tests
        run: npm run test:run -- src/components/weeklyPlanningConversationMode.test.ts src/components/WeeklyPlanningConversation.test.tsx src/features/weeklyPlanning/weeklyPlanningReducer.test.ts src/features/weeklyPlanning/weeklyPlanningConversationPersistence.test.ts src/features/weeklyPlanning/weeklyPlanningSessionState.property.test.ts
      - name: Full tests
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Commit verified UI ownership changes
        run: |
          rm scripts/apply-weekly-planning-session-ui.mjs .github/workflows/apply-weekly-planning-session-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 週間計画の非同期turnと承認をsession管理"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
