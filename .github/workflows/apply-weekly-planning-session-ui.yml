name: Apply weekly planning session UI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply-weekly-planning-session-ui.mjs
      - .github/workflows/apply-weekly-planning-session-ui.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Adjust duplicate App anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-weekly-planning-session-ui.mjs')
          source = path.read_text()
          before = """  if (count !== 1) throw new Error(`${path}: expected one anchor, got ${count}`);
          writeFileSync(path, source.replace(before, after), 'utf8');"""
          after = """  if (count !== 1) {
            if (path === 'src/App.tsx' && before.includes('onRemoveWeeklyDraftBlock')) {
              if (count === 2) {
                writeFileSync(path, source.split(before).join(after), 'utf8');
                return;
              }
              if (count === 0) return;
            }
            throw new Error(`${path}: expected one anchor, got ${count}`);
          }
          writeFileSync(path, source.replace(before, after), 'utf8');"""
          if source.count(before) != 1:
              raise SystemExit('replaceOnce helper anchor mismatch')
          path.write_text(source.replace(before, after))
          PY
      - name: Apply UI ownership changes
        id: apply
        continue-on-error: true
        run: node scripts/apply-weekly-planning-session-ui.mjs > session-ui-script.log 2>&1
      - name: Save script failure
        if: ${{ steps.apply.outcome == 'failure' }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f session-ui-script.log
          git commit -m "feat: session UI script失敗内容を記録"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1
      - run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Targeted session tests
        run: npm run test:run -- src/components/weeklyPlanningConversationMode.test.ts src/components/WeeklyPlanningConversation.test.tsx src/features/weeklyPlanning/weeklyPlanningReducer.test.ts src/features/weeklyPlanning/weeklyPlanningConversationPersistence.test.ts src/features/weeklyPlanning/weeklyPlanningSessionState.property.test.ts
      - name: Full tests
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Commit verified UI ownership changes
        run: |
          rm scripts/apply-weekly-planning-session-ui.mjs .github/workflows/apply-weekly-planning-session-ui.yml
          rm -f session-ui-script.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 週間計画の非同期turnと承認をsession管理"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
