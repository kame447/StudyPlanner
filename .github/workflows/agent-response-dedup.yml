name: Agent response dedup

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/weekly-planning-response-dedup

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-response-dedup
          show-progress: false
      - name: Apply verified implementation patch
        run: |
          cat > /tmp/response-dedup.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/response-dedup.patch.gz.b64 | gzip -d > /tmp/response-dedup.patch
          echo '420e24b3c732e0184bf42eabb1154b9d33c6638e2c896c2a25dac2e4ccb48c23  /tmp/response-dedup.patch' | sha256sum -c -
          git apply --check /tmp/response-dedup.patch
          git apply /tmp/response-dedup.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - name: Focused response tests
        run: npm run test:run -- src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueText.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningBehaviorAwareDialoguePlanner.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningAiDialogueRenderer.test.ts src/features/weeklyPlanning/weeklyPlanningReducer.test.ts
      - name: TypeScript
        run: npx tsc -b
      - name: Weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git rm .github/patches/response-dedup.patch.b64.*
          git rm .github/workflows/agent-response-dedup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/weeklyPlanning
          git commit -m "feat: 不要な了解と重複応答を防止する"
          git push origin HEAD:agent/weekly-planning-response-dedup
