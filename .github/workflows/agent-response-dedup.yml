name: Agent response dedup source export

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/weekly-planning-response-dedup

permissions:
  contents: read

jobs:
  export-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-response-dedup
          show-progress: false
      - name: Export source snapshot
        run: tar -czf /tmp/studyplanner-response-dedup-source.tgz --exclude=.git --exclude=node_modules --exclude=dist .
      - uses: actions/upload-artifact@v4
        with:
          name: studyplanner-response-dedup-source
          path: /tmp/studyplanner-response-dedup-source.tgz
