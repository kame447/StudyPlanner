    occurrenceDate: '2026-09-01',
    actualStartTime: '09:00',
    actualEndTime: '10:00',
    subject: 'Math',
    note: '',
    updatedAt: '2026-09-01T10:00:00.000Z',
    ...overrides,
  };
}

function createGateway(seed: { plans?: Plan[]; actuals?: Actual[]; failActualWrite?: boolean }) {
  const state = {
    plans: [...(seed.plans ?? [])],
    actuals: [...(seed.actuals ?? [])],
    dayNotes: [] as DayNote[],
    monthEvents: [] as MonthEvent[],
    todos: [] as TodoTask[],
    studySubjects: [] as StudySubject[],
    studyMaterials: [] as StudyMaterial[],
    scheduleTemplates: [] as ScheduleTemplate[],
    timetableTerms: [] as TimetableTerm[],
    timetablePeriods: [] as TimetablePeriod[],
  };
  let failActualWrite = seed.failActualWrite ?? false;
  const gateway: PlannerStorageGateway = {
    async readPlans() { return state.plans; },
    async writePlans(items) { state.plans = [...items]; },
    async readActuals() { return state.actuals; },
    async writeActuals(items) {
      if (failActualWrite) {
        failActualWrite = false;
        throw new Error('actual write failed');
      }
      state.actuals = [...items];
    },
    async readDayNotes() { return state.dayNotes; },
    async writeDayNotes(items) { state.dayNotes = [...items]; },
    async readMonthEvents() { return state.monthEvents; },
    async writeMonthEvents(items) { state.monthEvents = [...items]; },
    async readTodos() { return state.todos; },
    async writeTodos(items) { state.todos = [...await items]; },
    async readStudySubjects() { return state.studySubjects; },
    async writeStudySubjects(items) { state.studySubjects = [...await items]; },
    async readStudyMaterials() { return state.studyMaterials; },
    async writeStudyMaterials(items) { state.studyMaterials = [...await items]; },
    async readScheduleTemplates() { return state.scheduleTemplates; },
    async writeScheduleTemplates(items) { state.scheduleTemplates = [...await items]; },
    async readTimetableTerms() { return state.timetableTerms; },
    async writeTimetableTerms(items) { state.timetableTerms = [...await items]; },
    async readTimetablePeriods() { return state.timetablePeriods; },
    async writeTimetablePeriods(items) { state.timetablePeriods = [...await items]; },
  };
  return { state, gateway };
}

function mutation(overrides: Partial<RecurringPlanMutation> = {}): RecurringPlanMutation {
  return {
    planUpserts: [],
    planDeletes: [],
    actualUpserts: [],
    actualDeletes: [],
    ...overrides,
  };
}

describe('planner repository recurring mutation boundary', () => {
  it('applies Plan and Actual changes as one logical repository operation', async () => {
    const source = plan();
    const linked = actual();
    const { state, gateway } = createGateway({ plans: [source], actuals: [linked] });
    const repository = createPlannerRepository(gateway);
    const nextPlan = plan({ title: 'Updated', updatedAt: '2026-09-01T01:00:00.000Z' });
    const nextActual = actual({ planId: 'plan-2' });

    await repository.applyRecurringPlanMutation(
      'user-1',
      mutation({ planUpserts: [nextPlan], actualUpserts: [nextActual] }),
    );

    expect(state.plans[0]?.title).toBe('Updated');
    expect(state.actuals[0]?.planId).toBe('plan-2');
  });

  it('rolls Plan storage back when the following Actual write fails', async () => {
    const source = plan();
    const linked = actual();
    const { state, gateway } = createGateway({
      plans: [source],
      actuals: [linked],
      failActualWrite: true,
    });
    const repository = createPlannerRepository(gateway);

    await expect(
      repository.applyRecurringPlanMutation(
        'user-1',
        mutation({
          planUpserts: [plan({ title: 'Should rollback' })],
          actualDeletes: [linked.id],
        }),
      ),
    ).rejects.toThrow('actual write failed');

    expect(state.plans).toEqual([source]);
    expect(state.actuals).toEqual([linked]);
  });

  it('does not delete records owned by another user even when ids are supplied', async () => {
    const ownPlan = plan();
    const otherPlan = plan({ id: 'other-plan', userId: 'user-2' });
    const ownActual = actual();
    const otherActual = actual({ id: 'other-actual', userId: 'user-2', planId: otherPlan.id });
    const { state, gateway } = createGateway({
      plans: [ownPlan, otherPlan],
      actuals: [ownActual, otherActual],
    });
    const repository = createPlannerRepository(gateway);

    await repository.applyRecurringPlanMutation(
      'user-1',
      mutation({
        planDeletes: [otherPlan.id],
        actualDeletes: [otherActual.id],
      }),
    );

    expect(state.plans).toContainEqual(otherPlan);
    expect(state.actuals).toContainEqual(otherActual);
  });

  it('rejects cross-owner upserts before writing either collection', async () => {
    const source = plan();
    const linked = actual();
    const { state, gateway } = createGateway({ plans: [source], actuals: [linked] });
    const repository = createPlannerRepository(gateway);

    await expect(
      repository.applyRecurringPlanMutation(
        'user-1',
        mutation({ planUpserts: [plan({ id: 'foreign', userId: 'user-2' })] }),
      ),
    ).rejects.toThrow('another user');

    expect(state.plans).toEqual([source]);
    expect(state.actuals).toEqual([linked]);
  });
});
