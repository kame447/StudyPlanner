    memo: '',
    createdAt: '2026-09-01T00:00:00.000Z',
    updatedAt: '2026-09-01T00:00:00.000Z',
    ...overrides,
  };
}

function draft(overrides: Partial<PlanDraft> = {}): PlanDraft {
  return {
    userId: 'user-1',
    title: 'Updated Math',
    subject: 'Math',
    date: '2026-09-03',
    startTime: '10:00',
    endTime: '11:00',
    repeat: 'none',
    repeatUntil: null,
    excludedDates: [],
    recurrenceRules: [rule()],
    type: 'study',
    memo: '',
    ...overrides,
  };
}

function actual(overrides: Partial<Actual> = {}): Actual {
  return {
    id: 'actual-1',
    userId: 'user-1',
    planId: 'plan-1',
    occurrenceDate: '2026-09-01',
    actualStartTime: '09:00',
    actualEndTime: '10:00',
    title: 'Math',
    subject: 'Math',
    note: '',
    updatedAt: '2026-09-01T10:00:00.000Z',
    ...overrides,
  };
}

describe('recurring plan mutation ownership', () => {
  it('derives future plan split and Actual rebind from the same boundary', () => {
    const source = plan();
    const mutation = buildRecurringPlanEditMutation(
      [source],
      [
        actual({ id: 'past', occurrenceDate: '2026-09-02' }),
        actual({ id: 'future', occurrenceDate: '2026-09-03' }),
        actual({ id: 'later', occurrenceDate: '2026-09-05' }),
        actual({ id: 'wrong-user', userId: 'user-2', occurrenceDate: '2026-09-04' }),
      ],
      source,
      '2026-09-03',
      draft(),
      'future',
    );

    const created = mutation.planUpserts.find((item) => item.id !== source.id);
    expect(created).toBeDefined();
    expect(mutation.actualUpserts.map((item) => item.id)).toEqual(['future', 'later']);
    expect(mutation.actualUpserts.every((item) => item.planId === created?.id)).toBe(true);
    expect(mutation.actualDeletes).toEqual([]);
  });

  it('limits all-series edits to the source owner', () => {
    const source = plan();
    const sibling = plan({ id: 'plan-2' });
    const wrongOwner = plan({ id: 'plan-other-user', userId: 'user-2' });
    const unrelated = plan({ id: 'unrelated', seriesId: 'series-2' });
    const mutation = buildRecurringPlanEditMutation(
      [source, sibling, wrongOwner, unrelated],
      [],
      source,
      '2026-09-03',
      draft(),
      'all',
    );

    expect(mutation.planUpserts.map((item) => item.id).sort()).toEqual(['plan-1', 'plan-2']);
  });

  it('deletes only one occurrence Actual for single delete', () => {
    const source = plan();
    const mutation = buildRecurringPlanDeleteMutation(
      [source],
      [
        actual({ id: 'target', occurrenceDate: '2026-09-03' }),
        actual({ id: 'other', occurrenceDate: '2026-09-04' }),
      ],
      source,
      '2026-09-03',
      'single',
    );

    expect(mutation.planUpserts).toHaveLength(1);
    expect(mutation.actualDeletes).toEqual(['target']);
  });

  it('deletes future Actuals from the same boundary as the truncated plan', () => {
    const source = plan();
    const mutation = buildRecurringPlanDeleteMutation(
      [source],
      [
        actual({ id: 'past', occurrenceDate: '2026-09-02' }),
        actual({ id: 'boundary', occurrenceDate: '2026-09-03' }),
        actual({ id: 'future', occurrenceDate: '2026-09-05' }),
      ],
      source,
      '2026-09-03',
      'future',
    );

    expect(mutation.planUpserts).toHaveLength(1);
    expect(mutation.actualDeletes).toEqual(['boundary', 'future']);
  });

  it('deletes only owned series Plans and their owned linked Actuals for all', () => {
    const source = plan();
    const sibling = plan({ id: 'plan-2' });
    const wrongOwner = plan({ id: 'wrong-owner-plan', userId: 'user-2' });
    const unrelated = plan({ id: 'unrelated', seriesId: 'series-2' });
    const mutation = buildRecurringPlanDeleteMutation(
      [source, sibling, wrongOwner, unrelated],
      [
        actual({ id: 'a1', planId: source.id }),
        actual({ id: 'a2', planId: sibling.id }),
        actual({ id: 'wrong-user', userId: 'user-2', planId: source.id }),
        actual({ id: 'standalone', planId: null }),
      ],
      source,
      '2026-09-03',
      'all',
    );

    expect(mutation.planDeletes.sort()).toEqual(['plan-1', 'plan-2']);
    expect(mutation.actualDeletes.sort()).toEqual(['a1', 'a2']);
  });
});
'''
