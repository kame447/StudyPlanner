name: Issue 266 Implementation Patch

on:
  push:
    branches:
      - refactor/issue266-recurring-plan-mutations
    paths:
      - .github/workflows/issue266-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue266-recurring-plan-mutations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          recurring = Path('src/domain/recurringPlan.ts')
          text = recurring.read_text()
          text = text.replace("import type {\n  Plan,", "import type {\n  Actual,\n  Plan,", 1)
          append = r'''

export interface RecurringPlanMutation {
  planUpserts: Plan[];
  planDeletes: string[];
  actualUpserts: Actual[];
  actualDeletes: string[];
}

function emptyRecurringPlanMutation(): RecurringPlanMutation {
  return {
    planUpserts: [],
    planDeletes: [],
    actualUpserts: [],
    actualDeletes: [],
  };
}

function getRecurringSeriesId(plan: Plan): string {
  return plan.seriesId || plan.id;
}

function getOwnedSeriesPlans(plans: Plan[], sourcePlan: Plan): Plan[] {
  const seriesId = getRecurringSeriesId(sourcePlan);
  return plans.filter(
    (plan) =>
      plan.userId === sourcePlan.userId &&
      getRecurringSeriesId(plan) === seriesId,
  );
}

function getOwnedLinkedActuals(
  actuals: Actual[],
  userId: string,
  planIds: string[],
): Actual[] {
  const planIdSet = new Set(planIds);
  return actuals.filter(
    (actual) =>
      actual.userId === userId &&
      typeof actual.planId === 'string' &&
      planIdSet.has(actual.planId),
  );
}

function assertRecurringDraftOwner(sourcePlan: Plan, draft: PlanDraft): void {
  if (draft.userId !== sourcePlan.userId) {
    throw new Error('Recurring plan edit owner does not match the source plan.');
  }
}

export function buildRecurringPlanEditMutation(
  plans: Plan[],
  actuals: Actual[],
  sourcePlan: Plan,
  occurrenceDate: string,
  draft: PlanDraft,
  scope: RecurringPlanScope,
): RecurringPlanMutation {
  assertRecurringDraftOwner(sourcePlan, draft);

  if (scope === 'all') {
    return {
      ...emptyRecurringPlanMutation(),
      planUpserts: getOwnedSeriesPlans(plans, sourcePlan).map((plan) =>
        applyRecurringPlanSeriesEdit(plan, draft),
      ),
    };
  }

  const editResult = applyRecurringPlanEditScope(
    sourcePlan,
    occurrenceDate,
    draft,
    scope,
  );
  const mutation = emptyRecurringPlanMutation();

  if (editResult.updatedPlan) {
    mutation.planUpserts.push(editResult.updatedPlan);
  } else {
    mutation.planDeletes.push(sourcePlan.id);
  }

  if (editResult.createdPlan) {
    mutation.planUpserts.push(editResult.createdPlan);
  }

  if (scope === 'future' && editResult.createdPlan) {
    mutation.actualUpserts = actuals
      .filter(
        (actual) =>
          actual.userId === sourcePlan.userId &&
          actual.planId === sourcePlan.id &&
          actual.occurrenceDate.localeCompare(occurrenceDate) >= 0,
      )
      .map((actual) => ({
        ...actual,
        planId: editResult.createdPlan?.id ?? actual.planId,
      }));
  }

  if (editResult.updatedPlan === null) {
    const reboundIds = new Set(mutation.actualUpserts.map((actual) => actual.id));
    mutation.actualDeletes = actuals
      .filter(
        (actual) =>
          actual.userId === sourcePlan.userId &&
          actual.planId === sourcePlan.id &&
          !reboundIds.has(actual.id),
      )
      .map((actual) => actual.id);
  }

  return mutation;
}

export function buildRecurringPlanDeleteMutation(
  plans: Plan[],
  actuals: Actual[],
  sourcePlan: Plan,
  occurrenceDate: string,
  scope: RecurringPlanScope,
): RecurringPlanMutation {
  if (scope === 'all') {
    const seriesPlans = getOwnedSeriesPlans(plans, sourcePlan);
    const planDeletes = seriesPlans.map((plan) => plan.id);
    return {
      ...emptyRecurringPlanMutation(),
      planDeletes,
      actualDeletes: getOwnedLinkedActuals(
        actuals,
        sourcePlan.userId,
        planDeletes,
      ).map((actual) => actual.id),
    };
  }

  const nextPlan = applyRecurringPlanDeleteScope(
    sourcePlan,
    occurrenceDate,
    scope,
  );
  const mutation = emptyRecurringPlanMutation();

  if (nextPlan) {
    mutation.planUpserts.push(nextPlan);
    mutation.actualDeletes = actuals
      .filter(
        (actual) =>
          actual.userId === sourcePlan.userId &&
          actual.planId === sourcePlan.id &&
          (scope === 'single'
            ? actual.occurrenceDate === occurrenceDate
            : actual.occurrenceDate.localeCompare(occurrenceDate) >= 0),
      )
      .map((actual) => actual.id);
    return mutation;
  }

  mutation.planDeletes.push(sourcePlan.id);
  mutation.actualDeletes = getOwnedLinkedActuals(
    actuals,
    sourcePlan.userId,
    [sourcePlan.id],
  ).map((actual) => actual.id);
  return mutation;
}
'''
          if 'export interface RecurringPlanMutation' in text:
              raise SystemExit('recurring mutation contract already exists')
