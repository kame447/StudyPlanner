              "import type { RecurringPlanMutation } from '../domain/recurringPlan';\nimport type {\n  PlannerRepository,\n  PlannerStorageGateway,\n} from './repositoryContracts';",
              1,
          )
          helper = r'''

function assertRecurringMutationOwners(
  userId: string,
  mutation: RecurringPlanMutation,
): void {
  const hasWrongOwner =
    mutation.planUpserts.some((plan) => plan.userId !== userId) ||
    mutation.actualUpserts.some((actual) => actual.userId !== userId);

  if (hasWrongOwner) {
    throw new Error('Recurring plan mutation contains records owned by another user.');
  }
}

function applyRecurringPlanRecords(
  current: import('../types/domain').Plan[],
  userId: string,
  mutation: RecurringPlanMutation,
): import('../types/domain').Plan[] {
  const deleteIds = new Set(mutation.planDeletes);
  return mutation.planUpserts.reduce(
    (records, plan) => replaceById(records, plan),
    current.filter(
      (plan) => !(plan.userId === userId && deleteIds.has(plan.id)),
    ),
  );
}

function applyRecurringActualRecords(
  current: import('../types/domain').Actual[],
  userId: string,
  mutation: RecurringPlanMutation,
): import('../types/domain').Actual[] {
  const deleteIds = new Set(mutation.actualDeletes);
  return mutation.actualUpserts.reduce(
    (records, actual) => upsertActualRecord(records, actual),
    current.filter(
      (actual) => !(actual.userId === userId && deleteIds.has(actual.id)),
    ),
  );
}

function errorText(error: unknown): string {
  return error instanceof Error ? error.message : String(error);
}
'''
          anchor = "export function createPlannerRepository(\n"
          if text.count(anchor) != 1:
              raise SystemExit('planner repository function anchor mismatch')
          text = text.replace(anchor, helper + '\n' + anchor, 1)
          method = r'''    async applyRecurringPlanMutation(userId, mutation) {
      assertRecurringMutationOwners(userId, mutation);
      const hasPlanChanges =
        mutation.planUpserts.length > 0 || mutation.planDeletes.length > 0;
      const hasActualChanges =
        mutation.actualUpserts.length > 0 || mutation.actualDeletes.length > 0;

      if (!hasPlanChanges && !hasActualChanges) {
        return;
      }

      const previousPlans = await storageGateway.readPlans();
      const previousActuals = await storageGateway.readActuals();
      const nextPlans = applyRecurringPlanRecords(previousPlans, userId, mutation);
      const nextActuals = applyRecurringActualRecords(previousActuals, userId, mutation);
      let plansWritten = false;

      try {
        if (hasPlanChanges) {
          await storageGateway.writePlans(nextPlans);
          plansWritten = true;
        }
        if (hasActualChanges) {
          await storageGateway.writeActuals(nextActuals);
        }
      } catch (error) {
        if (plansWritten && hasActualChanges) {
          try {
            await storageGateway.writePlans(previousPlans);
          } catch (rollbackError) {
            throw new Error(
              `Recurring plan mutation failed (${errorText(error)}) and local rollback failed (${errorText(rollbackError)}).`,
            );
          }
        }
        throw error;
      }
    },
