          anchor = "export function createFirebasePlannerRepository(\n"
          if text.count(anchor) != 1:
              raise SystemExit('firebase factory anchor mismatch')
          text = text.replace(anchor, fbhelper + '\n' + anchor, 1)
          fbmethod = r'''    async applyRecurringPlanMutation(userId, mutation) {
      try {
        assertRecurringMutationOwners(userId, mutation);
        const operationCount =
          mutation.planUpserts.length +
          mutation.planDeletes.length +
          mutation.actualUpserts.length +
          mutation.actualDeletes.length;

        if (operationCount > 500) {
          throw new Error('Recurring plan mutation exceeds the Firestore batch limit.');
        }
        if (operationCount === 0) {
          return;
        }

        const batch = writeBatch(firestoreDb);
        mutation.planUpserts.forEach((plan) => {
          batch.set(
            doc(firestoreDb, 'plans', plan.id),
            stripUndefinedDeep(plan),
            { merge: true },
          );
        });
        mutation.planDeletes.forEach((planId) => {
          batch.delete(doc(firestoreDb, 'plans', planId));
        });
        mutation.actualUpserts.forEach((actual) => {
          batch.set(
            doc(firestoreDb, 'actuals', actual.id),
            stripUndefinedDeep(actual),
            { merge: true },
          );
        });
        mutation.actualDeletes.forEach((actualId) => {
          batch.delete(doc(firestoreDb, 'actuals', actualId));
        });
        await batch.commit();
      } catch (error) {
        throw new Error(
          normalizeErrorMessage(
            '繰り返し予定を保存できませんでした。',
            error as FirebaseLikeError,
          ),
        );
      }
    },
