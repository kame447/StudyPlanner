name: Temporary PR 243 Ready

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-pr243-ready.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 243 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 243 --repo "${{ github.repository }}"
