name: Live Account Browser Verification

env:
  NPM_CONFIG_REGISTRY: https://npm.flatt.tech/

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'One live spec under tests/e2e to run (empty runs every *.live.mjs)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: live-account-browser-verification
  cancel-in-progress: false

jobs:
  chromium-live-account:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: live-account-verification
    env:
      STUDYPLANNER_LIVE_BASE_URL: ${{ secrets.STUDYPLANNER_LIVE_BASE_URL }}
      STUDYPLANNER_LIVE_EMAIL: ${{ secrets.STUDYPLANNER_LIVE_EMAIL }}
      STUDYPLANNER_LIVE_PASSWORD: ${{ secrets.STUDYPLANNER_LIVE_PASSWORD }}
      STUDYPLANNER_LIVE_ACCESS_KEY: ${{ secrets.STUDYPLANNER_LIVE_ACCESS_KEY }}
      STUDYPLANNER_TRACE_E2E_EMAIL: ${{ secrets.STUDYPLANNER_TRACE_E2E_EMAIL }}
      STUDYPLANNER_TRACE_E2E_PASSWORD: ${{ secrets.STUDYPLANNER_TRACE_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Verify required live-account secrets are configured
        shell: bash
        run: |
          missing=0
          for name in STUDYPLANNER_LIVE_BASE_URL STUDYPLANNER_LIVE_EMAIL STUDYPLANNER_LIVE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.64.0

      - name: Install Chromium
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run isolated production account verification
        shell: bash
        env:
          LIVE_SPEC: ${{ inputs.spec }}
        run: |
          if [ -n "$LIVE_SPEC" ] && ! [[ "$LIVE_SPEC" =~ ^tests/e2e/[A-Za-z0-9._-]+\.live\.mjs$ ]]; then
            echo "::error::spec must be a tests/e2e/*.live.mjs path"
            exit 1
          fi
          ./tests/e2e/node_modules/.bin/playwright test --config=tests/e2e/playwright.live.config.mjs ${LIVE_SPEC:+"$LIVE_SPEC"}
