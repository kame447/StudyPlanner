name: Issue 156 Local Regression Gate

on:
  push:
    branches:
      - agent/issue156-prompt-simplification-adversarial-audit
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/issue156-local-regression-marker.yml'

permissions:
  contents: read

jobs:
  local-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Write pass marker
        run: |
          mkdir -p artifacts/issue156-local-regression
          printf 'typecheck=pass\nunit=pass\nbuild=pass\nsha=%s\n' "$GITHUB_SHA" > artifacts/issue156-local-regression/PASS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: issue156-local-regression-pass
          path: artifacts/issue156-local-regression/PASS.txt
          retention-days: 7
