name: Diagnose weekly planning dialogue repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run dialogue repair tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:run -- \
            src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueRepairPolicy.test.ts \
            src/features/weeklyPlanning/dialogue/weeklyPlanningBehaviorAwareDialoguePlanner.test.ts \
            2>&1 | tee dialogue-repair-tests.log
      - name: Run full test suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee full-tests.log
      - name: Run production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee production-build.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-dialogue-repair-diagnostics
          path: |
            dialogue-repair-tests.log
            full-tests.log
            production-build.log
