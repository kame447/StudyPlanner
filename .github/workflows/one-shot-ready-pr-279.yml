name: One-shot Ready PR 279

on:
  push:
    branches:
      - refactor/issue278-schedule-event-authority

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    if: github.repository == 'kame447/StudyPlanner'
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact PR and mark ready
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: '279'
          TARGET_BRANCH: refactor/issue278-schedule-event-authority
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          expected_head="$GITHUB_SHA"

          actual_branch="$(gh pr view "$TARGET_PR" --repo "$repo" --json headRefName --jq '.headRefName')"
          actual_head="$(gh pr view "$TARGET_PR" --repo "$repo" --json headRefOid --jq '.headRefOid')"
          is_draft="$(gh pr view "$TARGET_PR" --repo "$repo" --json isDraft --jq '.isDraft')"

          test "$actual_branch" = "$TARGET_BRANCH"
          test "$actual_head" = "$expected_head"
          test "$is_draft" = 'true'

          gh pr ready "$TARGET_PR" --repo "$repo"

          after_head="$(gh pr view "$TARGET_PR" --repo "$repo" --json headRefOid --jq '.headRefOid')"
          after_draft="$(gh pr view "$TARGET_PR" --repo "$repo" --json isDraft --jq '.isDraft')"

          test "$after_head" = "$expected_head"
          test "$after_draft" = 'false'
