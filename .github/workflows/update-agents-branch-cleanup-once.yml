name: Update AGENTS branch cleanup fallback once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-agents-branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update AGENTS policy and remove this workflow
        env:
          AGENTS_ADDITION_B64: 
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main

          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("AGENTS.md")
          text = path.read_text(encoding="utf-8")
          marker = "- Keep the repository limited to `main`, currently active implementation branches, and explicitly justified long-lived branches.\n"
          heading = "### Branch deletion fallback when direct GitHub deletion is unavailable"
          addition = base64.b64decode(os.environ["AGENTS_ADDITION_B64"]).decode("utf-8")

          if heading in text:
              raise SystemExit("AGENTS policy already contains the branch deletion fallback")
          if marker not in text:
              raise SystemExit("Branch lifecycle insertion marker not found")

          text = text.replace(marker, marker + "\n" + addition, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/update-agents-branch-cleanup-once.yml
          git add AGENTS.md
          git config user.name "kame447"
          git config user.email "76802107+kame447@users.noreply.github.com"
          git commit -m "docs: document safe branch deletion fallback"
          git push origin HEAD:main
