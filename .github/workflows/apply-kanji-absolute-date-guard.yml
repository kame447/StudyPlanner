name: Apply kanji absolute date guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  apply-test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - name: Apply implementation
        run: |
          python3 .github/scripts/apply-kanji-absolute-date-guard.py
          python3 .github/scripts/patch-kanji-date-weekday-regression.py
      - name: Diff check
        run: git diff --check
      - name: Focused regression
        id: focused
        shell: bash
        run: |
          set -o pipefail
          npm run test:run -- src/features/weeklyPlanning/intake/weeklyPlanningKanjiAbsoluteDateGuard.test.ts 2>&1 | tee focused-regression.log
      - name: Weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Full test suite
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Stage verified files
        if: success()
        run: |
          mkdir -p verified-files/src/features/weeklyPlanning/intake
          mkdir -p verified-files/src/features/weeklyPlanning/pipeline
          cp src/features/weeklyPlanning/intake/weeklyPlanningAbsoluteDate.ts verified-files/src/features/weeklyPlanning/intake/
          cp src/features/weeklyPlanning/intake/weeklyPlanningScopeParsing.ts verified-files/src/features/weeklyPlanning/intake/
          cp src/features/weeklyPlanning/intake/weeklyPlanningCandidateValidator.ts verified-files/src/features/weeklyPlanning/intake/
          cp src/features/weeklyPlanning/intake/weeklyPlanningKanjiAbsoluteDateGuard.test.ts verified-files/src/features/weeklyPlanning/intake/
          cp src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.ts verified-files/src/features/weeklyPlanning/pipeline/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kanji-absolute-date-run-output
          path: |
            focused-regression.log
            verified-files
          if-no-files-found: warn
