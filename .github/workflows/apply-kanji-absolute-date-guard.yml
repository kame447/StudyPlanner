name: Apply kanji absolute date guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - name: Apply implementation
        run: |
          python3 .github/scripts/apply-kanji-absolute-date-guard.py
          python3 .github/scripts/patch-kanji-date-weekday-regression.py
      - name: Diff check
        run: git diff --check
      - name: Focused regression
        run: npm run test:run -- src/features/weeklyPlanning/intake/weeklyPlanningKanjiAbsoluteDateGuard.test.ts
      - name: Weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Full test suite
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Commit verified implementation
        run: |
          rm .github/scripts/apply-kanji-absolute-date-guard.py
          rm .github/scripts/patch-kanji-date-weekday-regression.py
          rm .github/workflows/apply-kanji-absolute-date-guard.yml
          rm -f .github/workflows/pr-kanji-absolute-date-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 漢数字の絶対日付誤認を修正"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
