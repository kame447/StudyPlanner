name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - scripts/ci/firestore-profile-registration-rules.mjs
      - scripts/ci/deploy-firestore-rules.mjs
      - scripts/ci/deploy-firestore-rules.test.mjs
      - scripts/ci/verify-deployed-firestore-rules.mjs
      - scripts/ci/verify-deployed-firestore-rules.test.mjs
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-firestore-rules-production
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'kame447/StudyPlanner'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install locked Firebase CLI
        run: npm ci --prefix tools/firebase-tools --ignore-scripts

      - name: Run Firestore rules regression
        run: npm run test:firestore-rules

  deploy:
    needs: test
    if: github.repository == 'kame447/StudyPlanner'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: study-planner-d1bc8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: study-planner-d1bc8
          workload_identity_provider: projects/980145543174/locations/global/workloadIdentityPools/github-actions/providers/studyplanner-main
          service_account: firestore-rules-deployer@study-planner-d1bc8.iam.gserviceaccount.com
          token_format: access_token

      - name: Deploy Firestore rules
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/ci/deploy-firestore-rules.mjs

      - name: Verify deployed ruleset
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/ci/verify-deployed-firestore-rules.mjs
