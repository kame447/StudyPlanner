name: Apply weekly planning documentation cleanup

on:
  push:
    branches:
      - docs/weekly-planning-post-pr75-cleanup

permissions:
  contents: write

jobs:
  apply-verify-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo '2847072dd5a2109be9676670eb834bc3a3c5cb83942681c2fe3e430ccd7ea55a  .github/docs-cleanup/weekly-planning-md-cleanup.patch.gz.b64' | sha256sum --check
          base64 --decode .github/docs-cleanup/weekly-planning-md-cleanup.patch.gz.b64 | gzip --decompress > /tmp/weekly-planning-md-cleanup.patch
          echo 'ae6f778bce86626148db9b9690ea502a161aad0386e358977d79aa5266c1d8f7  /tmp/weekly-planning-md-cleanup.patch' | sha256sum --check
          git apply --index /tmp/weekly-planning-md-cleanup.patch
          git rm -r .github/docs-cleanup .github/workflows/weekly-planning-md-cleanup.yml
      - name: Validate markdown organization
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          test ! -d docs/ai/audits/20260722-pr75-final
          test ! -e docs/ai/tasks/20260719-weekly-planning-ai-responsibility-boundary.md
          test ! -e docs/ai/tasks/20260719-weekly-planning-rules-end-to-end-integration-test.md
          test ! -e docs/ai/tasks/20260720-pr68-final-audit-fix-plan.md
          test ! -e docs/ai/tasks/20260721-weekly-planning-ai-semantic-ownership.md
          test ! -e docs/ai/tasks/20260721-weekly-planning-trace-server-authoritative-ids.md
          test -e docs/ai/tasks/closed/20260722-weekly-planning-ai-only-semantic-boundary-and-seven-audit.md
          test -e docs/ai/tasks/closed/20260720-pr68-final-audit-fix-plan.md
          test -e docs/ai/tasks/closed/20260721-weekly-planning-trace-server-authoritative-ids.md
          test -e docs/ai/tasks/superseded/20260719-weekly-planning-ai-responsibility-boundary.md
          test -e docs/ai/tasks/superseded/20260719-weekly-planning-rules-end-to-end-integration-test.md
          test -e docs/ai/tasks/superseded/20260721-weekly-planning-ai-semantic-ownership.md
          test "$(find docs/ai/tasks -maxdepth 1 -type f -name '*.md' | wc -l)" -eq 12
          ! grep -F 'deterministic baselineを先に適用する' docs/ai/weekly-planning-current-contract-status.md docs/ai/strategy/weekly-planning-roadmap.md
          ! grep -F 'Status: canonical / active post-merge status' docs/ai/weekly-planning-pr5-post-merge-status.md
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          targets = [
              Path('docs/ai/strategy/weekly-planning-roadmap.md'),
              Path('docs/ai/weekly-planning-current-contract-status.md'),
              Path('docs/ai/weekly-planning-docs-index.md'),
              Path('docs/ai/weekly-planning-pr5-post-merge-status.md'),
              Path('docs/ai/tasks/closed/20260722-weekly-planning-ai-only-semantic-boundary-and-seven-audit.md'),
          ]
          failures = []
          pattern = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          for source in targets:
              text = source.read_text(encoding='utf-8')
              for raw_target in pattern.findall(text):
                  target = raw_target.split('#', 1)[0].strip()
                  if not target or target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  resolved = (source.parent / target).resolve()
                  if not resolved.exists():
                      failures.append(f'{source}: missing {raw_target}')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: 週間計画の契約文書と監査記録を整理'
          git push origin HEAD:docs/weekly-planning-post-pr75-cleanup
