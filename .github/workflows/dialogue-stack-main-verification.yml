name: Dialogue stack verification on main

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  verify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: ${{ runner.temp }}/dialogue-stack-main-verification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Prepare output directory
        run: mkdir -p "$OUT"
      - name: Record repository state
        run: |
          {
            echo "base_sha=${{ github.event.pull_request.base.sha }}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current)"
            git status -sb
            git log -1 --oneline
          } | tee "$OUT/repository-state.txt"
      - run: npm ci
      - name: Enumerate current tests
        run: |
          find src/features/weeklyPlanning -type f -name '*.test.ts' | sort > "$OUT/weekly-planning-test-files.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          out = Path(os.environ['OUT'])
          terms = (
              'assumption', 'approval', 'dialogue', 'relative', 'feasibility',
              'behavior', 'conversation', 'storage', 'preview', 'turn', 'reducer',
              'property', 'range', 'period', 'fixed', 'candidate', 'interpreter',
              'acknowledgement', 'session', 'lifecycle', 'orchestrator', 'ui',
          )
          files = [line.strip() for line in (out / 'weekly-planning-test-files.txt').read_text().splitlines()]
          selected = [path for path in files if any(term in path.lower() for term in terms)]
          if not selected:
              raise SystemExit('no targeted weekly-planning tests found')
          (out / 'targeted-test-files.txt').write_text('\n'.join(selected) + '\n')
          print(f'selected {len(selected)} targeted files from {len(files)} weekly-planning test files')
          PY
          cat "$OUT/targeted-test-files.txt"
      - name: Targeted dialogue-stack tests
        shell: bash
        run: |
          set -o pipefail
          mapfile -t files < "$OUT/targeted-test-files.txt"
          npm run test:run -- "${files[@]}" 2>&1 | tee "$OUT/targeted-tests.log"
      - name: TypeScript
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee "$OUT/typescript.log"
      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$OUT/build.log"
      - name: Full test suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee "$OUT/full-tests.log"
      - name: Production entrypoint evidence
        shell: bash
        run: |
          {
            echo '# Request/session/preview/storage/keyboard/approval symbol evidence'
            rg -n --glob '*.ts' --glob '*.tsx' \
              'pendingTurn|pendingApproval|requestId|baseRevision|weekStartDate|clear_conversation|reset_session|isComposing|ctrlKey|metaKey|\.focus\(|previewCandidates|approvalEligibility|sourceDraftBlockId|sanitize|stale' \
              src/App.tsx src/components src/features/weeklyPlanning || true
          } > "$OUT/entrypoint-evidence.txt"
          test -s "$OUT/entrypoint-evidence.txt"
      - name: Built application smoke
        shell: bash
        run: |
          npm run preview:vite -- --port 4173 > "$OUT/preview-server.log" 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > "$OUT/built-index.html"; then
              break
            fi
            sleep 1
          done
          test -s "$OUT/built-index.html"
          grep -q '<div id="root"></div>' "$OUT/built-index.html"
      - name: Diff and final repository state
        run: |
          git diff --check
          git status -sb | tee "$OUT/final-repository-state.txt"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dialogue-stack-main-verification
          path: ${{ runner.temp }}/dialogue-stack-main-verification
          if-no-files-found: error
