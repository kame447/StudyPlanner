name: One-shot merged rendered-text branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-cleanup-merged-rendered-text-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged implementation branch
        run: git push origin --delete -- fix/stable-v5-rendered-text-routing
