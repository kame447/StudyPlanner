name: Admin Overview Render

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: admin-overview-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Snapshot application manifests before isolated test-runner install
        shell: bash
        run: sha256sum package.json package-lock.json > /tmp/studyplanner-manifests.sha256

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.62.1

      - name: Verify isolated test-runner install did not mutate application manifests
        shell: bash
        run: sha256sum -c /tmp/studyplanner-manifests.sha256

      - name: Install Chromium
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run admin overview render regression
        run: ./tests/e2e/node_modules/.bin/playwright test --config=tests/e2e/playwright.admin-overview.config.mjs

      - name: Upload admin overview render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-overview-render-${{ github.sha }}
          path: artifacts/admin-overview/
          if-no-files-found: error
          retention-days: 14
