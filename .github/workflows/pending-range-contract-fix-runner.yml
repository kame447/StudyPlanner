今回の主題に含まれる未解決事項はない。named future periodのrange終端は、選択可能window内に収める保守的契約を採用した。既存仕様が将来window越境を許可すると明示された場合は、独立タスクで契約変更する。
EOF

      - name: Remove temporary execution files
        run: |
          rm -rf .tmp/pending-range
          rm -f .github/workflows/apply-pending-range-contract-fix.yml

      - name: Diff validation
        run: |
          git diff --check
          git diff "$BASE_COMMIT" --check
          git status -sb

      - name: Commit and push verified changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: 週間計画のpending range契約を修正'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
