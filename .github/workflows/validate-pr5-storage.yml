name: validate-pr5-storage

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run -- src/features/weeklyPlanning/weeklyPlanningStorageValidation.test.ts src/features/weeklyPlanning/weeklyPlanningConversationPersistence.test.ts src/features/weeklyPlanning/weeklyPlanningPreviewSessionLifecycle.test.tsx
      - run: |
          git config user.name "studyplanner-fix-bot"
          git config user.email "studyplanner-fix-bot@users.noreply.github.com"
          set +e
          npm run build > /tmp/pr5-storage-build.log 2>&1
          status=$?
          cat /tmp/pr5-storage-build.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/pr5-storage-build.log docs/ai/tasks/20260716-weekly-planning-pr5-storage-build-error.log
            git add docs/ai/tasks/20260716-weekly-planning-pr5-storage-build-error.log
            git commit -m "feat: storage build失敗ログを保存"
            git push origin HEAD:agent/weekly-planning-conversation-hardening
            exit "$status"
          fi
