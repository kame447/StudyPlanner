name: validate-pr5-storage

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          git config user.name "studyplanner-fix-bot"
          git config user.email "studyplanner-fix-bot@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/weeklyPlanning/weeklyPlanningStorage.ts')
          text = path.read_text(encoding='utf-8')
          old = '''function isOptionalTimestamp(value: unknown): value is string | undefined {
            return value === undefined || isTimestamp(value);
          }

          '''
          if text.count(old) != 1:
              raise RuntimeError('unused helper did not match')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          git rm -f docs/ai/tasks/20260716-weekly-planning-pr5-storage-build-error.log || true
          git add src/features/weeklyPlanning/weeklyPlanningStorage.ts
          git commit -m "feat: storage validatorの未使用helperを除去"
          git push origin HEAD:agent/weekly-planning-conversation-hardening
      - run: npm run test:run -- src/features/weeklyPlanning/weeklyPlanningStorageValidation.test.ts src/features/weeklyPlanning/weeklyPlanningConversationPersistence.test.ts src/features/weeklyPlanning/weeklyPlanningPreviewSessionLifecycle.test.tsx
      - run: npm run build
