# Verification inputs only. One workflow-only child of the same-ref cleanup commit.
name: Issue 488 E Exact Verification Once
on:
  push:
    branches: ['integration/issue488-a-c-e-r0']
    paths: ['.github/workflows/issue488-e-verify-once.yml']
permissions:
  contents: read
env:
  EVENT_PARENT: '811bd6fa64baff5497b4f1cf9d4b03c8c1414507'
  EVENT_PARENT_TREE: 'db37d7bb56c9731f8585f985ee2dfeb7c6b05bdf'
  SOURCE_SHA: '2ea210a6a336b79bfc3895925adc35789126f128'
  SOURCE_TREE: '2979619553a6729ca0c48b34197fe1666020b103'
  TARGET_TREE: 'd2a5406f62662d961fd1f7b493aa6a105c1c6053'
  WORKFLOW_PATH: '.github/workflows/issue488-e-verify-once.yml'
concurrency:
  group: issue488-e-exact-verification-once
  cancel-in-progress: false
jobs:
  verify_once:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'kame447/StudyPlanner' &&
          github.repository_id == '1202727586' &&
          github.repository_owner == 'kame447' &&
          github.actor == 'kame447' && github.actor_id == '76802107' &&
          github.triggering_actor == 'kame447' &&
          github.ref == 'refs/heads/integration/issue488-a-c-e-r0' &&
          github.run_attempt == 1 &&
          github.event.created == false && github.event.deleted == false &&
          github.event.forced == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ''
      VITE_AI_API_KEY: ''
      VITE_CLOUDFLARE_AI_PROXY_URL: ''
      GOOGLE_API_KEY: ''
      STUDYPLANNER_F1_REAL_API: '0'
      STUDYPLANNER_R0_REAL_API: '0'
      STUDYPLANNER_H_REAL_API: '0'
      STUDYPLANNER_H2_REAL_API: '0'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate the workflow-only event before executing source
        id: event_guard
        env:
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTING_WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = kame447/StudyPlanner
          test "$GITHUB_REPOSITORY_ID" = 1202727586
          test "$GITHUB_REPOSITORY_OWNER" = kame447
          test "$GITHUB_ACTOR" = kame447
          test "$GITHUB_ACTOR_ID" = 76802107
          test "$GITHUB_TRIGGERING_ACTOR" = kame447
          test "$GITHUB_REF" = refs/heads/integration/issue488-a-c-e-r0
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXECUTING_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$EXECUTING_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$WORKFLOW_PATH@$GITHUB_REF"
          python3 - <<'PYEVENT'
          import json,os,pathlib
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['before']==os.environ['EVENT_PARENT'] and event['after']==os.environ['GITHUB_SHA']
          assert event['created'] is False and event['deleted'] is False and event['forced'] is False
          assert event['repository']['full_name']=='kame447/StudyPlanner' and event['repository']['id']==1202727586
          assert event['sender']['login']=='kame447' and event['sender']['id']==76802107
          PYEVENT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P "$GITHUB_SHA")" = "$EVENT_PARENT"
          test "$(git rev-parse "${EVENT_PARENT}^{tree}")" = "$EVENT_PARENT_TREE"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r "$EVENT_PARENT" "$GITHUB_SHA")" = "$(printf 'A\t%s' "$WORKFLOW_PATH")"
          test "$(git ls-tree "$GITHUB_SHA" -- "$WORKFLOW_PATH" | awk '{print $1, $2}')" = '100644 blob'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/e-artifacts"
          cp "$WORKFLOW_PATH" "$RUNNER_TEMP/e-artifacts/executing-workflow.yml"
          python3 - <<'PYPROVENANCE'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'e-artifacts'
          d={k:os.environ[v] for k,v in {'eventParent':'EVENT_PARENT','eventParentTree':'EVENT_PARENT_TREE','baseHead':'SOURCE_SHA','baseTree':'SOURCE_TREE','candidateTree':'TARGET_TREE',
             'eventSha':'GITHUB_SHA','workflowSha':'EXECUTING_WORKFLOW_SHA','ref':'GITHUB_REF','runId':'GITHUB_RUN_ID'}.items()}
          d.update(attempt=1,verificationInputOnly=True,workflowSha256=hashlib.sha256((out/'executing-workflow.yml').read_bytes()).hexdigest())
          (out/'event-provenance.json').write_text(json.dumps(d,indent=2)+'\n')
          PYPROVENANCE
      - name: Check out frozen main source, excluding the event workflow
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
      - name: Materialize the bounded reviewed verification-input bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          python3 - <<'PYBUNDLE'
          import base64,gzip,hashlib,json,os,pathlib
          packed=base64.b64decode('',validate=True)
          assert len(packed)==111000 and hashlib.sha256(packed).hexdigest()=='2038f0c0903d386285a3bb6c900ddce96ea0644b761b79e103abffeb2feeff9a'
          raw=gzip.decompress(packed)
          assert len(raw)==383930 and hashlib.sha256(raw).hexdigest()=='bfeb467dcf61b632949333becba16a8acb24fd1a4381d0a2e6461c9c834b46dc'
          values=json.loads(raw)
          expected={'run-verify.py': '5bc42c37f5b8bb5afa5e15c2e6c97f12828b89e768d5ffe589789b22f3f05d5b', 'source-manifest.json': 'b3cd55f76a5dcb68b4dda9064d10d0aaf0aef79e4b168125cd1c482f32155172', 'source/docs/domains/weekly-planning/architecture/current-contract-v5.md': 'e4ae3e5a8d0cc0e08ad16719accb8bbb4a77c08877396a0f326f6e1d03a56228', 'source/docs/domains/weekly-planning/work/20261010-issue488-staged-integration.md': 'f9c226c966e17f616b751b0e3a4ffcc98c2e727081d766bb55d8e59678f8f684', 'source/src/features/weeklyPlanning/application/weeklyPlanningProvisionalApprovalApplication.integration.test.tsx': '877f10033c3fbb723b070547f8cfb2a2be5502d4219d78e230f051bf07687302', 'source/src/features/weeklyPlanning/application/weeklyPlanningStableV5PlanningEvaluation.ts': 'f904d921aba6b6a193603ff83caa2631732db487ce1a9a37bacc2e526452e70e', 'source/src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.test.ts': '919f7af8a1382a256895b75a2068aae4554419595111c1354b5f151ac356706d', 'source/src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeQuestions.test.ts': '038a6edc33abab997e7d80145d9f35af2dbbc965e32c931391f3e260d8abfd5b', 'source/src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeQuestions.ts': 'f670b2f9c09c752dd7687ef4d94ddd78063e1d38def0aa48fd6c943a2e708234', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningAcceptedMemorySessionProjectionV5.test.ts': 'c42cd7ec8bac5ff14cf9db344d4b7fafd04660c72868208ab14b6dab09b93bd6', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningAcceptedMemorySessionProjectionV5.ts': '8fc9d46a9249ca83f51a2127e81cbfbf15480a413e90b19a3e3911826cff0b3a', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningDiscreteWorkDistributionV5.test.ts': '6b15a28a2ae2169a9723e4329ae521cb135fe4fd7ee6fbb0342e127ec9c880e4', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningGenericWorkItems.test.ts': 'c674909e3b3a728e4498d678e6d542a1f66cdfddd73ec0c557b8efc5b1bf0d9c', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningGenericWorkItems.ts': '091a205dc737192638199382e9b6ef3a8fce7aebe0b85339e65e32b5ea18858b', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningSchedulerWorkDistributionV5.ts': '7b8409aa647cb6494a71b13ddeee92d29bcad5bd41a9c4b9241cc7aa651d4781', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningStableV5SessionDistribution.test.ts': '25bfda156d924f8fb25f805d0930b59d9b218161a7ca4c2953251e9eb2fcc96c', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningStatedTimeBudgetProjectionV5.ts': '71646bdd4ee463e6d2d8ecd6c6b132246917875af411b3ca6d9db0ad5206f68e', 'source/src/features/weeklyPlanning/semantic/weeklyPlanningWorkloadQuantityLabelV5.ts': '0f23efe43992812c49d574cb0907dbf46ca51b6d81e246ff618403511fd81893'}
          expected_sizes={'run-verify.py': 16033, 'source-manifest.json': 7063, 'source/docs/domains/weekly-planning/architecture/current-contract-v5.md': 36163, 'source/docs/domains/weekly-planning/work/20261010-issue488-staged-integration.md': 36929, 'source/src/features/weeklyPlanning/application/weeklyPlanningProvisionalApprovalApplication.integration.test.tsx': 42019, 'source/src/features/weeklyPlanning/application/weeklyPlanningStableV5PlanningEvaluation.ts': 14006, 'source/src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.test.ts': 29335, 'source/src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeQuestions.test.ts': 12758, 'source/src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeQuestions.ts': 17346, 'source/src/features/weeklyPlanning/semantic/weeklyPlanningAcceptedMemorySessionProjectionV5.test.ts': 7306, 'source/src/features/weeklyPlanning/semantic/weeklyPlanningAcceptedMemorySessionProjectionV5.ts': 8391, 'source/src/features/weeklyPlanning/semantic/weeklyPlanningDiscreteWorkDistributionV5.test.ts': 6931, 'source/src/features/weeklyPlanning/semantic/weeklyPlanningGenericWorkItems.test.ts': 17645, 'source/src/features/weeklyPlanning/semantic/weeklyPlanningGenericWorkItems.ts': 15453, 'source/src/features/weeklyPlanning/semantic/weeklyPlanningSchedulerWorkDistributionV5.ts': 11228, 'source/src/features/weeklyPlanning/semantic/weeklyPlanningStableV5SessionDistribution.test.ts': 3958, 'source/src/features/weeklyPlanning/semantic/weeklyPlanningStatedTimeBudgetProjectionV5.ts': 3326, 'source/src/features/weeklyPlanning/semantic/weeklyPlanningWorkloadQuantityLabelV5.ts': 859}
          assert type(values) is dict and set(values)==set(expected)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'e-bundle';root.mkdir(exist_ok=False)
          for name,encoded in values.items():
              assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
              value=base64.b64decode(encoded,validate=True)
              assert len(value)==expected_sizes[name] and hashlib.sha256(value).hexdigest()==expected[name]
              target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(value)
          PYBUNDLE
      - name: Install pinned npm with a private empty configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -v)" = v22.23.0
          mkdir -p "$RUNNER_TEMP/e-bootstrap-home" "$RUNNER_TEMP/e-bootstrap-cache" "$RUNNER_TEMP/e-bootstrap-logs" "$RUNNER_TEMP/e-bootstrap-tmp"
          touch "$RUNNER_TEMP/e-bootstrap-npmrc" "$RUNNER_TEMP/e-bootstrap-global-npmrc"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/e-bootstrap-home" TMPDIR="$RUNNER_TEMP/e-bootstrap-tmp" \
            NPM_CONFIG_CACHE="$RUNNER_TEMP/e-bootstrap-cache" NPM_CONFIG_LOGS_DIR="$RUNNER_TEMP/e-bootstrap-logs" \
            NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/e-bootstrap-npmrc" NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/e-bootstrap-global-npmrc" \
            NPM_CONFIG_AUDIT=false NPM_CONFIG_FUND=false NPM_CONFIG_UPDATE_NOTIFIER=false \
            npm install --prefix "$RUNNER_TEMP/e-npm" --no-save --package-lock=false npm@11.9.0 \
            2>&1 | tee "$RUNNER_TEMP/e-artifacts/npm-bootstrap.log"
          test "$(node "$RUNNER_TEMP/e-npm/node_modules/npm/bin/npm-cli.js" --version)" = 11.9.0
      - name: Run unchanged npm verify on the exact reconstructed candidate tree
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin ISSUE488_E_REMOTE_ONCE=yes \
            python3 "$RUNNER_TEMP/e-bundle/run-verify.py" --source "$PWD" \
              --node "$(command -v node)" --npm-cli "$RUNNER_TEMP/e-npm/node_modules/npm/bin/npm-cli.js" \
              --output "$RUNNER_TEMP/e-artifacts/execution" \
              > "$RUNNER_TEMP/e-artifacts/runner.log" 2>&1
      - name: Read terminal evidence without hiding verification failure
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTERMINAL'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'e-artifacts/execution/terminal.json'
          assert p.is_file(), 'terminal missing; verification remains incomplete'
          d=json.loads(p.read_text());print(json.dumps(d,indent=2))
          assert d['status']=='full_verify_passed' and type(d['exit']) is int and d['exit']==0
          assert d['naturalTermination'] is True and d['identityPreserved'] is True
          assert d['candidateTree']=='d2a5406f62662d961fd1f7b493aa6a105c1c6053' and d['errors']==[]
          PYTERMINAL
      - name: Upload the single diagnostic root on success or failure
        if: ${{ always() && steps.event_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue488-e-exact-tree-d2a5406f-event-${{ github.sha }}
          path: ${{ runner.temp }}/e-artifacts/
          if-no-files-found: error
          retention-days: 14
