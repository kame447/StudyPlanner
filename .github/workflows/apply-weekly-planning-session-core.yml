name: Apply weekly planning session core

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply-weekly-planning-session-core.mjs
      - .github/workflows/apply-weekly-planning-session-core.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: node scripts/apply-weekly-planning-session-core.mjs
      - run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run -- src/features/weeklyPlanning/weeklyPlanningReducer.test.ts src/features/weeklyPlanning/weeklyPlanningConversationPersistence.test.ts src/features/weeklyPlanning/weeklyPlanningSessionState.property.test.ts
      - run: npm run build
      - name: Commit verified core changes
        run: |
          rm scripts/apply-weekly-planning-session-core.mjs .github/workflows/apply-weekly-planning-session-core.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 週間計画sessionの非同期状態を集約"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
