name: Run final weekly planning trace fix

on:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/weekly-planning-trace-full-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-trace-full-implementation
          fetch-depth: 0

      - name: Execute embedded finalizer
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap
          import traceback

          error_path = Path('.agent-finalize-error.txt')
          error_path.unlink(missing_ok=True)
          try:
              workflow = Path('.github/workflows/agent-finalize-weekly-planning-trace.yml').read_text(encoding='utf-8')
              start_marker = "          python <<'PY'\n"
              end_marker = "          PY\n\n      - name: Commit and push"
              if start_marker not in workflow or end_marker not in workflow:
                  raise RuntimeError('embedded finalizer markers not found')
              script = textwrap.dedent(workflow.split(start_marker, 1)[1].split(end_marker, 1)[0])
              script = script.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\nimport textwrap\n', 1)
              original_helper = """def replace_once(value, old, new, label):
              count = value.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, got {count}')
              return value.replace(old, new, 1)
          """
              flexible_helper = """def replace_once(value, old, new, label):
              candidates = [
                  (old, new),
                  (textwrap.dedent(old), textwrap.dedent(new)),
                  (textwrap.dedent(old).strip('\\n'), textwrap.dedent(new).strip('\\n')),
              ]
              checked = set()
              for candidate, replacement in candidates:
                  if candidate in checked:
                      continue
                  checked.add(candidate)
                  count = value.count(candidate)
                  if count == 1:
                      return value.replace(candidate, replacement, 1)
                  if count > 1:
                      if label == 'approval operation conversation id':
                          position = value.rfind(candidate)
                          return value[:position] + replacement + value[position + len(candidate):]
                      raise RuntimeError(f'{label}: ambiguous match count {count}')
              normalized_old = textwrap.dedent(old).strip()
              tokens = re.split(r'(\\s+)', normalized_old)
              pattern = ''.join(r'\\s+' if token.isspace() else re.escape(token) for token in tokens if token)
              matches = list(re.finditer(pattern, value, flags=re.S))
              if len(matches) == 1:
                  match = matches[0]
                  replacement = textwrap.dedent(new).strip('\\n')
                  return value[:match.start()] + replacement + value[match.end():]
              if len(matches) > 1:
                  if label == 'approval operation conversation id':
                      match = matches[-1]
                      replacement = textwrap.dedent(new).strip('\\n')
                      return value[:match.start()] + replacement + value[match.end():]
                  raise RuntimeError(f'{label}: ambiguous normalized match count {len(matches)}')
              raise RuntimeError(f'{label}: expected one match, got 0')
          """
              if original_helper not in script:
                  raise RuntimeError('replace_once helper source not found')
              script = script.replace(original_helper, flexible_helper, 1)
              exec(compile(script, 'agent-finalize-weekly-planning-trace.py', 'exec'))
          except Exception:
              error_path.write_text(traceback.format_exc(), encoding='utf-8')
          PY

      - name: Commit result
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .agent-finalize-error.txt ]; then
            cp .agent-finalize-error.txt /tmp/agent-finalize-error.txt
            git reset --hard HEAD
            cp /tmp/agent-finalize-error.txt .agent-finalize-error.txt
            git add .agent-finalize-error.txt
            git commit -m "feat: 週間計画trace仕上げエラーを更新"
            git push origin HEAD:agent/weekly-planning-trace-full-implementation
            exit 0
          fi
          rm -f .github/workflows/agent-finalize-weekly-planning-trace.yml
          rm -f .github/workflows/agent-run-finalize-trace.yml
          git diff --check
          git add -A
          git commit -m "feat: 週間計画traceの相関ID伝播を補強"
          git push origin HEAD:agent/weekly-planning-trace-full-implementation
