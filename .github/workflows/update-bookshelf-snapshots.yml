name: Update Bookshelf Visual Baselines

on:
  push:
    branches:
      - fix/bookshelf-add-material-mobile
    paths:
      - '.github/workflows/update-bookshelf-snapshots.yml'

permissions:
  contents: write

concurrency:
  group: bookshelf-baseline-refresh
  cancel-in-progress: true

jobs:
  update-bookshelf-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Regenerate approved visual snapshots
        run: ./tests/e2e/node_modules/.bin/playwright test --config=tests/e2e/playwright.visual.config.mjs --update-snapshots

      - name: Upload generated Bookshelf baselines
        uses: actions/upload-artifact@v4
        with:
          name: bookshelf-baselines-${{ github.sha }}
          path: tests/e2e/visual-regression.spec.mjs-snapshots/bookshelf-*-linux.png
          if-no-files-found: error
          retention-days: 14

      - name: Keep only Bookshelf baseline changes
        shell: bash
        run: |
          set -euo pipefail
          snapshot_dir='tests/e2e/visual-regression.spec.mjs-snapshots'
          tmp_dir="$(mktemp -d)"
          cp "$snapshot_dir"/bookshelf-*-linux.png "$tmp_dir"/
          git restore --worktree "$snapshot_dir"
          cp "$tmp_dir"/bookshelf-*-linux.png "$snapshot_dir"/
          git rm .github/workflows/update-bookshelf-snapshots.yml
          git add "$snapshot_dir"/bookshelf-*-linux.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: approve audited Bookshelf add visuals'
          git push origin HEAD:fix/bookshelf-add-material-mobile

# One-shot refresh triggered via an explicit fast-forward ref update. The successful job deletes itself.
