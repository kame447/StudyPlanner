name: Apply Copied Context Normalization V5

on:
  push:
    branches:
      - agent/weekly-ai-conversation-eval
    paths:
      - .github/workflows/apply-copied-context-normalization-v5.yml
      - .github/apply-copied-context-normalization-v5.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest branch head
        run: |
          set -euo pipefail
          git fetch origin agent/weekly-ai-conversation-eval
          git checkout -B agent/weekly-ai-conversation-eval origin/agent/weekly-ai-conversation-eval
      - name: Apply guarded integration
        run: python .github/apply-copied-context-normalization-v5.py
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts
          git diff --cached --check
          git commit -m "feat: normalize copied durable context before validation"
          git push origin HEAD:agent/weekly-ai-conversation-eval
