              "  onActivateTerm: (draft: TimetableTermDraft) => Promise<TimetableTerm>;\n  onDeleteTerm: (term: TimetableTerm) => Promise<void>;\n  onClearTermData: (term: TimetableTerm) => Promise<void>;",
          )
          replace_once(
              'src/components/TimetableView.tsx',
              "  onActivateTerm,\n  onClearTermData,",
              "  onActivateTerm,\n  onDeleteTerm,\n  onClearTermData,",
          )
          replace_once(
