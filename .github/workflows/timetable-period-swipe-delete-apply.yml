name: Apply timetable period swipe-delete

on:
  push:
    branches:
      - fix/timetable-period-swipe-delete

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              file_path.write_text(text.replace(old, new, 1))

          component = r'''import {
            useRef,
            useState,
            type CSSProperties,
            type PointerEvent,
          } from 'react';
          import type { TimetableTerm } from '../types/domain';

          const ACTION_REVEAL_WIDTH_PX = 84;
          const HORIZONTAL_SWIPE_START_PX = 6;
          const OPEN_THRESHOLD_RATIO = 0.38;

          interface TimetablePeriodSwipeItemProps {
            term: TimetableTerm;
            active: boolean;
            disabled: boolean;
            deleting: boolean;
            isOpen: boolean;
            onOpenChange: (open: boolean) => void;
            onSelect: () => void;
            onDelete: () => void;
          }

          interface SwipePointerState {
            pointerId: number;
            startX: number;
            startY: number;
            startOffset: number;
            horizontal: boolean;
          }

          function clampSwipeOffset(value: number): number {
            return Math.max(-ACTION_REVEAL_WIDTH_PX, Math.min(0, value));
          }

          export function TimetablePeriodSwipeItem({
            term,
            active,
            disabled,
            deleting,
            isOpen,
            onOpenChange,
            onSelect,
            onDelete,
          }: TimetablePeriodSwipeItemProps) {
            const pointerRef = useRef<SwipePointerState | null>(null);
            const suppressClickRef = useRef(false);
            const [dragOffset, setDragOffset] = useState<number | null>(null);
            const [dragging, setDragging] = useState(false);
            const restingOffset = isOpen ? -ACTION_REVEAL_WIDTH_PX : 0;
            const offset = dragOffset ?? restingOffset;
            const revealProgress = Math.min(1, Math.abs(offset) / ACTION_REVEAL_WIDTH_PX);
            const actionStyle: CSSProperties = {
              opacity: revealProgress,
              transform: `translate3d(${18 * (1 - revealProgress)}px, 0, 0) scale(${0.96 + 0.04 * revealProgress})`,
            };

            function handlePointerDown(event: PointerEvent<HTMLButtonElement>) {
              if (disabled) {
                return;
              }

              pointerRef.current = {
                pointerId: event.pointerId,
                startX: event.clientX,
                startY: event.clientY,
                startOffset: restingOffset,
                horizontal: false,
              };
              suppressClickRef.current = false;
              event.currentTarget.setPointerCapture?.(event.pointerId);
            }

            function handlePointerMove(event: PointerEvent<HTMLButtonElement>) {
              const pointer = pointerRef.current;
              if (!pointer || pointer.pointerId !== event.pointerId) {
                return;
              }

              const deltaX = event.clientX - pointer.startX;
              const deltaY = event.clientY - pointer.startY;
              const absX = Math.abs(deltaX);
              const absY = Math.abs(deltaY);

              if (!pointer.horizontal) {
                if (Math.max(absX, absY) < HORIZONTAL_SWIPE_START_PX) {
                  return;
                }

                if (absY > absX) {
                  pointerRef.current = null;
                  setDragOffset(null);
                  setDragging(false);
                  return;
                }

                pointer.horizontal = true;
                suppressClickRef.current = true;
                setDragging(true);
              }

              setDragOffset(clampSwipeOffset(pointer.startOffset + deltaX));
            }

            function finishPointer(event: PointerEvent<HTMLButtonElement>) {
              const pointer = pointerRef.current;
              if (!pointer || pointer.pointerId !== event.pointerId) {
                return;
              }

              if (pointer.horizontal) {
                const nextOffset = clampSwipeOffset(
                  pointer.startOffset + event.clientX - pointer.startX,
                );
                const shouldOpen =
                  nextOffset <= -ACTION_REVEAL_WIDTH_PX * OPEN_THRESHOLD_RATIO;
                onOpenChange(shouldOpen);
                suppressClickRef.current = true;
              }

              pointerRef.current = null;
              setDragOffset(null);
              setDragging(false);
              event.currentTarget.releasePointerCapture?.(event.pointerId);
            }

            function cancelPointer(event: PointerEvent<HTMLButtonElement>) {
              if (pointerRef.current?.pointerId === event.pointerId) {
                pointerRef.current = null;
              }
              setDragOffset(null);
              setDragging(false);
            }

            return (
              <div
                className={[
                  'timetable-period-swipe-row',
                  offset < -1 ? 'is-revealed' : '',
                  dragging ? 'is-dragging' : '',
                ].filter(Boolean).join(' ')}
              >
                <div className="timetable-period-swipe-actions">
                  <button
                    aria-label={`${term.label}を削除`}
                    className="timetable-period-delete-action"
                    disabled={disabled}
                    onClick={(event) => {
                      event.stopPropagation();
                      onDelete();
                    }}
                    onFocus={() => {
                      if (!disabled) {
                        onOpenChange(true);
                      }
                    }}
                    style={actionStyle}
                    type="button"
                  >
                    {deleting ? '削除中…' : '削除'}
                  </button>
                </div>
                <button
                  aria-expanded={isOpen}
                  aria-label={`${term.label}を選択`}
                  className={
                    active
                      ? 'timetable-period-list-item active'
                      : 'timetable-period-list-item'
                  }
                  disabled={disabled}
                  onClick={(event) => {
                    if (suppressClickRef.current) {
                      suppressClickRef.current = false;
                      event.preventDefault();
                      return;
                    }

                    if (isOpen) {
                      onOpenChange(false);
                      return;
                    }

                    onSelect();
                  }}
                  onPointerCancel={cancelPointer}
                  onPointerDown={handlePointerDown}
                  onPointerMove={handlePointerMove}
                  onPointerUp={finishPointer}
                  style={{ transform: `translate3d(${offset}px, 0, 0)` }}
                  type="button"
                >
                  <strong>{term.label}</strong>
                  <span>{formatTermRange(term)}</span>
                </button>
              </div>
            );
          }

          function formatTermRange(term: TimetableTerm): string {
            if (!term.startDate && !term.endDate) {
              return '期間未設定';
            }

            return `${term.startDate ?? '開始日未設定'} 〜 ${term.endDate ?? '終了日未設定'}`;
          }
          '''
          Path('src/components/TimetablePeriodSwipeItem.tsx').write_text(component)

          test = r'''import { useState } from 'react';
          import { act, create } from 'react-test-renderer';
          import { describe, expect, it, vi } from 'vitest';
          import type { TimetableTerm } from '../types/domain';
          import { TimetablePeriodSwipeItem } from './TimetablePeriodSwipeItem';

          const TERM: TimetableTerm = {
            id: 'term-1',
            userId: 'user-1',
            year: 2026,
            kind: 'custom',
            label: '2026年前期',
            startDate: '2026-04-01',
            endDate: '2026-08-10',
            isActive: true,
            createdAt: '2026-01-01T00:00:00.000Z',
            updatedAt: '2026-01-01T00:00:00.000Z',
          };

          function Harness({ onSelect, onDelete }: { onSelect: () => void; onDelete: () => void }) {
            const [open, setOpen] = useState(false);
            return (
              <TimetablePeriodSwipeItem
                active
                deleting={false}
                disabled={false}
                isOpen={open}
                onDelete={onDelete}
                onOpenChange={setOpen}
                onSelect={onSelect}
                term={TERM}
              />
            );
          }

          function pointerEvent(x: number, y = 20) {
            return {
              pointerId: 1,
              clientX: x,
              clientY: y,
              currentTarget: {
                setPointerCapture: vi.fn(),
                releasePointerCapture: vi.fn(),
              },
            };
          }

          describe('TimetablePeriodSwipeItem', () => {
            it('opens the delete action after a deliberate left swipe and routes delete', () => {
              const onSelect = vi.fn();
              const onDelete = vi.fn();
              const renderer = create(<Harness onSelect={onSelect} onDelete={onDelete} />);
              let surface = renderer.root.findByProps({ 'aria-label': '2026年前期を選択' });

              act(() => {
                surface.props.onPointerDown(pointerEvent(180));
                surface.props.onPointerMove(pointerEvent(110, 22));
                surface.props.onPointerUp(pointerEvent(110, 22));
              });

              surface = renderer.root.findByProps({ 'aria-label': '2026年前期を選択' });
              expect(surface.props['aria-expanded']).toBe(true);
              expect(onSelect).not.toHaveBeenCalled();

              const deleteAction = renderer.root.findByProps({ 'aria-label': '2026年前期を削除' });
              act(() => {
                deleteAction.props.onClick({ stopPropagation: vi.fn() });
              });
              expect(onDelete).toHaveBeenCalledTimes(1);
            });

            it('keeps an ordinary tap as the period selection action', () => {
              const onSelect = vi.fn();
              const renderer = create(<Harness onSelect={onSelect} onDelete={vi.fn()} />);
              const surface = renderer.root.findByProps({ 'aria-label': '2026年前期を選択' });

              act(() => {
                surface.props.onClick({ preventDefault: vi.fn() });
              });

              expect(onSelect).toHaveBeenCalledTimes(1);
            });
          });
          '''
          Path('src/components/TimetablePeriodSwipeItem.test.tsx').write_text(test)

          replace_once(
              'src/components/TimetableView.tsx',
              "import { resolveTimetableAlternatingWeek } from '../lib/timetableCalendar';\nimport type {",
              "import { resolveTimetableAlternatingWeek } from '../lib/timetableCalendar';\nimport { TimetablePeriodSwipeItem } from './TimetablePeriodSwipeItem';\nimport type {",
          )
          replace_once(
