              "  const [isTermSheetOpen, setIsTermSheetOpen] = useState(false);\n  const [isSavingTerm, setIsSavingTerm] = useState(false);\n  const [isClearingTermData, setIsClearingTermData] = useState(false);\n  const [periodForm, setPeriodForm] = useState<PeriodFormState>(() => createPeriodForm(activeTerm));",
              "  const [isTermSheetOpen, setIsTermSheetOpen] = useState(false);\n  const [isSavingTerm, setIsSavingTerm] = useState(false);\n  const [isClearingTermData, setIsClearingTermData] = useState(false);\n  const [deletingTermId, setDeletingTermId] = useState<string | null>(null);\n  const [openTermSwipeId, setOpenTermSwipeId] = useState<string | null>(null);\n  const [periodForm, setPeriodForm] = useState<PeriodFormState>(() => createPeriodForm(activeTerm));",
          )
          replace_once(
              'src/components/TimetableView.tsx',
              "    [timetableTerms],\n  );\n\n  function updateDraft<K extends keyof ScheduleTemplateDraft>(",
              "    [timetableTerms],\n  );\n  const isTermActionBusy =\n    isSavingTerm || isClearingTermData || deletingTermId !== null;\n\n  function updateDraft<K extends keyof ScheduleTemplateDraft>(",
          )
          replace_once(
              'src/components/TimetableView.tsx',
              "  function openPeriodSheet(term: TimetableTerm | null = activeTerm) {\n    setPeriodForm(createPeriodForm(term));\n    setPeriodActionError(null);\n    setIsTermSheetOpen(true);\n  }\n\n  function startNewPeriod() {\n    setPeriodForm(createPeriodForm(null));\n  }",
              "  function openPeriodSheet(term: TimetableTerm | null = activeTerm) {\n    setOpenTermSwipeId(null);\n    setPeriodForm(createPeriodForm(term));\n    setPeriodActionError(null);\n    setIsTermSheetOpen(true);\n  }\n\n  function startNewPeriod() {\n    setOpenTermSwipeId(null);\n    setPeriodForm(createPeriodForm(null));\n  }",
          )
          replace_once(
              'src/components/TimetableView.tsx',
              "      setAlternatingWeekView('a');\n      setIsTermSheetOpen(false);",
              "      setAlternatingWeekView('a');\n      setOpenTermSwipeId(null);\n      setIsTermSheetOpen(false);",
          )
          replace_once(
              'src/components/TimetableView.tsx',
              "  async function selectExistingPeriod(term: TimetableTerm) {\n    if (term.id === activeTerm?.id) {",
              "  async function selectExistingPeriod(term: TimetableTerm) {\n    setOpenTermSwipeId(null);\n    if (term.id === activeTerm?.id) {",
          )
          delete_handler = r'''  async function deleteExistingPeriod(term: TimetableTerm) {
            if (isTermActionBusy) {
              return;
            }

            if (availableTerms.length <= 1) {
              setPeriodActionError(
                '最後の期間は削除できません。新しい期間を追加してから削除してください。',
              );
              setOpenTermSwipeId(null);
              return;
            }

            const templateCount = scheduleTemplates.filter(
              (template) => getTemplateTermId(template) === term.id,
            ).length;
            const periodCount = timetablePeriods.filter(
              (period) => period.termId === term.id,
            ).length;
            const hasData = templateCount > 0 || periodCount > 0;
            const confirmed = window.confirm(
              hasData
                ? `「${term.label}」を削除しますか？\nこの期間に登録されている授業と時限設定も一緒に削除されます。この操作は元に戻せません。`
                : `「${term.label}」を削除しますか？この操作は元に戻せません。`,
            );

            if (!confirmed) {
              setOpenTermSwipeId(null);
              return;
            }

            const fallbackTerm = availableTerms.find((item) => item.id !== term.id) ?? null;
            setDeletingTermId(term.id);
            try {
              setPeriodActionError(null);
              await onDeleteTerm(term);
              setOpenTermSwipeId(null);
              if (periodForm.id === term.id) {
                setPeriodForm(createPeriodForm(fallbackTerm));
                setAlternatingWeekView(
                  fallbackTerm
                    ? resolveTimetableAlternatingWeek(getTodayIsoDate(), fallbackTerm) ?? 'a'
                    : 'a',
                );
              }
            } finally {
              setDeletingTermId(null);
            }
          }

          '''
          replace_once(
              'src/components/TimetableView.tsx',
              "  async function clearCurrentTermData() {",
              delete_handler + "  async function clearCurrentTermData() {",
          )
          replace_once(
              'src/components/TimetableView.tsx',
              "    if (!activeTerm || isClearingTermData || isSavingTerm) {",
              "    if (!activeTerm || isTermActionBusy) {",
          )
          replace_once(
              'src/components/TimetableView.tsx',
              "          onClick={() => {\n            if (!isSavingTerm && !isClearingTermData) {\n              setIsTermSheetOpen(false);\n            }\n          }}",
              "          onClick={() => {\n            if (!isTermActionBusy) {\n              setOpenTermSwipeId(null);\n              setIsTermSheetOpen(false);\n            }\n          }}",
          )
          view_path = Path('src/components/TimetableView.tsx')
          view_text = view_path.read_text()
          view_text = view_text.replace(
              'disabled={isSavingTerm || isClearingTermData}',
              'disabled={isTermActionBusy}',
          )
          view_text = view_text.replace(
              'onClick={() => setIsTermSheetOpen(false)}',
              "onClick={() => {\n                  setOpenTermSwipeId(null);\n                  setIsTermSheetOpen(false);\n                }}",
          )
          old_list = r'''                  <div className="timetable-period-list">
                    {availableTerms.map((term) => (
                      <button
                        className={
                          term.id === activeTerm?.id
                            ? 'timetable-period-list-item active'
                            : 'timetable-period-list-item'
                        }
                        disabled={isSavingTerm || isClearingTermData}
                        key={term.id}
                        onClick={() => {
                          void selectExistingPeriod(term);
                        }}
                        type="button"
                      >
                        <strong>{term.label}</strong>
                        <span>{formatPeriodRange(term)}</span>
                      </button>
                    ))}
                  </div>'''
          new_list = r'''                  <div className="timetable-period-list">
                    {availableTerms.map((term) => (
                      <TimetablePeriodSwipeItem
                        active={term.id === activeTerm?.id}
                        deleting={deletingTermId === term.id}
                        disabled={isTermActionBusy}
                        isOpen={openTermSwipeId === term.id}
                        key={term.id}
                        onDelete={() => {
                          void deleteExistingPeriod(term);
                        }}
                        onOpenChange={(open) => {
                          setOpenTermSwipeId((current) =>
                            open ? term.id : current === term.id ? null : current,
                          );
                        }}
                        onSelect={() => {
                          void selectExistingPeriod(term);
                        }}
                        term={term}
                      />
                    ))}
                  </div>'''
          if view_text.count(old_list) != 1:
              raise SystemExit(f'TimetableView list: expected one match, found {view_text.count(old_list)}')
          view_text = view_text.replace(old_list, new_list, 1)
          error_anchor = r'''              ) : null}

              <section className="timetable-period-form-card">'''
          error_insert = r'''              ) : null}

              {periodActionError ? (
                <p className="timetable-period-error timetable-period-sheet-error">
                  {periodActionError}
                </p>
              ) : null}

              <section className="timetable-period-form-card">'''
          if view_text.count(error_anchor) != 1:
              raise SystemExit(f'TimetableView sheet error anchor: expected one match, found {view_text.count(error_anchor)}')
          view_text = view_text.replace(error_anchor, error_insert, 1)
          view_text = view_text.replace(
              "                      isSavingTerm ||\n                      isClearingTermData ||\n                      (termTemplates.length === 0 && savedPeriodsForTerm.length === 0)",
              "                      isTermActionBusy ||\n                      (termTemplates.length === 0 && savedPeriodsForTerm.length === 0)",
          )
          view_path.write_text(view_text)

          replace_once(
              'src/App.tsx',
              "    activateTimetableTerm,\n    clearTimetableTermData,",
              "    activateTimetableTerm,\n    deleteTimetableTerm,\n    clearTimetableTermData,",
          )
          replace_once(
              'src/App.tsx',
              "                onActivateTerm={activateTimetableTerm}\n                onClearTermData={clearTimetableTermData}",
              "                onActivateTerm={activateTimetableTerm}\n                onDeleteTerm={deleteTimetableTerm}\n                onClearTermData={clearTimetableTermData}",
          )

          hook_path = Path('src/hooks/usePlannerDataState.ts')
          hook_text = hook_path.read_text()
          hook_start = hook_text.index('  async function deleteTimetableTerm(term: TimetableTerm) {')
          hook_end = hook_text.index('\n  async function clearTimetableTermData(term: TimetableTerm) {', hook_start)
          new_delete = r'''  async function deleteTimetableTerm(term: TimetableTerm) {
            if (!userId) {
              throw new Error('ログイン状態を確認できませんでした。');
            }

            const targetTerm = timetableTerms.find((item) => item.id === term.id) ?? term;
            if (timetableTerms.length <= 1) {
              showNotice(
                '最後の期間は削除できません。新しい期間を追加してから削除してください。',
                'error',
              );
              throw new Error('最後の期間は削除できません。');
            }

            const targetTermId = targetTerm.id;
            const targetTemplates = scheduleTemplates.filter(
              (template) => (template.termId || 'default') === targetTermId,
            );
            const targetPeriods = timetablePeriods.filter(
              (period) => period.termId === targetTermId,
            );
            const remainingTerms = timetableTerms.filter((item) => item.id !== targetTermId);
            const fallbackTerm = targetTerm.isActive
              ? sortTimetableTerms(remainingTerms)[0] ?? null
              : null;
            const nextFallbackTerm = fallbackTerm
              ? {
                  ...fallbackTerm,
                  isActive: true,
                  updatedAt: new Date().toISOString(),
                }
              : null;
            const deletedTemplates: ScheduleTemplate[] = [];
            const deletedPeriods: TimetablePeriod[] = [];
            let fallbackActivated = false;

            try {
              await runSequentially(targetTemplates, async (template) => {
                await plannerRepository.deleteScheduleTemplate(userId, template.id);
                deletedTemplates.push(template);
              });
              await runSequentially(targetPeriods, async (period) => {
                await plannerRepository.deleteTimetablePeriod(userId, period.id);
                deletedPeriods.push(period);
              });

              if (nextFallbackTerm) {
                await plannerRepository.upsertTimetableTerm(nextFallbackTerm);
                fallbackActivated = true;
              }

              await plannerRepository.deleteTimetableTerm(userId, targetTermId);

              setScheduleTemplates((current) =>
                current.filter(
                  (template) => (template.termId || 'default') !== targetTermId,
                ),
              );
              setTimetablePeriods((current) =>
                current.filter((period) => period.termId !== targetTermId),
              );
              setTimetableTerms((current) =>
                sortTimetableTerms(
                  current
                    .filter((item) => item.id !== targetTermId)
                    .map((item) =>
                      nextFallbackTerm && item.id === nextFallbackTerm.id
                        ? nextFallbackTerm
                        : item,
                    ),
                ),
              );
              showNotice('期間を削除しました。', 'success');
            } catch (error) {
              try {
                await runSequentially(deletedPeriods, async (period) => {
                  await plannerRepository.upsertTimetablePeriod(period);
                });
                await runSequentially(deletedTemplates, async (template) => {
                  await plannerRepository.upsertScheduleTemplate(template);
                });
                if (fallbackActivated && fallbackTerm) {
                  await plannerRepository.upsertTimetableTerm(fallbackTerm);
                }
              } catch (rollbackError) {
                console.error('[TimetableTermDelete] rollback failed', {
                  termId: targetTermId,
                  error: getErrorDiagnostics(rollbackError),
                });
              }

              showNotice(
                resolveErrorMessage(error, '期間を削除できませんでした。'),
                'error',
              );
              throw error;
            }
          }
          '''
