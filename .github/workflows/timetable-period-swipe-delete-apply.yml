          .timetable-period-delete-action:disabled {
            cursor: default;
            filter: saturate(0.55);
          }

          .timetable-period-list-item {
            position: relative;
            z-index: 1;
            display: grid;
            gap: 2px;
            width: 100%;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            text-align: left;
            cursor: pointer;
            touch-action: pan-y;
            will-change: transform;
            transition:
              transform 320ms cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow 220ms ease,
              border-color 180ms ease,
              background-color 180ms ease;
          }

          .timetable-period-swipe-row.is-revealed:not(.is-dragging) .timetable-period-list-item {
            box-shadow: 0 8px 22px rgba(31, 43, 43, 0.08);
          }

          .timetable-period-swipe-row.is-dragging .timetable-period-list-item,
          .timetable-period-swipe-row.is-dragging .timetable-period-delete-action {
            transition: none;
          }

          .timetable-period-list-item.active {
            border-color: color-mix(in srgb, var(--accent) 42%, var(--border) 58%);
            background: color-mix(in srgb, var(--accent) 9%, var(--surface) 91%);
          }

          .timetable-period-list-item > strong {
            overflow: hidden;
            font-size: 0.85rem;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .timetable-period-list-item > span {
            color: var(--text-muted);
            font-size: 0.7rem;
          }

          .timetable-period-sheet-error {
            margin: 0;
          }

          @media (prefers-reduced-motion: reduce) {
            .timetable-period-list-item,
            .timetable-period-delete-action {
              transition: none;
            }
          }
          '''
          css_path.write_text(css[:css_start] + new_css + css[css_end:])
