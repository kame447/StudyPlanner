name: Apply timetable period swipe-delete

on:
  push:
    branches:
      - fix/timetable-period-swipe-delete

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply implementation
        shell: bash
        run: |
          git show dd1cb1b2ff09fb2e49e9c422b5ea67162808b1ca:.github/workflows/timetable-period-swipe-delete-apply.yml > /tmp/previous-harness.yml
          python - <<'PATCHER'
          from pathlib import Path
          from textwrap import dedent

          harness = Path('/tmp/previous-harness.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Install dependencies"
          start = harness.index(start_marker) + len(start_marker)
          end = harness.index(end_marker, start)
          script = dedent(harness[start:end])

          old = '''close_button_old = '                onClick={() => setIsTermSheetOpen(false)}'
          close_button_new = ''' + "'''" + '''                onClick={() => {\\n                  setOpenTermSwipeId(null);\\n                  setIsTermSheetOpen(false);\\n                }}''' + "'''" + '''
          if view_text.count(close_button_old) != 1:
              raise SystemExit(f'TimetableView close button: expected one match, found {view_text.count(close_button_old)}')
          view_text = view_text.replace(close_button_old, close_button_new, 1)'''

          new = '''close_button_old = '                onClick={() => setIsTermSheetOpen(false)}'
          close_button_new = ''' + "'''" + '''                onClick={() => {\\n                  setOpenTermSwipeId(null);\\n                  setIsTermSheetOpen(false);\\n                }}''' + "'''" + '''
          close_button_count = view_text.count(close_button_old)
          if close_button_count != 2:
              raise SystemExit(
                  f'TimetableView close controls: expected two matches, found {close_button_count}'
              )
          view_text = view_text.replace(close_button_old, close_button_new)'''

          if script.count(old) != 1:
              raise SystemExit(f'previous harness close-control fragment mismatch: {script.count(old)}')
          Path('/tmp/apply.py').write_text(script.replace(old, new, 1))
          PATCHER
          python /tmp/apply.py
      - name: Install dependencies
        run: npm ci
      - name: Focused swipe test
        run: node ./node_modules/vitest/vitest.mjs --config vite.config.mjs run src/components/TimetablePeriodSwipeItem.test.tsx --reporter=verbose
      - name: Typecheck
        run: npm run typecheck
      - name: Build typecheck
        run: npm run typecheck:build
      - name: Full tests
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit verified implementation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/timetable-period-swipe-delete-apply.yml
          git add src/App.tsx src/components/TimetableView.tsx src/components/TimetablePeriodSwipeItem.tsx src/components/TimetablePeriodSwipeItem.test.tsx src/hooks/usePlannerDataState.ts src/styles/timetable-period-config.css
          git diff --cached --check
          git commit -m "feat: add swipe deletion for timetable periods"
          git push origin HEAD:"$GITHUB_REF_NAME"
