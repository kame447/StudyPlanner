name: Temporary Weekly Planning Patch

on:
  push:
    branches:
      - agent/weekly-ai-conversation-eval
    paths:
      - .github/workflows/temporary-weekly-planning-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-ai-conversation-eval
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 .github/scripts/apply-weekly-ci-noop-fix.py
      - run: npm ci
      - run: >-
          npm test -- --run
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPipelineV5.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningStableV5MultiTurnPipeline.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPipelineV5ExplicitRepair.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningDuplicateWorkloadNormalizationV5.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5Coverage.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5TaskBoundary.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticEvidenceV5.test.ts
          src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.test.ts
      - run: npm run typecheck
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'kame447'
          git config user.email '76802107+kame447@users.noreply.github.com'
          git rm .github/workflows/temporary-weekly-planning-patch.yml
          git rm .github/scripts/apply-weekly-ci-noop-fix.py
          git add src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPipelineV5.ts
          git add src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPipelineV5.test.ts
          git add src/features/weeklyPlanning/semantic/weeklyPlanningStableV5MultiTurnPipeline.test.ts
          git add src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPipelineV5ExplicitRepair.test.ts
          git add src/features/weeklyPlanning/semantic/weeklyPlanningDuplicateWorkloadNormalizationV5.test.ts
          git add src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5Coverage.test.ts
          git add src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5TaskBoundary.test.ts
          git commit -m 'fix: preserve no-op turn idempotency without revision churn'
          git push origin HEAD:agent/weekly-ai-conversation-eval
