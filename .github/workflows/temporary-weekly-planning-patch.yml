name: Temporary Weekly Planning Patch

on:
  push:
    branches:
      - agent/weekly-ai-conversation-eval
    paths:
      - .github/workflows/temporary-weekly-planning-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-ai-conversation-eval
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fix
        shell: bash
        run: |
          cp package.json /tmp/package.json.before
          npm audit fix
          cmp package.json /tmp/package.json.before
          npm audit --audit-level=moderate
          git diff -- package.json package-lock.json
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - name: Commit lockfile-only fix and remove temporary workflow
        shell: bash
        run: |
          test -z "$(git status --short -- package.json)"
          test -n "$(git status --short -- package-lock.json)"
          git config user.name 'kame447'
          git config user.email '76802107+kame447@users.noreply.github.com'
          git rm .github/workflows/temporary-weekly-planning-patch.yml
          git add package-lock.json
          git commit -m 'chore: update vulnerable transitive dependencies'
          git push origin HEAD:agent/weekly-ai-conversation-eval
