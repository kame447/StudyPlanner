name: Temporary Weekly Planning Patch

on:
  push:
    branches:
      - agent/weekly-ai-conversation-eval
    paths:
      - .github/workflows/temporary-weekly-planning-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-ai-conversation-eval
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 .github/scripts/apply-weekly-scheduler-patch.py
      - run: npm ci
      - run: npm test -- --run src/features/weeklyPlanning/semantic/weeklyPlanningStableV5PreviewScheduler.test.ts src/features/weeklyPlanning/semantic/weeklyPlanningSemanticStableV5.test.ts src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.test.ts
      - run: npm run typecheck
      - name: Commit patch
        run: |
          git config user.name kame447
          git config user.email 76802107+kame447@users.noreply.github.com
          git rm .github/workflows/temporary-weekly-planning-patch.yml .github/scripts/apply-weekly-scheduler-patch.py
          git add src/features/weeklyPlanning/semantic/weeklyPlanningStableV5PreviewScheduler.ts src/features/weeklyPlanning/semantic/weeklyPlanningStableV5PreviewScheduler.test.ts
          git commit -m 'fix: honor explicit preferred windows over scheduler defaults'
          git push origin HEAD:agent/weekly-ai-conversation-eval
