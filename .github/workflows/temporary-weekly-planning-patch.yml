name: Temporary Weekly Planning Patch

on:
  push:
    branches:
      - agent/weekly-ai-conversation-eval
    paths:
      - .github/workflows/temporary-weekly-planning-patch.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-ai-conversation-eval
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities},null,2))"
      - name: Final focused verification
        run: >-
          npm test -- --run
          src/components/NaturalLanguageAssistant.weeklyPlanningControls.test.tsx
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticEvidenceV5.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningStableV5PreviewScheduler.test.ts
          src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.test.ts
      - run: npm run typecheck
