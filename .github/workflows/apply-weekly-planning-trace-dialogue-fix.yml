name: Apply weekly planning trace and dialogue fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-trace-and-dialogue-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure commit identity
        run: |
          git config user.name 'studyplanner-agent'
          git config user.email 'studyplanner-agent@users.noreply.github.com'
      - name: Apply source changes
        run: |
          set +e
          {
            python scripts/apply_weekly_planning_trace_dialogue_fix.py
            python scripts/apply_weekly_planning_integration_tests.py
            python scripts/apply_weekly_planning_followup_fix.py
          } > /tmp/apply-output.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply-output.txt scripts/apply-error.txt
            git add scripts/apply-error.txt
            git commit -m 'chore: 週間計画修正の適用エラーを記録'
            git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-repair
            exit "$status"
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run focused unit and integration tests
        run: |
          set +e
          npx vitest run \
            src/features/weeklyPlanning/__tests__/weeklyPlanningObservedConversationRegression.test.ts \
            src/features/weeklyPlanning/__tests__/weeklyPlanningObservedConversation.integration.test.ts \
            src/features/weeklyPlanning/dialogue/weeklyPlanningAiDialogueRenderer.test.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningQuestionSlots.test.ts \
            workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceStructuralIds.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts \
            > /tmp/test-output.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/test-output.txt scripts/apply-error.txt
            git add scripts/apply-error.txt
            git commit -m 'chore: 週間計画修正のテスト失敗を記録'
            git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-repair
            exit "$status"
          fi
      - name: Run full test suite
        run: |
          set +e
          npm run test:run > /tmp/full-test-output.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              printf 'run_commit=%s\n' "$(git rev-parse HEAD)"
              cat /tmp/full-test-output.txt
            } > scripts/full-test-error.txt
            git add scripts/full-test-error.txt
            git commit -m 'chore: 週間計画修正の全体テスト失敗を記録'
            git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-repair
            exit "$status"
          fi
      - name: Build
        run: |
          set +e
          npm run build > /tmp/build-output.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/build-output.txt scripts/apply-error.txt
            git add scripts/apply-error.txt
            git commit -m 'chore: 週間計画修正のビルド失敗を記録'
            git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-repair
            exit "$status"
          fi
      - name: Remove temporary applicators
        run: |
          rm -f scripts/apply_weekly_planning_trace_dialogue_fix.py
          rm -f scripts/apply_weekly_planning_integration_tests.py
          rm -f scripts/apply_weekly_planning_integration_fixes.py
          rm -f scripts/apply_weekly_planning_followup_fix.py
          rm -f scripts/apply-error.txt
          rm -f scripts/full-test-error.txt
          rm -f .github/workflows/apply-weekly-planning-trace-dialogue-fix.yml
      - name: Commit applied fix
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'feat: 週間計画ログと対話修復を改善'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-repair
