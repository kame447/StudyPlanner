name: Build weekly planning trace and dialogue fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-trace-and-dialogue-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure commit identity
        run: |
          git config user.name 'studyplanner-agent'
          git config user.email 'studyplanner-agent@users.noreply.github.com'
      - name: Apply source changes
        run: |
          python scripts/apply_weekly_planning_trace_dialogue_fix.py
          python scripts/apply_weekly_planning_integration_tests.py
          python scripts/apply_weekly_planning_integration_fixes.py
          python scripts/apply_weekly_planning_followup_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused unit and integration tests
        run: |
          npx vitest run \
            src/features/weeklyPlanning/__tests__/weeklyPlanningObservedConversationRegression.test.ts \
            src/features/weeklyPlanning/__tests__/weeklyPlanningObservedConversation.integration.test.ts \
            src/features/weeklyPlanning/dialogue/weeklyPlanningAiDialogueRenderer.test.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningQuestionSlots.test.ts \
            workers/ai-proxy/src/weeklyPlanningTracePrivacy.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceStructuralIds.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts
      - name: Run full test suite
        id: full-tests
        continue-on-error: true
        run: npm run test:run > /tmp/full-test.log 2>&1
      - name: Upload full test failure log
        if: steps.full-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-full-test-log
          path: /tmp/full-test.log
          retention-days: 1
      - name: Report full test failure
        if: steps.full-tests.outcome == 'failure'
        run: |
          tail -n 300 /tmp/full-test.log
          exit 1
      - name: Build
        id: production-build
        continue-on-error: true
        run: npm run build > /tmp/build.log 2>&1
      - name: Upload build failure log
        if: steps.production-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-build-log
          path: /tmp/build.log
          retention-days: 1
      - name: Report build failure
        if: steps.production-build.outcome == 'failure'
        run: |
          cat /tmp/build.log
          exit 1
      - name: Prepare clean patch
        run: |
          rm -f scripts/apply_weekly_planning_trace_dialogue_fix.py
          rm -f scripts/apply_weekly_planning_integration_tests.py
          rm -f scripts/apply_weekly_planning_integration_fixes.py
          rm -f scripts/apply_weekly_planning_followup_fix.py
          rm -f scripts/apply-error.txt
          rm -f scripts/full-test-error.txt
          rm -f .github/workflows/apply-weekly-planning-trace-dialogue-fix.yml
          git add -N .
          git diff --binary origin/main -- . ':(exclude)node_modules' > /tmp/final.patch
          test -s /tmp/final.patch
      - name: Publish clean final branch
        run: |
          git reset --hard
          git clean -fd
          git checkout -B agent/fix-weekly-planning-trace-and-dialogue-final origin/main
          git apply --index /tmp/final.patch
          git diff --cached --check
          git commit -m 'feat: 週間計画ログと対話修復を改善'
          git push --force origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
