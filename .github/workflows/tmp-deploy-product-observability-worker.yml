name: One-shot Product Observability Worker Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-deploy-product-observability-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify intended Phase 8 source is present
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 46a8d22a9a60e373947d2fd568286e0eaa5949ba HEAD
          test -f workers/ai-proxy/src/productObservabilitySystemStatusService.ts
          grep -q "PRODUCT_OBSERVABILITY_ADMIN_SYSTEM_PATH" workers/ai-proxy/src/productObservabilityAdminApi.ts

      - name: Install application dependencies
        run: npm ci

      - name: Verify Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 whoami

      - name: Validate Worker bundle without publishing
        run: npx --yes wrangler@4 deploy --dry-run --config workers/ai-proxy/wrangler.jsonc

      - name: Deploy production Worker
        run: npx --yes wrangler@4 deploy --keep-vars --config workers/ai-proxy/wrangler.jsonc
