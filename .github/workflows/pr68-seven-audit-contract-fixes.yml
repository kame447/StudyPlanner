name: PR68 seven audit responsibility verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr68-seven-audit-contract-fixes.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply responsibility-boundary fixes
        run: python3 scripts/pr68_seven_audit_contract_fixes.py
      - name: Check diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        shell: bash
        run: |
          set +e
          npm run test:run -- \
            src/features/weeklyPlanning/__tests__/weeklyPlanningSevenAuditContract.test.ts \
            src/features/weeklyPlanning/__tests__/weeklyPlanningAdversarialInput.test.ts \
            src/features/weeklyPlanning/__tests__/weeklyPlanningInterpreterFoundation.test.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningCandidateValidator.test.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningQuestionSlots.test.ts \
            src/features/weeklyPlanning/dialogue/weeklyPlanningAiDialogueRenderer.test.ts \
            --reporter=verbose > /tmp/pr68-seven-contract.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 260 /tmp/pr68-seven-contract.log > pr68-seven-contract-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pr68-seven-contract-error.txt
            git commit -m 'feat: 7監査責務境界診断を記録'
            git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
          fi
          tail -n 260 /tmp/pr68-seven-contract.log
          exit "$status"
      - name: Run full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Commit verified fixes and clean temporary files
        run: |
          rm -f scripts/pr68_seven_audit_contract_fixes.py
          rm -f .github/workflows/pr68-seven-audit-contract-fixes.yml
          rm -f pr68-seven-contract-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 週間計画の7監査責務境界を整合'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
