name: PR68 stage1 debug2

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr68-stage1-debug2.yml]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Capture isolated patch failure
        shell: bash
        run: |
          git worktree add /tmp/pr68-stage1 HEAD
          set +e
          (cd /tmp/pr68-stage1 && python3 scripts/pr68_stage1_fix.py) >/tmp/pr68-stage1-output.txt 2>/tmp/pr68-stage1-error.txt
          status=$?
          cp /tmp/pr68-stage1-output.txt pr68-stage1-output.txt
          cp /tmp/pr68-stage1-error.txt pr68-stage1-error.txt
          echo "exit_status=$status" >> pr68-stage1-error.txt
          rm .github/workflows/pr68-stage1-debug2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pr68-stage1-output.txt pr68-stage1-error.txt .github/workflows/pr68-stage1-debug2.yml
          git commit -m 'feat: 敵対的入力修正の置換診断を更新'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
