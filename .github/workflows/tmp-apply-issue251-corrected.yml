name: One-shot issue 251 patch corrected

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-apply-issue251-corrected.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stable-v5-question-slot-decoding
          fetch-depth: 0
      - name: Apply focused refactor
        env:
          PATCH_SCRIPT_B64:  nLmxlbmd0aCkKICAgIDogbnVsbDsKfQoKZnVuY3Rpb24gcXVlc3Rpb25Db2RlRnJvbVRhcmdldFNsb3QodGFyZ2V0U2xvdDogc3RyaW5nIHwgdW5kZWZpbmVkKTogc3RyaW5nIHwgbnVsbCB7CiAgcmV0dXJuIHRhcmdldFNsb3Q/LnN0YXJ0c1dpdGgoJ3N0YWJsZV92NTo  
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 -d > /tmp/apply.py
          python /tmp/apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: centralize Stable V5 question-slot decoding'
          git push origin HEAD:fix/stable-v5-question-slot-decoding
