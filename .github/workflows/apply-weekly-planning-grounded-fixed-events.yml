name: Apply weekly planning grounded fixed events

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply-weekly-planning-grounded-fixed-events.mjs
      - .github/workflows/apply-weekly-planning-grounded-fixed-events.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply grounded fixed event fixes
        run: node scripts/apply-weekly-planning-grounded-fixed-events.mjs
      - name: Diff check
        run: git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Targeted tests
        run: npm run test:run -- src/features/weeklyPlanning/dialogue/weeklyPlanningKnownFixedEvents.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningBehaviorAwareDialoguePlanner.test.ts src/features/weeklyPlanning/pipeline/weeklyPlanningFixedEventCapability.test.ts src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts
      - name: Weekly planning tests
        run: npm run test:run -- src/features/weeklyPlanning
      - name: Build
        run: npm run build
      - name: Finalize task doc
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/ai/tasks/20260716-weekly-planning-grounded-fixed-event-occurrences.md';
          let content = fs.readFileSync(path, 'utf8');
          content = content.replace('Status: open', 'Status: closed\nClosed: 2026-07-16');
          content = content.replaceAll('- [ ]', '- [x]');
          fs.writeFileSync(path, content);
          NODE
      - name: Remove temporary automation
        run: rm scripts/apply-weekly-planning-grounded-fixed-events.mjs .github/workflows/apply-weekly-planning-grounded-fixed-events.yml
      - name: Commit verified fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: 固定予定の質問と期間判定をgrounding"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
