name: Home Four Plan Render Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render-four-plan-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install isolated Playwright
        run: npm install --prefix /tmp/home-four-plan --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: /tmp/home-four-plan/node_modules/.bin/playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        shell: bash
        run: |
          npm run preview:vite -- --host 127.0.0.1 --port 4173 > /tmp/home-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/home-preview.log
          exit 1

      - name: Render four-plan viewport matrix
        shell: bash
        run: |
          mkdir -p artifacts/home-four-plan
          cat > /tmp/home-four-plan/render.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';

          const viewports = [
            [320, 568],
            [360, 640],
            [375, 667],
            [390, 844],
            [393, 852],
            [412, 915],
            [430, 932],
            [511, 1094],
            [768, 710],
            [1024, 768],
          ];

          const browser = await chromium.launch({ headless: true });
          const results = [];

          for (const [width, height] of viewports) {
            const page = await browser.newPage({ viewport: { width, height } });
            await page.addInitScript(() => {
              const today = new Date().toISOString().slice(0, 10);
              const now = new Date().toISOString();
              const user = {
                id: 'render-user',
                email: 'render@example.com',
                username: 'render-user',
                avatar: '',
                createdAt: now,
              };
              const slots = [
                ['20:10', '20:40'],
                ['20:50', '21:20'],
                ['21:30', '22:00'],
                ['22:10', '22:40'],
              ];
              const plans = slots.map(([startTime, endTime], index) => ({
                id: `render-plan-${index + 1}`,
                seriesId: `render-plan-${index + 1}`,
                userId: user.id,
                title: `情報資源総論 ${index + 1}`,
                subject: '情報科学',
                type: 'study',
                date: today,
                startTime,
                endTime,
                memo: '',
                recurrence: null,
                createdAt: now,
                updatedAt: now,
              }));
              const material = {
                id: 'material-1',
                userId: user.id,
                name: '基本情報技術者テキスト',
                subjectId: 'subject-1',
                subjectName: '情報科学',
                status: 'active',
                progressUnit: 'page',
                totalUnits: 500,
                currentUnit: 120,
                createdAt: now,
                updatedAt: now,
              };
              localStorage.setItem('studyplanner.users', JSON.stringify([user]));
              localStorage.setItem('studyplanner.session', user.id);
              localStorage.setItem('studyplanner.plans', JSON.stringify(plans));
              localStorage.setItem('studyplanner.actuals', '[]');
              localStorage.setItem('studyplanner.todos.v1', '[]');
              localStorage.setItem('studyplanner.studyMaterials.v1', JSON.stringify([material]));
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.locator('section[aria-label="ホーム"]').waitFor();
            await page.waitForTimeout(500);

            const metrics = await page.evaluate(({ width, height }) => {
              const visible = (element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
              };
              const schedule = document.querySelector('.home-schedule-list');
              const rows = [...document.querySelectorAll('.home-schedule-row')];
              const materials = [...document.querySelectorAll('.home-material-panel')].filter(visible);
              const nav = document.querySelector('.home-bottom-nav');
              const fourth = rows[3];
              const scheduleRect = schedule?.getBoundingClientRect();
              const fourthRect = fourth?.getBoundingClientRect();
              const materialRect = materials[0]?.getBoundingClientRect();
              const navRect = nav?.getBoundingClientRect();
              return {
                viewport: `${width}x${height}`,
                rowCount: rows.length,
                scheduleClientHeight: schedule?.clientHeight ?? 0,
                scheduleScrollHeight: schedule?.scrollHeight ?? 0,
                scheduleBottom: scheduleRect?.bottom ?? null,
                fourthBottom: fourthRect?.bottom ?? null,
                materialCount: materials.length,
                materialBottom: materialRect?.bottom ?? null,
                navTop: navRect?.top ?? 0,
                bodyClientHeight: document.documentElement.clientHeight,
                bodyScrollHeight: document.documentElement.scrollHeight,
              };
            }, { width, height });

            const scrollable = metrics.scheduleScrollHeight > metrics.scheduleClientHeight + 1;
            if (metrics.rowCount !== 4) throw new Error(`${metrics.viewport}: expected 4 rows, got ${metrics.rowCount}`);
            if (metrics.bodyScrollHeight > metrics.bodyClientHeight + 1) throw new Error(`${metrics.viewport}: page overflow`);
            if (metrics.materialCount > 1) throw new Error(`${metrics.viewport}: duplicate visible material cards`);
            if (metrics.materialBottom !== null && metrics.materialBottom > metrics.navTop + 1) throw new Error(`${metrics.viewport}: material overlaps nav`);
            if (scrollable && metrics.materialCount !== 0) throw new Error(`${metrics.viewport}: material remained while schedule was clipped`);
            if (!scrollable && metrics.fourthBottom !== null && metrics.scheduleBottom !== null && metrics.fourthBottom > metrics.scheduleBottom + 1) {
              throw new Error(`${metrics.viewport}: fourth row is clipped`);
            }
            if (metrics.viewport === '768x710' && (scrollable || metrics.materialCount !== 0)) {
              throw new Error(`768x710 priority mismatch: ${JSON.stringify(metrics)}`);
            }
            if (metrics.viewport === '511x1094' && (scrollable || metrics.materialCount !== 1)) {
              throw new Error(`511x1094 expected room for material: ${JSON.stringify(metrics)}`);
            }

            results.push({ ...metrics, scrollable });
            await page.screenshot({ path: `artifacts/home-four-plan/${width}x${height}.png`, fullPage: true });
            await page.close();
          }

          fs.writeFileSync('artifacts/home-four-plan/metrics.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          await browser.close();
          NODE
          node /tmp/home-four-plan/render.mjs

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-four-plan-render-${{ github.sha }}
          path: artifacts/home-four-plan/
          if-no-files-found: error
          retention-days: 7
