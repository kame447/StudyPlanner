name: One-shot Issue 268 Cross-entity Retry

on:
  push:
    branches:
      - fix/issue268-cross-entity-consistency
    paths:
      - scripts/ci/tmp-issue268-retry-trigger.txt

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue268-cross-entity-consistency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Avoid stale material state projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/hooks/usePlannerDataState.ts')
          text = path.read_text()
          old = '''        setStudyMaterials((current) =>
          sortStudyMaterials(
            progress.nextMaterials.map((nextMaterial) => {
              const currentMaterial = current.find((material) => material.id === nextMaterial.id);
              return currentMaterial ? { ...currentMaterial, ...nextMaterial } : nextMaterial;
            }),
          ),
        );'''
          new = '''        setStudyMaterials((current) =>
          sortStudyMaterials(
            progress.changedMaterials.reduce(
              (records, nextMaterial) =>
                upsertByKey(records, nextMaterial, (material) => material.id),
              current,
            ),
          ),
        );'''
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 stale material projections, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Focused repository tests
        run: npx vitest run src/repositories/plannerCrossEntityMutation.test.ts src/repositories/observedPlannerRepository.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/usePlannerDataState.ts
          git commit -m "fix: preserve concurrent material state updates"
          git push origin HEAD:fix/issue268-cross-entity-consistency
