name: Weekly Planning Real API Conversation Eval

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/features/weeklyPlanning/**'
      - 'src/domain/**'
      - 'src/types/**'
      - 'package.json'
      - '.github/workflows/weekly-planning-real-api-conversation-eval.yml'
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-planning-real-api-conversation-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-api-conversation-eval:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      TZ: Asia/Tokyo
      WEEKLY_PLANNING_REAL_API_CONVERSATION_EVAL: '1'
      VITE_WEEKLY_PLANNING_RUNTIME_MODE: stable_v5
      VITE_AI_PROVIDER: openai
      VITE_AI_BASE_URL: https://api.openai.com/v1
      VITE_AI_MODEL: ${{ github.event.inputs.model || vars.WEEKLY_PLANNING_EVAL_MODEL || 'gpt-5.4-mini' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Repository secret OPENAI_API_KEY is required." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run deterministic safety tests
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/application/weeklyPlanningStableV5RuntimeExecutor.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningStableV5MultiTurnPipeline.test.ts
          src/features/weeklyPlanning/__tests__/weeklyPlanningControllerApprovalFlow.integration.test.ts
          src/features/weeklyPlanning/preview/weeklyPlanningStableV5PreviewBlocks.test.ts

      - name: Build
        run: npm run build

      - name: Run real API conversation evaluation
        id: real_eval
        continue-on-error: true
        env:
          VITE_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run test:weekly-ai:conversation:real

      - name: Publish report to job summary
        if: always()
        run: |
          report="artifacts/weekly-planning-real-api-conversation-eval/report.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No real API conversation report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-real-api-conversation-eval
          path: artifacts/weekly-planning-real-api-conversation-eval/
          if-no-files-found: warn
          retention-days: 14

      - name: Propagate real evaluation failure
        if: steps.real_eval.outcome == 'failure'
        run: exit 1
