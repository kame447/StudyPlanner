name: Apply Week Plan Drag Wiring

on:
  push:
    branches:
      - feat/week-plan-drag-drop

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Wire drag result into application state
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file_path.write_text(text.replace(old, new, 1))

          data_state = 'src/hooks/usePlannerDataState.ts'
          replace_once(
              data_state,
              "import type { ShowNotice } from './useNoticeState';\n",
              "import type { WeekPlanMoveTarget } from '../lib/weekPlanDrag';\nimport type { ShowNotice } from './useNoticeState';\n",
          )
          replace_once(
              data_state,
              "  savePlanDraft: (draft: PlanDraft, targetPlanId?: string) => Promise<void>;\n  deletePlan: (plan: Plan) => Promise<void>;\n",
              "  savePlanDraft: (draft: PlanDraft, targetPlanId?: string) => Promise<void>;\n  movePlanOccurrence: (plan: Plan, target: WeekPlanMoveTarget) => Promise<void>;\n  deletePlan: (plan: Plan) => Promise<void>;\n",
          )
          move_method = "\n".join([
              "  async function movePlanOccurrence(plan: Plan, target: WeekPlanMoveTarget) {",
              "    if (!userId) {",
              "      throw new Error('ログイン状態を確認できませんでした。');",
              "    }",
              "",
              "    if (minutesBetween(target.startTime, target.endTime) <= 0) {",
              "      showNotice('終了時刻は開始時刻より後にしてください。', 'error');",
              "      throw new Error('終了時刻は開始時刻より後にしてください。');",
              "    }",
              "",
              "    const sourcePlan = resolveStoredPlan(plan);",
              "    const occurrenceDate = plan.occurrenceDate ?? plan.date;",
              "    const draft: PlanDraft = {",
              "      ...createPlanDraftFromPlan(plan),",
              "      date: target.date,",
              "      startTime: target.startTime,",
              "      endTime: target.endTime,",
              "    };",
              "",
              "    if (isScopedRecurringEditCandidate(sourcePlan)) {",
              "      if (target.date !== occurrenceDate) {",
              "        showNotice(",
              "          '繰り返し予定は週表示のドラッグでは曜日を変更できません。時刻は変更できます。',",
              "          'info',",
              "        );",
              "        return;",
              "      }",
              "",
              "      setPendingRecurringPlanAction({",
              "        kind: 'edit',",
              "        plan,",
              "        draft,",
              "      });",
              "      return;",
              "    }",
              "",
              "    const nextPlan = createPlanFromDraft(draft, sourcePlan);",
              "    const previousPlans = plans;",
              "",
              "    try {",
              "      setPlans((current) =>",
              "        sortByDateTime(upsertByKey(current, nextPlan, (item) => item.id)),",
              "      );",
              "      await plannerRepository.upsertPlan(nextPlan);",
              "      showNotice('予定を移動しました。', 'success');",
              "    } catch (error) {",
              "      setPlans(previousPlans);",
              "      showNotice(",
              "        resolveErrorMessage(error, '予定を移動できませんでした。'),",
              "        'error',",
              "      );",
              "      throw error;",
              "    }",
              "  }",
              "",
              "",
          ])
          replace_once(
              data_state,
              "  async function savePlanDraft(draft: PlanDraft, targetPlanId?: string) {\n",
              move_method + "  async function savePlanDraft(draft: PlanDraft, targetPlanId?: string) {\n",
          )
          replace_once(
              data_state,
              "    savePlanDraft,\n    deletePlan,\n",
              "    savePlanDraft,\n    movePlanOccurrence,\n    deletePlan,\n",
          )

          app_state = 'src/hooks/usePlannerAppState.ts'
          replace_once(
              app_state,
              "import type {\n  Actual,\n",
              "import type { WeekPlanMoveTarget } from '../lib/weekPlanDrag';\nimport type {\n  Actual,\n",
          )
          replace_once(
              app_state,
              "  savePlanDraft: (draft: PlanDraft, targetPlanId?: string) => Promise<void>;\n  saveWeeklyApprovedPlan: (draft: PlanDraft) => Promise<Plan>;\n",
              "  savePlanDraft: (draft: PlanDraft, targetPlanId?: string) => Promise<void>;\n  movePlanOccurrence: (plan: Plan, target: WeekPlanMoveTarget) => Promise<void>;\n  saveWeeklyApprovedPlan: (draft: PlanDraft) => Promise<Plan>;\n",
          )
          replace_once(
              app_state,
              "    savePlanDraft,\n    deletePlan,\n",
              "    savePlanDraft,\n    movePlanOccurrence,\n    deletePlan,\n",
          )
          replace_once(
              app_state,
              "    savePlanDraft,\n    saveWeeklyApprovedPlan,\n",
              "    savePlanDraft,\n    movePlanOccurrence,\n    saveWeeklyApprovedPlan,\n",
          )

          app = 'src/App.tsx'
          replace_once(
              app,
              "    savePlanDraft,\n    saveWeeklyApprovedPlan,\n",
              "    savePlanDraft,\n    movePlanOccurrence,\n    saveWeeklyApprovedPlan,\n",
          )
          replace_once(
              app,
              "                onOpenDay={openDay}\n              />\n",
              "                onOpenPlan={openEditPlan}\n                onMovePlan={movePlanOccurrence}\n                onOpenDay={openDay}\n              />\n",
          )

          Path('.github/workflows/zz-week-plan-dnd-apply.yml').unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit verified wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire week plan drag persistence"
          git push origin HEAD:feat/week-plan-drag-drop
