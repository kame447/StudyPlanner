name: Weekly Planning Resumable Conversation Command

on:
  push:
    branches:
      - agent/weekly-conversation-quality-luna-audit
      - fix/issue136-semantic-regressions
    paths:
      - '.github/weekly-planning-resumable-turn-command.json'
      - '.github/workflows/weekly-planning-resumable-conversation-command.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/weekly-planning-resumable-turn-command.json'
      - '.github/workflows/weekly-planning-resumable-conversation-command.yml'
      - 'src/features/weeklyPlanning/**'
      - 'src/features/userPlanningContext/**'

permissions:
  actions: read
  contents: read

concurrency:
  group: weekly-planning-resumable-command
  cancel-in-progress: false

jobs:
  observe-one-turn:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      OUTPUT_DIR: artifacts/weekly-planning-resumable-conversation
      ARTIFACT_NAME: weekly-planning-resumable-conversation
      COMMAND_FILE: .github/weekly-planning-resumable-turn-command.json

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read turn command
        shell: bash
        run: |
          set -euo pipefail
          test -f "$COMMAND_FILE"
          echo "ACTION=$(jq -r '.action // "submit_turn"' "$COMMAND_FILE")" >> "$GITHUB_ENV"
          echo "USER_TEXT=$(jq -r '.user_text // ""' "$COMMAND_FILE")" >> "$GITHUB_ENV"
          echo "PREVIOUS_RUN_ID=$(jq -r '.previous_run_id // ""' "$COMMAND_FILE")" >> "$GITHUB_ENV"
          echo "CONVERSATION_ID=$(jq -r '.conversation_id // ""' "$COMMAND_FILE")" >> "$GITHUB_ENV"
          echo "OWNER_ID=$(jq -r '.owner_id // ""' "$COMMAND_FILE")" >> "$GITHUB_ENV"
          echo "WEEK_START_DATE=$(jq -r '.week_start_date // ""' "$COMMAND_FILE")" >> "$GITHUB_ENV"
          echo "SELECTED_DATE=$(jq -r '.selected_date // ""' "$COMMAND_FILE")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run focused semantic and durable-memory regressions
        run: >-
          npm run test -- --run
          src/features/userPlanningContext/userPlanningContextSpace.test.ts
          src/features/userPlanningContext/userPlanningContextRepository.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticDenseTurnBudgetV5.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningDateOnlyTemporalBoundValidationV5.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPromptBudget.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticUserContextV5.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningRecurrenceCalendarV5.test.ts

      - name: Run complete unit and integration suite
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

      - name: Restore previous checkpoint artifact
        if: ${{ env.PREVIOUS_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-artifact
          gh run download "$PREVIOUS_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir previous-artifact
          test -f previous-artifact/checkpoint.json

      - name: Validate command
        shell: bash
        run: |
          set -euo pipefail
          case "$ACTION" in
            submit_turn)
              test -n "$USER_TEXT"
              ;;
            promote_preview|approve_drafts)
              test -n "$PREVIOUS_RUN_ID"
              ;;
            *)
              echo "Unsupported action: $ACTION" >&2
              exit 1
              ;;
          esac
          test -n "$CONVERSATION_ID"
          test -n "$OWNER_ID"
          echo "$WEEK_START_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          echo "$SELECTED_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

      - name: Verify API credential
        if: ${{ env.ACTION == 'submit_turn' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Advance exactly one completion-based action
        env:
          WEEKLY_PLANNING_RESUMABLE_EVALUATION_ACTION: '1'
          WEEKLY_PLANNING_RESUMABLE_ACTION: ${{ env.ACTION }}
          WEEKLY_PLANNING_RESUMABLE_REAL_API_TURN: ${{ env.ACTION == 'submit_turn' && '1' || '0' }}
          WEEKLY_PLANNING_RESUMABLE_USER_TEXT: ${{ env.USER_TEXT }}
          WEEKLY_PLANNING_RESUMABLE_CHECKPOINT_PATH: ${{ env.PREVIOUS_RUN_ID != '' && 'previous-artifact/checkpoint.json' || '' }}
          WEEKLY_PLANNING_RESUMABLE_OUTPUT_DIR: artifacts/weekly-planning-resumable-conversation
          WEEKLY_PLANNING_RESUMABLE_OWNER_ID: ${{ env.OWNER_ID }}
          WEEKLY_PLANNING_RESUMABLE_CONVERSATION_ID: ${{ env.CONVERSATION_ID }}
          WEEKLY_PLANNING_RESUMABLE_WEEK_START_DATE: ${{ env.WEEK_START_DATE }}
          WEEKLY_PLANNING_RESUMABLE_SELECTED_DATE: ${{ env.SELECTED_DATE }}
          WEEKLY_PLANNING_RESUMABLE_TEST_TIMEOUT_MS: '90000'
          VITE_AI_PROVIDER: openai
          VITE_AI_BASE_URL: https://api.openai.com/v1
          VITE_AI_MODEL: gpt-5.6-luna
          VITE_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VITE_AI_MAX_PROCESS_REQUESTS: '4'
          VITE_CLOUDFLARE_AI_PROXY_URL: ''
        run: npm run observe:weekly-ai:conversation:turn

      - name: Record observation completion
        if: always()
        run: echo "Observation details are available in the uploaded artifact."

      - name: Upload observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-resumable-conversation
          path: artifacts/weekly-planning-resumable-conversation/
          if-no-files-found: error
          retention-days: 30
