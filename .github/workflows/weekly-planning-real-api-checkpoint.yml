name: Weekly Planning Real API Checkpoint

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'checkpoint = focused stochastic checks; merge-gate = full repeated audit'
        required: true
        default: checkpoint
        type: choice
        options:
          - checkpoint
          - merge-gate
          - correction-ui
          - temporal-ui
      repetitions:
        description: 'Run 1-10 independent repetitions in parallel'
        required: true
        default: '3'
        type: string
      expected_head_sha:
        description: 'Required for correction-ui/temporal-ui: reviewed full 40-hex commit SHA'
        required: false
        default: ''
        type: string
  pull_request:
    branches:
      - main
    paths:
      - '.github/weekly-planning-real-api-command.json'
      - '.github/workflows/weekly-planning-real-api-checkpoint.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      profile: ${{ steps.resolve.outputs.profile }}
      iterations: ${{ steps.resolve.outputs.iterations }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: resolve
        name: Resolve requested audit matrix
        shell: bash
        run: |
          set -euo pipefail
          should_run=true
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            profile='${{ inputs.profile }}'
            repetitions='${{ inputs.repetitions }}'
          else
            profile=$(jq -r '.profile' .github/weekly-planning-real-api-command.json)
            repetitions=$(jq -r '.repetitions // 3' .github/weekly-planning-real-api-command.json)
            if ! git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq '.github/weekly-planning-real-api-command.json'; then
              should_run=false
            fi
          fi
          case "$profile" in
            checkpoint|merge-gate) ;;
            correction-ui|temporal-ui)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "$repetitions" = 1
              ;;
            *) echo "unsupported profile: $profile" >&2; exit 1 ;;
          esac
          case "$repetitions" in
            ''|*[!0-9]*) echo "repetitions must be an integer" >&2; exit 1 ;;
          esac
          if [ "$repetitions" -lt 1 ] || [ "$repetitions" -gt 10 ]; then
            echo "repetitions must be between 1 and 10" >&2
            exit 1
          fi
          iterations=$(jq -cn --argjson n "$repetitions" '[range(1; $n + 1)]')
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "iterations=$iterations" >> "$GITHUB_OUTPUT"

  real-api:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.profile != 'correction-ui' && needs.prepare.outputs.profile != 'temporal-ui' }}
    strategy:
      fail-fast: false
      matrix:
        iteration: ${{ fromJSON(needs.prepare.outputs.iterations) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      REAL_API_PROFILE: ${{ needs.prepare.outputs.profile }}
      WEEKLY_PLANNING_ISSUE156_REAL_API: '1'
      WEEKLY_PLANNING_ISSUE156_OUTPUT_DIR: artifacts/weekly-planning-real-api
      WEEKLY_PLANNING_ISSUE156_TIMEOUT_MS: '420000'
      VITE_AI_PROVIDER: openai
      VITE_AI_BASE_URL: https://api.openai.com/v1
      VITE_AI_MODEL: gpt-5.6-luna
      VITE_AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VITE_AI_MAX_PROCESS_REQUESTS: '180'
      VITE_AI_EVAL_CAPTURE_METRICS: '1'
      VITE_CLOUDFLARE_AI_PROXY_URL: ''

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify API credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Typecheck first
        run: npm run typecheck

      - name: Provider smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p "$WEEKLY_PLANNING_ISSUE156_OUTPUT_DIR"
          payload=$(jq -nc --arg model "$VITE_AI_MODEL" '{model:$model,messages:[{role:"user",content:"Reply only OK."}]}')
          status=$(curl -sS -o "$WEEKLY_PLANNING_ISSUE156_OUTPUT_DIR/provider-smoke.json" -w '%{http_code}' \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$VITE_AI_BASE_URL/chat/completions")
          echo "provider smoke HTTP $status"
          jq '{error:(if .error then {type:.error.type,code:.error.code,param:.error.param,message:.error.message} else null end),model:.model,has_choices:(.choices|type=="array")}' \
            "$WEEKLY_PLANNING_ISSUE156_OUTPUT_DIR/provider-smoke.json"
          test "$status" -ge 200 -a "$status" -lt 300

      - name: Run checkpoint real API audit
        if: ${{ env.REAL_API_PROFILE == 'checkpoint' }}
        shell: bash
        run: |
          set -euo pipefail
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs --maxWorkers=1 run \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156FinalConversation.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156CompletedProgressRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156RemainingEffortRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156TimeboxOveraskingRealApi.observation.test.ts \
            2>&1 | tee "$WEEKLY_PLANNING_ISSUE156_OUTPUT_DIR/run.log"

      - name: Run merge-gate real API audit
        if: ${{ env.REAL_API_PROFILE == 'merge-gate' }}
        shell: bash
        run: |
          set -euo pipefail
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs --maxWorkers=1 run \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156FinalConversation.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156CompletedProgressRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156RemainingEffortRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156TimeboxOveraskingRealApi.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156TypedRendererMatrix.observation.test.ts \
            src/features/weeklyPlanning/evals/weeklyPlanningIssue156AllQuestionCodes.observation.test.ts \
            2>&1 | tee "$WEEKLY_PLANNING_ISSUE156_OUTPUT_DIR/run.log"

      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-planning-real-api-${{ matrix.iteration }}
          path: artifacts/weekly-planning-real-api/
          if-no-files-found: warn
          retention-days: 30


  correction-ui:
    needs: prepare
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && needs.prepare.outputs.should_run == 'true' && (needs.prepare.outputs.profile == 'correction-ui' || needs.prepare.outputs.profile == 'temporal-ui') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the reviewed exact product commit before credential access
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked application and existing isolated browser tools
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          sha256sum package.json package-lock.json > /tmp/correction-ui-manifests.sha256
          npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.64.0
          sha256sum -c /tmp/correction-ui-manifests.sha256
          ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Collect the bounded synthetic scenarios without a credential
        env:
          STUDYPLANNER_CORRECTION_REAL_API: '1'
          STUDYPLANNER_TEMPORAL_REAL_API: ${{ needs.prepare.outputs.profile == 'temporal-ui' && '1' || '0' }}
        run: ./tests/e2e/node_modules/.bin/playwright test --config=tests/e2e/playwright.planner-recovery.config.mjs --list
      - name: Run the selected two real-model UI conversations with fixed bounds
        env:
          STUDYPLANNER_CORRECTION_REAL_API: '1'
          STUDYPLANNER_TEMPORAL_REAL_API: ${{ needs.prepare.outputs.profile == 'temporal-ui' && '1' || '0' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TZ: Asia/Tokyo
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          unset DEBUG PWDEBUG VITE_AI_API_KEY VITE_CLOUDFLARE_AI_PROXY_URL
          ./tests/e2e/node_modules/.bin/playwright test --config=tests/e2e/playwright.planner-recovery.config.mjs
      - name: Upload only redacted synthetic observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-${{ needs.prepare.outputs.profile }}-${{ github.sha }}
          path: ${{ needs.prepare.outputs.profile == 'temporal-ui' && 'artifacts/weekly-temporal-real-api/evidence/' || 'artifacts/weekly-correction-real-api/evidence/' }}
          if-no-files-found: ignore
          retention-days: 14
