name: Verify Pages deployment once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-pages-deploy-once.yml

permissions:
  contents: write

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify production bundles
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          python <<'PY'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          site = 'https://studyplannner.pages.dev/'
          result = {
              'status': 'verification_failed',
              'site': site.rstrip('/'),
              'httpStatus': 0,
              'jsFilesFetched': 0,
              'hasTraceCollection': False,
              'hasTraceRoute': False,
          }

          def fetch(url: str) -> tuple[int, bytes]:
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'StudyPlanner deployment verifier',
                      'Accept-Encoding': 'identity',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return int(response.status), response.read()
              except urllib.error.HTTPError as error:
                  return int(error.code), error.read()
              except Exception:
                  return 0, b''

          for attempt in range(1, 7):
              status, html = fetch(site)
              result['httpStatus'] = status
              if status == 200:
                  text = html.decode('utf-8', errors='ignore')
                  initial = set(re.findall(r'(?:src|href)=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']', text))
                  queue = [urllib.parse.urljoin(site, item) for item in initial]
                  seen: set[str] = set()
                  combined = bytearray()

                  while queue and len(seen) < 100:
                      url = queue.pop(0)
                      if url in seen:
                          continue
                      seen.add(url)
                      js_status, payload = fetch(url)
                      if js_status != 200:
                          continue
                      combined.extend(payload)
                      js_text = payload.decode('utf-8', errors='ignore')
                      references = set(re.findall(
                          r'(?:(?:https?:)?//[^"\']+|(?:\.{0,2}/)?assets/)[A-Za-z0-9._/-]+\.js(?:\?[^"\']*)?',
                          js_text,
                      ))
                      for reference in references:
                          normalized = reference
                          if normalized.startswith('//'):
                              normalized = 'https:' + normalized
                          target = urllib.parse.urljoin(url, normalized)
                          if target not in seen:
                              queue.append(target)

                  result['jsFilesFetched'] = len(seen)
                  result['hasTraceCollection'] = b'weekly_planning_trace_sessions' in combined
                  result['hasTraceRoute'] = b'weekly-planning-traces' in combined
                  if result['hasTraceCollection'] and result['hasTraceRoute']:
                      result['status'] = 'success'
                      break
              time.sleep(15)

          result['sourceCommit'] = '${{ github.sha }}'
          result['recordedAt'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          Path('.github/verify-pages-result.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          if result['status'] != 'success':
              raise SystemExit(1)
          PY

      - name: Record verification result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/verify-pages-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: Pages本番反映結果を記録"
          git push origin HEAD:main
