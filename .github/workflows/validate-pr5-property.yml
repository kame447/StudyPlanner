name: validate-pr5-property

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run -- src/features/weeklyPlanning/weeklyPlanningSessionState.property.test.ts src/features/weeklyPlanning/weeklyPlanningReducer.test.ts src/features/weeklyPlanning/weeklyPlanningReducerGuards.test.ts
      - run: npm run build
