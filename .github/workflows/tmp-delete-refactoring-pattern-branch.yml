name: Temporary merged branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-delete-refactoring-pattern-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged refactoring-pattern branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init cleanup
          cd cleanup
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin --delete -- docs/refactoring-pattern-knowledge
