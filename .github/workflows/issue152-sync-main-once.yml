name: Issue 152 sync main once

on:
  push:
    branches:
      - test/issue152-adversarial-validation-lab
    paths:
      - .github/workflows/issue152-sync-main-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/issue152-adversarial-validation-lab
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest main with bounded Issue 152 resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          if git merge --no-edit origin/main; then
            echo 'main merged without conflicts'
          else
            conflicts_file="$(mktemp)"
            expected_file="$(mktemp)"
            git diff --name-only --diff-filter=U | sort > "$conflicts_file"
            cat > "$expected_file" <<'EOF'
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticMeaningPolicyInventoryV5.test.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticMeaningPolicyV5.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts
          src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPromptAssemblyV5.ts
          EOF
            sed -i 's/^          //' "$expected_file"
            if ! diff -u "$expected_file" "$conflicts_file"; then
              echo 'Unexpected merge conflict set; refusing automatic resolution.' >&2
              exit 1
            fi

            python <<'PY'
          from pathlib import Path

          ROOT = Path('src/features/weeklyPlanning/semantic')

          def resolve_conflicts(path: Path, resolver):
              text = path.read_text()
              out = []
              pos = 0
              index = 0
              while True:
                  start = text.find('<<<<<<< HEAD\n', pos)
                  if start < 0:
                      out.append(text[pos:])
                      break
                  middle = text.find('=======\n', start)
                  end = text.find('>>>>>>> origin/main\n', middle)
                  if middle < 0 or end < 0:
                      raise RuntimeError(f'malformed conflict markers in {path}')
                  ours = text[start + len('<<<<<<< HEAD\n'):middle]
                  theirs = text[middle + len('=======\n'):end]
                  out.append(text[pos:start])
                  out.append(resolver(index, ours, theirs))
                  index += 1
                  pos = end + len('>>>>>>> origin/main\n')
              resolved = ''.join(out)
              if '<<<<<<< ' in resolved or '>>>>>>> ' in resolved or '\n=======\n' in resolved:
                  raise RuntimeError(f'unresolved markers in {path}')
              path.write_text(resolved)
              return index

          normalizer = ROOT / 'weeklyPlanningSemanticNormalizerV5.ts'
          count = resolve_conflicts(normalizer, lambda i, ours, theirs: ours + theirs)
          if count != 1:
              raise RuntimeError(f'unexpected normalizer conflict count: {count}')
          text = normalizer.read_text().replace(
              'if (denseCompletenessRetry) return denseCompletenessRetry;',
              'if (denseCompletenessRetry) return finish(denseCompletenessRetry);',
          )
          normalizer.write_text(text)

          prompt = ROOT / 'weeklyPlanningSemanticPromptAssemblyV5.ts'
          def resolve_prompt(i, ours, theirs):
              if i != 0:
                  raise RuntimeError(f'unexpected prompt conflict index: {i}')
              material = "  'registeredMaterials are context; resolve aliases/progress, never replay saved facts. If user explicitly selects all remaining work for one unique match, emit one remaining workload from saved remainingUnits/unit without copying saved scope_total/completed facts.',\n"
              lines = ours.splitlines(keepends=True)
              lines.insert(1, material)
              return ''.join(lines)
          count = resolve_conflicts(prompt, resolve_prompt)
          if count != 1:
              raise RuntimeError(f'unexpected prompt conflict count: {count}')

          inventory = ROOT / 'weeklyPlanningSemanticMeaningPolicyInventoryV5.test.ts'
          count = resolve_conflicts(
              inventory,
              lambda i, ours, theirs: ours + '  });\n\n' + theirs,
          )
          if count != 1:
              raise RuntimeError(f'unexpected inventory conflict count: {count}')
          inventory.write_text(
              inventory.read_text().replace(
                  'custom only if none matches',
                  'custom only when none matches',
              )
          )

          policy = ROOT / 'weeklyPlanningSemanticMeaningPolicyV5.ts'
          def resolve_policy(i, ours, theirs):
              if i == 0:
                  resolved = ours
                  resolved = resolved.replace(
                      'If the user intends all remaining work without a separate amount, omit target; deterministic progress projection derives remaining.',
                      'Uncounted qualitative scope belongs in task/component structure, not amount=1 custom workload; if needed, emit work_breakdown uncertainty; never invent quantity or total duration. If the user intends all remaining work without a separate amount, omit target; deterministic progress projection derives remaining.',
                  )
                  resolved = resolved.replace(
                      'Explicit numeric progress, including approximate percentages, is workload state; use completed custom "%" 0..100.',
                      'Explicit numeric progress, including approximate percentages, is workload state; use completed custom "%" 0..100. Scores, grades, accuracy, and rank are not workload progress unless explicitly stated as task/material completion.',
                  )
                  resolved = resolved.replace(
                      'Distinguish workload quantity from duration.',
                      'Distinguish workload quantity from duration. Scheduled time intended as the work itself is target minute/hour workload; do not ask content progress.',
                  )
                  resolved = resolved.replace(
                      'Preserve completed-versus-remaining direction even when a pending question asks about the other side; such a statement is a side contribution. Per-unit effort only when stated.',
                      'Keep perOccurrence workload and recurrence aligned. Separate workload cost uses total_duration/duration_per_unit; session_duration only for one session. Preserve completed-versus-remaining direction even when a pending question asks about the other side; such a statement is a side contribution. Per-unit effort only when stated.',
                  )
                  return resolved
              if i == 1:
                  return ours
              if i == 2:
                  return ours.replace(
                      'represent the recurrence and per-occurrence workload consistently; do not invent recurrence from a one-off amount.',
                      'represent the recurrence and per-occurrence workload consistently. A perOccurrence workload with an explicit period must have matching recurrence on that same task/component target, not only on an ancestor task; do not invent recurrence from a one-off amount.',
                  )
              if i == 3:
                  return ours
              raise RuntimeError(f'unexpected policy conflict index: {i}')

          count = resolve_conflicts(policy, resolve_policy)
          if count != 4:
              raise RuntimeError(f'unexpected policy conflict count: {count}')
          PY

            git add \
              src/features/weeklyPlanning/semantic/weeklyPlanningSemanticMeaningPolicyInventoryV5.test.ts \
              src/features/weeklyPlanning/semantic/weeklyPlanningSemanticMeaningPolicyV5.ts \
              src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts \
              src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPromptAssemblyV5.ts
            git commit --no-edit
          fi

          git rm .github/workflows/issue152-sync-main-once.yml
          git commit -m 'chore: remove one-shot Issue 152 sync workflow'
          git push origin HEAD:test/issue152-adversarial-validation-lab
