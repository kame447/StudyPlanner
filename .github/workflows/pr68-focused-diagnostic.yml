name: PR68 focused diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr68-focused-diagnostic.yml]

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run -- src/features/weeklyPlanning/__tests__/weeklyPlanningAdversarialInput.test.ts --reporter=verbose
