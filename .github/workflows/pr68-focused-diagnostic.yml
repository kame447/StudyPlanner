name: PR68 final audit verification

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr68-focused-diagnostic.yml]

permissions:
  contents: write

jobs:
  verify-and-clean:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final audit fixes
        run: python3 scripts/pr68_finalize_audit.py
      - name: Check diff
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: npm run test:run -- src/features/weeklyPlanning/__tests__/weeklyPlanningAdversarialInput.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningAiDialogueRenderer.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningObservedConversation.integration.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningControllerApprovalFlow.integration.test.ts
      - name: Run full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Commit verified fixes and remove diagnostics
        run: |
          rm -f scripts/pr68_finalize_audit.py
          rm -f pr68-focused-failure.txt
          rm -f .github/workflows/pr68-focused-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 優先順の受理表示と入力groundingを整合'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
