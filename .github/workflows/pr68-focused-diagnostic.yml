name: PR68 focused diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr68-focused-diagnostic.yml]

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci >/dev/null 2>&1
      - name: Capture focused failure
        shell: bash
        run: |
          set +e
          npm run test:run -- src/features/weeklyPlanning/__tests__/weeklyPlanningAdversarialInput.test.ts --reporter=verbose > /tmp/pr68-focused.log 2>&1
          status=$?
          tail -n 120 /tmp/pr68-focused.log > pr68-focused-failure.txt
          if [ "$status" -eq 0 ]; then
            echo 'focused test passed' > pr68-focused-failure.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pr68-focused-failure.txt
          git commit -m 'feat: PR68 focused診断結果を記録'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
          exit "$status"
