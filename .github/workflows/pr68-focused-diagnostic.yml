name: PR68 focused diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr68-focused-diagnostic.yml]

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run focused test and print only failure tail
        shell: bash
        run: |
          set +e
          npm run test:run -- src/features/weeklyPlanning/__tests__/weeklyPlanningAdversarialInput.test.ts --reporter=verbose > /tmp/pr68-focused.log 2>&1
          status=$?
          tail -n 90 /tmp/pr68-focused.log
          exit "$status"
