name: PR68 stage1 runner

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr68-stage1-runner.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Execute guarded patch script
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr68-stage1-autofix.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in source[start:end].splitlines()
          )
          exec(compile(script, 'pr68-stage1-patch.py', 'exec'))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: npm run test:run -- src/features/weeklyPlanning/__tests__/weeklyPlanningAdversarialInput.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningObservedConversation.integration.test.ts src/features/weeklyPlanning/intake/weeklyPlanningAiInterpreter.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningAiDialogueRenderer.test.ts
      - name: Run full tests
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Commit fixes to the existing branch
        run: |
          rm .github/workflows/pr68-stage1-autofix.yml .github/workflows/pr68-stage1-runner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 敵対的入力と訂正処理を堅牢化'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
