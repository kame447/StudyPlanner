name: Apply clean mini semantic comparison

on:
  push:
    branches:
      - agent/weekly-ai-conversation-eval
    paths:
      - '.github/workflows/apply-mini-semantic-clean-comparison.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply clean comparison patch
        run: python .github/apply-mini-semantic-clean-comparison.py
      - name: Verify
        run: |
          npm run typecheck
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs run workers/ai-proxy/src/modelPolicy.test.ts src/features/weeklyPlanning/__tests__/weeklyPlanningPromptGeneralizationV5.test.ts src/features/weeklyPlanning/semantic/weeklyPlanningSemanticRequestBudgetV5.test.ts src/features/weeklyPlanning/semantic/weeklyPlanningSemanticPromptBudget.test.ts src/features/weeklyPlanning/dialogue/weeklyPlanningStableV5AiDialogueRenderer.test.ts
          git diff --check
      - name: Commit
        run: |
          git config user.name 'kame447'
          git config user.email '76802107+kame447@users.noreply.github.com'
          git add workers/ai-proxy/src/modelPolicy.ts workers/ai-proxy/src/modelPolicy.test.ts src/features/weeklyPlanning/semantic/weeklyPlanningSemanticDocumentV5.ts src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts src/features/weeklyPlanning/dialogue/weeklyPlanningStableV5AiDialogueRenderer.ts src/features/weeklyPlanning/__tests__/weeklyPlanningPromptGeneralizationV5.test.ts
          git commit -m 'test: compare semantic normalizer on mini without regression prompts'
          git push origin HEAD:agent/weekly-ai-conversation-eval
