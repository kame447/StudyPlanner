name: Fix clarification context

on:
  push:
    branches:
      - agent/fix-weekly-planning-dialogue-path
    paths:
      - .github/workflows/agent-fix-clarification-context.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-dialogue-path
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply clarification context fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise RuntimeError(f'anchor not found: {path}\n{old[:160]}')
              file.write_text(text.replace(old, new, 1))

          intake_types = 'src/features/weeklyPlanning/intake/weeklyPlanningIntakeTypes.ts'
