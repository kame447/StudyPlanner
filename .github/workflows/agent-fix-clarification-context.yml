          insertion = """function isQuestionBearingAction(action: AllowedDialogueAction): boolean {
  return action.kind === 'show_options'
    || action.kind === 'ask_required_fact'
    || action.kind === 'report_infeasibility'
    || action.kind === 'suggest_draft_generation';
}

function questionContextForAction(params: {
  action: AllowedDialogueAction;
  base: WeeklyPlanningIntakePipelineOutput;
}): WeeklyPlanningQuestionContext | undefined {
  const { action, base } = params;
  if (action.kind === 'report_infeasibility') {
    return {
      kind: 'feasibility_adjustment',
      targetSlot: 'constraint_relaxation',
      intent: 'ask_constraint_relaxation',
      topicId: action.topicId,
      actionId: action.actionId,
    };
  }
  if (action.kind === 'suggest_draft_generation') {
    return {
      kind: 'approval',
      targetSlot: 'draft_generation_confirmation',
      intent: 'confirm_draft_generation',
      topicId: action.topicId,
      actionId: action.actionId,
    };
  }

  const matchingQuestion = base.decision.questionPlan?.find((question) => {
    if (action.topicId === 'planning-range') {
      return question.targetSlot === 'planning_start_date' || question.targetSlot === 'planning_period';
    }
    if (action.topicId === 'task-identity') return question.targetSlot === 'tasks_or_goals';
    if (action.topicId === 'workload-estimate') {
      return question.targetSlot === 'unit_rate' || question.targetSlot === 'unit_duration_estimate';
    }
    if (action.topicId === 'availability-basis') {
      return ['fixed_events', 'sleep_cycle', 'meal_bath_constraints', 'life_constraints']
        .includes(question.targetSlot);
    }
    return false;
  });

  let targetSlot = matchingQuestion?.targetSlot;
  if (!targetSlot) {
    if (action.topicId === 'planning-range') {
      targetSlot = base.state.pendingPlanningRange ? 'planning_start_date' : 'planning_period';
    } else if (action.topicId === 'task-identity') {
      targetSlot = 'tasks_or_goals';
    } else if (action.topicId === 'workload-estimate') {
      targetSlot = 'unit_duration_estimate';
    } else if (action.topicId === 'availability-basis') {
      targetSlot = 'availability_basis';
    } else if (action.topicId === 'feasibility_basis') {
      targetSlot = 'feasibility_basis';
    } else if (action.topicId === 'planning-purpose') {
      targetSlot = 'planning_purpose';
    }
  }
  if (!targetSlot) return undefined;

  return {
    kind: action.kind === 'show_options' ? 'options' : 'missing',
    targetSlot,
    intent: matchingQuestion?.intent ?? `clarify_${action.topicId}`,
    topicId: action.topicId,
    actionId: action.actionId,
  };
}

function questionContextForRenderedDialogue(params: {
  base: WeeklyPlanningIntakePipelineOutput;
  behavior: BehaviorAwarePlanningBridgeResult;
  behaviorDialogue: BehaviorAwareDialoguePlannerResult;
}): WeeklyPlanningQuestionContext | undefined {
  if (params.base.decision.kind === 'answer_clarification') {
    return params.base.state.lastQuestionContext;
  }
  const selectedIds = params.behaviorDialogue.response?.selectedActionIds
    ?? params.behavior.actions
      .filter((action) => action.kind !== 'acknowledge_fact')
      .slice(0, 2)
      .map((action) => action.actionId);
  const selectedActions = selectedIds.flatMap((actionId) => {
    const action = params.behavior.actions.find((candidate) => candidate.actionId === actionId);
    return action ? [action] : [];
  });
  for (const action of selectedActions) {
    if (!isQuestionBearingAction(action)) continue;
    const context = questionContextForAction({ action, base: params.base });
    if (context) return context;
  }
  return undefined;
}

