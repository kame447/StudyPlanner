        intent: 'confirm_draft_conditions',
      };
    case 'offer_dry_run_preview':
      return {
        kind: 'preview',
        targetSlot: 'preview_confirmation',
        intent: 'confirm_preview',
      };
    default:
      return undefined;
  }
}

function buildPipelineOutput(params: {""",
