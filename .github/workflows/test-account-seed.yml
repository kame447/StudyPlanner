name: Test Account Seed

on:
  pull_request:
    paths:
      - .github/workflows/test-account-seed.yml
      - tests/e2e/test-account-seed.seed.mjs
      - tests/e2e/playwright.seed.config.mjs
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-account-seed.yml
      - tests/e2e/test-account-seed.seed.mjs
      - tests/e2e/playwright.seed.config.mjs

permissions:
  contents: read

concurrency:
  group: live-test-account-seed-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate-seed-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Validate seed JavaScript syntax
        run: |
          node --check tests/e2e/test-account-seed.seed.mjs
          node --check tests/e2e/playwright.seed.config.mjs

  seed-live-test-account:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-account-verification
    permissions:
      contents: read
      issues: write
    env:
      STUDYPLANNER_LIVE_BASE_URL: ${{ secrets.STUDYPLANNER_LIVE_BASE_URL }}
      STUDYPLANNER_LIVE_EMAIL: ${{ secrets.STUDYPLANNER_LIVE_EMAIL }}
      STUDYPLANNER_LIVE_PASSWORD: ${{ secrets.STUDYPLANNER_LIVE_PASSWORD }}
      STUDYPLANNER_LIVE_ACCESS_KEY: ${{ secrets.STUDYPLANNER_LIVE_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Verify required live-account secrets are configured
        shell: bash
        run: |
          missing=0
          for name in STUDYPLANNER_LIVE_BASE_URL STUDYPLANNER_LIVE_EMAIL STUDYPLANNER_LIVE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Seed persistent UI fixtures
        run: ./tests/e2e/node_modules/.bin/playwright test tests/e2e/test-account-seed.seed.mjs --config=tests/e2e/playwright.seed.config.mjs

      - name: Record successful seed run
        if: success()
        shell: bash
        run: |
          gh issue comment 183 --repo "${GITHUB_REPOSITORY}" --body "Test Account Seed succeeded on main. Persistent fixture data was verified through the production UI. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record failed seed run
        if: failure()
        shell: bash
        run: |
          gh issue comment 183 --repo "${GITHUB_REPOSITORY}" --body "Test Account Seed failed. Inspect the workflow logs; credentials are not included in this comment. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
