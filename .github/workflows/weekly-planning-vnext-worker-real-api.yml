name: Weekly Planning VNext Worker Real-API E2E

env:
  NPM_CONFIG_REGISTRY: https://npm.flatt.tech/

# The real model through the real Worker (#926). weekly-planning-real-api-checkpoint calls the provider directly
# (VITE_CLOUDFLARE_AI_PROXY_URL is empty), so it never exercises the Worker's auth, durable turn job or output clamp.
# This run does: the production build with the durable client on, the production Worker code on wrangler dev with
# the durable job on, the Firebase Auth and Firestore emulators (no test auth bypass, no production account), and
# api.openai.com as the only allowed provider host. Paid, so owner-only and opt-in; five conversation turns (budget six).
on:
  workflow_dispatch:
    inputs:
      execute_action:
        description: Actually run the paid conversation (false only checks the setup, no API request)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-planning-vnext-worker-real-api
  cancel-in-progress: false

jobs:
  worker-real-api:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install application dependencies
        run: npm ci

      - name: Install the locked Firebase CLI
        run: npm ci --prefix tools/firebase-tools --ignore-scripts

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.64.0

      - name: Install Chromium
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Verify the API credential
        if: ${{ inputs.execute_action }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: List the conversation (no API request)
        if: ${{ !inputs.execute_action }}
        env:
          OPENAI_API_KEY: setup-check-only-no-request
        run: ./tests/e2e/node_modules/.bin/playwright test --config=tests/e2e/playwright.emulator-real-api.config.mjs --list

      - name: Run the VNext conversation with the real model through the Worker
        if: ${{ inputs.execute_action }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./tests/e2e/node_modules/.bin/playwright test --config=tests/e2e/playwright.emulator-real-api.config.mjs

      - name: Upload evidence
        if: ${{ always() && inputs.execute_action }}
        uses: actions/upload-artifact@v7
        with:
          name: weekly-planning-vnext-worker-real-api-${{ github.run_id }}
          path: |
            artifacts/playwright-emulator-real-api-results/
            artifacts/playwright-emulator-real-api-results.json
          if-no-files-found: ignore
          retention-days: 30
