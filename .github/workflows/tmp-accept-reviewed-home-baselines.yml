name: Temporary Reviewed Home Baseline Update

on:
  push:
    branches:
      - test/playwright-ui-regression

permissions:
  actions: read
  contents: write

jobs:
  update-reviewed-baselines:
    runs-on: ubuntu-latest
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4
        with:
          ref: test/playwright-ui-regression
          fetch-depth: 0

      - name: Download reviewed visual artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/9479834221/zip" \
            --output /tmp/reviewed-visual.zip
          mkdir -p /tmp/reviewed-visual
          unzip -q /tmp/reviewed-visual.zip -d /tmp/reviewed-visual

      - name: Verify and copy only reviewed Home mobile baselines
        run: |
          set -euo pipefail
          light="/tmp/reviewed-visual/playwright-visual-results/visual-regression-primary--a1761-he-approved-visual-baseline-mobile-light/home-actual.png"
          dark="/tmp/reviewed-visual/playwright-visual-results/visual-regression-primary--a1761-he-approved-visual-baseline-mobile-dark/home-actual.png"

          echo "b41b082bf7c54e9d46815ca91599ef19fe9b5efb450e209ac82adac5bf471192  ${light}" | sha256sum --check --strict
          echo "c6a22e6923f297ccb941b5962bebdcc4f726c3cd0e79fcac5feca29962961c39  ${dark}" | sha256sum --check --strict

          cp "${light}" tests/e2e/visual-regression.spec.mjs-snapshots/home-mobile-light-linux.png
          cp "${dark}" tests/e2e/visual-regression.spec.mjs-snapshots/home-mobile-dark-linux.png

      - name: Commit reviewed baselines
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/visual-regression.spec.mjs-snapshots/home-mobile-light-linux.png \
            tests/e2e/visual-regression.spec.mjs-snapshots/home-mobile-dark-linux.png
          git diff --cached --quiet && { echo "Reviewed baselines produced no diff"; exit 1; }
          git commit -m "test: update reviewed Home mobile visual baselines"
          git push origin HEAD:test/playwright-ui-regression
