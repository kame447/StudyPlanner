# ROOT EXECUTION GRANTED for reservation consultation-date-whatif-adopt-live-ui; root fresh carrier2field binding is still required.
# Reservation consultation-date-whatif-adopt-live-ui: six ordinary calls plus at most one generic semantic repair.
# Root alone publishes/dispatches. The zero carrier lease below blocks execution until final root binding.
name: Issue 488 Consultation Date Live Once
on:
  push:
    branches: ['integration/issue488-a-c-e-r0']
    paths: ['.github/workflows/issue488-consultation-date-live-once.yml']
permissions:
  contents: read
env:
  EVENT_PARENT: 'e7058dae63b26968859135abd6099d39ae877bb5'
  EVENT_PARENT_TREE: 'db37d7bb56c9731f8585f985ee2dfeb7c6b05bdf'
  SOURCE_SHA: '60c7eb22aa4765c587c2c5e6980a2102a37513bb'
  SOURCE_TREE: 'ff8bd3dfeaf0c3f41052dc4d061da56fa0727485'
  WORKFLOW_PATH: '.github/workflows/issue488-consultation-date-live-once.yml'
concurrency:
  group: issue488-consultation-date-live-once
  cancel-in-progress: false
jobs:
  consultation_once:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'kame447/StudyPlanner' &&
          github.repository_id == '1202727586' &&
          github.repository_owner == 'kame447' &&
          github.actor == 'kame447' && github.actor_id == '76802107' &&
          github.triggering_actor == 'kame447' &&
          github.ref == 'refs/heads/integration/issue488-a-c-e-r0' &&
          github.run_attempt == 1 &&
          github.event.created == false && github.event.deleted == false &&
          github.event.forced == false }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      OPENAI_API_KEY: ''
      VITE_AI_API_KEY: ''
      VITE_CLOUDFLARE_AI_PROXY_URL: ''
      STUDYPLANNER_F1_REAL_API: '0'
      STUDYPLANNER_R0_REAL_API: '0'
      STUDYPLANNER_H_REAL_API: '0'
      STUDYPLANNER_H2_REAL_API: '0'
      GOOGLE_API_KEY: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the one-file direct-child event before any source execution
        id: event_guard
        env:
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTING_WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = kame447/StudyPlanner
          test "$GITHUB_REPOSITORY_ID" = 1202727586
          test "$GITHUB_REPOSITORY_OWNER" = kame447
          test "$GITHUB_ACTOR" = kame447
          test "$GITHUB_ACTOR_ID" = 76802107
          test "$GITHUB_TRIGGERING_ACTOR" = kame447
          test "$GITHUB_REF" = refs/heads/integration/issue488-a-c-e-r0
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXECUTING_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$EXECUTING_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$WORKFLOW_PATH@$GITHUB_REF"
          python3 - <<'PYEVENT'
          import json,os,pathlib
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['before']==os.environ['EVENT_PARENT'] and event['after']==os.environ['GITHUB_SHA']
          assert event['created'] is False and event['deleted'] is False and event['forced'] is False
          assert event['repository']['full_name']=='kame447/StudyPlanner' and event['repository']['id']==1202727586
          assert event['sender']['login']=='kame447' and event['sender']['id']==76802107
          PYEVENT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P "$GITHUB_SHA")" = "$EVENT_PARENT"
          test "$(git rev-parse "${EVENT_PARENT}^{tree}")" = "$EVENT_PARENT_TREE"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r "$EVENT_PARENT" "$GITHUB_SHA")" = "$(printf 'A\t%s' "$WORKFLOW_PATH")"
          test "$(git ls-tree "$GITHUB_SHA" -- "$WORKFLOW_PATH" | awk '{print $1, $2}')" = '100644 blob'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/consultation-artifacts"
          cp "$WORKFLOW_PATH" "$RUNNER_TEMP/consultation-artifacts/executing-workflow.yml"
          python3 - <<'PYPROVENANCE'
          import json,os,pathlib
          values={key:os.environ[name] for key,name in {'source':'SOURCE_SHA','tree':'SOURCE_TREE','eventParent':'EVENT_PARENT','eventParentTree':'EVENT_PARENT_TREE','event':'GITHUB_SHA',
              'workflow':'EXECUTING_WORKFLOW_SHA','ref':'GITHUB_REF','runId':'GITHUB_RUN_ID'}.items()}
          values['attempt']=1
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'consultation-artifacts/event-provenance.json').write_text(json.dumps(values,indent=2)+'\n')
          PYPROVENANCE
      - name: Check out immutable consultation production source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
      - name: Install locked app and version-matched runner with no model credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          test -w "$PWD"; test -w "$HOME"; test -w "$RUNNER_TEMP"
          test "$(node -v)" = v22.23.0
          test "$PLAYWRIGHT_BROWSERS_PATH" = /ms-playwright
          test -z "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          sha256sum package.json package-lock.json > "$RUNNER_TEMP/consultation-artifacts/app-manifests.sha256"
          test ! -e .npmrc
          test ! -e "$RUNNER_TEMP/consultation-isolated-home"; test ! -e "$RUNNER_TEMP/consultation-npm"
          mkdir -p "$RUNNER_TEMP/consultation-isolated-home" "$RUNNER_TEMP/consultation-npm/cache" "$RUNNER_TEMP/consultation-npm/logs"
          : > "$RUNNER_TEMP/consultation-npm/user.npmrc"; : > "$RUNNER_TEMP/consultation-npm/global.npmrc"
          NODE_BIN="$(command -v node)"; NPM_ENTRY="$(readlink -f "$(command -v npm)")"
          export NODE_BIN NPM_ENTRY
          python3 - <<'PYNPM'
          import hashlib,json,os,pathlib,subprocess
          node=pathlib.Path(os.environ['NODE_BIN']).resolve();npm=pathlib.Path(os.environ['NPM_ENTRY'])
          assert npm.is_file() and str(npm).endswith('/node_modules/npm/bin/npm-cli.js')
          package=json.loads((npm.parents[1]/'package.json').read_text());assert package['name']=='npm'
          info={'nodePath':str(node),'nodeSha256':hashlib.sha256(node.read_bytes()).hexdigest(),
            'nodeVersion':subprocess.check_output([str(node),'--version'],text=True).strip(),
            'npmEntry':str(npm),'npmEntrySha256':hashlib.sha256(npm.read_bytes()).hexdigest(),'npmVersion':package['version'],
            'configScope':'fresh private HOME, user/global configs, cache and logs; env -i; source .npmrc absent'}
          assert info['nodeVersion']=='v22.23.0'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'consultation-artifacts/install-tooling.json').write_text(json.dumps(info,indent=2)+'\n')
          PYNPM
          clean_npm() {
            env -i PATH="$(dirname "$NODE_BIN"):/usr/local/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/consultation-isolated-home" \
              CI=true TZ=UTC PLAYWRIGHT_BROWSERS_PATH=/ms-playwright PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
              npm_config_userconfig="$RUNNER_TEMP/consultation-npm/user.npmrc" npm_config_globalconfig="$RUNNER_TEMP/consultation-npm/global.npmrc" \
              npm_config_cache="$RUNNER_TEMP/consultation-npm/cache" npm_config_logs_dir="$RUNNER_TEMP/consultation-npm/logs" \
              npm_config_update_notifier=false npm_config_fund=false WRANGLER_SEND_METRICS=false \
              "$NODE_BIN" "$NPM_ENTRY" "$@"
          }
          clean_npm ci
          clean_npm install --prefix "$RUNNER_TEMP/consultation-pw" --no-save --package-lock=false @playwright/test@1.64.0
          python3 - <<'PYNPMCHECK'
          import hashlib,json,os,pathlib
          j=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'consultation-artifacts/install-tooling.json').read_text())
          for key,hashkey in [('nodePath','nodeSha256'),('npmEntry','npmEntrySha256')]:
              assert hashlib.sha256(pathlib.Path(j[key]).read_bytes()).hexdigest()==j[hashkey]
          PYNPMCHECK
          sha256sum -c "$RUNNER_TEMP/consultation-artifacts/app-manifests.sha256"
          # No playwright install, apt, browser fallback, or executablePath override.
      - name: Materialize the exact reviewed live bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          import base64,gzip,hashlib,io,json,os,pathlib,tarfile
          packed=base64.b64decode('')
          assert len(packed)==152667 and hashlib.sha256(packed).hexdigest()=='7b04c43d41d31d28ed61ffd2e3dec7dc7be3ea2d605b886a1e05d37700bf8401'
          raw=gzip.decompress(packed);assert len(raw)==450560 and hashlib.sha256(raw).hexdigest()=='636235b6d9b379f67665f529595804cbba603013249d98d1515d8efde59db2e7'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'consultation-bundle';root.mkdir(exist_ok=False)
          expected={'candidate/budget-envelope.json': 'a40ad53ece426ad7b8ee7ef168b830f3136c0c99d37a8853cbc4f7d2b8c46303', 'candidate/consultation-oracles.mjs': 'd53ecd023004e5e73cbb5336e410252de388be37a3a46d727cb2f384b6561744', 'candidate/consultation-playwright.config.template.mjs': '4b9faf7a81194737d7039b3257a54e04d9994c092d0c3af693eab8fcf95f261b', 'candidate/consultation-route-contract.mjs': '547709681eded7cab34fa48f17114276cb6e952adbba73f1d9a9df32ae2fb535', 'candidate/consultation-vite.config.template.mjs': '2ec8dc6dbc4c9e5194feed779ee43373b0720d8fc9205a6c7a7f9005ccd2c6d2', 'candidate/consultation.live-app.mjs': 'c09592841bc1d8519e9e717ce82db600062a4951263b93306343dddd882025e6', 'candidate/f1-ui-observers.mjs': 'efd1148116b158a3df4e4d1be71db7ae3e5378f3b2ceb0cee9a190ddf21845c7', 'candidate/fixed-clock.mjs': '1fc159075ad5563e1904450652678445523475c2d5e09c68bc15ace5be6524e5', 'candidate/live-dispatch.mjs': '86d7df804b34823f9c5257ae2dcb928d71bdeece3ecbc143d7d431aafb3f3fcc', 'candidate/prepare-consultation-gate.py': '576d456f3e07b130b436b2471229838557f4e5fdafa0339ee0fcf3b1b5b88455', 'candidate/r0-captured-evidence.mjs': '79a054f4631983b9057b76f3de4dac45f7e1112aaae634769bd824145b6c2cc0', 'candidate/read-unless-stopped.mjs': '90cf181c39e02ab2b8fdab111cdecb739b58455a1f092df142fcc0299308dc9f', 'candidate/scenarios.json': '5e2f2d425a0f933ed02a0efefa6311c0e7f7b730898a74983e37a5520b36d6a9', 'candidate/source-pins.json': '87c97381b534b7c2081b065b99a1acb6c4d35d4b18bc3b0fa889210397c7d47f', 'candidate/startup-ready.mjs': 'd0d8adb0f428a75ae0249460763938a84ecc06e516f32436c616d94a6d84fe63', 'execution-wrapper/run-consultation-live.py': '3159b77f8447979a110496908415f8208f64b8a5d0e8af99d546a4a2cd83d8d5', 'manifest.json': 'f072bdbc2e25577400b29dc012fdbbbc01e1165c31e770f82d674712ba4d17fb'}
          expected_sizes={'candidate/budget-envelope.json': 7183, 'candidate/consultation-oracles.mjs': 2414, 'candidate/consultation-playwright.config.template.mjs': 1140, 'candidate/consultation-route-contract.mjs': 4051, 'candidate/consultation-vite.config.template.mjs': 2286, 'candidate/consultation.live-app.mjs': 14028, 'candidate/f1-ui-observers.mjs': 25327, 'candidate/fixed-clock.mjs': 1501, 'candidate/live-dispatch.mjs': 7336, 'candidate/prepare-consultation-gate.py': 2792, 'candidate/r0-captured-evidence.mjs': 4683, 'candidate/read-unless-stopped.mjs': 490, 'candidate/scenarios.json': 785, 'candidate/source-pins.json': 331747, 'candidate/startup-ready.mjs': 1779, 'execution-wrapper/run-consultation-live.py': 24035, 'manifest.json': 2178}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
              rows=archive.getmembers()
              assert len(rows)==len(expected) and sorted(row.name for row in rows)==sorted(expected)
              values={}
              for row in rows:
                  assert row.isfile() and row.name in expected and row.size == expected_sizes[row.name]
                  value=archive.extractfile(row).read();assert len(value)==row.size
                  assert hashlib.sha256(value).hexdigest()==expected[row.name]
                  values[row.name]=value
              for name,value in values.items():
                  target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(value)
          PYBUNDLE
      - name: Bounded live consultation App acceptance from the exact reservation
        id: live_app
        timeout-minutes: 13
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"; test -z "$GOOGLE_API_KEY"
          mkdir -p "$RUNNER_TEMP/consultation-isolated-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/consultation-isolated-home" PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            ISSUE488_CONSULTATION_LIVE_SLOT_GRANTED=yes OPENAI_API_KEY="$OPENAI_API_KEY" CI=true TZ=UTC WRANGLER_SEND_METRICS=false \
            python3 "$RUNNER_TEMP/consultation-bundle/execution-wrapper/run-consultation-live.py" \
            --root "$PWD" --node "$(command -v node)" --playwright "$RUNNER_TEMP/consultation-pw/node_modules" \
            --output "$RUNNER_TEMP/consultation-live-execution-1" \
            > "$RUNNER_TEMP/consultation-artifacts/runner.log" 2>&1
          python3 - <<'PYTERMINAL'
          import json,os,pathlib
          receipt=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'consultation-live-execution-1/terminal-receipt.json').read_text())
          assert receipt['result']=='passed' and receipt['lastStage']=='completed'
          assert type(receipt['processExitCode']) is int and receipt['processExitCode']==0
          assert receipt['immutableBeforeAfterEqual'] is True and receipt['narrowBeforeAfterEqual'] is True
          PYTERMINAL
      - name: Preserve bounded diagnostics inside the single proven artifact root
        id: diagnostic_stage
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/consultation-live-execution-1"
          DEST="$RUNNER_TEMP/consultation-artifacts/execution"
          # Small diagnostics also survive in the job log if artifact delivery fails.
          python3 - <<'PYDIAGNOSTICS'
          import json,os,pathlib,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'consultation-live-execution-1'
          receipt=root/'terminal-receipt.json'
          try:
              meta=receipt.lstat()
              if not stat.S_ISREG(meta.st_mode) or meta.st_size>8*1024*1024:
                  raise ValueError('Receipt is not a bounded regular file')
              value=json.loads(receipt.read_text())
              if not isinstance(value,dict):raise TypeError('Receipt is not an object')
              keys=['lastStage','processExitCode','result','error','afterError','immutableBeforeAfterEqual','narrowBeforeAfterEqual']
              print('CONSULTATION_TERMINAL_DIAGNOSTIC '+json.dumps({k:value.get(k) for k in keys})[:8192])
          except Exception as exc:print('CONSULTATION_TERMINAL_DIAGNOSTIC unavailable: '+type(exc).__name__)
          log=root/'playwright.log'
          try:
              meta=log.lstat()
              if not stat.S_ISREG(meta.st_mode):raise ValueError('Log is not a regular file')
              with log.open('rb') as stream:
                  stream.seek(max(0,meta.st_size-24576));tail=stream.read(24576).decode('utf-8',errors='replace')
              print('CONSULTATION_PLAYWRIGHT_FAILURE_TAIL_BEGIN\n'+'\n'.join(tail.splitlines()[-80:])+'\nCONSULTATION_PLAYWRIGHT_FAILURE_TAIL_END')
          except Exception as exc:print('CONSULTATION_PLAYWRIGHT_FAILURE_TAIL unavailable: '+type(exc).__name__)
          PYDIAGNOSTICS
          test -d "$SRC"; test ! -e "$DEST"
          # Copy only generated evidence/input records, excluding disposable browser/temp and Vite caches.
          python3 - <<'PYBOUNDS'
          import os,pathlib,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'consultation-live-execution-1';count=0;size=0
          for parent,dirs,files in os.walk(root,followlinks=False):
              here=pathlib.Path(parent)
              dirs[:]=[name for name in dirs if here/name not in [root/'tmp',root/'app/vite-cache']]
              for name in dirs+files:
                  item=here/name;mode=item.lstat().st_mode
                  assert stat.S_ISREG(mode) or stat.S_ISDIR(mode), 'Non-regular diagnostic input'
                  if stat.S_ISREG(mode):count+=1;size+=item.stat().st_size
          assert count<=10000 and size<=256*1024*1024, 'Diagnostic evidence exceeds bounded upload scope'
          print('CONSULTATION_DIAGNOSTIC_COPY_BOUNDS files='+str(count)+' bytes='+str(size))
          PYBOUNDS
          mkdir -p "$DEST"
          for entry in "$SRC"/*; do
            test -e "$entry" || continue
            name="$(basename "$entry")"
            if test "$name" = tmp; then continue; fi
            if test "$name" = app; then
              mkdir -p "$DEST/app"
              for child in "$entry"/*; do
                test -e "$child" || continue
                if test "$(basename "$child")" = vite-cache; then continue; fi
                cp -a -- "$child" "$DEST/app/"
              done
            else cp -a -- "$entry" "$DEST/"
            fi
          done
          test -f "$DEST/terminal-receipt.json"
          cmp "$SRC/terminal-receipt.json" "$DEST/terminal-receipt.json"
      - name: Require the immutable product source after every attempted gate
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"; test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          sha256sum -c "$RUNNER_TEMP/consultation-artifacts/app-manifests.sha256"
      - name: Upload bounded live evidence on success or failure
        if: ${{ always() && steps.event_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue488-consultation-live-source-${{ env.SOURCE_SHA }}-event-${{ github.sha }}
          path: ${{ runner.temp }}/consultation-artifacts/
          if-no-files-found: error
          retention-days: 14
