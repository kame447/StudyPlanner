name: One-shot merged material-context branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-delete-merged-issue187-material-context-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merged branch target
        run: |
          git fetch origin refactor/issue187-explicit-material-context
          test "$(git rev-parse origin/refactor/issue187-explicit-material-context)" = "8c554d54a09472673c98fa219092c046a7010a2c"
          git merge-base --is-ancestor aaef5aac11e0b1573b7ed0116d5cdc935402ba6b origin/main
          test "$(git rev-parse origin/refactor/issue187-explicit-material-context^{tree})" = "$(git rev-parse aaef5aac11e0b1573b7ed0116d5cdc935402ba6b^{tree})"
      - name: Delete explicit merged branch
        run: git push origin --delete -- refactor/issue187-explicit-material-context
