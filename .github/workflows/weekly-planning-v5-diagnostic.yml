name: Weekly Planning V5 Diagnostic

on:
  push:
    branches:
      - test/weekly-planning-semantic-schema-eval
  pull_request:
    branches:
      - main
    paths:
      - 'src/features/weeklyPlanning/semantic/**'
      - '.github/workflows/weekly-planning-v5-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run semantic validator tests
        id: tests
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run test:run -- src/features/weeklyPlanning/semantic/weeklyPlanningSemanticValidator.test.ts 2>&1 | tee artifacts/semantic-validator-test.log
      - name: Run TypeScript and build
        id: build
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run build 2>&1 | tee artifacts/build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-planning-v5-diagnostics
          path: artifacts
          if-no-files-found: warn
      - name: Publish diagnostic tail
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '<!-- weekly-planning-v5-diagnostic -->'
            echo '## V5 diagnostic'
            echo
            echo '### semantic validator test'
            echo '```text'
            tail -n 100 artifacts/semantic-validator-test.log 2>/dev/null || true
            echo '```'
            echo
            echo '### build'
            echo '```text'
            tail -n 140 artifacts/build.log 2>/dev/null || true
            echo '```'
          } > /tmp/weekly-planning-v5-diagnostic.md
          gh pr comment 77 --body-file /tmp/weekly-planning-v5-diagnostic.md
      - name: Propagate failure
        if: steps.tests.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
