name: PR5 self migration

on:
  push:
    branches:
      - agent/weekly-planning-conversation-hardening

permissions:
  contents: write
  issues: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Finalize AI interpreter
        id: migrate
        continue-on-error: true
        run: |
          set -o pipefail
          python .github/scripts/pr5_finalize_ai_interpreter.py 2>&1 | tee /tmp/migrate.log

      - name: Commit finalized interpreter
        if: steps.migrate.outcome == 'success'
        run: |
          if git diff --quiet; then
            echo 'No interpreter changes required.'
            exit 0
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/weeklyPlanning/intake/weeklyPlanningAiInterpreter.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningAiInterpreterCore.ts
          git commit -m "feat: AI interpreterの重複実装を解消"
          git push origin HEAD:agent/weekly-planning-conversation-hardening

      - name: Report migration result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/migrate.log')
              ? fs.readFileSync('/tmp/migrate.log', 'utf8').slice(-12000)
              : 'migration log not found';
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 20,
              body: `interpreter finalization: ${{ steps.migrate.outcome }}\nhead: ${context.sha}\n\n\`\`\`text\n${log}\n\`\`\``,
            });

      - name: Fail on finalization error
        if: steps.migrate.outcome != 'success'
        run: exit 1
