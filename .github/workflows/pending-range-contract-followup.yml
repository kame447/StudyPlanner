name: Pending range contract follow-up

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: github.event.issue.title == '[automation] pending range contract follow-up'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply exact contract fixes
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/followup.log
          from pathlib import Path
          import re

          def sub_exact(path, pattern, replacement, expected=1, flags=0):
              p = Path(path)
              text = p.read_text()
              next_text, count = re.subn(pattern, replacement, text, count=expected, flags=flags)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} substitutions, found {count}: {pattern[:80]}')
              p.write_text(next_text)

          scope = 'src/features/weeklyPlanning/intake/weeklyPlanningScopeParsing.ts'
          sub_exact(
              scope,
              r"(function isBareDurationAnswer\(text: string\): boolean \{.*?\n\}\n)",
              r"\1\nfunction isCombinedStartAndDurationAnswer(text: string): boolean {\n  return /^\\s*\\d{1,2}\\s*月\\s*\\d{1,2}\\s*日(?:\\s*から)?\\s*(?:(?:一|1)\\s*週間|7\\s*日間?)(?:\\s*です)?\\s*$/.test(\n    normalizeIntakeText(text),\n  );\n}\n",
              flags=re.S,
          )
          sub_exact(
              scope,
              r"return isBareStartDateAnswer\(text\)\n\s*\|\| isBareWeekdayStartAnswer\(text\)",
              "return isBareStartDateAnswer(text)\n    || isCombinedStartAndDurationAnswer(text)\n    || isBareWeekdayStartAnswer(text)",
          )
          sub_exact(
              scope,
              r"return isBareDurationAnswer\(text\)\n\s*\|\| \(",
              "return isBareDurationAnswer(text)\n    || isCombinedStartAndDurationAnswer(text)\n    || (",
          )

          ai = Path('src/features/weeklyPlanning/intake/weeklyPlanningAiInterpreter.ts')
          text = ai.read_text()
          old_import = "import type { OpenAiCompatibleClient } from '../../../lib/openaiCompatibleClient';"
          if text.count(old_import) != 1:
              raise SystemExit(f'AI client import count: {text.count(old_import)}')
          text = text.replace(
              old_import,
              "import type { JsonSchemaResponseFormat, OpenAiCompatibleClient } from '../../../lib/openaiCompatibleClient';",
          )
          response_pattern = re.compile(
              r"export const WEEKLY_PLANNING_INTERPRETER_RESPONSE_FORMAT = \{.*?\n\};\n\nfunction isRecord",
              re.S,
          )
          response_replacement = """export const WEEKLY_PLANNING_INTERPRETER_RESPONSE_FORMAT: JsonSchemaResponseFormat = {
  type: 'json_schema',
  json_schema: {
    name: 'weekly_planning_interpreted_commands',
    strict: false,
    schema: {
      type: 'object',
      additionalProperties: false,
      required: ['candidates'],
      properties: {
        candidates: {
          type: 'array',
          items: {
            anyOf: WEEKLY_PLANNING_COMMAND_SCHEMAS,
          },
        },
        assumptionProposalDrafts: {
          type: 'array',
          items: ASSUMPTION_PROPOSAL_DRAFT_SCHEMA,
        },
      },
    },
  },
};

function isRecord"""
          text, count = response_pattern.subn(response_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'AI response format count: {count}')
          old_relative = "- Resolve relative dates such as today, tomorrow, the day after tomorrow, and next week from context.currentDateTime. Emit ISO YYYY-MM-DD or YYYY-MM-DDTHH:mm:ss values only when the resolution is certain."
          new_relative = "- Resolve today, tomorrow, and the day after tomorrow from context.currentDateTime. Resolve a planning next_week window from context.selectedDate so deterministic and AI paths use the same selected week. Emit ISO values only when the resolution is certain."
          if text.count(old_relative) != 1:
              raise SystemExit(f'AI relative prompt count: {text.count(old_relative)}')
          text = text.replace(old_relative, new_relative)
          old_promotion_line = "    '- Emit set_planning_range only when both pending.planningStartDate and pending.durationDays are known and the selected start date satisfies the pending window. Never persist a fully resolved pending object.',"
          new_promotion_lines = old_promotion_line + "\n    '- Never substitute an inferred set_planning_range for an unresolved pending range.',"
          if text.count(old_promotion_line) != 1:
              raise SystemExit(f'AI promotion prompt count: {text.count(old_promotion_line)}')
          text = text.replace(old_promotion_line, new_promotion_lines)
          ai.write_text(text)

          edge = 'src/features/weeklyPlanning/__tests__/weeklyPlanningIntakeEdgeCases.test.ts'
          sub_exact(
              edge,
              re.escape("scope: { kind: 'next_week', label: '来週', startDate: '2026-07-13' },"),
              "scope: {\n          kind: 'next_week',\n          label: '来週',\n          windowStartDate: '2026-07-13',\n          windowEndDate: '2026-07-19',\n        },",
          )

          foundation = 'src/features/weeklyPlanning/__tests__/weeklyPlanningInterpreterFoundation.test.ts'
          sub_exact(
              foundation,
              r"  it\.each\(\[\n    \['Friday', '2026-07-10T15:30:00', '2026-07-13', '2026-07-19'\],\n    \['Sunday', '2026-07-12T15:30:00', '2026-07-13', '2026-07-19'\],\n    \['Monday', '2026-07-13T15:30:00', '2026-07-20', '2026-07-26'\],\n  \]\)\('normalizes a next_week pending command from the current date at the %s boundary', \(",
              "  it.each([\n    ['Friday current time', '2026-07-10T15:30:00', '2020-01-06', '2020-01-12'],\n    ['Sunday current time', '2026-07-12T15:30:00', '2020-01-06', '2020-01-12'],\n    ['Monday current time', '2026-07-13T15:30:00', '2020-01-06', '2020-01-12'],\n  ])('normalizes a next_week pending command from selectedDate at the %s boundary', (",
          )
          sub_exact(
              foundation,
              re.escape("        startDate: expectedStartDate,\n        endDate: expectedEndDate,"),
              "        windowStartDate: expectedStartDate,\n        windowEndDate: expectedEndDate,",
          )
          sub_exact(
              foundation,
              re.escape("{ scope: { kind: 'next_week', label: 'next week', startDate: 'not-a-date' }, sourceText: 'next week' },\n      'invalid-date',"),
              "{ scope: { kind: 'next_week', label: 'next week', windowStartDate: 'not-a-date', windowEndDate: '2026-07-19' }, sourceText: 'next week' },\n      'invalid-command-shape',",
          )
          sub_exact(foundation, re.escape("expect(prompt).toContain('pendingPlanningRange.startDate');"), "expect(prompt).toContain('pending.planningStartDate');")
          sub_exact(foundation, re.escape("expect(prompt).toContain('concrete ISO date inside that pending window');"), "expect(prompt).toContain('selected start date satisfies the pending window');")
          sub_exact(foundation, re.escape("expect(prompt).toContain('the application computes the next_week window');"), "expect(prompt).toContain('planning next_week window from context.selectedDate');")
          PY

      - name: Commit exact fixes
        id: commit
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/features/weeklyPlanning/intake/weeklyPlanningScopeParsing.ts \
              src/features/weeklyPlanning/intake/weeklyPlanningAiInterpreter.ts \
              src/features/weeklyPlanning/__tests__/weeklyPlanningIntakeEdgeCases.test.ts \
              src/features/weeklyPlanning/__tests__/weeklyPlanningInterpreterFoundation.test.ts
            git diff --cached --check
            git commit -m "feat: pending rangeの既存契約を追補"
            git push origin HEAD:agent/weekly-planning-conversation-hardening
          } 2>&1 | tee /tmp/commit.log

      - name: Report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const apply = '${{ steps.apply.outcome }}';
            const commit = '${{ steps.commit.outcome }}';
            const ok = apply === 'success' && commit === 'success';
            const logs = ['/tmp/followup.log', '/tmp/commit.log']
              .filter(path => fs.existsSync(path))
              .map(path => fs.readFileSync(path, 'utf8').split('\n').slice(-60).join('\n'))
              .join('\n');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `follow-up migration: ${ok ? 'PASS' : 'FAIL'}\napply: ${apply}\ncommit: ${commit}\n\n\`\`\`text\n${logs}\n\`\`\``,
              state: ok ? 'closed' : 'open',
              state_reason: ok ? 'completed' : undefined,
            });
            if (!ok) core.setFailed('follow-up migration failed');
