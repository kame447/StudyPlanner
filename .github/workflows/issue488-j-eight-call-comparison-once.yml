# PREPARATION ONLY. Do not publish/run before root authorization and final review.
# One added workflow file, direct child of the existing integration cleanup; attempt 1 only.
name: Issue 488 J Eight-Call Comparison Once
on:
  push:
    branches: ['integration/issue488-a-c-e-r0']
    paths: ['.github/workflows/issue488-j-eight-call-comparison-once.yml']
permissions:
  contents: read
env:
  EVENT_PARENT: 'c5ac88d3ee57d3a723ab933841002cb724969a8a'
  EVENT_PARENT_TREE: 'db37d7bb56c9731f8585f985ee2dfeb7c6b05bdf'
  SOURCE_SHA: '298604a4eaa3b1ab3a5612c90a668d8c89d01eb0'
  SOURCE_TREE: '68073804bbbeba4c8f4f1ebd428beb78a8a560a1'
  WORKFLOW_PATH: '.github/workflows/issue488-j-eight-call-comparison-once.yml'
concurrency:
  group: issue488-j-eight-call-comparison-once
  cancel-in-progress: false
jobs:
  j_once:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'kame447/StudyPlanner' &&
          github.repository_id == '1202727586' &&
          github.repository_owner == 'kame447' &&
          github.actor == 'kame447' && github.actor_id == '76802107' &&
          github.triggering_actor == 'kame447' &&
          github.ref == 'refs/heads/integration/issue488-a-c-e-r0' &&
          github.run_attempt == 1 &&
          github.event.created == false && github.event.deleted == false &&
          github.event.forced == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ''
      VITE_AI_API_KEY: ''
      VITE_CLOUDFLARE_AI_PROXY_URL: ''
      STUDYPLANNER_F1_REAL_API: '0'
      STUDYPLANNER_R0_REAL_API: '0'
      STUDYPLANNER_H_REAL_API: '0'
      STUDYPLANNER_H2_REAL_API: '0'
      GOOGLE_API_KEY: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the one-file direct-child event before any source execution
        id: event_guard
        env:
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTING_WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = kame447/StudyPlanner
          test "$GITHUB_REPOSITORY_ID" = 1202727586
          test "$GITHUB_REPOSITORY_OWNER" = kame447
          test "$GITHUB_ACTOR" = kame447
          test "$GITHUB_ACTOR_ID" = 76802107
          test "$GITHUB_TRIGGERING_ACTOR" = kame447
          test "$GITHUB_REF" = refs/heads/integration/issue488-a-c-e-r0
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXECUTING_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$EXECUTING_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$WORKFLOW_PATH@$GITHUB_REF"
          python3 - <<'PYEVENT'
          import json,os,pathlib
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['before']==os.environ['EVENT_PARENT'] and event['after']==os.environ['GITHUB_SHA']
          assert event['created'] is False and event['deleted'] is False and event['forced'] is False
          assert event['repository']['full_name']=='kame447/StudyPlanner' and event['repository']['id']==1202727586
          assert event['sender']['login']=='kame447' and event['sender']['id']==76802107
          PYEVENT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P "$GITHUB_SHA")" = "$EVENT_PARENT"
          test "$(git rev-parse "${EVENT_PARENT}^{tree}")" = "$EVENT_PARENT_TREE"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r "$EVENT_PARENT" "$GITHUB_SHA")" = "$(printf 'A\t%s' "$WORKFLOW_PATH")"
          test "$(git ls-tree "$GITHUB_SHA" -- "$WORKFLOW_PATH" | awk '{print $1, $2}')" = '100644 blob'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/j8-artifacts"
          cp "$WORKFLOW_PATH" "$RUNNER_TEMP/j8-artifacts/executing-workflow.yml"
          python3 - <<'PYPROVENANCE'
          import json,os,pathlib
          values={key:os.environ[name] for key,name in {'source':'SOURCE_SHA','tree':'SOURCE_TREE','eventParent':'EVENT_PARENT','eventParentTree':'EVENT_PARENT_TREE','event':'GITHUB_SHA',
              'workflow':'EXECUTING_WORKFLOW_SHA','ref':'GITHUB_REF','runId':'GITHUB_RUN_ID'}.items()}
          values['attempt']=1
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'j8-artifacts/event-provenance.json').write_text(json.dumps(values,indent=2)+'\n')
          PYPROVENANCE
      - name: Check out immutable J production source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
      - name: Install exactly locked dependencies without a model credential
        shell: bash
        run: |
          set -euo pipefail
          test -z "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"
          test "$(node -v)" = v22.23.0
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"; test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"; test ! -e .npmrc
          mkdir "$RUNNER_TEMP/j8-home" "$RUNNER_TEMP/j8-npm" "$RUNNER_TEMP/j8-tmp"
          : > "$RUNNER_TEMP/j8-npm/user.npmrc"; : > "$RUNNER_TEMP/j8-npm/global.npmrc"
          sha256sum package.json package-lock.json > "$RUNNER_TEMP/j8-artifacts/package-pins.sha256"
          python3 - <<'PYHOOK'
          import json,pathlib
          scripts=json.loads(pathlib.Path('package.json').read_text()).get('scripts',{})
          assert not any(scripts.get(k) for k in ('preinstall','install','postinstall','prepare'))
          PYHOOK
          NODE_BIN="$(command -v node)"; NPM_ENTRY="$(readlink -f "$(command -v npm)")"
          test "${NPM_ENTRY##*/}" = npm-cli.js
          env -i PATH="$(dirname "$NODE_BIN"):/usr/bin:/bin" HOME="$RUNNER_TEMP/j8-home" TMPDIR="$RUNNER_TEMP/j8-tmp" CI=true TZ=UTC \
            npm_config_userconfig="$RUNNER_TEMP/j8-npm/user.npmrc" npm_config_globalconfig="$RUNNER_TEMP/j8-npm/global.npmrc" \
            npm_config_cache="$RUNNER_TEMP/j8-npm/cache" npm_config_logs_dir="$RUNNER_TEMP/j8-npm/logs" \
            npm_config_update_notifier=false npm_config_fund=false WRANGLER_SEND_METRICS=false \
            "$NODE_BIN" "$NPM_ENTRY" ci
          sha256sum -c "$RUNNER_TEMP/j8-artifacts/package-pins.sha256"
      - name: Materialize reviewed J adapter
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          import base64,gzip,hashlib,io,json,os,pathlib,tarfile
          packed=base64.b64decode('')
          assert hashlib.sha256(packed).hexdigest()=='c9f1f24278d2c24f54359c5295a01a125ee81a57c6955718b064807727824c44'
          raw=gzip.decompress(packed);assert len(raw)==153600 and hashlib.sha256(raw).hexdigest()=='2357e6d4691e4f6cee865a897a3f4bf1cce0bb48ec3f3d8b457a321ae09b47c2'
          expected={'bounded-transport.mjs': {'sha256': 'e4e2a3f869a5083d7ba1028234eb058fdd86302cb7e4ad4923449ff56165520c', 'bytes': 4657}, 'bounded-transport.test.mjs': {'sha256': '4e667da6b68d836a5ca5938b2e8839f4f6807469c6933b023fcf45aa0ccb99d8', 'bytes': 5000}, 'build-bundles.mjs': {'sha256': 'ea29ac99e840517c5cbf426770f86a3eb76761f76e6771beb379f3adc930ca7f', 'bytes': 5037}, 'run-paid.mjs': {'sha256': 'ffe8992e4d191069adb84a9917ac56d9130cfbf21a7d55997355df764372f582', 'bytes': 6350}, 'comparison-controls.mjs': {'sha256': '5dd0a73c11a1664c27d2e3610dc7cb5b14a9f7d03967a935ec7d81d2af741821', 'bytes': 10546}, 'scenarios.json': {'sha256': '36b742ea41b3eb1262e36c6dca7a2167d4d0ccc0e4bcedbd84c0e5ddfe227302', 'bytes': 5976}, 'fixtures.json': {'sha256': '34138b2e3683adf6b1a98ed2cbdccba05bb683cba3db593ef376eda3144749ed', 'bytes': 90715}, 'root-reservation.json': {'sha256': 'cdb7c5c9c8083d4b42c3e8464aeb220c931abafe51b2f5dda6929820a37333ab', 'bytes': 390}, 'capture-runtime.py': {'sha256': '8ee7fbeccbfc5594708a130ebdc87537a6042e96cc529060ce3e6fa911ce6fce', 'bytes': 1295}, 'README.md': {'sha256': '1b00d55e3e9b12e0d57aa8568a325f004ae426ba401fed60d6c4f83eec7dd02f', 'bytes': 6570}}
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'j8-adapter';root.mkdir()
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
              rows=archive.getmembers();assert len(rows)==len(expected) and len({r.name for r in rows})==len(rows)
              for row in rows:
                  assert row.isfile() and row.name in expected and row.size==expected[row.name]['bytes'] and row.size<=100000
                  value=archive.extractfile(row).read();assert hashlib.sha256(value).hexdigest()==expected[row.name]['sha256']
                  (root/row.name).write_bytes(value)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'j8-artifacts/adapter-manifest.json').write_text(json.dumps(expected,indent=2)+'\n')
          PYBUNDLE
      - name: Free guards and actual two-arm production request preflight
        id: preflight
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          test -z "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"
          A="$RUNNER_TEMP/j8-adapter"; O="$RUNNER_TEMP/j8-artifacts"
          python3 "$A/capture-runtime.py" "$PWD" "$O/before.json"
          NODE_BIN="$(command -v node)"
          clean_node() { env -i PATH="$(dirname "$NODE_BIN"):/usr/bin:/bin" HOME="$RUNNER_TEMP/j8-home" TMPDIR="$RUNNER_TEMP/j8-tmp" CI=true TZ=UTC WRANGLER_SEND_METRICS=false "$NODE_BIN" "$@"; }
          clean_node --test "$A/bounded-transport.test.mjs" > "$O/free-controls.log" 2>&1
          clean_node "$A/build-bundles.mjs" "$PWD" "$O/bundles" > "$O/bundle.log" 2>&1
          clean_node "$A/run-paid.mjs" --preflight-only "$O/bundles" "$O/preflight" "$A/root-reservation.json" > "$O/preflight.log" 2>&1
          python3 - <<'PYPREFLIGHT'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'j8-artifacts/preflight/terminal.json';r=json.loads(p.read_text())
          assert r['status']=='preflight-passed' and r['blockedPreflightNetworkAttempts']==0
          assert r['budget']['consumed']==r['budget']['actualDispatches']==0
          PYPREFLIGHT
      - name: At most eight authorized model dispatches with durable arm reservations
        id: paid
        timeout-minutes: 14
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"; test "$GITHUB_RUN_ATTEMPT" = 1
          NODE_BIN="$(command -v node)"
          timeout --signal=TERM --kill-after=5s 800s env -i \
            PATH="$(dirname "$NODE_BIN"):/usr/bin:/bin" HOME="$RUNNER_TEMP/j8-home" TMPDIR="$RUNNER_TEMP/j8-tmp" CI=true TZ=UTC \
            WRANGLER_SEND_METRICS=false OPENAI_API_KEY="$OPENAI_API_KEY" \
            J_PAID_DISPATCH_GRANTED=J-comparison-max8-attempt1 GITHUB_RUN_ATTEMPT=1 \
            "$NODE_BIN" "$RUNNER_TEMP/j8-adapter/run-paid.mjs" \
            "$RUNNER_TEMP/j8-artifacts/bundles" "$RUNNER_TEMP/j8-artifacts/paid" "$RUNNER_TEMP/j8-adapter/root-reservation.json" \
            > "$RUNNER_TEMP/j8-artifacts/paid.log" 2>&1
          python3 - <<'PYTERMINAL'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'j8-artifacts/paid/terminal.json';r=json.loads(p.read_text())
          assert r['status']=='passed' and len(r['completed'])==8
          assert r['budget']['consumed']==r['budget']['actualDispatches']==8 and r['budget']['stopped'] is False
          PYTERMINAL
      - name: Preserve failure diagnostics and immutable source/dependencies
        if: ${{ always() && steps.preflight.outcome != 'skipped' && steps.bundle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/j8-artifacts"
          python3 - <<'PYDIAG'
          import pathlib,json,os,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'j8-artifacts'
          for stage in ('preflight','paid'):
            p=root/stage/'terminal.json'
            try:
              st=p.lstat();assert stat.S_ISREG(st.st_mode) and st.st_size<32768
              r=json.loads(p.read_text());assert isinstance(r,dict)
              print('J8_'+stage.upper()+'_TERMINAL '+json.dumps({k:r.get(k) for k in ('status','completed','budget','error','blockedPreflightNetworkAttempts')})[:8192])
            except Exception as e:print('J8_'+stage.upper()+'_TERMINAL unavailable: '+type(e).__name__)
          PYDIAG
          python3 "$RUNNER_TEMP/j8-adapter/capture-runtime.py" "$PWD" "$O/after.json"
          cmp "$O/before.json" "$O/after.json"
          sha256sum -c "$O/package-pins.sha256"
          test -z "$(git status --porcelain)"
      - name: Upload one synthetic evidence root on success or failure
        if: ${{ always() && steps.event_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue488-J8-source-${{ env.SOURCE_SHA }}-event-${{ github.sha }}
          path: ${{ runner.temp }}/j8-artifacts/
          if-no-files-found: error
          retention-days: 14
