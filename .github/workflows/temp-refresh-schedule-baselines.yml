name: Temporary Schedule Baseline Refresh

on:
  push:
    branches:
      - feat/timetable-period-alternating-weeks

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.62.1
      - name: Install Chromium
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
      - name: Refresh dark schedule snapshots
        run: |
          ./tests/e2e/node_modules/.bin/playwright test \
            --config=tests/e2e/playwright.visual.config.mjs \
            --project=desktop-dark \
            --project=mobile-dark \
            --update-snapshots
      - name: Commit only approved schedule baselines
        shell: bash
        run: |
          git add \
            tests/e2e/visual-regression.spec.mjs-snapshots/schedule-desktop-dark-linux.png \
            tests/e2e/visual-regression.spec.mjs-snapshots/schedule-mobile-dark-linux.png
          if git diff --cached --quiet; then
            echo 'No schedule baseline changes were produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: refresh dark schedule visual baselines'
          git push origin HEAD:feat/timetable-period-alternating-weeks
