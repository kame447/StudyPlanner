name: PR68 finalize non-M8 fixes

on:
  push:
    branches:
      - agent/fix-weekly-planning-trace-and-dialogue-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-weekly-planning-trace-and-dialogue-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final non-M8 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueManager.test.ts',
              """      requiredFields: ['fixed_events', 'sleep_cycle'],
              questionPlan: [
                expect.objectContaining({ targetSlot: 'fixed_events', missing: ['fixed_events'] }),
                expect.objectContaining({ targetSlot: 'sleep_cycle', missing: ['sleep_cycle'] }),
              ],""",
              """      requiredFields: ['fixed_events'],
              questionPlan: [
                expect.objectContaining({ targetSlot: 'fixed_events', missing: ['fixed_events'] }),
              ],""",
          )

          pipeline = 'src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts'
          replace_once(
              pipeline,
              """      questionPlan: [
                expect.objectContaining({ targetSlot: 'planning_period', intent: 'ask_planning_period' }),
                expect.objectContaining({ targetSlot: 'tasks_or_goals', intent: 'ask_tasks_or_goals' }),
              ],""",
              """      questionPlan: [
                expect.objectContaining({ targetSlot: 'planning_period', intent: 'ask_planning_period' }),
              ],""",
          )
          replace_once(
              pipeline,
              """    expect(continued.decision.questionPlan).toEqual([
                expect.objectContaining({ targetSlot: 'planning_start_date' }),
                expect.objectContaining({ targetSlot: 'tasks_or_goals' }),
              ]);""",
              """    expect(continued.decision.questionPlan).toEqual([
                expect.objectContaining({ targetSlot: 'planning_start_date' }),
              ]);""",
          )
          replace_once(
              pipeline,
              """    expect(output.decision.questionPlan).toEqual([
                expect.objectContaining({ targetSlot: 'planning_start_date' }),
                expect.objectContaining({ targetSlot: 'tasks_or_goals' }),
              ]);""",
              """    expect(output.decision.questionPlan).toEqual([
                expect.objectContaining({ targetSlot: 'planning_start_date' }),
              ]);""",
          )
          replace_once(
              pipeline,
              """        requiredFields: [
                  'fixed_events',
                  'sleep_cycle',
                ],
                questionPlan: [
                  expect.objectContaining({ targetSlot: 'fixed_events', missing: ['fixed_events'] }),
                  expect.objectContaining({ targetSlot: 'sleep_cycle', missing: ['sleep_cycle'] }),
                ],""",
              """        requiredFields: [
                  'fixed_events',
                ],
                questionPlan: [
                  expect.objectContaining({ targetSlot: 'fixed_events', missing: ['fixed_events'] }),
                ],""",
          )
          replace_once(
              pipeline,
              """        requiredFields: [
                  'fixed_events',
                  'sleep_cycle',
                ],
                shouldSavePlan: false,""",
              """        requiredFields: [
                  'fixed_events',
                ],
                shouldSavePlan: false,""",
          )

          replace_once(
              'workers/ai-proxy/src/weeklyPlanningTraceApi.ts',
              """  return ok({ entries: safeWeeklyPlanningTraceDocumentsForAdmin(entries) });""",
              """  const safeEntries = safeWeeklyPlanningTraceDocumentsForAdmin(entries);
              if (isLegacySessionHandle) {
                safeEntries.forEach((entry) => {
                  const sequence = entry.sequence;
                  if (typeof sequence !== 'number'
                    || !Number.isSafeInteger(sequence)
                    || sequence < 0) {
                    return;
                  }
                  entry.id = `${sessionId}-${String(sequence).padStart(8, '0')}`;
                  entry.sessionId = sessionId;
                });
              }
              return ok({ entries: safeEntries });""",
          )

          Path('.github/workflows/ci.yml').write_text("""name: CI

          on:
            pull_request:
              branches:
                - main
              types:
                - opened
                - synchronize
                - reopened
                - ready_for_review
            push:
              branches:
                - main
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - name: Install dependencies
                  run: npm ci
                - name: Run tests
                  run: npm run test:run
                - name: TypeScript and production build
                  run: npm run build
                - name: Check pull request diff
                  if: github.event_name == 'pull_request'
                  run: git diff --check origin/${{ github.base_ref }}...HEAD
          """)

          Path('.github/workflows/pr68-finalize-non-m8.yml').unlink()
          PY
      - name: Verify focused fixes
        run: |
          npm ci
          npm run test:run -- \
            src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueManager.test.ts \
            src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceAdmin.integration.test.ts
          npm run build
          git diff --check
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml \
            .github/workflows/pr68-finalize-non-m8.yml \
            src/features/weeklyPlanning/dialogue/weeklyPlanningDialogueManager.test.ts \
            src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts \
            workers/ai-proxy/src/weeklyPlanningTraceApi.ts
          git commit -m "feat: M-8以外の監査指摘修正を完了"
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
