name: Apply Fresh Contextual Repair

on:
  push:
    branches:
      - agent/weekly-ai-conversation-eval
    paths:
      - .github/apply-fresh-contextual-repair.py
      - .github/workflows/apply-fresh-contextual-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-ai-conversation-eval
          fetch-depth: 0
      - name: Sync latest branch head
        run: |
          git fetch origin agent/weekly-ai-conversation-eval
          git reset --hard origin/agent/weekly-ai-conversation-eval
      - name: Apply guarded migration
        run: python .github/apply-fresh-contextual-repair.py
      - name: Commit and push
        run: |
          git config user.name "kame447"
          git config user.email "76802107+kame447@users.noreply.github.com"
          git add src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNormalizerV5.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: retry typed clarification from authoritative context"
          git push origin HEAD:agent/weekly-ai-conversation-eval
