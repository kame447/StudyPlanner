name: One-shot timetable normalization owner patch

on:
  push:
    branches:
      - refactor/issue263-timetable-normalization-owner
    paths:
      - '.github/workflows/tmp-apply-issue263-timetable-normalization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue263-timetable-normalization-owner
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Move timetable normalization policy out of the React hook
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/hooks/usePlannerDataState.ts')
          text = path.read_text(encoding='utf-8')

          old_import = "import { resolveActiveTimetableTerm } from '../domain/timetableTerm';\n"
          new_import = "import {\n  createTimetableTermId,\n  createTimetableTermLabel,\n  mergeTimetablePeriodsByTermAndNumber,\n  normalizeTimetableDate,\n  normalizeTimetableTermsByYearAndKind,\n  remapTimetableTermId,\n  sortTimetableTerms,\n} from '../domain/timetableDataNormalization';\n"
          if text.count(old_import) != 1:
              raise SystemExit(f'expected one active-term import, got {text.count(old_import)}')
          text = text.replace(old_import, new_import)

          type_line = '  TimetableTermKind,\n'
          if text.count(type_line) != 1:
              raise SystemExit(f'expected one TimetableTermKind import, got {text.count(type_line)}')
          text = text.replace(type_line, '')

          first_start = text.index('function getTimetableTermKindLabel(')
          first_end = text.index('function sortStudySubjects(', first_start)
          text = text[:first_start] + text[first_end:]

          second_start = text.index('function normalizeTimetableTermsByYearAndKind(')
          second_end = text.index('interface UsePlannerDataStateResult', second_start)
          text = text[:second_start] + text[second_end:]

          forbidden = [
              'function getTimetableTermKindLabel(',
              'function createTimetableTermLabel(',
              'function getTimetableTermKindKey(',
              'function createTimetableTermId(',
              'function normalizeTimetableDate(',
              'function createDefaultTimetableTerm(',
              'function pickLatestTimetableTerm(',
              'function sortTimetableTerms(',
              'function normalizeTimetableTermsByYearAndKind(',
              'function remapTimetableTermId(',
              'function mergeTimetablePeriodsByTermAndNumber(',
          ]
          remaining = [name for name in forbidden if name in text]
          if remaining:
              raise SystemExit(f'helper definitions remain in hook: {remaining}')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused timetable tests
        run: npx vitest run src/domain/timetableTerm.test.ts src/domain/timetableDataNormalization.test.ts
      - name: Verify TypeScript contract
        run: npm run typecheck
      - name: Remove one-shot workflow
        run: rm .github/workflows/tmp-apply-issue263-timetable-normalization.yml
      - name: Commit verified extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: extract timetable normalization policy'
          git push origin HEAD:refactor/issue263-timetable-normalization-owner
