name: Home Device Visual Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render-device-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install isolated Playwright
        run: npm install --prefix /tmp/home-device-render --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: /tmp/home-device-render/node_modules/.bin/playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        shell: bash
        run: |
          npm run preview:vite -- --host 127.0.0.1 --port 4173 > /tmp/home-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/home-preview.log
          exit 1

      - name: Render device matrix
        shell: bash
        run: |
          mkdir -p artifacts
          cat > /tmp/home-device-render/render.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';

          const androidUa = 'Mozilla/5.0 (Linux; Android 13; SM-G960F) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0 Mobile Safari/537.36';
          const ipadUa = 'Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1';
          const desktopUa = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0 Safari/537.36';

          const cases = [
            { name: 'galaxy-360x640-mobile', width: 360, height: 640, dpr: 3, mobile: true, touch: true, ua: androidUa },
            { name: 'galaxy-390x844-mobile', width: 390, height: 844, dpr: 3, mobile: true, touch: true, ua: androidUa },
            { name: 'phone-360x640-desktop-mode', width: 360, height: 640, dpr: 1, mobile: false, touch: false, ua: desktopUa },
            { name: 'reference-511x1094', width: 511, height: 1094, dpr: 1, mobile: false, touch: false, ua: desktopUa },
            { name: 'ipad-mini-768x1024', width: 768, height: 1024, dpr: 2, mobile: true, touch: true, ua: ipadUa },
            { name: 'ipad-pro-1024x1366', width: 1024, height: 1366, dpr: 2, mobile: true, touch: true, ua: ipadUa },
            { name: 'ipad-pro-landscape-1366x1024', width: 1366, height: 1024, dpr: 2, mobile: true, touch: true, ua: ipadUa },
            { name: 'desktop-1440x900', width: 1440, height: 900, dpr: 1, mobile: false, touch: false, ua: desktopUa },
          ];

          const browser = await chromium.launch({ headless: true });
          const metrics = [];

          for (const item of cases) {
            const context = await browser.newContext({
              viewport: { width: item.width, height: item.height },
              screen: { width: item.width, height: item.height },
              deviceScaleFactor: item.dpr,
              isMobile: item.mobile,
              hasTouch: item.touch,
              userAgent: item.ua,
            });
            const page = await context.newPage();
            await page.addInitScript(() => {
              const today = new Date().toISOString().slice(0, 10);
              const now = new Date().toISOString();
              const user = {
                id: 'device-render-user',
                email: 'device-render@example.com',
                username: 'device-render-user',
                avatar: '',
                createdAt: now,
              };
              const plan = {
                id: 'device-render-plan',
                seriesId: 'device-render-plan',
                userId: user.id,
                title: '情報資源総論',
                subject: '情報科学',
                type: 'study',
                date: today,
                startTime: '10:20',
                endTime: '11:50',
                memo: '',
                recurrence: null,
                createdAt: now,
                updatedAt: now,
              };
              const material = {
                id: 'device-render-material',
                userId: user.id,
                name: '基本情報技術者テキスト',
                subjectId: 'device-render-subject',
                subjectName: '情報科学',
                status: 'active',
                progressUnit: 'page',
                totalUnits: 500,
                currentUnit: 120,
                createdAt: now,
                updatedAt: now,
              };
              localStorage.setItem('studyplanner.users', JSON.stringify([user]));
              localStorage.setItem('studyplanner.session', user.id);
              localStorage.setItem('studyplanner.plans', JSON.stringify([plan]));
              localStorage.setItem('studyplanner.actuals', '[]');
              localStorage.setItem('studyplanner.todos.v1', '[]');
              localStorage.setItem('studyplanner.studyMaterials.v1', JSON.stringify([material]));
            });

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.locator('.home-dashboard-default').waitFor();
            await page.waitForTimeout(800);

            const measured = await page.evaluate(() => {
              const visible = (element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
              };
              const shell = document.querySelector('.home-app-shell');
              const nav = document.querySelector('.home-bottom-nav');
              const core = document.querySelector('.home-core-sections');
              const lastCore = core?.lastElementChild ?? null;
              const materials = [...document.querySelectorAll('.home-material-panel')].filter(visible);
              const material = materials[0] ?? null;
              const schedule = document.querySelector('.home-schedule-list');
              const addRow = document.querySelector('.home-schedule-add-row');
              const today = document.querySelector('.home-today-panel');
              const attention = document.querySelector('.home-alert-grid');
              const nextMeta = document.querySelector('.home-next-meta');
              const start = document.querySelector('.home-start-button');
              const navTop = nav?.getBoundingClientRect().top ?? 0;
              const lastBottom = material?.getBoundingClientRect().bottom ?? lastCore?.getBoundingClientRect().bottom ?? 0;
              return {
                cssViewportWidth: document.documentElement.clientWidth,
                cssViewportHeight: document.documentElement.clientHeight,
                visualViewportWidth: window.visualViewport?.width ?? null,
                visualViewportHeight: window.visualViewport?.height ?? null,
                shellWidth: shell?.getBoundingClientRect().width ?? 0,
                navWidth: nav?.getBoundingClientRect().width ?? 0,
                bottomGap: navTop - lastBottom,
                materialCount: materials.length,
                pageWidth: document.documentElement.scrollWidth,
                pageHeight: document.documentElement.scrollHeight,
                scheduleClientHeight: schedule?.clientHeight ?? 0,
                scheduleScrollHeight: schedule?.scrollHeight ?? 0,
                addRowBottom: addRow?.getBoundingClientRect().bottom ?? null,
                scheduleBottom: schedule?.getBoundingClientRect().bottom ?? null,
                todayBottom: today?.getBoundingClientRect().bottom ?? null,
                attentionTop: attention?.getBoundingClientRect().top ?? null,
                nextMetaBottom: nextMeta?.getBoundingClientRect().bottom ?? null,
                startTop: start?.getBoundingClientRect().top ?? null,
              };
            });

            metrics.push({ ...item, ...measured });
            await page.screenshot({ path: `artifacts/${item.name}.png`, fullPage: true });
            await context.close();
          }

          fs.writeFileSync('artifacts/metrics.json', JSON.stringify(metrics, null, 2));
          await browser.close();
          NODE
          node /tmp/home-device-render/render.mjs

      - name: Upload device matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-device-matrix-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
