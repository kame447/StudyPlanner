name: Temporary AI Planning Hardening

on:
  push:
    branches:
      - ui/home-screen-redesign
    paths:
      - '.github/workflows/tmp-ai-planning-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/home-screen-redesign
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new))

          policy_path = Path('workers/ai-proxy/src/rateLimitPolicy.ts')
          policy_path.write_text("""export const AI_PROXY_RATE_LIMITS = {
            chat: {
              uidMinute: 30,
              uidDay: 1000,
            },
            attachment: {
              uidMinute: 10,
              uidDay: 100,
            },
            ocr: {
              uidMinute: 2,
              uidDay: 5,
            },
            ipMinute: 120,
          } as const;
          """)

          Path('workers/ai-proxy/src/rateLimitPolicy.test.ts').write_text("""import { describe, expect, it } from 'vitest';
          import { AI_PROXY_RATE_LIMITS } from './rateLimitPolicy';

          describe('AI proxy rate limit policy', () => {
            it('leaves enough headroom for multi-request weekly-planning turns', () => {
              expect(AI_PROXY_RATE_LIMITS.chat).toEqual({ uidMinute: 30, uidDay: 1000 });
              expect(AI_PROXY_RATE_LIMITS.attachment).toEqual({ uidMinute: 10, uidDay: 100 });
              expect(AI_PROXY_RATE_LIMITS.ipMinute).toBe(120);
            });

            it('keeps timetable OCR on its tighter separate budget', () => {
              expect(AI_PROXY_RATE_LIMITS.ocr).toEqual({ uidMinute: 2, uidDay: 5 });
            });
          });
          """)

          replace_once(
              'workers/ai-proxy/src/worker.ts',
              "import { DEFAULT_ALLOWED_CHAT_MODELS, resolveChatModel } from './modelPolicy';\n",
              "import { DEFAULT_ALLOWED_CHAT_MODELS, resolveChatModel } from './modelPolicy';\nimport { AI_PROXY_RATE_LIMITS } from './rateLimitPolicy';\n",
          )
          replace_once(
              'workers/ai-proxy/src/worker.ts',
              """const CHAT_UID_MINUTE_LIMIT = 5;
          const CHAT_UID_DAY_LIMIT = 100;
          const ATTACHMENT_UID_MINUTE_LIMIT = 3;
          const ATTACHMENT_UID_DAY_LIMIT = 20;
          const IP_MINUTE_LIMIT = 20;""",
              """const CHAT_UID_MINUTE_LIMIT = AI_PROXY_RATE_LIMITS.chat.uidMinute;
          const CHAT_UID_DAY_LIMIT = AI_PROXY_RATE_LIMITS.chat.uidDay;
          const ATTACHMENT_UID_MINUTE_LIMIT = AI_PROXY_RATE_LIMITS.attachment.uidMinute;
          const ATTACHMENT_UID_DAY_LIMIT = AI_PROXY_RATE_LIMITS.attachment.uidDay;
          const IP_MINUTE_LIMIT = AI_PROXY_RATE_LIMITS.ipMinute;""",
          )
          replace_once(
              'workers/ai-proxy/src/worker.ts',
              "const CHAT_PROXY_VERSION = 'weekly-planning-luna-attachment-20260821-002';",
              "const CHAT_PROXY_VERSION = 'weekly-planning-quota-retry-20260821-003';",
          )

          replace_once(
              'workers/ai-proxy/src/index.ts',
              "import { DEFAULT_ALLOWED_CHAT_MODELS, resolveChatModel } from './modelPolicy';\n",
              "import { DEFAULT_ALLOWED_CHAT_MODELS, resolveChatModel } from './modelPolicy';\nimport { AI_PROXY_RATE_LIMITS } from './rateLimitPolicy';\n",
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              """const CHAT_UID_MINUTE_LIMIT = 5;
          // nano/mini の real-eval 比較(全 golden cases × 2 model)を1日で回せるよう当面 100 に引き上げる。
          // 分あたりは 5 のまま(eval 側で呼び出し間隔を空ければ足りるため据え置き)。uid 単位・全 chat 利用者共通。
          const CHAT_UID_DAY_LIMIT = 100;
          const OCR_UID_MINUTE_LIMIT = 2;
          const OCR_UID_DAY_LIMIT = 5;
          const ATTACHMENT_UID_MINUTE_LIMIT = 3;
          const ATTACHMENT_UID_DAY_LIMIT = 20;
          const IP_MINUTE_LIMIT = 20;""",
              """const CHAT_UID_MINUTE_LIMIT = AI_PROXY_RATE_LIMITS.chat.uidMinute;
          const CHAT_UID_DAY_LIMIT = AI_PROXY_RATE_LIMITS.chat.uidDay;
          const OCR_UID_MINUTE_LIMIT = AI_PROXY_RATE_LIMITS.ocr.uidMinute;
          const OCR_UID_DAY_LIMIT = AI_PROXY_RATE_LIMITS.ocr.uidDay;
          const ATTACHMENT_UID_MINUTE_LIMIT = AI_PROXY_RATE_LIMITS.attachment.uidMinute;
          const ATTACHMENT_UID_DAY_LIMIT = AI_PROXY_RATE_LIMITS.attachment.uidDay;
          const IP_MINUTE_LIMIT = AI_PROXY_RATE_LIMITS.ipMinute;""",
          )
          replace_once(
              'workers/ai-proxy/src/index.ts',
              "const WORKER_DEBUG_VERSION = 'planning-attachment-20260821-001';",
              "const WORKER_DEBUG_VERSION = 'planning-quota-retry-20260821-002';",
          )

          semantic = 'src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNoOpCompletenessRetryV5.ts'
          replace_once(
              semantic,
              """  SEMANTIC_NORMALIZER_V5_MAX_COMPLETION_TOKENS,
            semanticNormalizerErrorDetails,
            type WeeklyPlanningSemanticNormalizerRunV5,""",
              """  SEMANTIC_NORMALIZER_V5_MAX_COMPLETION_TOKENS,
            semanticNormalizerErrorDetails,
            semanticNormalizerErrorMessage,
            type WeeklyPlanningSemanticNormalizerRunV5,""",
          )
          text = read(semantic)
          pattern = re.compile(r"function acceptedPriorResult\(params: \{.*?\n\}\n\nexport function isWeeklyPlanningSemanticNoOpCompletenessRetryEligibleV5", re.S)
          replacement = """function rejectedPriorNoOpResult(params: {
            run: WeeklyPlanningSemanticNormalizerRunV5;
            document: WeeklyPlanningSemanticDocumentV5;
            attemptCount: number;
            repairAttempted: boolean;
            validationErrors: string[];
          }): WeeklyPlanningSemanticNormalizerResultV5 {
            const result: WeeklyPlanningSemanticNormalizerResultV5 = {
              status: 'rejected',
              document: null,
              diagnostics: params.run.diagnostics({
                attemptCount: params.attemptCount,
                repairAttempted: params.repairAttempted,
                validationErrors: [
                  ...params.validationErrors,
                  'completeness_retry:semantic_noop_after_retries',
                ],
                providerError: null,
              }),
            };
            params.run.recordDecision(result, {
              route: 'schema_valid_noop_completeness_retry_rejected',
              severity: 'error',
              extra: { rejectedSchemaValidDocument: params.document },
            });
            return result;
          }

          function providerFailureDuringCompletenessRetry(params: {
            run: WeeklyPlanningSemanticNormalizerRunV5;
            attemptCount: number;
            repairAttempted: boolean;
            validationErrors: string[];
            error: unknown;
          }): WeeklyPlanningSemanticNormalizerResultV5 {
            const result: WeeklyPlanningSemanticNormalizerResultV5 = {
              status: 'provider_failure',
              document: null,
              diagnostics: params.run.diagnostics({
                attemptCount: params.attemptCount,
                repairAttempted: params.repairAttempted,
                validationErrors: params.validationErrors,
                providerError: semanticNormalizerErrorMessage(params.error),
              }),
            };
            params.run.recordDecision(result, {
              route: 'schema_valid_noop_completeness_retry_provider_failure',
              severity: 'error',
            });
            return result;
          }

          export function isWeeklyPlanningSemanticNoOpCompletenessRetryEligibleV5"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'{semantic}: acceptedPriorResult helper block not found')
          write(semantic, text)

          replace_once(
              semantic,
              """          fallback: 'initial_schema_valid_document',
                    error: semanticNormalizerErrorDetails(error),
                  },
                });
                return acceptedPriorResult({
                  run: params.run,
                  document: params.initialDocument,
                  attemptCount,
                  repairAttempted,
                  validationErrors,
                });""",
              """          fallback: 'provider_failure',
                    error: semanticNormalizerErrorDetails(error),
                  },
                });
                return providerFailureDuringCompletenessRetry({
                  run: params.run,
                  attemptCount,
                  repairAttempted,
                  validationErrors,
                  error,
                });""",
          )
          replace_count(semantic, 'acceptedPriorResult({', 'rejectedPriorNoOpResult({', 2)
          replace_once(
              semantic,
              """        fallback: retryIndex === 1 && (!validation.document || stillNoOp)
                  ? 'initial_schema_valid_document'
                  : null,""",
              """        fallback: retryIndex === 1 && (!validation.document || stillNoOp)
                  ? 'rejected_schema_valid_noop'
                  : null,""",
          )

          semantic_test = 'src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNoOpCompletenessRetryV5.test.ts'
          replace_once(
              semantic_test,
              'function fakeClient(responses: string[]): {',
              'function fakeClient(responses: Array<string | Error>): {',
          )
          replace_once(
              semantic_test,
              """        const response = responses[index++];
                  if (response === undefined) throw new Error('fake response exhausted');
                  return response;""",
              """        const response = responses[index++];
                  if (response === undefined) throw new Error('fake response exhausted');
                  if (response instanceof Error) throw response;
                  return response;""",
          )
          old_test = """  it('falls back to the original schema-valid no-op only after focused and both generic passes are empty', async () => {
            const initial = existingTaskShell();
            const fake = fakeClient([
              JSON.stringify(initial),
              focusedFallback(),
              JSON.stringify(existingTaskShell()),
              JSON.stringify(existingTaskShell()),
            ]);
            const result = await createWeeklyPlanningSemanticNormalizerV5(fake.client).normalize({
              userText,
              publicStateSummary: publicStateSummary(),
            });

            expect(fake.calls).toHaveLength(4);
            expect(result.status).toBe('accepted');
            expect(result.diagnostics).toMatchObject({
              attemptCount: 4,
              repairAttempted: false,
            });
            expect(result.document).toEqual(initial);
          });
          """
          new_test = """  it('rejects a schema-valid no-op after focused and both generic completeness passes are empty', async () => {
            const fake = fakeClient([
              JSON.stringify(existingTaskShell()),
              focusedFallback(),
              JSON.stringify(existingTaskShell()),
              JSON.stringify(existingTaskShell()),
            ]);
            const result = await createWeeklyPlanningSemanticNormalizerV5(fake.client).normalize({
              userText,
              publicStateSummary: publicStateSummary(),
            });

            expect(fake.calls).toHaveLength(4);
            expect(result.status).toBe('rejected');
            expect(result.document).toBeNull();
            expect(result.diagnostics).toMatchObject({
              attemptCount: 4,
              repairAttempted: false,
            });
            expect(result.diagnostics.validationErrors).toContain(
              'completeness_retry:semantic_noop_after_retries',
            );
          });

          it('returns provider failure when a completeness retry request fails instead of accepting the no-op', async () => {
            const fake = fakeClient([
              JSON.stringify(existingTaskShell()),
              focusedFallback(),
              new Error('AI rate limit exceeded.'),
            ]);
            const result = await createWeeklyPlanningSemanticNormalizerV5(fake.client).normalize({
              userText,
              publicStateSummary: publicStateSummary(),
            });

            expect(fake.calls).toHaveLength(3);
            expect(result.status).toBe('provider_failure');
            expect(result.document).toBeNull();
            expect(result.diagnostics.providerError).toContain('AI rate limit exceeded.');
          });
          """
          replace_once(semantic_test, old_test, new_test)

          chat_store = 'src/features/weeklyPlanning/chat/aiPlanningChatStore.ts'
          marker = 'export function saveAiPlanningChatIndex(userId: string, index: AiPlanningChatIndex): void {'
          helper = """export function hasStoredAiPlanningChatIndex(userId: string): boolean {
            if (typeof window === 'undefined') return false;
            try {
              return window.localStorage.getItem(indexKey(userId)) !== null;
            } catch {
              return false;
            }
          }

          """
          replace_once(chat_store, marker, helper + marker)

          chat_test = 'src/features/weeklyPlanning/chat/aiPlanningChatStore.test.ts'
          replace_once(
              chat_test,
              """  deleteAiPlanningChat,
            loadAiPlanningChatIndex,""",
              """  deleteAiPlanningChat,
            hasStoredAiPlanningChatIndex,
            loadAiPlanningChatIndex,""",
          )
          replace_once(
              chat_test,
              """describe('AI planning chat store', () => {
            it('keeps separate chats and restores a Stable V5 snapshot', () => {""",
              """describe('AI planning chat store', () => {
            it('distinguishes a fresh store from an already-created blank chat index', () => {
              expect(hasStoredAiPlanningChatIndex(USER_ID)).toBe(false);
              const initial = loadAiPlanningChatIndex(USER_ID);
              expect(hasStoredAiPlanningChatIndex(USER_ID)).toBe(false);
              saveAiPlanningChatIndex(USER_ID, initial);
              expect(hasStoredAiPlanningChatIndex(USER_ID)).toBe(true);
            });

            it('keeps separate chats and restores a Stable V5 snapshot', () => {""",
          )

          ai_view = 'src/components/AiPlanningView.tsx'
          replace_once(
              ai_view,
              """  deriveAiPlanningChatTitle,
            loadAiPlanningChatIndex,""",
              """  deriveAiPlanningChatTitle,
            hasStoredAiPlanningChatIndex,
            loadAiPlanningChatIndex,""",
          )
          replace_once(
              ai_view,
              """    didInitializeChatsRef.current = true;
              const loadedIndex = loadAiPlanningChatIndex(userId);""",
              """    didInitializeChatsRef.current = true;
              const hadStoredChatIndex = hasStoredAiPlanningChatIndex(userId);
              const loadedIndex = loadAiPlanningChatIndex(userId);""",
          )
          replace_once(
              ai_view,
              '    if (loadedActive && currentSnapshot) {',
              '    if (!hadStoredChatIndex && loadedActive && currentSnapshot) {',
          )
          PY

          if git diff --quiet; then
            echo 'No patch changes detected.'
            exit 0
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run focused regression tests
        shell: bash
        run: |
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs --maxWorkers=1 run \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNoOpCompletenessRetryV5.test.ts \
            src/features/weeklyPlanning/chat/aiPlanningChatStore.test.ts \
            workers/ai-proxy/src/rateLimitPolicy.test.ts

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            workers/ai-proxy/src/rateLimitPolicy.ts \
            workers/ai-proxy/src/rateLimitPolicy.test.ts \
            workers/ai-proxy/src/worker.ts \
            workers/ai-proxy/src/index.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNoOpCompletenessRetryV5.ts \
            src/features/weeklyPlanning/semantic/weeklyPlanningSemanticNoOpCompletenessRetryV5.test.ts \
            src/features/weeklyPlanning/chat/aiPlanningChatStore.ts \
            src/features/weeklyPlanning/chat/aiPlanningChatStore.test.ts \
            src/components/AiPlanningView.tsx
          git commit -m 'fix: harden AI planning retries and quota'
          git push origin HEAD:ui/home-screen-redesign
