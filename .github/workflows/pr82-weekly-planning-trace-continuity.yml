name: PR82 weekly planning trace continuity verification

on:
  push:
    branches:
      - fix/weekly-planning-trace-conversation-continuity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm
      - run: npm ci
      - name: Focused trace tests
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/trace/weeklyPlanningStableV5TraceRuntime.test.ts
          src/features/weeklyPlanning/trace/weeklyPlanningTraceRemoteRepository.test.ts
      - name: Full verification
        run: npm run verify
      - name: Diff check
        run: git diff --check origin/main...HEAD
