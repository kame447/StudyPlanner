name: Bounded material contents photo smoke

on:
  push:
    branches: [eval/material-contents-photo]
    paths:
      - .github/workflows/material-contents-photo-smoke-once.yml
      - scripts/ci/material-contents-photo-live-smoke-once.mjs

permissions:
  contents: read

concurrency:
  group: bounded-material-contents-photo-smoke
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.repository == 'kame447/StudyPlanner' &&
      github.ref == 'refs/heads/eval/material-contents-photo' &&
      github.run_attempt == 1 &&
      github.event.before == 'fedcc04e40e3c716b3de6bbcd35e6830cb4dbef1' &&
      github.event.head_commit.message == 'eval: bounded Japanese material contents photo smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and dedicated change before secret use
        env:
          SOURCE_SHA: fedcc04e40e3c716b3de6bbcd35e6830cb4dbef1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" = 2
          printf '%s\n' '.github/workflows/material-contents-photo-smoke-once.yml' 'scripts/ci/material-contents-photo-live-smoke-once.mjs' | sort > /tmp/expected-paths
          git diff --name-only "$SOURCE_SHA" HEAD | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git diff --exit-code "$SOURCE_SHA" HEAD -- shared/materialContentsPhoto.ts workers/ai-proxy/src/modelPolicy.ts shared/aiProxyContract.ts package.json package-lock.json
          printf '%s  %s\n' 'fc5fda07ff6e3b7620a98764875dbf675692420c0f8722dab422a86b81a7c596' 'scripts/ci/material-contents-photo-live-smoke-once.mjs' | sha256sum --check
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install existing application dependencies
        run: npm ci
      - name: Run at most two synthetic provider requests and validate artifact safety
        id: smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PHOTO_EVAL_SOURCE_SHA: fedcc04e40e3c716b3de6bbcd35e6830cb4dbef1
          PHOTO_EVAL_OUTPUT: artifacts/material-contents-photo-smoke
        run: |
          set -uo pipefail
          mkdir -p artifacts/material-contents-photo-smoke
          node scripts/ci/material-contents-photo-live-smoke-once.mjs > artifacts/material-contents-photo-smoke/summary.log 2>&1
          result=$?
          python - <<'PY'
          import os,pathlib
          key=os.environ.get('OPENAI_API_KEY','').encode()
          root=pathlib.Path('artifacts/material-contents-photo-smoke')
          if key and any(key in p.read_bytes() for p in root.rglob('*') if p.is_file()):
              raise SystemExit('Artifact secret scan failed; upload prohibited')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('artifact_safe=true\n')
          PY
          scan=$?
          if [ "$scan" -ne 0 ]; then exit "$scan"; fi
          cat artifacts/material-contents-photo-smoke/summary.log
          exit "$result"
      - name: Upload only scanned synthetic evidence
        if: ${{ always() && steps.smoke.outputs.artifact_safe == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: material-contents-photo-smoke-${{ github.sha }}
          path: artifacts/material-contents-photo-smoke/
          if-no-files-found: error
          retention-days: 14

