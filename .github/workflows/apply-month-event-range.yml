name: Apply Month Event Range Patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'chore: apply month event range patch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify patch executor syntax
        run: node --check scripts/apply-month-event-range.mjs

      - name: Apply multi-day month event patch
        run: node scripts/apply-month-event-range.mjs

      - name: Verify patch shape
        run: git diff --check

      - name: Install application dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run focused month-event tests
        run: >-
          node ./node_modules/vitest/vitest.mjs --config vite.config.mjs run
          src/lib/monthEvents.test.ts
          src/lib/monthEventEditor.test.ts
          src/lib/monthViewProjection.test.ts

      - name: Run full unit suite
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

      - name: Snapshot application manifests before isolated test-runner install
        shell: bash
        run: sha256sum package.json package-lock.json > /tmp/studyplanner-manifests.sha256

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.62.1

      - name: Verify isolated test-runner install did not mutate application manifests
        shell: bash
        run: sha256sum -c /tmp/studyplanner-manifests.sha256

      - name: Install Chromium
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run focused mobile browser regression
        run: >-
          ./tests/e2e/node_modules/.bin/playwright test
          tests/e2e/mobile-overlay-stability.spec.mjs
          --config=tests/e2e/playwright.config.mjs

      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/types/domain.ts \
            src/domain/planner.ts \
            src/lib/monthEvents.ts \
            src/lib/monthEventEditor.ts \
            src/components/MonthEventDialog.tsx \
            src/components/MonthGridPanel.tsx \
            src/components/MonthDaySheet.tsx \
            src/lib/monthEvents.test.ts \
            src/lib/monthEventEditor.test.ts \
            src/lib/monthViewProjection.test.ts \
            tests/e2e/mobile-overlay-stability.spec.mjs
          git commit -m "fix: support multi-day month events"
          git push
