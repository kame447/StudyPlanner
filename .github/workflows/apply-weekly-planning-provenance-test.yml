name: Apply weekly planning provenance test patch

on:
  push:
    branches:
      - agent/weekly-planning-plan-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-plan-provenance
          fetch-depth: 0
      - name: Patch approval test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/weeklyPlanning/application/weeklyPlanningApprovalApplication.test.ts')
          text = path.read_text()
          old_import = "import type { Plan, PlanDraft } from '../../../types/domain';\n"
          new_import = old_import + "import {\n  parseWeeklyPlanningPlanSourceId,\n  WEEKLY_PLANNING_PLAN_SOURCE_TYPE,\n} from '../planning/weeklyPlanningPlanProvenance';\n"
          if old_import not in text:
              raise SystemExit('approval test import pattern not found')
          text = text.replace(old_import, new_import, 1)
          old_helper = """function readSourceBlockId(draft: PlanDraft): string {
            const match = draft.memo.match(/\\[weekly-source:([^\\]]+)\\]/);
            if (!match) throw new Error('weekly source marker was not added');
            return match[1];
          }"""
          new_helper = """function readSourceBlockId(draft: PlanDraft): string {
            expect(draft.sourceType).toBe(WEEKLY_PLANNING_PLAN_SOURCE_TYPE);
            const identity = parseWeeklyPlanningPlanSourceId(draft.sourceId);
            if (!identity) throw new Error('weekly planning source identity was not added');
            return identity.sourceDraftBlockId;
          }"""
          if old_helper not in text:
              raise SystemExit('approval test helper pattern not found')
          path.write_text(text.replace(old_helper, new_helper, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/weeklyPlanning/application/weeklyPlanningApprovalApplication.test.ts
          git commit -m "feat: 承認Planの構造化provenanceを検証"
          git push origin HEAD:agent/weekly-planning-plan-provenance
