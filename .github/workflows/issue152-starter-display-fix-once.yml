name: Issue 152 starter display fix once

on:
  push:
    branches:
      - test/issue152-adversarial-validation-lab
    paths:
      - '.github/workflows/issue152-starter-display-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/issue152-adversarial-validation-lab
          fetch-depth: 0
      - name: Apply bounded display/input split
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          view = 'src/components/AiPlanningViewLegacy.tsx'
          replace_once(
              view,
              "import { buildAiPlanningStarterPrompts } from '../features/weeklyPlanning/ui/aiPlanningStarterPrompts';",
              "import { buildAiPlanningStarterPromptOptions } from '../features/weeklyPlanning/ui/aiPlanningStarterPrompts';",
          )
          replace_once(
              view,
              "  const starterPrompts = useMemo(\n    () =>\n      buildAiPlanningStarterPrompts({",
              "  const starterPromptOptions = useMemo(\n    () =>\n      buildAiPlanningStarterPromptOptions({",
          )
          replace_once(
              view,
              "                {starterPrompts.map((prompt) => (\n                  <button\n                    key={prompt}\n                    type=\"button\"\n                    onClick={() => useStarterPrompt(prompt)}\n                  >\n                    <span>{prompt}</span>",
              "                {starterPromptOptions.map((option) => (\n                  <button\n                    key={`${option.displayText}\\u0000${option.prompt}`}\n                    type=\"button\"\n                    onClick={() => useStarterPrompt(option.prompt)}\n                  >\n                    <span>{option.displayText}</span>",
          )

          spec = 'tests/e2e/ai-planning-starter-prompts.spec.mjs'
          replace_once(
              spec,
              "  const expected = [\n    `登録済み模試名: ${JSON.stringify('情報処理試験')}。${shortDate(examDate)}のこの模試に向けて学習計画を作って`,\n    `登録済みTodo名: ${JSON.stringify('英語レポート')}。このTodoを${shortDate(todoDate)}までに終えられるように計画して`,\n    `登録済み教材名: ${JSON.stringify('基本情報問題集')}。この教材を${shortDate(materialDate)}までに終えられるように計画して`,\n  ];\n\n  for (let index = 0; index < expected.length; index += 1) {\n    await expect(page.locator('.ai-planning-starter-list button').nth(index)).toHaveText(expected[index]);\n  }\n\n  await page.locator('.ai-planning-starter-list button').nth(1).click();\n  await expect(page.locator('.ai-planning-composer textarea')).toHaveValue(expected[1]);",
              "  const expectedDisplay = [\n    `${shortDate(examDate)}の情報処理試験に向けて学習計画を作って`,\n    `英語レポートを${shortDate(todoDate)}までに終えられるように計画して`,\n    `基本情報問題集を${shortDate(materialDate)}までに終えられるように計画して`,\n  ];\n  const expectedPrompt = [\n    `登録済み模試名: ${JSON.stringify('情報処理試験')}。${shortDate(examDate)}のこの模試に向けて学習計画を作って`,\n    `登録済みTodo名: ${JSON.stringify('英語レポート')}。このTodoを${shortDate(todoDate)}までに終えられるように計画して`,\n    `登録済み教材名: ${JSON.stringify('基本情報問題集')}。この教材を${shortDate(materialDate)}までに終えられるように計画して`,\n  ];\n\n  for (let index = 0; index < expectedDisplay.length; index += 1) {\n    await expect(page.locator('.ai-planning-starter-list button').nth(index)).toHaveText(expectedDisplay[index]);\n  }\n\n  await page.locator('.ai-planning-starter-list button').nth(1).click();\n  await expect(page.locator('.ai-planning-composer textarea')).toHaveValue(expectedPrompt[1]);",
          )

          test = 'src/features/weeklyPlanning/ui/aiPlanningStarterPrompts.test.ts'
          replace_once(
              test,
              "  AI_PLANNING_FALLBACK_PROMPTS,\n  buildAiPlanningStarterPrompts,",
              "  AI_PLANNING_FALLBACK_PROMPTS,\n  buildAiPlanningStarterPromptOptions,\n  buildAiPlanningStarterPrompts,",
          )
          p = Path(test)
          text = p.read_text()
          anchor = "  it('serializes stored names as one data value instead of concatenating their clauses into the request', () => {"
          if text.count(anchor) != 1:
              raise SystemExit('unit test anchor mismatch')
          added = """  it('keeps natural display copy while preserving the safe serialized prompt', () => {\n    const [option] = buildAiPlanningStarterPromptOptions({\n      referenceDate: '2026-08-21',\n      plans: [],\n      todos: [],\n      materials: [material({ name: '基本情報問題集', targetDate: null })],\n      limit: 1,\n    });\n\n    expect(option).toEqual({\n      displayText: '基本情報問題集を今週進める学習計画を作って',\n      prompt: '登録済み教材名: \\\"基本情報問題集\\\"。この教材を今週進める学習計画を作って',\n    });\n  });\n\n"""
          p.write_text(text.replace(anchor, added + anchor, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify targeted unit contract
        run: |
          npm ci
          npx vitest run src/features/weeklyPlanning/ui/aiPlanningStarterPrompts.test.ts
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue152-starter-display-fix-once.yml
          git add src/components/AiPlanningViewLegacy.tsx \
            src/features/weeklyPlanning/ui/aiPlanningStarterPrompts.test.ts \
            tests/e2e/ai-planning-starter-prompts.spec.mjs
          git commit -m 'fix: keep starter display copy natural'
          git push origin HEAD:test/issue152-adversarial-validation-lab
