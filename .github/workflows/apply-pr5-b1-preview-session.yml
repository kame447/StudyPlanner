name: apply-pr5-b1-preview-session

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          git config user.name "studyplanner-fix-bot"
          git config user.email "studyplanner-fix-bot@users.noreply.github.com"
          git rm -f docs/ai/tasks/20260716-weekly-planning-pr5-b1-workflow-error.log || true
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/agent-scripts/apply-pr5-b1-preview-session.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(relative_path: str, old: str, new: str) -> None:
              path = ROOT / relative_path
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{relative_path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '''
          new = '''def replace_once(relative_path: str, old: str, new: str) -> None:
              import re

              path = ROOT / relative_path
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count >= 1:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return
              lines = old.splitlines()
              pattern = r"\\n".join(
                  r"[ \\t]*" + re.escape(line.strip())
                  for line in lines
              )
              matches = list(re.finditer(pattern, text))
              if len(matches) == 1:
                  match = matches[0]
                  path.write_text(text[:match.start()] + new + text[match.end():], encoding="utf-8")
                  return
              raise RuntimeError(f"{relative_path}: expected one match, found {count}")
          '''
          if old not in text:
              raise RuntimeError('replace_once definition did not match')
          text = text.replace(old, new, 1)
          test_window = "  value: { localStorage: localStorageMock },\n"
          if test_window not in text:
              raise RuntimeError('test window fixture did not match')
          text = text.replace(
              test_window,
              "  value: { localStorage: localStorageMock, sessionStorage: localStorageMock },\n",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          set +e
          python .github/agent-scripts/apply-pr5-b1-preview-session.py > /tmp/pr5-b1.log 2>&1
          status=$?
          cat /tmp/pr5-b1.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/pr5-b1.log docs/ai/tasks/20260716-weekly-planning-pr5-b1-workflow-error.log
            git add docs/ai/tasks/20260716-weekly-planning-pr5-b1-workflow-error.log
            git commit -m "feat: B1修正workflowの失敗ログを保存"
            git push origin HEAD:agent/weekly-planning-conversation-hardening
            exit "$status"
          fi
