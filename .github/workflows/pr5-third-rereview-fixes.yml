name: PR5 third rereview fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/weekly-planning-conversation-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-conversation-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply source and test fixes
        run: node scripts/apply-pr5-third-rereview-fixes.mjs

      - name: Run focused tests
        run: >-
          npm run test:run --
          src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts
          src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts
          src/features/weeklyPlanning/weeklyPlanningStorageValidation.test.ts
          src/features/weeklyPlanning/weeklyPlanningPreviewSessionLifecycle.test.tsx

      - name: Run weekly planning suite
        run: npm run test:run -- src/features/weeklyPlanning src/components/WeeklyPlanningConversation.test.tsx src/components/weeklyPlanningConversationMode.test.ts

      - name: Run full test suite
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Check diff whitespace
        run: git diff --check

      - name: Remove temporary automation files
        run: rm scripts/apply-pr5-third-rereview-fixes.mjs .github/workflows/pr5-third-rereview-fixes.yml

      - name: Commit verified changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/weeklyPlanning/intake/weeklyPlanningScopeParsing.ts \
            src/features/weeklyPlanning/intake/weeklyPlanningPendingRangeCommandContract.test.ts \
            src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.test.ts \
            src/features/weeklyPlanning/weeklyPlanningStorage.ts \
            src/features/weeklyPlanning/weeklyPlanningStorageValidation.test.ts \
            src/features/weeklyPlanning/weeklyPlanningPreviewSessionLifecycle.test.tsx \
            scripts/apply-pr5-third-rereview-fixes.mjs \
            .github/workflows/pr5-third-rereview-fixes.yml
          git commit -m "feat: PR5三回目再レビュー指摘を修正"
          git push origin HEAD:agent/weekly-planning-conversation-hardening
