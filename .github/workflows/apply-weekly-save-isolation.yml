name: Apply weekly save isolation patch

on:
  push:
    branches:
      - agent/weekly-planning-approval-save-isolation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-planning-approval-save-isolation
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found: {path}: {old[:80]!r}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'src/hooks/usePlannerDataState.ts',
              "  savePlanDraft: (draft: PlanDraft, targetPlanId?: string) => Promise<void>;\n",
              "  savePlanDraft: (draft: PlanDraft, targetPlanId?: string) => Promise<void>;\n  saveWeeklyApprovedPlan: (draft: PlanDraft) => Promise<Plan>;\n",
          )
          replace(
              'src/hooks/usePlannerDataState.ts',
              "  async function savePlanDraft(draft: PlanDraft, targetPlanId?: string) {\n",
              """  async function saveWeeklyApprovedPlan(draft: PlanDraft): Promise<Plan> {
    if (!userId) {
      throw new Error('ログイン状態を確認できませんでした。');
    }

    if (minutesBetween(draft.startTime, draft.endTime) <= 0) {
      throw new Error('終了時刻は開始時刻より後にしてください。');
    }

    const nextPlan = createPlanFromDraft(draft);
    setPlans((current) =>
      sortByDateTime(upsertByKey(current, nextPlan, (plan) => plan.id)),
    );

    try {
      const savedPlan = await plannerRepository.upsertPlan(nextPlan);
      setPlans((current) =>
        sortByDateTime(
          upsertByKey(
            current.filter((plan) => plan.id !== nextPlan.id),
            savedPlan,
            (plan) => plan.id,
          ),
        ),
      );
      return savedPlan;
    } catch (error) {
      setPlans((current) => current.filter((plan) => plan.id !== nextPlan.id));
      throw error;
    }
  }

  async function savePlanDraft(draft: PlanDraft, targetPlanId?: string) {
""",
          )
          replace(
              'src/hooks/usePlannerDataState.ts',
              "    savePlanDraft,\n    deletePlan,\n",
              "    savePlanDraft,\n    saveWeeklyApprovedPlan,\n    deletePlan,\n",
          )

          replace(
              'src/hooks/usePlannerAppState.ts',
              "  savePlanDraft: (draft: PlanDraft, targetPlanId?: string) => Promise<void>;\n",
              "  savePlanDraft: (draft: PlanDraft, targetPlanId?: string) => Promise<void>;\n  saveWeeklyApprovedPlan: (draft: PlanDraft) => Promise<Plan>;\n",
          )
          replace(
              'src/hooks/usePlannerAppState.ts',
              "    savePlanDraft,\n    deletePlan,\n",
              "    savePlanDraft,\n    saveWeeklyApprovedPlan,\n    deletePlan,\n",
          )
          replace(
              'src/hooks/usePlannerAppState.ts',
              "    savePlanDraft,\n    deletePlan,\n",
              "    savePlanDraft,\n    saveWeeklyApprovedPlan,\n    deletePlan,\n",
          )

          replace(
              'src/App.tsx',
              "    savePlanDraft,\n    deletePlan,\n",
              "    savePlanDraft,\n    saveWeeklyApprovedPlan,\n    deletePlan,\n",
          )
          replace(
              'src/App.tsx',
              "    timetableTermId: activeTimetableTermId,\n    savePlanDraft,\n",
              "    timetableTermId: activeTimetableTermId,\n    saveWeeklyApprovedPlan,\n",
          )
          PY
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/usePlannerDataState.ts src/hooks/usePlannerAppState.ts src/App.tsx
          git commit -m "feat: 週間計画承認の保存副作用を分離 [auto-patch]"
          git push origin HEAD:agent/weekly-planning-approval-save-isolation
