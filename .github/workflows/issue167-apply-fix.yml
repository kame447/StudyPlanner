      - name: Install application dependencies
        run: npm ci

      - name: Verify TypeScript, unit tests, and production build
        run: npm run verify

      - name: Install isolated Playwright runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        run: ./tests/e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run focused browser regressions
        run: ./tests/e2e/node_modules/.bin/playwright test --config=tests/e2e/playwright.config.mjs tests/e2e/primary-chrome-consistency.spec.mjs tests/e2e/bookshelf-surface.spec.mjs

      - name: Remove temporary mutation workflow
        run: rm .github/workflows/issue167-apply-fix.yml

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: resolve issue 167 UI regressions"
          git push origin HEAD:fix/issue167-ui-regressions
