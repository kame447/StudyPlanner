                          </button>
                          <button
                            className=\"bookshelf-row-menu-button\"
                            type=\"button\"
                            aria-label={`${material.name}のメニュー`}
                            onClick={() => openMaterialMenu(material)}
                          >
                            <MoreHorizontal aria-hidden=\"true\" />
                          </button>
                        </div>""",
          )

          append_once(
              'src/styles/bookshelf.css',
              'Issue 167 split material row controls',
              """/* Issue 167 split material row controls ------------------------------- */
          .bookshelf-material-list-row {
            grid-template-columns: minmax(0, 1fr) 36px;
            gap: 11px;
            padding: 0 12px 0 54px;
            cursor: default;
          }

          .bookshelf-material-list-row > .bookshelf-material-row-main {
            width: 100%;
            height: auto;
            min-width: 0;
            min-height: 72px;
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) minmax(110px, 0.32fr);
            align-items: center;
            gap: 11px;
            padding: 8px 0;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
          }

          .bookshelf-material-list-row > .bookshelf-row-menu-button,
          .bookshelf-recent-row > .bookshelf-row-menu-button {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #26334b;
            cursor: pointer;
          }

          .bookshelf-recent-row {
            grid-template-columns: minmax(0, 1fr) 36px;
            gap: 11px;
            padding: 0 12px;
            cursor: default;
          }

          .bookshelf-recent-row > .bookshelf-recent-main {
            width: 100%;
            height: auto;
            min-width: 0;
            min-height: 64px;
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) auto;
            align-items: center;
            gap: 11px;
            padding: 7px 0;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: inherit;
            text-align: left;
            cursor: pointer;
          }

          .bookshelf-recent-main > span {
            min-width: 0;
            display: grid;
            gap: 3px;
          }

          .bookshelf-material-row-main:focus-visible,
          .bookshelf-recent-main:focus-visible,
          .bookshelf-row-menu-button:focus-visible {
            outline: 2px solid var(--bookshelf-blue);
            outline-offset: -2px;
          }

          @media (max-width: 760px) {
