              expect(actual.childrenContained).toBe(true);""",
              """  expect(actual.headerScrollWidth).toBeLessThanOrEqual(actual.headerClientWidth + 1);
              expect(actual.childrenContained).toBe(true);
              expect(actual.dateSegmentsContained).toBe(true);
              expect(actual.dateValuesContained).toBe(true);
              expect(actual.dateText).toEqual(home.dateText);""",
          )
          replace_once(
              'tests/e2e/primary-chrome-consistency.spec.mjs',
              """    const home = await readChromeMetrics(page);
                await page.screenshot({""",
              """    const home = await readChromeMetrics(page);
                expect(home.dateText).toHaveLength(4);
                expect(home.dateText[0]).toMatch(/^\\d{4}$/);
                expect(home.dateText[1]).toMatch(/^\\d{1,2}$/);
                expect(home.dateText[2]).toMatch(/^\\d{1,2}$/);
                expect(home.dateText[3]).toMatch(/^[日月火水木金土]$/);
                await page.screenshot({""",
          )

          replace_once(
              'tests/e2e/bookshelf-surface.spec.mjs',
              """test.describe('mobile bookshelf containment', () => {""",
              """test('keeps material row detail and menu actions as sibling keyboard controls', async ({ page }) => {
            await seedBookshelf(page);
            await openBookshelf(page);

            const materialRow = page.locator('.bookshelf-material-list-row').first();
            await expect(materialRow).not.toHaveAttribute('role', 'button');
            await expect(materialRow.locator(':scope > .bookshelf-material-row-main')).toHaveCount(1);
            await expect(materialRow.locator(':scope > .bookshelf-row-menu-button')).toHaveCount(1);
            await expect(page.locator('.bookshelf-material-list-row[role=\"button\"], .bookshelf-recent-row[role=\"button\"]')).toHaveCount(0);

            const menuButton = materialRow.locator(':scope > .bookshelf-row-menu-button');
            await menuButton.focus();
            await page.keyboard.press('Enter');
            await expect(page.getByText('教材内構造を編集')).toBeVisible();
            await page.locator('.bookshelf-sheet-overlay').click({ position: { x: 4, y: 4 } });

            const mainButton = materialRow.locator(':scope > .bookshelf-material-row-main');
            await mainButton.focus();
            await page.keyboard.press('Enter');
            await expect(page.getByRole('heading', { name: '教材の詳細' })).toBeVisible();
          });

          test.describe('mobile bookshelf containment', () => {""",
          )
