                const actions = header.querySelector('.home-top-actions');""",
              """    const date = header.querySelector('.home-date-display');
                const datePaper = header.querySelector('.home-date-paper');
                const dateSegments = [...header.querySelectorAll('.home-date-segment')];
                const actions = header.querySelector('.home-top-actions');""",
          )
          replace_once(
              'tests/e2e/primary-chrome-consistency.spec.mjs',
              """    const headerBox = rect(header);
                const childBoxes = [streak, date, actions].map(rect).filter(Boolean);
                const childrenContained = childBoxes.every(""",
              """    const headerBox = rect(header);
                const datePaperBox = rect(datePaper);
                const dateSegmentBoxes = dateSegments.map(rect).filter(Boolean);
                const dateSegmentsContained = dateSegmentBoxes.every(
                  (box) =>
                    datePaperBox &&
                    box.x >= datePaperBox.x - 0.75 &&
                    box.right <= datePaperBox.right + 0.75 &&
                    box.y >= datePaperBox.y - 0.75 &&
                    box.bottom <= datePaperBox.bottom + 0.75,
                );
                const dateValuesContained = dateSegments.every((segment) => {
                  const value = segment.querySelector('.home-date-value');
                  const segmentBox = rect(segment);
                  const valueBox = rect(value);
                  return Boolean(
                    segmentBox &&
                    valueBox &&
                    valueBox.x >= segmentBox.x - 0.75 &&
                    valueBox.right <= segmentBox.right + 0.75,
                  );
                });
                const childBoxes = [streak, date, actions].map(rect).filter(Boolean);
                const childrenContained = childBoxes.every(""",
          )
          replace_once(
              'tests/e2e/primary-chrome-consistency.spec.mjs',
              """      date: rect(date),
                  actions: rect(actions),""",
              """      date: rect(date),
                  datePaper: datePaperBox,
                  dateSegmentsContained,
                  dateValuesContained,
                  dateText: dateSegments.map((segment) => segment.textContent?.trim() ?? ''),
                  actions: rect(actions),""",
          )
          replace_once(
