              grid-template-columns: 38px minmax(0, 1fr) minmax(88px, 0.32fr);
              gap: 8px;
            }
          }

          @media (max-width: 440px) {
            .bookshelf-material-list-row {
              grid-template-columns: minmax(0, 1fr) 32px;
              min-height: 64px;
              padding-left: 14px;
            }

            .bookshelf-material-list-row > .bookshelf-material-row-main {
              min-height: 64px;
              grid-template-columns: 36px minmax(0, 1fr);
              grid-template-rows: auto auto;
              column-gap: 8px;
              row-gap: 3px;
            }

            .bookshelf-material-row-main > .bookshelf-list-cover {
              width: 36px;
              height: 47px;
              grid-column: 1;
              grid-row: 1 / span 2;
            }

            .bookshelf-material-row-main > .bookshelf-material-row-copy {
              grid-column: 2;
              grid-row: 1;
            }

            .bookshelf-material-row-main > .bookshelf-material-row-progress {
              grid-column: 2;
              grid-row: 2;
            }

            .bookshelf-recent-row {
              grid-template-columns: minmax(0, 1fr) 32px;
            }

