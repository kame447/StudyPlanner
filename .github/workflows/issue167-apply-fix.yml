name: Issue 167 Apply Verified UI Fix

on:
  push:
    branches:
      - fix/issue167-ui-regressions

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Apply issue 167 production and regression fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append_once(path: str, marker: str, block: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8-sig')
              if marker in text:
                  raise SystemExit(f'{path}: marker already exists: {marker}')
              file_path.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          replace_once(
