              """          <span className={`home-date-segment home-date-segment-${segment.key}`} key={segment.key}>
                        <span className=\"home-date-value\">{segment.value}</span>
                        {segment.suffix ? (
                          <span className=\"home-date-unit\">{segment.suffix}</span>
                        ) : null}
                      </span>""",
              """          <span className={`home-date-segment home-date-segment-${segment.key}`} key={segment.key}>
                        <span className=\"home-date-value\">{segment.value}</span>
                      </span>""",
