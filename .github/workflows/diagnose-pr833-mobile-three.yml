name: Diagnose PR833 three mobile cases
on:
  push:
    branches:
      - diagnose/pr833-mobile-three
permissions:
  contents: read
jobs:
  isolated-three:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Snapshot application manifests before isolated test-runner install
        shell: bash
        run: sha256sum package.json package-lock.json > /tmp/studyplanner-manifests.sha256

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.64.0

      - name: Verify isolated test-runner install did not mutate application manifests
        shell: bash
        run: sha256sum -c /tmp/studyplanner-manifests.sha256

      - name: Build production bundle
        run: npm run build

      - name: Verify approved three cases using ordinary configuration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/check-node-security-version.mjs
          node scripts/ci/playwright-shard.mjs test --config=tests/e2e/playwright.cross-browser.config.mjs --project=webkit-mobile --grep 'material long text 1920x1080 (saves the last chapter and preserves it after full reload at (100|200)%|keeps full detail text and cancels unsaved chapter edits at 200%)$'

      - name: Upload complete functional test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr833-mobile-functional-full-${{ github.sha }}
          path: |
            artifacts/playwright-cross-browser-results/
            artifacts/playwright-cross-browser-report/
            artifacts/playwright-cross-browser-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compact functional results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr833-mobile-functional-results-${{ github.sha }}
          path: |
            artifacts/playwright-cross-browser-results.json
            artifacts/playwright-cross-browser-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14
