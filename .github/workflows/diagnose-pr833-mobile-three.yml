name: Diagnose PR833 three mobile cases
on:
  push:
    branches:
      - diagnose/pr833-mobile-three
permissions:
  contents: read
jobs:
  isolated-three:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Snapshot application manifests before isolated test-runner install
        shell: bash
        run: sha256sum package.json package-lock.json > /tmp/studyplanner-manifests.sha256

      - name: Install isolated Playwright test runner
        run: npm install --prefix tests/e2e --no-save --package-lock=false @playwright/test@1.64.0

      - name: Verify isolated test-runner install did not mutate application manifests
        shell: bash
        run: sha256sum -c /tmp/studyplanner-manifests.sha256

      - name: Build production bundle
        run: npm run build

      - name: Run bounded same-host grid comparison
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/check-node-security-version.mjs
          node scripts/ci/mobile-grid-diagnostic.mjs

      - name: Upload complete grid artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr833-grid-full-${{ github.sha }}
          path: artifacts/grid/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compact grid diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr833-grid-diagnostics-${{ github.sha }}
          path: |
            artifacts/grid/*.json
            artifacts/grid/*/*.json
            artifacts/grid/**/error-context.md
          if-no-files-found: warn
          retention-days: 14
