name: PR68 stage3 debug v3

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/pr68-stage3-debug-v3.yml]

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Capture controller integration failure
        run: |
          set +e
          npm ci >/tmp/pr68-stage3-v3-install.txt 2>&1
          npm run test:run -- src/features/weeklyPlanning/__tests__/weeklyPlanningControllerApprovalFlow.integration.test.ts >/tmp/pr68-stage3-v3-test.txt 2>&1
          status=$?
          cp /tmp/pr68-stage3-v3-test.txt pr68-stage3-v3-test.txt
          echo "test_status=$status" >> pr68-stage3-v3-test.txt
          rm .github/workflows/pr68-stage3-debug-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pr68-stage3-v3-test.txt .github/workflows/pr68-stage3-debug-v3.yml
          git commit -m 'feat: controller横断結合テスト最終診断を記録'
          git push origin HEAD:agent/fix-weekly-planning-trace-and-dialogue-final
