# ROOT-AUTHORIZED ONE-RENDERER PREPARATION. Carrier lease499c is provisional; root fresh binding required before publication.
# One existing reserved renderer call, exact source/request. No semantic model, repair or uncertain retransmission.
# One added workflow file, direct child of the existing integration cleanup; attempt 1 only.
name: Issue 488 Preferred Live App Once
on:
  push:
    branches: ['integration/issue488-a-c-e-r0']
    paths: ['.github/workflows/issue488-preferred-renderer-one-live-app-once.yml']
permissions:
  contents: read
env:
  EVENT_PARENT: 'ee35e70e95c3d3ef7b797f6e85ee0926e66e521c'
  EVENT_PARENT_TREE: '3d453dddcc7c6bf0b85a6f41b233c32af93c44a4'
  SOURCE_SHA: 'bd7d1ba3982598dead70b1615c8c64b877e66ec2'
  SOURCE_TREE: '5528ed57265275a8dc7794c5f2eedf95a156d208'
  WORKFLOW_PATH: '.github/workflows/issue488-preferred-renderer-one-live-app-once.yml'
concurrency:
  group: issue488-preferred-renderer-one-live-app-once
  cancel-in-progress: false
jobs:
  preferred_once:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 'kame447/StudyPlanner' &&
          github.repository_id == '1202727586' &&
          github.repository_owner == 'kame447' &&
          github.actor == 'kame447' && github.actor_id == '76802107' &&
          github.triggering_actor == 'kame447' &&
          github.ref == 'refs/heads/integration/issue488-a-c-e-r0' &&
          github.run_attempt == 1 &&
          github.event.created == false && github.event.deleted == false &&
          github.event.forced == false }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      OPENAI_API_KEY: ''
      VITE_AI_API_KEY: ''
      VITE_CLOUDFLARE_AI_PROXY_URL: ''
      STUDYPLANNER_F1_REAL_API: '0'
      STUDYPLANNER_R0_REAL_API: '0'
      STUDYPLANNER_H_REAL_API: '0'
      STUDYPLANNER_H2_REAL_API: '0'
      GOOGLE_API_KEY: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the one-file direct-child event before any source execution
        id: event_guard
        env:
          EXECUTING_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTING_WORKFLOW_REF: ${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = kame447/StudyPlanner
          test "$GITHUB_REPOSITORY_ID" = 1202727586
          test "$GITHUB_REPOSITORY_OWNER" = kame447
          test "$GITHUB_ACTOR" = kame447
          test "$GITHUB_ACTOR_ID" = 76802107
          test "$GITHUB_TRIGGERING_ACTOR" = kame447
          test "$GITHUB_REF" = refs/heads/integration/issue488-a-c-e-r0
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$EXECUTING_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$EXECUTING_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$WORKFLOW_PATH@$GITHUB_REF"
          python3 - <<'PYEVENT'
          import json,os,pathlib
          event=json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          assert event['before']==os.environ['EVENT_PARENT'] and event['after']==os.environ['GITHUB_SHA']
          assert event['created'] is False and event['deleted'] is False and event['forced'] is False
          assert event['repository']['full_name']=='kame447/StudyPlanner' and event['repository']['id']==1202727586
          assert event['sender']['login']=='kame447' and event['sender']['id']==76802107
          PYEVENT
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P "$GITHUB_SHA")" = "$EVENT_PARENT"
          test "$(git rev-parse "${EVENT_PARENT}^{tree}")" = "$EVENT_PARENT_TREE"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r "$EVENT_PARENT" "$GITHUB_SHA")" = "$(printf 'A\t%s' "$WORKFLOW_PATH")"
          test "$(git ls-tree "$GITHUB_SHA" -- "$WORKFLOW_PATH" | awk '{print $1, $2}')" = '100644 blob'
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/preferred-artifacts"
          cp "$WORKFLOW_PATH" "$RUNNER_TEMP/preferred-artifacts/executing-workflow.yml"
          python3 - <<'PYPROVENANCE'
          import json,os,pathlib
          values={key:os.environ[name] for key,name in {'source':'SOURCE_SHA','tree':'SOURCE_TREE','eventParent':'EVENT_PARENT','eventParentTree':'EVENT_PARENT_TREE','event':'GITHUB_SHA',
              'workflow':'EXECUTING_WORKFLOW_SHA','ref':'GITHUB_REF','runId':'GITHUB_RUN_ID'}.items()}
          values['attempt']=1
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'preferred-artifacts/event-provenance.json').write_text(json.dumps(values,indent=2)+'\n')
          PYPROVENANCE
      - name: Check out immutable preferred production source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.0'
      - name: Install locked app and version-matched runner with no model credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" = 1001
          test -w "$PWD"; test -w "$HOME"; test -w "$RUNNER_TEMP"
          test "$(node -v)" = v22.23.0
          test "$PLAYWRIGHT_BROWSERS_PATH" = /ms-playwright
          test -z "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          sha256sum package.json package-lock.json > "$RUNNER_TEMP/preferred-artifacts/app-manifests.sha256"
          test ! -e .npmrc
          test ! -e "$RUNNER_TEMP/preferred-isolated-home"; test ! -e "$RUNNER_TEMP/preferred-npm"
          mkdir -p "$RUNNER_TEMP/preferred-isolated-home" "$RUNNER_TEMP/preferred-npm/cache" "$RUNNER_TEMP/preferred-npm/logs"
          : > "$RUNNER_TEMP/preferred-npm/user.npmrc"; : > "$RUNNER_TEMP/preferred-npm/global.npmrc"
          NODE_BIN="$(command -v node)"; NPM_ENTRY="$(readlink -f "$(command -v npm)")"
          export NODE_BIN NPM_ENTRY
          python3 - <<'PYNPM'
          import hashlib,json,os,pathlib,subprocess
          node=pathlib.Path(os.environ['NODE_BIN']).resolve();npm=pathlib.Path(os.environ['NPM_ENTRY'])
          assert npm.is_file() and str(npm).endswith('/node_modules/npm/bin/npm-cli.js')
          package=json.loads((npm.parents[1]/'package.json').read_text());assert package['name']=='npm'
          info={'nodePath':str(node),'nodeSha256':hashlib.sha256(node.read_bytes()).hexdigest(),
            'nodeVersion':subprocess.check_output([str(node),'--version'],text=True).strip(),
            'npmEntry':str(npm),'npmEntrySha256':hashlib.sha256(npm.read_bytes()).hexdigest(),'npmVersion':package['version'],
            'configScope':'fresh private HOME, user/global configs, cache and logs; env -i; source .npmrc absent'}
          assert info['nodeVersion']=='v22.23.0'
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'preferred-artifacts/install-tooling.json').write_text(json.dumps(info,indent=2)+'\n')
          PYNPM
          clean_npm() {
            env -i PATH="$(dirname "$NODE_BIN"):/usr/local/bin:/usr/bin:/bin" HOME="$RUNNER_TEMP/preferred-isolated-home" \
              CI=true TZ=UTC PLAYWRIGHT_BROWSERS_PATH=/ms-playwright PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
              npm_config_userconfig="$RUNNER_TEMP/preferred-npm/user.npmrc" npm_config_globalconfig="$RUNNER_TEMP/preferred-npm/global.npmrc" \
              npm_config_cache="$RUNNER_TEMP/preferred-npm/cache" npm_config_logs_dir="$RUNNER_TEMP/preferred-npm/logs" \
              npm_config_update_notifier=false npm_config_fund=false WRANGLER_SEND_METRICS=false \
              "$NODE_BIN" "$NPM_ENTRY" "$@"
          }
          clean_npm ci
          clean_npm install --prefix "$RUNNER_TEMP/preferred-pw" --no-save --package-lock=false @playwright/test@1.64.0
          python3 - <<'PYNPMCHECK'
          import hashlib,json,os,pathlib
          j=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'preferred-artifacts/install-tooling.json').read_text())
          for key,hashkey in [('nodePath','nodeSha256'),('npmEntry','npmEntrySha256')]:
              assert hashlib.sha256(pathlib.Path(j[key]).read_bytes()).hexdigest()==j[hashkey]
          PYNPMCHECK
          sha256sum -c "$RUNNER_TEMP/preferred-artifacts/app-manifests.sha256"
          # No playwright install, apt, browser fallback, or executablePath override.
      - name: Preferredize the exact reviewed live bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          import base64,gzip,hashlib,io,json,os,pathlib,tarfile
          packed=base64.b64decode('',validate=True)
          assert len(packed)==160292 and hashlib.sha256(packed).hexdigest()=='b9d5a3e30a4f0325b0348065c09ac637f32cb6760345beb3a81b59f3b52685e5'
          raw=gzip.decompress(packed);assert len(raw)==481280 and hashlib.sha256(raw).hexdigest()=='e9006e2cb96fe9c9b0c5cda021e063e85ba5abb7bcdcfade4836faacd59e9d2b'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'preferred-bundle';root.mkdir(exist_ok=False)
          expected={'candidate/budget-envelope.json': '0b9d4c6c23e1960d484371ff4387841880c3dc0dddec03c3fd0d7d2dd1a2eb23', 'candidate/captured-conversation-identity.mjs': '4efb6d93cb076654e4e0c8ce95166898d01a700b5b2c02f1fe86c9f3acb06450', 'candidate/f1-ui-observers.mjs': 'efd1148116b158a3df4e4d1be71db7ae3e5378f3b2ceb0cee9a190ddf21845c7', 'candidate/fixed-clock.mjs': '814a21374df6b3d0dd5317f412b50afb5ed026ac6fa8909bcb444d8af7ce5b06', 'candidate/live-dispatch.mjs': '8ae2a08d7de8efd8a80ec08027ff1a939a54853a99bf382abc6622b1eaa1de87', 'candidate/mixed-semantic.json': 'c60423abeca10fa5aaca0ca10896a4c393947b468ac931faba3d3b3c18e18cd9', 'candidate/mode.json': '345c6671df239b56cd8cda65eb6d0093396076025f63664f00ff153a3c764d26', 'candidate/observed-renderer-request.json': 'f8a14ddb5c39eff731e97b977fa8dd8322383f3d3ef4a127b09552c6ec9bfd22', 'candidate/preferred-controls.mjs': 'ed9f028fa3e98051821734bc496717028a939c2907a8532c517c5ca066e796bf', 'candidate/preferred-playwright.config.template.mjs': 'f32d9887531df003a9512d6dfc062d7fd993c316ca2cb1be6c941f4e52c6f552', 'candidate/preferred-vite.config.template.mjs': 'dbdc58023e16740691b6fbd68d9a8c220e4fa2134b21ca01a953167b780ae890', 'candidate/preferred.live-app.mjs': '53d75694f2122debc9ddfbc457e1240e36a9d1f8a86f8c0e1814e39bd38d6d3b', 'candidate/prepare-preferred-gate.py': '5cb853044e7d8ef1707597d268f39ee02e45e49b16ee7a9559d05f24cddf588f', 'candidate/r0-captured-evidence.mjs': '79a054f4631983b9057b76f3de4dac45f7e1112aaae634769bd824145b6c2cc0', 'candidate/read-unless-stopped.mjs': '90cf181c39e02ab2b8fdab111cdecb739b58455a1f092df142fcc0299308dc9f', 'candidate/source-pins.json': '06c05772e7a8510cda39e84ae0e260e871d81dd9ac5a4f880ff35502d6e0214c', 'candidate/startup-ready.mjs': 'd0d8adb0f428a75ae0249460763938a84ecc06e516f32436c616d94a6d84fe63', 'manifest.json': '357d3124a48607289227900481d565bee81c309398fab0b37cdc1530c87f7790', 'execution-wrapper/run-preferred.py': 'aa2c5e50d2a8f32b491bd2fb42b0a8e356f23a5ddc691bcb055daff9f2a0d277'}
          expected_sizes={'candidate/budget-envelope.json': 6339, 'candidate/captured-conversation-identity.mjs': 3119, 'candidate/f1-ui-observers.mjs': 25327, 'candidate/fixed-clock.mjs': 1501, 'candidate/live-dispatch.mjs': 7599, 'candidate/mixed-semantic.json': 3472, 'candidate/mode.json': 296, 'candidate/observed-renderer-request.json': 14264, 'candidate/preferred-controls.mjs': 8943, 'candidate/preferred-playwright.config.template.mjs': 1134, 'candidate/preferred-vite.config.template.mjs': 2280, 'candidate/preferred.live-app.mjs': 15085, 'candidate/prepare-preferred-gate.py': 2845, 'candidate/r0-captured-evidence.mjs': 4683, 'candidate/read-unless-stopped.mjs': 490, 'candidate/source-pins.json': 332482, 'candidate/startup-ready.mjs': 1779, 'manifest.json': 2942, 'execution-wrapper/run-preferred.py': 23113}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
              rows=archive.getmembers()
              assert len(rows)==len(expected) and sorted(row.name for row in rows)==sorted(expected)
              values={}
              for row in rows:
                  assert row.isfile() and row.name in expected and row.size == expected_sizes[row.name]
                  value=archive.extractfile(row).read();assert len(value)==row.size
                  assert hashlib.sha256(value).hexdigest()==expected[row.name]
                  values[row.name]=value
              for name,value in values.items():
                  target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(value)
          PYBUNDLE
      - name: Root-authorized preferred single renderer with exact captured request
        id: live_app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        timeout-minutes: 9
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"; test -z "$VITE_AI_API_KEY"; test -z "$GOOGLE_API_KEY"
          mkdir -p "$RUNNER_TEMP/preferred-isolated-home"
          env -i OPENAI_API_KEY="$OPENAI_API_KEY" PATH="$PATH" HOME="$RUNNER_TEMP/preferred-isolated-home" PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            ISSUE488_PREFERRED_SLOT_GRANTED=yes CI=true TZ=UTC WRANGLER_SEND_METRICS=false \
            python3 "$RUNNER_TEMP/preferred-bundle/execution-wrapper/run-preferred.py" \
            --root "$PWD" --node "$(command -v node)" --playwright "$RUNNER_TEMP/preferred-pw/node_modules" \
            --output "$RUNNER_TEMP/preferred-execution-1" \
            > "$RUNNER_TEMP/preferred-artifacts/runner.log" 2>&1
          python3 - <<'PYTERMINAL'
          import json,os,pathlib
          receipt=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'preferred-execution-1/terminal-receipt.json').read_text())
          assert receipt['result']=='passed' and receipt['lastStage']=='completed'
          assert type(receipt['processExitCode']) is int and receipt['processExitCode']==0
          assert receipt['immutableBeforeAfterEqual'] is True and receipt['narrowBeforeAfterEqual'] is True
          PYTERMINAL
      - name: Preserve bounded diagnostics inside the single proven artifact root
        id: diagnostic_stage
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/preferred-execution-1"
          DEST="$RUNNER_TEMP/preferred-artifacts/execution"
          # Small diagnostics also survive in the job log if artifact delivery fails.
          python3 - <<'PYDIAGNOSTICS'
          import json,os,pathlib,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'preferred-execution-1'
          receipt=root/'terminal-receipt.json'
          try:
              meta=receipt.lstat()
              if not stat.S_ISREG(meta.st_mode) or meta.st_size>8*1024*1024:
                  raise ValueError('Receipt is not a bounded regular file')
              value=json.loads(receipt.read_text())
              if not isinstance(value,dict):raise TypeError('Receipt is not an object')
              keys=['lastStage','processExitCode','result','error','afterError','immutableBeforeAfterEqual','narrowBeforeAfterEqual']
              print('PREFERRED_TERMINAL_DIAGNOSTIC '+json.dumps({k:value.get(k) for k in keys})[:8192])
          except Exception as exc:print('PREFERRED_TERMINAL_DIAGNOSTIC unavailable: '+type(exc).__name__)
          log=root/'playwright.log'
          try:
              meta=log.lstat()
              if not stat.S_ISREG(meta.st_mode):raise ValueError('Log is not a regular file')
              with log.open('rb') as stream:
                  stream.seek(max(0,meta.st_size-24576));tail=stream.read(24576).decode('utf-8',errors='replace')
              print('PREFERRED_PLAYWRIGHT_FAILURE_TAIL_BEGIN\n'+'\n'.join(tail.splitlines()[-80:])+'\nPREFERRED_PLAYWRIGHT_FAILURE_TAIL_END')
          except Exception as exc:print('PREFERRED_PLAYWRIGHT_FAILURE_TAIL unavailable: '+type(exc).__name__)
          PYDIAGNOSTICS
          test -d "$SRC"; test ! -e "$DEST"
          # Copy only generated evidence/input records, excluding disposable browser/temp and Vite caches.
          python3 - <<'PYBOUNDS'
          import os,pathlib,stat
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'preferred-execution-1';count=0;size=0
          for parent,dirs,files in os.walk(root,followlinks=False):
              here=pathlib.Path(parent)
              dirs[:]=[name for name in dirs if here/name not in [root/'tmp',root/'app/vite-cache']]
              for name in dirs+files:
                  item=here/name;mode=item.lstat().st_mode
                  assert stat.S_ISREG(mode) or stat.S_ISDIR(mode), 'Non-regular diagnostic input'
                  if stat.S_ISREG(mode):count+=1;size+=item.stat().st_size
          assert count<=10000 and size<=256*1024*1024, 'Diagnostic evidence exceeds bounded upload scope'
          print('PREFERRED_DIAGNOSTIC_COPY_BOUNDS files='+str(count)+' bytes='+str(size))
          PYBOUNDS
          mkdir -p "$DEST"
          for entry in "$SRC"/*; do
            test -e "$entry" || continue
            name="$(basename "$entry")"
            if test "$name" = tmp; then continue; fi
            if test "$name" = app; then
              mkdir -p "$DEST/app"
              for child in "$entry"/*; do
                test -e "$child" || continue
                if test "$(basename "$child")" = vite-cache; then continue; fi
                cp -a -- "$child" "$DEST/app/"
              done
            else cp -a -- "$entry" "$DEST/"
            fi
          done
          test -f "$DEST/terminal-receipt.json"
          cmp "$SRC/terminal-receipt.json" "$DEST/terminal-receipt.json"
      - name: Require the immutable product source after every attempted gate
        if: ${{ always() && steps.bundle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"; test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test ! -e "$WORKFLOW_PATH"; test -z "$(git status --porcelain)"
          sha256sum -c "$RUNNER_TEMP/preferred-artifacts/app-manifests.sha256"
      - name: Upload bounded one-renderer evidence on success or failure
        if: ${{ always() && steps.event_guard.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue488-preferred-live-source-${{ env.SOURCE_SHA }}-event-${{ github.sha }}
          path: ${{ runner.temp }}/preferred-artifacts/
          if-no-files-found: error
          retention-days: 14
