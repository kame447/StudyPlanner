name: Fix agent final validation

on:
  push:
    branches:
      - agent/fix-weekly-planning-dialogue-path
    paths:
      - .github/workflows/agent-fix-final-validation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Limit diff check to source files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/agent-weekly-planning-final-validation.yml')
          text = path.read_text(encoding='utf-8')
          old = '            git diff --check >> .agent-validation/weekly-planning-output.log 2>&1\n'
          new = '''            git diff --check -- \\
              src/features/weeklyPlanning/intake/weeklyPlanningIntakeReducer.ts \\
              src/features/weeklyPlanning/pipeline/weeklyPlanningIntakePipeline.ts \\
              src/features/weeklyPlanning/pipeline/weeklyPlanningBehaviorAwareIntakePipeline.ts \\
              src/features/weeklyPlanning/__tests__/weeklyPlanningInterpreterFoundation.test.ts \\
              >> .agent-validation/weekly-planning-output.log 2>&1
          '''
          if text.count(old) != 1:
              raise RuntimeError('diff check target was not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/agent-weekly-planning-final-validation.yml
          git commit -m "feat: 検証対象を実装差分へ限定"
          git push
