name: One-shot Issue 268 Cross-entity Patch

on:
  push:
    branches:
      - fix/issue268-cross-entity-consistency
    paths:
      - scripts/ci/tmp-issue268-cross-entity-patch.mjs

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue268-cross-entity-consistency
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact Issue 268 patch
        run: node scripts/ci/tmp-issue268-cross-entity-patch.mjs

      - name: Install dependencies
        run: npm ci

      - name: Focused repository tests
        run: npx vitest run src/repositories/plannerCrossEntityMutation.test.ts src/repositories/observedPlannerRepository.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Full tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/usePlannerDataState.ts src/repositories/repositoryContracts.ts src/repositories/plannerRepository.ts src/repositories/firebasePlannerRepository.ts src/repositories/observedPlannerRepository.ts src/repositories/plannerCrossEntityMutation.test.ts src/repositories/observedPlannerRepository.test.ts
          git commit -m "fix: harden planner cross-entity mutations"
          git push origin HEAD:fix/issue268-cross-entity-consistency
