name: One-shot merged AGENTS explanation branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tmp-delete-merged-agent-explanation-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merged branch target
        run: |
          git fetch origin docs/agent-explanation-clarity
          test "$(git rev-parse origin/docs/agent-explanation-clarity)" = "ada6b286bd557fd7d5598ea180534f2d01462c54"
          git merge-base --is-ancestor 6f61cc36a3d3f394d8e61cc5ce521907ce9538dc origin/main
          test "$(git rev-parse origin/docs/agent-explanation-clarity^{tree})" = "$(git rev-parse 6f61cc36a3d3f394d8e61cc5ce521907ce9538dc^{tree})"
      - name: Delete explicit merged branch
        run: git push origin --delete -- docs/agent-explanation-clarity
