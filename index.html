<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style id="initial-startup-canvas">
      /* Paint before CSS/JS arrive, including before the parser reaches #root.
         Release as soon as React supplies content; the splash/theme then owns it. */
      html:not(:has(#root:not(:empty))),
      html:not(:has(#root:not(:empty))) body {
        background: #060914 !important;
        color-scheme: dark;
        transition: none !important;
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Laplance</title>
    <meta name="application-name" content="Laplance" />
    <meta name="apple-mobile-web-app-title" content="Laplance" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/laplans-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/laplans-192.png" />
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/icons/laplans-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
